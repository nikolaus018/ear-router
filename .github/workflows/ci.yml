name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build and tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test
        working-directory: ios
        run: |
          xcodebuild test -project EarRouter.xcodeproj -scheme EarRouter \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO | tail -40

  legacy-web:
    name: Legacy web server (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: legacy-web
      - run: cargo test --manifest-path legacy-web/Cargo.toml
