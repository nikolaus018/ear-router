name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build and tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Test
        working-directory: ios
        run: |
          xcodebuild test -project EarRouter.xcodeproj -scheme EarRouter \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO | tail -40
