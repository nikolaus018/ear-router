[package]
name = "ear_routing"
version = "0.1.0"
edition = "2021"
# What the server builds with. Keeps `cargo update` from picking dependencies
# it cannot compile.
rust-version = "1.85"
default-run = "ear_routing"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
# Body-size capping uses axum's own `DefaultBodyLimit`, not tower-http's
# `limit` feature — that feature is deliberately not enabled.
tower-http = { version = "0.5", features = ["trace", "catch-panic", "timeout"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["clock"] }
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
argon2 = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = 3
lto = true
