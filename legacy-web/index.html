      // The overlay stops at 19 where the imagery goes to 21; above that
      // MapLibre stretches the deepest tiles it has, which is the right
      // trade — by then the driver needs the picture, not the lettering.
      maxzoom: 19,
      attribution: AERIAL_ATTRIB_WIEN,
    },
  };
  try {
    // Everything already in the style is the vector basemap's — recorded
    // before anything of ours is added, so `applyBasemap` can switch the
    // whole of it off in one go.
    if (!map._earVectorLayers) {
      const existing = map.getStyle().layers;
      map._earBackgroundLayer = existing.find((l) => l.type === 'background')?.id || null;
      map._earVectorLayers = existing
        .filter((l) => l.id !== map._earBackgroundLayer
          && !AERIAL_LAYER_IDS.includes(l.id)
          // The route's own layers are NOT part of the basemap and must
          // never be switched off with it. They are in the style by the
          // time this runs (see `ensureRouteLayers`, called first from the
          // `styledata` handler), so without this line they were captured
          // here as "vector basemap" and `applyBasemap` hid the route every
          // single time the driver switched to Luftbild — which is the
          // Luftbild's whole purpose, so the route vanished exactly when it
          // was needed most. This was reachable before those layers were
          // created eagerly too, just intermittently: whether the route was
          // hidden depended on whether `drawRouteOnMap` happened to have run
          // before the first `mountAerialLayers` on that particular load.
          && !ROUTE_LAYER_IDS.includes(l.id))
        .map((l) => l.id);
      if (map._earBackgroundLayer) {
        try {
          map._earBackgroundColor = map.getPaintProperty(map._earBackgroundLayer, 'background-color');
        } catch (_) { map._earBackgroundColor = null; }
      }
    }
    for (const [id, source] of Object.entries(sources)) {
      if (!map.getSource(id)) map.addSource(id, source);
    }
    // Under the route line if it's already drawn, so switching to the
    // Luftbild can never bury the route under the imagery.
    const before = map.getLayer('route-line-casing') ? 'route-line-casing' : undefined;
    const visibility = map._earBasemap === 'aerial' ? 'visible' : 'none';
    for (const id of AERIAL_LAYER_IDS) {
      if (map.getLayer(id)) continue;
      map.addLayer({
        id,
        type: 'raster',
        source: id,
        layout: { visibility },
        // The zoom range goes on the LAYER as well as the source, and the
        // layer is the one that counts: MapLibre decides a source is unused
        // — and so loads nothing for it — from whether any *layer* using it
        // is drawn at the current zoom. A range set only on the source
        // leaves the layer nominally drawn at every zoom, which keeps the
        // source marked in use.
        ...(AERIAL_LAYER_ZOOM[id] || {}),
        paint: {
          // Raster tiles fade in over 300ms by default. On a screenful of
          // them arriving one at a time that reads as the map slowly
          // developing rather than loading — and the driver is waiting on
          // it. Show each tile the moment it lands.
          'raster-fade-duration': 0,
          ...(id === 'wien-labels' ? { 'raster-opacity': 0.95 } : {}),
        },
      }, before);
    }
    return true;
  } catch (err) {
    // A failure here costs the Luftbild, not the map: the vector basemap,
    // the route and the markers are all still there.
    console.warn('aerial layers could not be added', err);
    return false;
  }
}

// Bottom-to-top: the nationwide fallback, Vienna's imagery over it, labels
// on top of both.
const AERIAL_LAYER_IDS = ['at-ortho', 'wien-lb', 'wien-labels'];

// The route's own layers, in draw order (casing under line). Everything the
// app adds to the style that is neither basemap nor imagery — so switching
// basemaps has to leave both alone. See `mountAerialLayers`.
const ROUTE_LAYER_IDS = ['entrance-links', 'route-line-casing', 'route-line'];

// Where the nationwide overview imagery hands over to Vienna's own
// high-resolution imagery. Street level: below this the driver is looking at
// the shape of the route, above it at a specific building.
const AERIAL_DETAIL_ZOOM = 16;

// The zoom band each aerial layer is actually drawn in, so that exactly one
// imagery layer is doing the work at any given zoom.
//   - `at-ortho` covers everything below street level and then stays on as a
//     stretched underlay, so a hole in the city imagery shows ground.
//   - `wien-lb` only exists from street level up, which is the only place its
//     extra resolution can be seen.
//   - labels are unreadable on an overview and are simply not fetched there.
const AERIAL_LAYER_ZOOM = {
  'wien-lb': { minzoom: AERIAL_DETAIL_ZOOM },
  'wien-labels': { minzoom: 13 },
};

// Which basemap every map in the app opens with, persisted like the
// maps-app choice (see `MAPS_PROVIDER_KEY`) — a driver who works off the
// Luftbild wants it to still be the Luftbild after a reload, not a
// preference to re-set on every route.
const BASEMAP_KEY = 'ear_basemap';

function getBasemap() {
  let saved;
  try { saved = localStorage.getItem(BASEMAP_KEY); } catch (_) { /* private-browsing storage lockout */ }
  return saved === 'aerial' ? 'aerial' : 'map';
}

function setBasemap(mode) {
  try { localStorage.setItem(BASEMAP_KEY, mode); } catch (_) { /* private-browsing storage lockout */ }
}

// How long the street map is left underneath the imagery before the app
// gives up waiting for tiles that are evidently not coming.
//
// Reaching this ceiling is not a failure mode — it is the *good* outcome
// for a driver with no signal: the street map simply stays up instead of
// being swapped for a dark void, which is what "there is no state this map
// can get into where nothing is drawn" means in practice. All the timeout
// does is stop listening.
const AERIAL_HANDOVER_TIMEOUT_MS = 8000;

function setVectorLayersVisible(map, visible) {
  const value = visible ? 'visible' : 'none';
  for (const id of map._earVectorLayers || []) {
    if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', value);
  }
}

function stopAerialHandover(map) {
  if (map._earHandover) {
    map.off('idle', map._earHandover);
    map._earHandover = null;
  }
  if (map._earHandoverTimer) {
    clearTimeout(map._earHandoverTimer);
    map._earHandoverTimer = null;
  }
}

// Switches the vector basemap off — but only once the imagery that is
// meant to replace it is actually on screen.
//
// Hiding it in the same breath as showing the aerial layers (which is what
// this used to do) is why the Luftbild "loads so slowly": the switch is
// instant, the tiles are not, so the driver's first second or more is a
// blank rectangle. Nothing about that is faster — it is the same tiles over
// the same connection — it just removes everything that was on screen while
// they arrive, which is the difference between "the photo is coming in" and
// "the map broke".
//
// The reason for hiding it at all is real and is kept: a hidden layer's
// source stops loading, so this is a whole set of vector tiles per view not
// downloaded, not decoded, and not re-rendered on a phone CPU that is
// already busy with imagery. Deferring the switch by a second or two costs
// one screenful of vector tiles that were, in the overwhelming majority of
// cases, already in the browser's cache from the street view the driver was
// looking at a moment ago.
function startAerialHandover(map) {
  stopAerialHandover(map);
  // Waiting for `idle` alone is what put a blank map in front of the driver.
  //
  // `idle` means "nothing left to draw or load". The trap is that a map
  // sitting still — which is exactly what it is doing when a thumb reaches
  // for the Luftbild button — is *already* idle, and switching a layer's
  // visibility does not queue its tiles until the next render pass. So the
  // first `idle` after the switch could arrive before MapLibre had requested
  // a single aerial tile, and handing over on it hid the street map with
  // nothing yet in its place: dark grey, no imagery, no street map. Waiting
  // on `sourcedata` instead had the mirror of the same problem, which is why
  // this was written against `idle` in the first place.
  //
  // The fix is to stop inferring readiness from an event at all and require
  // evidence instead: one `sourcedata` event, from one of the imagery
  // sources, reporting itself loaded. That cannot be true before the tiles
  // for this view have actually arrived, whatever order the events come in.
  // `areTilesLoaded()` on top of it covers the rest of the screen.
  let sawImagery = false;
  const onData = (e) => {
    // Switched back to the street map while waiting — nothing to hand over.
    if (map._earBasemap !== 'aerial') { stopAerialHandover(map); return; }
    if (e.sourceId && AERIAL_IMAGERY_SOURCES.includes(e.sourceId) && e.isSourceLoaded) {
      sawImagery = true;
    }
    if (!sawImagery || !map.areTilesLoaded()) return;
    stopAerialHandover(map);
    setVectorLayersVisible(map, false);
    // The street map going down must never take the route with it. It does
    // not — the route's layers are deliberately excluded from
    // `_earVectorLayers` (see `mountAerialLayers`) — but this is the exact
    // moment a driver reported losing the line, so the invariant is asserted
    // here rather than trusted.
    ensureRouteVisible(map);
  };
  map._earHandover = onData;
  map.on('sourcedata', onData);
  // Imagery that never arrives leaves the street map up, which is the right
  // answer for a driver with no signal — see `AERIAL_HANDOVER_TIMEOUT_MS`.
  map._earHandoverTimer = setTimeout(() => stopAerialHandover(map), AERIAL_HANDOVER_TIMEOUT_MS);
}

// The two sources that actually carry imagery. The label overlay is left out
// on purpose: it is transparent, it does not cover the street map, and above
// zoom 19 it stops loading entirely — waiting on it would strand the
// handover at exactly the zoom a driver uses to look at a door.
const AERIAL_IMAGERY_SOURCES = ['at-ortho', 'wien-lb'];

// Re-asserts the one thing about this map that must always be true: the
// route the driver is following is on screen, and on top.
//
// Two ways a route line goes missing, and this covers both because from the
// driver's seat they are the same event — the red line is not there any more:
//
//   - hidden, if a basemap switch ever caught the route's layers in the set
//     it switches off. They are deliberately excluded (see
//     `mountAerialLayers`), so this should not fire.
//   - buried, which does not need anything to go wrong at all. The imagery
//     is inserted beneath `route-line-casing` when the aerial layers are
//     first mounted — but only if the route's layers already exist at that
//     moment. Tap Luftbild during the second or two before the style has
//     parsed, and the imagery is appended to the top of the style instead,
//     with three opaque raster layers now sitting over the route. Nothing
//     errors. The line is simply underneath the photograph.
//
// Moving the two layers back to the top is idempotent and costs a pair of
// style reorders on an action the driver takes by hand, which is nothing
// next to a driver following a route they cannot see. `moveLayer` with no
// target means "to the top"; casing first so the red line lands above its
// own outline.
function ensureRouteVisible(map) {
  for (const id of ROUTE_LAYER_IDS) {
    if (!map.getLayer(id)) continue;
    if ((map.getLayoutProperty(id, 'visibility') || 'visible') !== 'visible') {
      console.warn('route layer was hidden by a basemap change — restoring', id);
      map.setLayoutProperty(id, 'visibility', 'visible');
    }
    try { map.moveLayer(id); } catch (_) { /* not in the style yet */ }
  }
}

// Switching basemap: visibility flags, no style replacement. Nothing is
// re-fetched, the route line and markers are not touched, and tiles already
// in memory stay there — so switching back is instant rather than a reload.
function applyBasemap(map, mode) {
  map._earBasemap = mode;
  // Late-mounted if the style wasn't ready when the map was built.
  if (!mountAerialLayers(map)) return;
  const aerial = mode === 'aerial';
  for (const id of AERIAL_LAYER_IDS) {
    if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', aerial ? 'visible' : 'none');
  }
  if (aerial) {
    // Up now, down once the photos cover it — see `startAerialHandover`.
    setVectorLayersVisible(map, true);
    startAerialHandover(map);
  } else {
    stopAerialHandover(map);
    setVectorLayersVisible(map, true);
  }
  // The background layer is the ground under both: a neutral dark grey
  // while the imagery loads (and outside its coverage), the style's own
  // colour otherwise. Without it, a gap in the photos is the bare canvas.
  if (map._earBackgroundLayer && map.getLayer(map._earBackgroundLayer)) {
    map.setPaintProperty(
      map._earBackgroundLayer,
      'background-color',
      aerial ? '#2f3133' : (map._earBackgroundColor || '#f8f4f0')
    );
  }
  // Whatever this switch did to the basemap, the route stays visible.
  ensureRouteVisible(map);
}

// Runs whenever the map's style changes state. There is only ever one style
// now (the vector basemap; the aerial layers live inside it), so this has
// two jobs: put the aerial layers in as soon as there is a style to put them
// in, and draw the route once.
//
// `styledata` rather than `style.load`: the latter fires only for a map's
// first style and MapLibre gives no other reliable "ready" signal. Readiness
// is "the style is parsed" (it has layers) rather than `isStyleLoaded()`,
// which additionally waits for every source's tiles — on a van's connection
// that can be a long time, and the route line has no reason to wait for
// imagery.
function mountBasemapRedraw(map) {
  map._earStyleReady = false;
  const onStyleData = () => {
    // `styledata` fires for the life of the map — once per tile that
    // arrives, across every source, plus once for each of the dozen-plus
    // layer property writes `applyBasemap` makes. Everything below has to
    // stay cheap at that rate, which is why the one genuinely expensive
    // call is behind a one-shot flag.
    //
    // `getStyle()` deep-clones the entire style JSON on every call.
    // Running it per event is what made the map feel like it had ground to
    // a halt when panning into fresh area (dozens of tiles landing at once,
    // dozens of full-style clones a second). It only ever answers one
    // question — "is the style parsed yet" — and that answer never goes
    // back to false, so it is asked exactly once.
    if (!map._earStyleReady) {
      let layers;
      // getStyle() throws rather than returning undefined at some points
      // during a style's life.
      try { layers = map.getStyle()?.layers; } catch (_) { return; }
      if (!layers?.length) return;
      map._earStyleReady = true;
    }

    // The route's own source and layers go in FIRST, empty — before the
    // imagery, so `mountAerialLayers` finds `route-line-casing` to insert
    // itself beneath and the Luftbild can never be painted over the route.
    // They are also what `drawRouteOnMap` now updates rather than rebuilds
    // (see `ensureRouteLayers`), so they exist from the moment the style is
    // parsed — before a route has even been chosen.
    try { ensureRouteLayers(map); } catch (err) { console.warn('route layers not ready', err); }

    // Mounts the imagery and, on a map that opens straight into Luftbild,
    // switches the vector layers off in the same pass — but only once.
    // `applyBasemap` calls setLayoutProperty/setPaintProperty on every
    // aerial + vector layer, and each of those calls fires ANOTHER
    // `styledata` event of its own — so calling it unconditionally here
    // (as this used to) fed straight back into this same handler: tile
    // arrives -> styledata -> applyBasemap touches a dozen+ layers ->
    // each touch fires styledata -> repeat, for as long as tiles kept
    // streaming in. That self-sustaining loop is what made the Luftbild
    // feel laggy. Explicit switches (the basemap button) still call
    // `applyBasemap` directly — this guard only stops it from being an
    // implicit side effect of every tile that happens to load.
    if (!map._earBasemapMounted) {
      if (mountAerialLayers(map)) {
        applyBasemap(map, map._earBasemap);
        map._earBasemapMounted = true;
      }
      // If mounting failed (a transient error inside mountAerialLayers),
      // `_earBasemapMounted` stays false on purpose — the next `styledata`
      // event retries. Only a *successful* mount is one-shot.
    }

    // Draws the route the first time there is a style to draw it into, and
    // puts it back if it ever goes missing afterwards. Both conditions are
    // hash lookups on a flag and a layer id, so this stays cheap at
    // per-tile rates; `syncMapTabRoute` itself only runs when there is
    // genuinely something to do.
    if (mapTabMap === map && (!map._earRouteDrawn || !map.getLayer('route-line'))) {
      syncMapTabRoute();
    }
  };
  map.on('styledata', onStyleData);
  onStyleData();
}

// Rebuilding the Karte tab's map from scratch — the recovery of last resort,
// for the one thing that leaves a live map permanently blank with no error
// anyone can catch: a lost WebGL context. Rate-limited, because a rebuild
// that fails the same way immediately would loop, and a phone stuck in a
// rebuild loop is worse than a phone showing a stale map.
let lastMapRebuildAt = 0;
function rebuildMapTabMap(reason) {
  const now = Date.now();
  if (now - lastMapRebuildAt < 15000) {
    console.warn('map rebuild suppressed (too soon):', reason);
    return false;
  }
  lastMapRebuildAt = now;
  console.warn('rebuilding map:', reason);
  try { mapTabMap?.remove(); } catch (_) { /* already torn down */ }
  mapTabMap = null;
  mapTabRouteId = null;
  // A rebuild is a fresh map with nothing on it — the placeholder belongs
  // back up until this one has drawn, exactly as on a cold start.
  mapTabReady = false;
  // `remove()` empties the container, but the element itself is reused —
  // it's the node `render()` re-parents between screens (see `mapTabEl`).
  if (mapTabEl) mapTabEl.innerHTML = '';
  if (state.tab === 'map' && !isDetailShowing()) initMapTabMap();
  return true;
}

function basemapControl() {
  return {
    onAdd(map) {
      const container = elFromHtml('<div class="maplibregl-ctrl maplibregl-ctrl-group"><button type="button" class="basemap-toggle"></button></div>');
      const btn = container.querySelector('button');
      const paint = () => {
        const aerial = map._earBasemap === 'aerial';
        btn.textContent = aerial ? 'Karte' : 'Luftbild';
        const label = aerial ? 'Zur Kartenansicht wechseln' : 'Zum Luftbild wechseln — Häuser von oben';
        btn.title = label;
        btn.setAttribute('aria-label', label);
      };
      btn.addEventListener('click', () => {
        applyBasemap(map, map._earBasemap === 'aerial' ? 'map' : 'aerial');
        setBasemap(map._earBasemap);
        paint();
      });
      paint();
      this._container = container;
      return container;
    },
    onRemove() {
      this._container?.remove();
      this._container = null;
    },
  };
}

// Loads MapLibre GL JS/CSS on first actual need (see the comment in
// <head> where the old blocking <link>/<script> tags used to be) and
// caches the in-flight promise so concurrent callers (the Karte tab and
// the pin-drop sheet can both want it around the same time) share one
// fetch instead of racing to inject duplicate tags. Idempotent — safe to
// call from every site that touches `maplibregl`, including ones that
// already ran once and found it loaded.
let mapLibrePromise = null;
function ensureMapLibre() {
  if (typeof maplibregl !== 'undefined') return Promise.resolve();
  if (mapLibrePromise) return mapLibrePromise;
  mapLibrePromise = new Promise((resolve, reject) => {
    // Waits for BOTH the stylesheet and the script, not just the script —
    // the static <link>+<script> tags this replaced got that ordering for
    // free (a browser holds a following synchronous <script> from
    // *executing* until a preceding <link rel=stylesheet> has finished, so
    // MapLibre's own code never used to run before its CSS was applied).
    // Two independently `document.head.appendChild`-ed elements have no
    // such relationship, so it's tracked explicitly here instead — without
    // it, `new maplibregl.Map(...)` could run with the map's controls
    // still unstyled for a frame.
    let cssReady = false;
    let jsReady = false;
    const maybeResolve = () => { if (cssReady && jsReady) resolve(); };

    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css';
    // A CSS load failure degrades to unstyled map controls, not a broken
    // map — worth letting the script side still resolve rather than
    // blocking the whole map on a stylesheet that will never arrive.
    link.onload = () => { cssReady = true; maybeResolve(); };
    link.onerror = () => { cssReady = true; maybeResolve(); };
    document.head.appendChild(link);
    // Belt-and-suspenders against a real, documented cross-browser gotcha:
    // a dynamically-appended <link rel=stylesheet> pointing at a resource
    // the browser already has cached (the overwhelmingly common case after
    // the very first load) does not reliably fire `load` at all in every
    // browser/condition — no load, no error, nothing. Without this timeout,
    // that silently wedged `ensureMapLibre()`'s promise forever, which
    // wedged every caller awaiting it (`initMapTabMap`, the pin-drop sheet)
    // — the map tab would render its empty container and just sit there,
    // permanently, even though the MapLibre *script* loaded fine. A missed
    // `onload` is now a cosmetic risk (rare, brief unstyled controls)
    // instead of a functional one.
    setTimeout(() => { cssReady = true; maybeResolve(); }, 1500);

    const script = document.createElement('script');
    script.src = 'https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js';
    script.onload = () => { jsReady = true; maybeResolve(); };
    script.onerror = () => {
      // Let a fresh attempt happen next time (a dropped connection loading
      // this shouldn't permanently disable the map for the rest of the
      // session) rather than caching a rejected promise forever.
      mapLibrePromise = null;
      reject(new Error('MapLibre GL JS konnte nicht geladen werden.'));
    };
    document.head.appendChild(script);
  });
  return mapLibrePromise;
}

// Speculatively starts the fetch a moment after first load — not blocking
// anything (this fires well after `render()` has already painted the
// first screen), just likely finished by the time a driver actually taps
// the Karte tab instead of them watching it load right then.
// `requestIdleCallback` doesn't exist in Safari, the platform this app
// mostly runs on (see the zoom-lock comment in <head>), hence the
// `setTimeout` fallback rather than skipping the idle path outright. The
// `timeout` option is what actually matters, not just a nice-to-have: a
// tab that's never truly "idle" (rendering, animating, handling touch
// input the whole time a driver is using it) can otherwise leave this
// speculative preload waiting forever — a real possibility, not a
// hypothetical, for an app whose whole point is a driver actively poking
// at it. Bounding it means the driver's very first tap on the Karte tab
// is still at worst a few seconds' wait, not an indefinite one.
if (typeof requestIdleCallback === 'function') {
  requestIdleCallback(() => ensureMapLibre().catch(() => {}), { timeout: 3000 });
} else {
  setTimeout(() => ensureMapLibre().catch(() => {}), 1500);
}

function elFromHtml(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

// MapLibre GL JS's GeolocateControl has never actually implemented
// `showUserHeading` — see the comment where this is called, in `newMap()`.
// This is the hand-built replacement: a small arrow marker kept on the
// same coordinate as the control's own location dot, rotated from raw
// device-orientation events instead of anything the control provides.
function newMap(container, opts) {
  // Both tile hosts speak HTTP/2, where a request is a stream rather than a
  // connection — so the default cap of 16 in-flight image requests leaves a
  // screenful of tiles queueing behind each other for no reason. Raised
  // once, guarded, because it is a global knob on the library rather than a
  // map option and its name is not part of the public API contract.
  try {
    if (maplibregl.config && typeof maplibregl.config.MAX_PARALLEL_IMAGE_REQUESTS === 'number') {
      maplibregl.config.MAX_PARALLEL_IMAGE_REQUESTS = 32;
    }
  } catch (_) { /* not a knob this build has */ }
  const basemap = getBasemap();
  const map = new maplibregl.Map({
    container,
    // One style for the life of the map. The Luftbild is layers inside it,
    // not a style of its own — see `mountAerialLayers`.
    style: MAP_STYLE_URL,
    center: opts.center || VIENNA_CENTER,
    zoom: opts.zoom || 12,
    // The aerial imagery stops at zoom 21 but is worth overzooming a
    // little: a driver pinching all the way in on one building wants the
    // biggest possible picture of the entrance, not a hard stop.
    maxZoom: 22,
    dragRotate: false,
    touchPitch: false,
    pitchWithRotate: false,
    // Every tile this app draws is immutable in the ways that matter: the
    // Luftbild is reflown once a year, basemap.at's orthophoto on its own
    // multi-year cycle, OpenFreeMap's vector tiles on theirs — and all of
    // them ship a two-week `Cache-Control: max-age`. MapLibre's default is
    // to re-request a tile the moment that max-age expires, *for every tile
    // on screen*, which on a van's connection is a screenful of round-trips
    // to be told nothing changed. The service worker already serves tiles
    // cache-first for the same reason (see `TILE_HOSTS` in sw.js); this
    // stops the library from asking in the first place.
    refreshExpiredTiles: false,
    // Tiles fade in over 300ms by default. On a mobile connection, where
    // they arrive one at a time rather than all at once, that reads as the
    // map slowly developing rather than loading — and the driver is waiting
    // on it. This is the vector basemap's equivalent of the
    // `raster-fade-duration: 0` already set on the aerial layers.
    fadeDuration: 0,
    // Roughly a phone screen's worth of tiles at three zoom levels. The
    // default is derived from the viewport and is smaller than a driver's
    // actual working set — zooming out to check the route and back in to
    // the next house evicted the tiles for the house, so coming back
    // re-fetched them. Holding them costs memory this app has (a few MB of
    // decoded raster) and saves the one thing it doesn't have, which is
    // bandwidth on a moving van.
    maxTileCacheSize: 400,
    // A tap on a marker should not also be a tap on the map underneath it.
    // MapLibre's default 3px slop is tuned for a mouse; a thumb on a phone
    // moves further than that while pressing.
    clickTolerance: 5,
    ...opts.extra,
  });
  map._earBasemap = basemap;
  mountBasemapRedraw(map);
  // A phone under memory pressure can have its WebGL context taken away by
  // the browser. MapLibre does not recover from that on its own: the canvas
  // simply stays blank for the rest of the session, with no error and
  // nothing to tap. Caught here and rebuilt, it costs a second of reloading
  // instead of a dead map tab.
  map.on('webglcontextlost', () => console.warn('map WebGL context lost'));
  // The pending basemap handover holds a timer and a `sourcedata` listener;
  // a map that is torn down mid-handover (the pin-drop sheet closing, a
  // rebuild after a lost WebGL context) must not leave either behind.
  map.once('remove', () => stopAerialHandover(map));
  map.on('webglcontextrestored', () => {
    if (mapTabMap === map) rebuildMapTabMap('WebGL context restored');
  });
  // Whether two badges collide depends on the zoom, so the fan is recomputed
  // whenever it changes. `zoomend` rather than `zoom`: this walks every
  // marker, and doing that on each frame of a pinch is work nobody sees.
  map.on('zoomend', () => relayoutStopMarkers(map));
  const closeIn = () => map.getContainer().classList.toggle('map-close-in', map.getZoom() >= MAP_CLOSE_IN_ZOOM);
  map.on('zoom', closeIn);
  map.once('load', closeIn);
  map.touchZoomRotate.disableRotation();
  // MapLibre labels its canvas "Map" in English. This app is German
  // throughout, and a screen reader switching language mid-screen for one
  // word is exactly the seam that gives a web app away.
  try { map.getCanvas().setAttribute('aria-label', 'Karte der Tour'); } catch (_) { /* no canvas yet */ }
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  map.addControl(basemapControl(), 'top-right');
  // No heading indicator, deliberately, and this is the note that stops it
  // being "added back" as an oversight.
  //
  // MapLibre's `showUserHeading` has never been implemented (it exists on
  // Mapbox GL JS; maplibre/maplibre-gl-js#2426 is still open), so the only
  // way to draw one is by hand off `deviceorientation`. That was tried, as
  // an arrow and then as an Apple-Maps-style cone, and on the iPhone this
  // app runs on it pointed somewhere the driver was not facing. The web
  // compass on iOS is a single number with no tilt compensation and no way
  // to tell a good reading from a bad one beyond a coarse accuracy field;
  // what it gave was not close enough to be useful.
  //
  // A direction indicator is read at a glance, at a door, to decide which
  // way to walk. One that is wrong is worse than none at all, because the
  // driver has no way to know it is wrong. The blue location dot alone is
  // the honest drawing of "you are here" — which is the part that was
  // always working.
  const geolocate = new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: true });
  map.addControl(geolocate, 'top-right');

  // `_earPauseGeolocate`/`_earResumeGeolocate` exist so the Karte tab's
  // persistent map (see the section below — it's built once and kept
  // alive for the app's whole lifetime) can stop `watchPosition()` while
  // its own tab isn't the one on screen. Once a driver has tapped the
  // locate-me button, `trackUserLocation: true` keeps that GPS watch
  // running continuously — including while the map's canvas sits detached
  // during a visit to Routen/Verlauf/Mehr — for as long as the app stays
  // open, which for this PWA is realistically hours. `geolocate.trigger()`
  // is the same action a tap on the control performs: a toggle, not a
  // dedicated pause/resume API (MapLibre doesn't expose one), so whether
  // it was actually active is tracked separately rather than assumed —
  // pausing it while off, or resuming it when the driver had already
  // turned it off themselves, would incorrectly turn it *on*.
  let geolocateActive = false;
  let pausedFromActive = false;
  geolocate.on('trackuserlocationstart', () => { geolocateActive = true; });
  geolocate.on('trackuserlocationend', () => { geolocateActive = false; });
  map._earPauseGeolocate = () => {
    pausedFromActive = geolocateActive;
    if (geolocateActive) geolocate.trigger();
  };
  map._earResumeGeolocate = () => {
    if (pausedFromActive) geolocate.trigger();
    pausedFromActive = false;
  };
  return map;
}

// A cheap fingerprint of exactly what `drawRouteOnMap` actually draws —
// not the whole route object, which also carries fields (name,
// created_at, status, ...) that change independently of anything on the
// map and would otherwise force a pointless marker teardown/rebuild.
// `total_km`/`total_min` stand in for the route geometry itself (a full
// coordinate-array comparison on every sync would cost more than the
// redraw it's trying to avoid): a reoptimization that changes the line
// always changes the rounded totals too, even fractionally.
function routeMarkerSignature(r) {
  // Every field `drawRouteOnMap` actually reads into a marker or its popup
  // — id/lat/lon (position), delivered/location_precision (marker color and
  // ring), excluded (whether the stop gets a marker at all), kunde/strasse/plz
  // (the popup's text). `total_km`/`total_min`
  // stand in for the route geometry itself (see the comment where this
  // function is called) rather than the coordinate array, which would cost
  // more to compare on every sync than the redraw it's trying to avoid.
  const stopsSig = r.stops
    .map(s => `${s.id}:${s.lat}:${s.lon}:${s.outcome || ''}:${s.excluded ? 1 : 0}:${s.location_precision || ''}:${s.kunde}:${s.strasse}:${s.plz}:${s.pinned ? 1 : 0}:${s.entrance_lat ?? ''}:${s.entrance_lon ?? ''}`)
    .join('|');
  return `${r.id}|${r.total_km}|${r.total_min}|${stopsSig}`;
}

// How far apart (in degrees) two stops' coordinates may be and still get one
// shared dot rather than two. 1e-5 ° is a bit over a metre: two entries
// geocoded to the same register point are bitwise identical, but two
// registered entrances of one building can land a metre apart, where a second
// dot would be indistinguishable from the first at any zoom — one dot is the
// honest drawing of "one door, as far as this map can show it". Keeping the
// badges apart is a separate job, done in screen space (see
// `relayoutStopMarkers`) because whether two badges collide depends on zoom.
const SAME_POINT_DECIMALS = 5;

function pointKey(s) {
  return `${s.lat.toFixed(SAME_POINT_DECIMALS)},${s.lon.toFixed(SAME_POINT_DECIMALS)}`;
}

// Where a badge sits relative to the point it belongs to, in screen pixels —
// a marker `offset`, so it holds its distance at every zoom instead of
// drifting as the map scales.
//
// A lone badge gets pushed straight up, clear of the dot marking the door.
// Badges that would land on top of each other fan out evenly around the
// group's shared centre.
function badgeOffset(i, n) {
  if (n <= 1) return [0, -22];
  // Grows with the group so five-plus badges don't crowd each other back
  // into the clump the fan exists to break up.
  const radius = n <= 4 ? 26 : 26 + (n - 4) * 4;
  // Starts at 12 o'clock and goes clockwise, so a pair reads as one above
  // and one below the door rather than an arbitrary diagonal.
  const angle = -Math.PI / 2 + (i * 2 * Math.PI) / n;
  return [Math.cos(angle) * radius, Math.sin(angle) * radius];
}

// How close two badges have to be, on screen, to be fanned apart instead of
// left to overlap.
const FAN_CLUSTER_PX = 34;
// Below street level, only *exactly* coincident stops are fanned. Two
// entries for one door overlap at every zoom there is and must always be
// separated; two neighbouring houses only overlap when the map is zoomed
// out, and pulling their badges apart there would just scatter numbers away
// from the streets they belong to for no gain — at that zoom the driver is
// reading the shape of the route, not picking out a door.
const FAN_MIN_ZOOM = 15;

// Fans out every group of badges that would otherwise sit on top of each
// other *at the current zoom*.
//
// Grouping by identical coordinates (which is what this used to do) only
// caught two orders at one address. It did nothing for the case that
// actually hides a stop just as thoroughly: two doors a few metres apart —
// neighbouring houses, or two Stiegen of one Gemeindebau, 30 m and therefore
// a couple of pixels apart on an overview. Clustering in projected screen
// space catches both, and re-running on zoom means a fan opens up as the
// driver zooms in rather than being decided once at whatever zoom the route
// happened to be drawn at.
//
// The dots never move: each stays on its own registered point, so the
// precise locations stay readable underneath whatever the badges do.
function relayoutStopMarkers(map) {
  const badges = map._earBadges || [];
  if (!badges.length) return;
  const radius = map.getZoom() >= FAN_MIN_ZOOM ? FAN_CLUSTER_PX : 0.5;
  const pts = badges.map((b) => {
    const p = map.project(b.lngLat);
    return { b, x: p.x, y: p.y, taken: false };
  });
  for (const seed of pts) {
    if (seed.taken) continue;
    // `seed` is still untaken here, so it heads its own cluster.
    const cluster = pts.filter((q) => !q.taken && Math.hypot(q.x - seed.x, q.y - seed.y) <= radius);
    for (const q of cluster) q.taken = true;
    const cx = cluster.reduce((sum, q) => sum + q.x, 0) / cluster.length;
    const cy = cluster.reduce((sum, q) => sum + q.y, 0) / cluster.length;
    cluster.forEach((q, idx) => {
      const [fx, fy] = badgeOffset(idx, cluster.length);
      // Offsets are relative to each marker's *own* coordinate, so the fan
      // is built around the cluster's centre by first cancelling out how far
      // this marker sits from it.
      // Rounded: these end up as CSS translate values, and a whole pixel
      // renders a 26px badge crisply where 25.9999 makes the browser
      // resample it.
      const off = [Math.round(cx - q.x + fx), Math.round(cy - q.y + fy)];
      q.b.marker.setOffset(off);
    });
  }
}

// An empty LineString — what the route source holds before a route is
// loaded, and what it falls back to for a route with no drivable geometry.
// A source always has *some* data so the line's layers can be created once
// and then left alone; see `ensureRouteLayers`.
const EMPTY_LINE = { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [] } };

function routeLineGeoJson(r) {
  return {
    type: 'Feature',
    properties: {},
    geometry: {
      type: 'LineString',
      // OSRM's polyline comes in as [lat, lon]; GeoJSON wants [lon, lat].
      // One malformed pair must not be able to break the whole line, so
      // anything that isn't a finite pair is dropped rather than passed on.
      coordinates: (Array.isArray(r?.geometry) ? r.geometry : [])
        .filter((p) => Array.isArray(p) && Number.isFinite(p[0]) && Number.isFinite(p[1]))
        .map(([lat, lon]) => [lon, lat]),
    },
  };
}

// Creates the route line's source and its two layers once, empty, and
// leaves them in the style for the life of the map.
//
// This used to be part of `drawRouteOnMap`, which tore all three down and
// rebuilt them on every redraw — and that teardown is what made the route
// line "disappear sometimes". Between the `removeLayer` calls and the
// `addLayer` calls the map genuinely has no route on it, and anything that
// threw in between (an `addSource` against a style MapLibre was in the
// middle of mutating, a `styledata` re-entry, a redraw racing the basemap
// mount) left it that way permanently: the caller had already recorded the
// new signature as drawn, so no later sync ever tried again. There was no
// gesture that fixed it short of a reload.
//
// Created once and updated with `setData`, there is no such window. A
// redraw is one buffer swap on a source that never stops existing, which is
// also markedly cheaper — no layer re-validation, no style re-index — on
// exactly the redraws that happen most (a stop ticked off mid-route).
/// From here in, a house's street door is drawn apart from its pin. About
/// the height the iOS app's map switches at.
const MAP_CLOSE_IN_ZOOM = 15;

/// One mark per street door that is not where its pin is, with the pins it
/// is the way in to -- the iOS app's `MapTab.entranceMarks`.
///
/// The pin sits on the Stiege, which in a Gemeindebau can be a courtyard
/// away from the only door on the street. A door within ten metres of its
/// pin would be drawn underneath it, and says nothing the pin does not.
/// Several Stiegen behind one door share its mark.
function entranceMarks(doors) {
  const key = (c) => `${Math.round(c[0] * 100000)},${Math.round(c[1] * 100000)}`;
  const marks = new Map();
  for (const door of doors) {
    if (metresBetween(door.pin[0], door.pin[1], door.entrance[0], door.entrance[1]) < 10) continue;
    const id = key(door.entrance);
    if (!marks.has(id)) marks.set(id, { lat: door.entrance[0], lon: door.entrance[1], pins: [], seen: new Set() });
    const mark = marks.get(id);
    const pin = key(door.pin);
    if (!mark.seen.has(pin)) { mark.seen.add(pin); mark.pins.push(door.pin); }
  }
  return [...marks.values()];
}

function ensureRouteLayers(map) {
  if (!map.getSource('route-line')) {
    map.addSource('route-line', { type: 'geojson', data: EMPTY_LINE });
  }
  // A white casing under the red line. On the vector basemap it's a subtle
  // outline; on the aerial one it's what keeps the route visible at all,
  // since red-on-dark-asphalt at 4px is nearly invisible from arm's length
  // in daylight.
  if (!map.getLayer('route-line-casing')) {
    map.addLayer({
      id: 'route-line-casing',
      type: 'line',
      source: 'route-line',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#fff', 'line-width': 8, 'line-opacity': 0.75 },
    });
  }
  // Under the route line, and only from close in -- see `.marker-door`.
  if (!map.getSource('entrance-links')) {
    map.addSource('entrance-links', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  }
  if (!map.getLayer('entrance-links')) {
    map.addLayer({
      id: 'entrance-links',
      type: 'line',
      source: 'entrance-links',
      minzoom: MAP_CLOSE_IN_ZOOM,
      layout: { 'line-cap': 'round' },
      paint: { 'line-color': '#8E8E93', 'line-width': 2, 'line-dasharray': [1, 2.5] },
    });
  }
  if (!map.getLayer('route-line')) {
    map.addLayer({
      id: 'route-line',
      type: 'line',
      source: 'route-line',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#ED1639', 'line-width': 4, 'line-opacity': 0.95 },
    });
  }
}

function drawRouteOnMap(map, r, { fit = true } = {}) {
  ensureRouteLayers(map);
  // Scoped to this map's own container. A document-wide query would also
  // rip the markers out of any *other* map that happens to be open — the
  // pin-drop sheet's, most obviously — which is a bug waiting for the day
  // two maps are on screen at once rather than a hypothetical.
  (map._earMarkers || []).forEach((m) => m.remove());
  map._earMarkers = [];
  map._earBadges = [];

  map.getSource('route-line').setData(routeLineGeoJson(r));

  const bounds = new maplibregl.LngLatBounds();
  if (Array.isArray(r.geometry) && r.geometry.length > 1) {
    for (const point of r.geometry) {
      // Same reasoning as the per-stop check below, for the route line's
      // own polyline: it comes from OSRM rather than from this app, and one
      // malformed pair must not be able to break the camera.
      if (!Array.isArray(point)) continue;
      const [lat, lon] = point;
      if (Number.isFinite(lat) && Number.isFinite(lon)) bounds.extend([lon, lat]);
    }
  }

  const firstOpenIdx = firstOpenIndex(r.stops);
  let customerNum = 0;

  // One dot per distinct registered point, and every badge collected for
  // `relayoutStopMarkers` to fan out once they're all placed.
  const dotsPlaced = new Set();
  map._earBadges = [];

  r.stops.forEach((s, i) => {
    // A skipped fixed stop isn't on this tour at all: the line doesn't go
    // there and neither does the van, so a marker for it would only be a
    // pin the driver has to work out isn't a destination — and letting it
    // into `bounds` would zoom the map out to frame a place nobody visits.
    if (s.excluded) return;
    // A coordinate that isn't a real number would be drawn as a marker at
    // an undefined place and, worse, poison `bounds` — one NaN there and
    // `fitBounds` throws, taking the whole map render down with it rather
    // than losing one pin. The stop is still in the list, where the driver
    // can see and fix it; it just isn't on the map.
    if (!Number.isFinite(s.lat) || !Number.isFinite(s.lon)) return;
    const meta = stopKindMeta(s);
    let el;
    // Each marker is announced as what it is, not as the bare number or
    // tick inside it. Without this the Karte tab is a blank spot for
    // VoiceOver: a canvas with nothing readable on it, surrounded by
    // unlabelled `div`s. `role="button"` because tapping one does something
    // (it opens the popup), and the marker element is already focusable —
    // MapLibre makes a marker with a popup keyboard-reachable, so this is
    // the label that reachability was missing.
    let label;
    if (meta) {
      el = elFromHtml(`<div class="marker-fixed">${meta.icon}</div>`);
      label = `${meta.title}: ${meta.subtitle}`;
    } else {
      // A door the van does not go to takes no number: it is not a stop of
      // the tour, and counting it would shift every number after it away
      // from the order the list drives in.
      const skipped = skipsDoor(s);
      if (!skipped) customerNum++;
      const isNext = i === firstOpenIdx;
      const bg = s.delivered ? '#34C759' : s.outcome === 'notHome' ? '#FF9500' : skipped ? '#C7C7CC' : isNext ? '#ED1639' : '#8E8E93';
      const ring = s.location_precision ? 'box-shadow:0 0 0 3px #FF9500,0 1px 4px rgba(0,0,0,.4);' : '';
      const glyph = s.delivered ? '✓' : s.outcome === 'notHome' ? '!' : skipped ? '–' : customerNum;
      el = elFromHtml(`<div class="marker-badge" style="background:${bg};${ring}">${glyph}</div>`);
      // Position in the tour, who it is, and its state — the three things
      // the marker's colour and number convey to someone who can see it.
      const status = s.outcome ? OUTCOMES[s.outcome]?.short || 'erledigt' : isNext ? 'nächster Stopp' : 'offen';
      label = `${skipped ? 'Stopp' : `Stopp ${customerNum}`}: ${s.kunde}, ${s.strasse}, ${s.plz} — ${status}`;
    }
    el.classList.add('ear-route-marker');
    // One dot per address, drawn once for the whole group and marking the
    // registered position of the door itself. The badge is 26px wide and
    // would otherwise sit *on* the building it's pointing at, hiding the
    // one thing the driver zoomed in to look at; offsetting the badge and
    // leaving a 9px dot behind is what makes "exactly this house, this
    // entrance" readable on the aerial imagery. `pointer-events: none` (see
    // the CSS) keeps the dot from swallowing taps meant for the badge.
    const key = pointKey(s);
    if (!dotsPlaced.has(key)) {
      dotsPlaced.add(key);
      const dot = new maplibregl.Marker({ element: elFromHtml('<div class="marker-dot"></div>'), anchor: 'center' })
        .setLngLat([s.lon, s.lat])
        .addTo(map);
      map._earMarkers.push(dot);
    }

    const marker = new maplibregl.Marker({ element: el, anchor: 'center', offset: [0, -22] })
      .setLngLat([s.lon, s.lat])
      .addTo(map);
    // A tap opens the stop's card. Stopped here, so the map underneath does
    // not take the same tap as "somewhere else" and close it again.
    el.style.cursor = 'pointer';
    el.addEventListener('click', (e) => { e.stopPropagation(); selectMapStop(s.id); });
    // After the Marker is constructed, not before: MapLibre stamps its own
    // `aria-label` of "Map marker" onto the element it is handed, so a
    // label set on `el` earlier is silently overwritten — every pin on the
    // route announced identically, in English, in a German app.
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', label);
    map._earMarkers.push(marker);
    map._earBadges.push({ marker, lngLat: [s.lon, s.lat] });
    bounds.extend([s.lon, s.lat]);
  });

  // The street doors that are not where their pin is. Not for a pin the
  // driver placed, which is the door already; and not once the meal is handed
  // over, when nobody is looking for the way in any more.
  const marks = entranceMarks(r.stops
    .filter((s) => s.kind === 'customer' && !s.excluded && !s.pinned && !handedOver(s.outcome)
      && Number.isFinite(s.lat) && Number.isFinite(s.lon) && entranceOf(s))
    .map((s) => ({ pin: [s.lat, s.lon], entrance: entranceOf(s) })));
  map.getSource('entrance-links').setData({
    type: 'FeatureCollection',
    // The thread back to the pin: in a courtyard of Stiegen it is what says
    // whose door this is.
    features: marks.flatMap((m) => m.pins.map((pin) => ({
      type: 'Feature', properties: {},
      geometry: { type: 'LineString', coordinates: [[m.lon, m.lat], [pin[1], pin[0]]] },
    }))),
  });
  for (const m of marks) {
    // Not something to tap: the pin is the stop, this only says where to
    // walk in.
    const door = new maplibregl.Marker({ element: elFromHtml(`<div class="marker-door" role="img" aria-label="Eingang">${ICONS.door}</div>`), anchor: 'center' })
      .setLngLat([m.lon, m.lat])
      .addTo(map);
    map._earMarkers.push(door);
  }

  // Only frame the route when it's a route the map wasn't already showing.
  // Redrawing after a stop is ticked off (or after any other in-place
  // update) must leave the camera exactly where the driver put it —
  // re-fitting on every redraw would silently undo their zoom/pan each
  // time, which is maddening while actually using the map to navigate.
  if (fit) {
    if (!bounds.isEmpty()) {
      map.fitBounds(bounds, { padding: 48, maxZoom: 16, duration: 0 });
    } else {
      map.jumpTo({ center: VIENNA_CENTER, zoom: 12 });
    }
  }
  // Last, after any camera move: which badges collide is a function of the
  // zoom this ends on, not the one the map happened to be at when the
  // redraw started.
  relayoutStopMarkers(map);
}

// ---------------------------------------------------------------------
// The Karte tab's map is built exactly once and then kept alive for the
// life of the page.
//
// It can't simply live in the markup `renderMapTab()` returns: render()
// replaces all of #app's innerHTML, so any element written there is a
// brand new DOM node every single pass, and a map bound to the old one
// would have to be torn down and rebuilt — refetching the style JSON,
// glyphs and sprites, and throwing away the driver's zoom and pan — on
// every re-render, including something as routine as tapping a different
// route chip.
//
// So MapLibre gets its own element that render() never touches
// (`mapTabEl`, created detached), and each render just re-parents that
// element into the empty `#route-map` slot the freshly built screen
// provides. Moving a node between parents preserves its canvas and its
// WebGL context — the map keeps its tiles, its camera and its state, and
// switching routes becomes "swap the line and the markers".
// ---------------------------------------------------------------------
let mapTabMap = null;
let mapTabEl = null;
let mapTabRouteId = null;
// Tracks whether the Karte tab was the visible screen as of the last
// render — see `render()`'s own use of this, right after the comment
// about not destroying the map on tab-away.
let mapTabWasVisible = false;

function initMapTabMap() {
  const slot = document.getElementById('route-map');
  // Deliberately NOT gated on `state.currentRoute`.
  //
  // It used to be, and that turned two independent waits into one queue:
  // opening the Karte tab fires a `GET /routes/:id` for the auto-selected
  // route (see `renderMapTab`), and the map — the style JSON, the sprite,
  // the glyphs, the first screenful of tiles, the WebGL context — did not
  // even *begin* loading until that request came back. On a van's
  // connection that is a grey rectangle for as long as the route fetch
  // takes, and only then the map starting from nothing.
  //
  // The map needs no route to exist. Built immediately, it loads in
  // parallel with the fetch, and by the time the route lands the basemap is
  // usually already on screen and drawing the line is instant.
  if (!slot) return;
  if (typeof maplibregl === 'undefined') {
    // Not loaded yet (the idle-time speculative fetch may still be in
    // flight, or this is the very first thing the driver did after a cold
    // start) — kick it off/join the in-flight load, then re-run this
    // function from scratch once it lands. Re-running rather than
    // continuing the stale call is what makes sure whatever's actually on
    // screen by the time it resolves (maybe a different route, maybe a
    // different tab entirely) is what gets initialized, not whatever was
    // true when this call started.
    ensureMapLibre()
      .then(() => { if (state.tab === 'map' && !isDetailShowing()) initMapTabMap(); })
      .catch(() => { toast('Kartenbibliothek konnte nicht geladen werden.', 'error'); });
    return;
  }

  if (!mapTabEl) {
    mapTabEl = document.createElement('div');
    mapTabEl.className = 'absolute inset-0';
  }
  if (mapTabEl.parentElement !== slot) slot.appendChild(mapTabEl);

  if (!mapTabMap) {
    const map = newMap(mapTabEl, {});
    mapTabMap = map;
    map.on('click', () => closeMapCard());
    // The element's real size is still settling the tick it's inserted
    // (safe-area values resolve, layout lands) — and it's detached and re-attached on
    // every tab switch from then on. A ResizeObserver keeps the canvas in
    // sync with whatever the box actually turns out to be, each time,
    // instead of guessing at one fixed delay.
    const resizeObserver = new ResizeObserver(() => map.resize());
    resizeObserver.observe(mapTabEl);
    map.once('remove', () => resizeObserver.disconnect());
    // `idle` fires when everything currently requested has been drawn;
    // `load` is the belt-and-braces path for a map whose first view needs
    // no tiles at all. Whichever comes first retires the placeholder.
    map.once('idle', markMapTabReady);
    map.once('load', markMapTabReady);
    // And a ceiling under both, because the failure this guards is worse
    // than the thing it is guarding. A source that never finishes — one
    // tile host unreachable while the rest of the map draws perfectly —
    // means no `idle`, ever. Without a deadline the placeholder would then
    // sit opaquely over a map that works, which is strictly worse than no
    // placeholder at all. After this it comes down regardless and the
    // driver gets whatever has drawn, plus the street map underneath.
    setTimeout(markMapTabReady, MAP_PLACEHOLDER_MAX_MS);
    // No 'load' handler for the first draw: `mountBasemapRedraw` covers it,
    // earlier (layers only need a parsed style, not loaded tiles) and on
    // one code path rather than two that can disagree.
    return;
  }

  // Re-attached from a previous tab visit: the element had no layout box
  // while it was detached, so the canvas needs one explicit nudge before
  // the ResizeObserver takes over again.
  mapTabMap.resize();
  syncMapTabRoute();
}

function syncMapTabRoute() {
  const map = mapTabMap;
  const r = state.currentRoute;
  if (!map || !r) return;
  // Nothing to add sources or layers to until the style is parsed. Waiting
  // on `isStyleLoaded()` here (which is what this used to do) waits for far
  // more than that — it also wants every *source* to have its tiles, which
  // on a van's connection can be in flight for a long time, and re-arming
  // on `styledata` to find out was both racy and easy to dead-end. The
  // `styledata` handler in `mountBasemapRedraw` sets this flag at exactly
  // the moment layers can be added, and calls back here itself, so a plain
  // early return is now the whole of the waiting logic.
  if (!map._earStyleReady) return;
  // Skip the teardown/rebuild entirely when nothing that's actually drawn
  // has changed since the last time this map was synced — `render()` calls
  // this on every single re-render while the Karte tab is showing (see its
  // call to `initMapTabMap()`), including a driver just switching away to
  // the stop list and back with nothing having changed at all. Without
  // this, every one of those visits tore down and recreated every marker
  // and popup from scratch.
  const signature = routeMarkerSignature(r);
  // Two conditions, not one. The signature says "the data hasn't changed";
  // the layer check says "and what was drawn from it is still on the map".
  // Only the first used to be tested, which meant any redraw that didn't
  // finish left the map permanently blank: the signature had already been
  // recorded, so every later sync agreed there was nothing to do. The layer
  // lookup is a cheap hash lookup, not a style clone, so paying it on every
  // sync costs nothing and makes a missing line self-heal on the very next
  // render instead of needing a reload.
  if (map._earLastSignature === signature && map.getLayer('route-line')) { applyMapFocus(); return; }
  // Recorded only after the draw actually completes, and cleared if it
  // throws, so a failed draw is retried rather than remembered as done.
  map._earLastSignature = null;
  try {
    // Asked to show one stop: that is where the camera goes, not the tour.
    drawRouteOnMap(map, r, { fit: mapTabRouteId !== r.id && mapFocusRequest == null });
  } catch (err) {
    // The map keeps its basemap and whatever was already drawn; only this
    // redraw is lost, and the next render (or the `styledata` handler)
    // tries again because the signature was never recorded.
    console.warn('route redraw failed', err);
    return;
  }
  map._earLastSignature = signature;
  map._earRouteDrawn = true;
  mapTabRouteId = r.id;
  applyMapFocus();
}

// ---------------------------------------------------------------------
// The card of the pin that was tapped: who, where, what to hand over, the
// tick, navigation, and the way to its row in the list -- the iOS app's pin
// card. It takes the place of the tour's own card at the bottom of the map
// and gives it back when it is closed.
// ---------------------------------------------------------------------
/// `{ id }` for one stop's card, `{ id, shared: true }` for the list of the
/// stops drawn on one spot, `{ id, fromShared: true }` for a stop picked
/// from that list.
let mapCard = null;
/// A stop the map has been asked to go to, until it has.
let mapFocusRequest = null;

/// The customers drawn where `stop` is: one house, several households.
function sharedPinMembers(r, stop) {
  if (stop.kind !== 'customer') return [stop];
  return r.stops.filter((s) => s.kind === 'customer' && !s.excluded
    && Number.isFinite(s.lat) && Number.isFinite(s.lon)
    && metresBetween(s.lat, s.lon, stop.lat, stop.lon) < 10);
}

function selectMapStop(stopId) {
  const r = state.currentRoute;
  const stop = r?.stops.find((s) => s.id === stopId);
  if (!stop) return;
  // From far out the badges of one house lie on top of each other and a tap
  // can only ever reach the top one: say who else is there. Closer in they
  // fan out, and each is its own tap.
  const stacked = mapTabMap && mapTabMap.getZoom() < FAN_MIN_ZOOM && sharedPinMembers(r, stop).length > 1;
  mapCard = stacked ? { id: stopId, shared: true } : { id: stopId };
  paintMapCard();
}

function pickMapStop(stopId) {
  mapCard = { id: stopId, fromShared: true };
  paintMapCard();
}

function backToSharedPin() {
  if (!mapCard) return;
  mapCard = { id: mapCard.id, shared: true };
  paintMapCard();
}

function closeMapCard() {
  if (!mapCard) return;
  mapCard = null;
  paintMapCard();
}

function paintMapCard() {
  const slot = document.querySelector('[data-map-card]');
  if (slot) slot.innerHTML = mapCardHtml() || mapDockHtml();
}

/// The tour's own card at the bottom of the map: tap for its stop list.
function mapDockHtml() {
  const r = state.currentRoute;
  if (!r) return '';
  const progress = r.customer_count ? Math.round((r.delivered_count / r.customer_count) * 100) : 0;
  return `
    <button data-bottom-dock onclick="openCurrentRouteDetail()" class="press-98 w-full text-left bg-white/90 backdrop-blur-xl rounded-2xl p-4 shadow-lg flex items-center gap-3">
      <div class="flex-1 min-w-0">
        <p class="font-semibold truncate">${escapeHtml(r.name)}</p>
        <p class="text-[13px] text-black/55 mt-0.5">${r.delivered_count}/${r.customer_count} geliefert · ≈ ${fmtKm(r.total_km)} · ${r.total_min} min</p>
        <div class="h-1 bg-black/10 rounded-full overflow-hidden mt-1.5"><div class="h-full bg-success" style="width:${progress}%"></div></div>
      </div>
      <span class="text-black/25 text-lg flex shrink-0">${ICONS.chevron}</span>
    </button>`;
}

function mapCardHtml() {
  const r = state.currentRoute;
  const stop = mapCard && r?.stops.find((s) => s.id === mapCard.id);
  if (!stop) return '';
  const close = `<button type="button" onclick="closeMapCard()" aria-label="Schließen" title="Schließen" class="tap-target press-fade w-9 h-9 shrink-0 flex items-center justify-center text-black/55 text-lg" style="margin:-.375rem -.375rem 0 0">${ICONS.close}</button>`;
  const badge = (s) => {
    const n = stopNumber(s, r);
    return n == null ? '' : `<span class="row-num ${s.outcome ? 'done' : ''}" aria-hidden="true" style="margin-right:0">${n}</span>`;
  };

  if (mapCard.shared) {
    const members = sharedPinMembers(r, stop);
    return `
      <div class="map-card" data-bottom-dock>
        <div class="flex items-start gap-3">
          <div class="flex-1 min-w-0">
            <p class="text-[19px] font-bold" style="line-height:1.25">${members.length} Stopps an dieser Adresse</p>
            <p class="text-[15px] text-black/55 mt-0.5">${escapeHtml(stopAddress(stop))}</p>
          </div>
          ${close}
        </div>
        <div class="divide-y divide-black/10" style="margin-top:.5rem">
          ${members.map((s) => `
            <button type="button" onclick="pickMapStop(${s.id})" class="w-full flex items-center gap-3 text-left active:bg-black/5" style="padding:.625rem 0; min-height:44px">
              ${badge(s)}
              <span class="flex-1 min-w-0">
                <span class="block ${s.outcome ? 'text-black/55' : ''} ${s.delivered ? 'line-through' : ''}">${escapeHtml(s.kunde || 'Stopp')}</span>
                ${s.outcome ? `<span class="block text-[13px] text-black/55">${escapeHtml(OUTCOMES[s.outcome]?.label || '')}</span>` : ''}
              </span>
              <span class="text-black/25 text-lg flex shrink-0">${ICONS.chevron}</span>
            </button>`).join('')}
        </div>
      </div>`;
  }

  const meta = stopKindMeta(stop);
  const settled = !!stop.outcome;
  const ticks = stop.kind === 'customer' || isCheckpoint(stop);
  const tickLabel = settled ? 'Stopp wieder öffnen' : meta ? 'Als erledigt markieren' : 'Als geliefert markieren';
  const tickClass = !settled ? 'bg-white border-2 border-black/45 text-black/40'
    : stop.delivered || meta ? 'bg-success text-white'
    : stop.outcome === 'notHome' ? 'bg-warn text-white' : 'bg-black/10 text-black/55';
  const tickIcon = !settled ? ICONS.circle : stop.delivered || meta ? ICONS.checkCircleFill : stop.outcome === 'notHome' ? ICONS.bellOff : ICONS.box;
  const paket = meta ? '' : displayPaket(stop, r);
  const precision = stop.location_precision === 'street' ? 'Nur Straße — Hausnummer nicht gefunden'
    : stop.location_precision === 'district' ? 'Nur Bezirk — Adresse nicht gefunden' : '';
  const outcome = !meta && stop.outcome && stop.outcome !== 'delivered' ? OUTCOMES[stop.outcome]?.label || '' : '';
  return `
    <div class="map-card" data-bottom-dock>
      ${mapCard.fromShared ? `<button type="button" onclick="backToSharedPin()" class="press-fade flex items-center gap-1 text-[15px] font-medium text-brand-600" style="min-height:36px; margin-top:-.375rem"><span class="flex">${ICONS.back}</span>Alle an dieser Adresse</button>` : ''}
      <div class="flex items-start gap-3">
        ${badge(stop) ? `<span style="margin-top:.2rem">${badge(stop)}</span>` : ''}
        <div class="flex-1 min-w-0">
          <p class="text-[19px] font-bold" style="line-height:1.25; overflow-wrap:anywhere">${escapeHtml(meta ? meta.title : stop.kunde || 'Stopp')}</p>
          <p class="text-[15px] text-black/55 mt-0.5" style="overflow-wrap:anywhere">${escapeHtml(stopAddress(stop))}</p>
        </div>
        ${ticks ? `<button type="button" onclick="toggleDelivered(${stop.id}, ${!settled})" aria-pressed="${settled}" aria-label="${tickLabel}" title="${tickLabel}" class="tap-target press-95 shrink-0 w-10 h-10 rounded-full flex items-center justify-center text-[20px] shadow-sm ${tickClass}">${tickIcon}</button>` : ''}
        ${close}
      </div>
      ${outcome ? `<p class="now-fact warn"><span>${stop.outcome === 'notHome' ? ICONS.bellOff : ICONS.box}</span><span>${escapeHtml(outcome)}</span></p>` : ''}
      ${paket ? `<p class="now-fact"><span>${ICONS.box}</span><span style="font-weight:600">${escapeHtml(paket)}</span></p>` : ''}
      ${stop.notiz && !meta ? `<p class="now-fact"><span>${ICONS.note}</span><span>${escapeHtml(stop.notiz)}</span></p>` : ''}
      ${precision ? `<p class="now-fact warn"><span>${ICONS.warning}</span><span>${precision}</span></p>` : ''}
      <div class="flex gap-2" style="margin-top:1rem">
        <a href="${navUrl(stop)}" target="_blank" rel="noopener" onclick="noteDeparture(${stop.id})" class="press-98 wide-btn accent">${ICONS.arrowTurn} Navigation</a>
        <button type="button" onclick="showStopInList(${stop.id})" class="press-98 wide-btn quiet">${ICONS.list} In der Liste</button>
      </div>
    </div>`;
}

/// "In der Liste": the tour's stop list, on this stop's row.
function showStopInList(stopId) {
  if (!state.currentRoute) return;
  resetStopFilter();
  openCurrentRouteDetail();
  requestAnimationFrame(() => {
    const row = document.querySelector(`[data-stop-row="${stopId}"]`);
    if (!row) return;
    row.scrollIntoView({ block: 'center', behavior: 'auto' });
    row.animate(
      [{ backgroundColor: 'rgba(237,22,57,0.22)' }, { backgroundColor: 'rgba(237,22,57,0)' }],
      { duration: 1600, easing: 'ease-out' }
    );
  });
}

/// "Auf der Karte zeigen": the map, on this stop, with its card up.
function showStopOnMap(stopId) {
  const stop = state.currentRoute?.stops.find((s) => s.id === stopId);
  if (stop && !stop.excluded && Number.isFinite(stop.lat) && Number.isFinite(stop.lon)) {
    mapCard = { id: stopId };
    mapFocusRequest = stopId;
  }
  if (state.tab === 'map' && !isDetailShowing()) { paintMapCard(); applyMapFocus(); }
  else { dismissUndo(); state.tab = 'map'; render(); }
}

/// Jetzt's map button: the stop the driver is at.
function showNowOnMap() {
  const stops = state.currentRoute?.stops || [];
  const idx = firstOpenIndex(stops);
  if (idx >= 0) showStopOnMap(stops[idx].id);
  else switchTab('map');
}

function applyMapFocus() {
  const map = mapTabMap;
  const r = state.currentRoute;
  if (!map || !r || mapFocusRequest == null || !map._earRouteDrawn) return;
  const stop = r.stops.find((s) => s.id === mapFocusRequest);
  mapFocusRequest = null;
  if (!stop) return;
  // A little above the middle, so the card coming up from below does not
  // cover the pin it is about.
  map.easeTo({
    center: [stop.lon, stop.lat], zoom: Math.max(map.getZoom(), 16.5),
    offset: [0, -90], duration: prefersReducedMotion() ? 0 : 450,
  });
}

/// Every point the tour draws, as the box the map frames.
function routeBounds(r) {
  const bounds = new maplibregl.LngLatBounds();
  for (const point of Array.isArray(r.geometry) ? r.geometry : []) {
    if (Array.isArray(point) && Number.isFinite(point[0]) && Number.isFinite(point[1])) bounds.extend([point[1], point[0]]);
  }
  for (const s of r.stops) {
    if (!s.excluded && Number.isFinite(s.lat) && Number.isFinite(s.lon)) bounds.extend([s.lon, s.lat]);
  }
  return bounds;
}

/// "Ganze Route zeigen".
function fitMapToRoute() {
  const map = mapTabMap;
  const r = state.currentRoute;
  if (!map || !r) return;
  const bounds = routeBounds(r);
  if (bounds.isEmpty()) return;
  map.fitBounds(bounds, { padding: 48, maxZoom: 16, duration: prefersReducedMotion() ? 0 : 450 });
}

// Keeps the selected route's chip visible in the horizontally scrolling
// picker — auto-selecting the first active route, or picking one far down
// a long list, otherwise leaves the highlighted chip off-screen with no
// hint that the map is showing anything at all.
let chipScrolledOnce = false;
function scrollActiveChipIntoView() {
  const chip = document.querySelector('[data-route-chip-active]');
  if (!chip) return;
  // The very first paint has nowhere to animate *from*, and a smooth scroll
  // there just looks like the row drifting on arrival.
  chip.scrollIntoView({ inline: 'center', block: 'nearest', behavior: chipScrolledOnce ? scrollBehavior() : 'auto' });
  chipScrolledOnce = true;
}

// ---------------------------------------------------------------------
// Route detail — pushed screen (stops only; the map lives in its own
// Karte tab now). Large-title collapse, back chevron, "..." overflow menu.
// ---------------------------------------------------------------------
// The header row uses `gap-2`, not `gap-1`, and that is load-bearing: its
// three buttons are 36pt of drawn icon inside a 44pt hit area (see
// `.tap-target` in the stylesheet), so at a 4pt gap two neighbouring hit
// areas overlapped by 4pt — a sliver where "Stopp hinzufügen" and "Weitere
// Aktionen" both claimed the same pixels. An 8pt gap puts the 44pt targets
// exactly edge to edge, which is what makes them unambiguous as well as
// reachable.
function renderRouteDetail() {
  const r = state.currentRoute;
  const progress = r.customer_count ? Math.round((r.delivered_count / r.customer_count) * 100) : 0;
  // A full render rebuilds the filtered list from `stopFilter` on its own, so
  // a background refresh mid-search reproduces exactly what was on screen —
  // `paintStopFilter` exists for keystrokes, not for correctness.
  const filtering = stopFilterActive();

  return `
    <div data-scroll role="main" class="flex-1 min-h-0 overflow-y-auto momentum" style="padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 3.75rem)">
      <div class="sticky top-0 z-20 bg-[#F2F2F7]/85 backdrop-blur-xl border-b border-black/10" style="padding-top: calc(env(safe-area-inset-top) + 0.5rem)">
        <div class="flex items-center gap-2 px-2 pb-2.5">
          <button onclick="closeDetail()" aria-label="Zurück zur Übersicht" title="Zurück" class="tap-target press-fade w-9 h-9 flex items-center justify-center text-brand-600 text-lg shrink-0">${ICONS.back}</button>
          <p data-compact-title class="compact-title flex-1 min-w-0 text-[15px] font-semibold text-center truncate px-1" style="opacity:0">${escapeHtml(r.name)}</p>
          <button onclick="openAddSheet()" aria-label="Stopp hinzufügen" title="Stopp hinzufügen" class="tap-target press-fade w-9 h-9 flex items-center justify-center text-brand-600 text-lg shrink-0">${ICONS.plus}</button>
          <div class="relative shrink-0">
            <button id="route-menu-btn" onclick="toggleRouteMenu()" aria-label="Weitere Aktionen" title="Weitere Aktionen" aria-haspopup="menu" aria-expanded="false" aria-controls="route-menu" class="tap-target press-fade w-9 h-9 flex items-center justify-center text-black/60 text-lg">${ICONS.kebab}</button>
            ${renderRouteMenu()}
          </div>
        </div>
      </div>

      <div class="px-4">
        <h1 data-large-title class="large-title text-[22px] font-bold tracking-tight pt-3 pb-1 truncate">${escapeHtml(r.name)}</h1>
        <p data-route-summary class="text-[13px] text-black/55 pb-3">${escapeHtml(routeSummaryText(r))}</p>

        <div data-optimize-slot>${optimizeBannerHtml()}</div>
        ${r.hand_ordered && r.status === 'active' ? `<p class="now-caption" style="padding:0 .25rem .75rem">Eigene Reihenfolge — die Tour wird so gefahren, wie sie hier steht.</p>` : ''}

        <button onclick="switchTab('map')" class="${CARD} w-full text-left px-4 py-3.5 flex items-center gap-3 mb-4">
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-baseline mb-1.5">
              <p data-delivered-count-text class="text-[15px] font-semibold">${escapeHtml(deliveryLine(r))}</p>
            </div>
            <div class="h-1.5 bg-black/10 rounded-full overflow-hidden">
              <div data-progress-bar class="h-full bg-success transition-all duration-500" style="width: ${progress}%"></div>
            </div>
          </div>
          <span class="text-brand-600 shrink-0 flex items-center gap-1 text-[13px] font-medium">${ICONS.mapPin} Karte<span class="flex">${ICONS.chevron}</span></span>
        </button>

        ${r.status === 'active' && r.customer_count > 0 && !r.stops.some((s) => s.outcome) ? `
          <button onclick="openPreflightSheet()" class="${CARD} press-98 w-full text-left px-4 py-3.5 flex items-center gap-3 mb-4">
            <span class="w-9 h-9 shrink-0 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center text-lg">${ICONS.checkCircle}</span>
            <span class="flex-1 min-w-0"><span class="block font-semibold">Tour vorbereiten</span><span class="block text-[13px] text-black/55">Kurz prüfen, ob vor der Abfahrt alles passt.</span></span>
            <span class="text-black/25 text-lg flex shrink-0">${ICONS.chevron}</span>
          </button>` : ''}
        <div data-next-stop-bar-slot>${nextStopBarHtml()}</div>

        ${stopSearchBar()}
        <p data-stop-filter-status role="status" aria-live="polite"
          class="${filtering ? '' : 'hidden'} text-[13px] font-medium text-black/55 px-1 pb-1.5">${escapeHtml(stopFilterStatusText())}</p>

        <div data-stop-list>${stopListHtml({ animate: !suppressRowAnim })}</div>
        <div data-route-foot>${routeFootHtml()}</div>
      </div>
    </div>
  `;
}

// A route is 20–30 stops, and the one that matters is whichever is next.
// Partway through a shift that row is somewhere in the middle of a list
// the driver has to scroll and scan to find — every single time they come
// back to the app after a delivery. This puts it one tap away, and names
// the customer so it doubles as an answer to "who am I going to?" without
// scrolling at all. Hidden once everything is delivered, when there is no
// next stop to go to.
function nextStopBar(stops, firstOpenIdx) {
  if (firstOpenIdx < 0) return '';
  const next = stops[firstOpenIdx];
  return `
    <button onclick="scrollToNextStop()" class="press-98 w-full flex items-center gap-3 bg-brand-600 text-white rounded-2xl px-4 py-3 mb-4 shadow-sm text-left">
      <span class="w-8 h-8 shrink-0 rounded-full bg-white/20 flex items-center justify-center">${ICONS.mapPin}</span>
      <span class="flex-1 min-w-0">
        <span class="block text-[11px] font-semibold uppercase tracking-wide text-white">Nächster Stopp</span>
        <span class="block text-[15px] font-semibold truncate">${escapeHtml(stopKindMeta(next)?.title || next.kunde)}</span>
        <span class="block text-[12px] text-white truncate">${escapeHtml(next.strasse)}, ${escapeHtml(next.plz)}</span>
      </span>
      <span class="shrink-0 text-white/70 flex">${ICONS.chevron}</span>
    </button>
  `;
}

// Whether the driver has asked the OS for less motion. Read live rather
// than cached: iOS lets it be toggled from Control Center, and this app
// stays open for days at a time, so a value read once at load would be the
// wrong one for most of that.
//
// The CSS side is handled by the `prefers-reduced-motion` block in the
// stylesheet; this is for the handful of places the decision is made in
// JavaScript instead — `scrollIntoView`, mostly, whose behaviour is an
// argument rather than a property and so is not reachable from CSS at all.
function prefersReducedMotion() {
  return !!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
}

function scrollBehavior() {
  return prefersReducedMotion() ? 'auto' : 'smooth';
}

function scrollToNextStop() {
  const row = document.querySelector('[data-next-stop]');
  if (!row) return;
  row.scrollIntoView({ block: 'center', behavior: scrollBehavior() });
  // A brief highlight so the eye lands on the right row rather than on
  // wherever the scroll happened to stop.
  row.animate(
    [{ backgroundColor: 'rgba(237,22,57,0.22)' }, { backgroundColor: 'rgba(237,22,57,0)' }],
    { duration: 1200, easing: 'ease-out' }
  );
}

// ---------------------------------------------------------------------
// Stop filter — finding one customer inside the open route.
//
// A route is 20–30 stops in driving order, which is the right order to
// drive and the wrong one to look something up in. A driver holding a name
// or half an address ("who was the Gentzgasse one?", "did I already do
// Novak?") has to scroll the whole list and read every row. This narrows it
// to what they typed.
//
// Entirely local: `state.currentRoute.stops` is already in memory, so
// filtering costs nothing, needs no network, and works with no signal —
// which is most of the point, since the list is consulted standing next to
// a van rather than at a desk.
// ---------------------------------------------------------------------

/// Belongs to whichever route is open, and is cleared whenever a different
/// one is loaded (see `loadRouteIntoFocus`/`closeDetail`) — a filter left
/// over from the last route would silently hide most of the new one.
const stopFilter = { query: '' };

/// The tokens the filter matches on, or `null` when there is nothing to
/// filter by (an empty field, or one holding only punctuation — which
/// normalizes away to nothing and must not be treated as a filter that
/// matches everything *or* nothing).
///
/// Every token has to appear somewhere in the stop's text, in any order, so
/// "gruber gentzgasse" and "gentzgasse gruber" are the same search. Deliberately
/// substring rather than whole-word: one-handed in a van, people stop typing
/// at "gentz".
function stopFilterTokens() {
  const key = normalizeMatchText(stopFilter.query);
  return key ? key.split(' ').filter(Boolean) : null;
}

function stopFilterActive() {
  return stopFilterTokens() !== null;
}

/// Customer, street and postcode together, through the same normalization
/// the duplicate check uses — so "hauptstr 5" finds the stop stored as
/// "Hauptstraße 5", "gentzgasse 129 1" finds "Gentzgasse 129/1", and no
/// match is ever decided by a slash or a full stop.
function stopMatches(s, tokens) {
  const hay = `${normalizeMatchText(s.kunde)} ${normalizeMatchText(s.strasse)} ${String(s.plz || '').trim()} ${normalizeMatchText(s.paket)} ${normalizeMatchText(s.notiz)}`;
  return tokens.every((t) => hay.includes(t));
}

/// No debounce and no minimum length: this is a synchronous pass over at
/// most a hundred objects already in memory, so the list can simply keep up
/// with the keyboard. A single letter is a legitimate narrowing here in a
/// way it would not be against a whole database.
function onStopFilterInput(value) {
  stopFilter.query = value;
  paintStopFilter();
}

function clearStopFilter() {
  stopFilter.query = '';
  const input = document.getElementById('stop-search');
  if (input) {
    input.value = '';
    // Focus stays in the field: clearing is usually the first half of
    // "search for something else", and dropping the caret would make that
    // two taps instead of one.
    input.focus({ preventScroll: true });
  }
  paintStopFilter();
}
