<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<!-- Zoom is locked. Installed to a home screen this is an app, not a page,
     and browser zoom on an app reads as breakage: a stray two-finger touch
     while steadying the phone in a van leaves the whole UI at 1.4× with the
     tab bar half off screen and no visible way back.

     Deliberate trade, recorded here so it isn't "fixed" by accident: this
     is the one thing that let a driver enlarge a house number they couldn't
     quite read. Nothing replaces it — the app's own type is sized for that
     (nothing readable below 13px, addresses at 13–15px), and the OS-level
     accessibility zoom still works, but in-app pinch does not. Reverting is
     just dropping `maximum-scale`/`user-scalable` below and the zoom-lock
     listeners in the Init section.

     `user-scalable=no` is honored by Android/Chrome and ignored outright by
     iOS Safari since iOS 10, so it is the `gesturestart` handlers in the
     Init section that actually do the work on the platform this mostly runs
     on. The map is exempt — see there for why it needs no exemption code.

     Keeping every focusable field at ≥16px still matters independently: it
     is the threshold iOS checks before auto-zooming a focused input, and
     that auto-zoom fires regardless of these settings. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>EAR Routing</title>
<meta name="description" content="Essen auf Rädern – Routenplanung für Zusteller des Arbeiter-Samariter-Bundes Österreichs" />
<meta name="color-scheme" content="light" />

<!-- PWA / "add to home screen".

     Light mode only, and deliberately so rather than by omission: this is a
     daylight tool. It is read at arm's length through a windscreen and in a
     van doorway, where a light ground at full brightness is the legible
     one, and its whole visual language — the ASBÖ red on white, the grouped
     iOS-settings lists — is built for that. `color-scheme: light` above is
     what makes the choice real: without it a phone in dark mode renders the
     form controls, the select's popup and the scrollbars dark against this
     app's light surfaces, which is the worst of both.

     Recorded here because it is a decision, not an oversight. Adding a dark
     palette is a real piece of work (every colour in the app is a literal,
     and the map's own basemap style and marker colours would need a dark
     variant too), not a flag to flip.

     theme-color matches the app's actual grouped background;
     apple-mobile-web-app-status-bar-style is "default" (dark status-bar
     icons), which reads correctly against that light background. -->
<meta name="theme-color" content="#F2F2F7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="EAR Routing" />
<meta name="format-detection" content="telephone=no" />

<script>
  // The ASBÖ logo (Arbeiter-Samariter-Bund Österreichs) is served
  // from disk as /icon.png (see src/main.rs) — reused for the favicon,
  // apple-touch-icon, the inline manifest's icon and the in-app
  // header/empty-states, all via this one constant.
  const APP_LOGO = "/icon.png";
  const MANIFEST = {
    name: "EAR Routing – Essen auf Rädern",
    short_name: "EAR Routing",
    description: "Routenplanung für Essen auf Rädern – Arbeiter-Samariter-Bund Österreichs",
    start_url: "/",
    scope: "/",
    display: "standalone",
    orientation: "portrait",
    background_color: "#F2F2F7",
    theme_color: "#F2F2F7",
    icons: [
      { src: APP_LOGO, sizes: "512x512", type: "image/png", purpose: "any" },
      { src: APP_LOGO, sizes: "512x512", type: "image/png", purpose: "maskable" },
    ],
  };
  // Appended to <head> directly rather than via document.write(): same
  // result, but document.write is blocked outright in a few contexts a PWA
  // can legitimately end up in (a parser-inserted async script, some
  // in-app browsers) and would silently take the icons and the manifest —
  // i.e. "add to home screen" itself — down with it.
  const head = document.head;
  const addTag = (tag, attrs) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    head.appendChild(el);
  };
  addTag('link', { rel: 'icon', type: 'image/png', href: APP_LOGO });
  addTag('link', { rel: 'apple-touch-icon', href: APP_LOGO });
  addTag('link', {
    rel: 'manifest',
    href: 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(MANIFEST)),
  });
  addTag('meta', { name: 'apple-mobile-web-app-status-bar-style', content: 'default' });
</script>

<!-- MapLibre GL JS/CSS is loaded on demand (see `ensureMapLibre()` further
     down), not as a blocking tag here: it's a several-hundred-KB library
     needed only once the driver opens the Karte tab or the pin-drop
     sheet, and this app's entire screen is built by `render()` in JS with
     no static body content to paint in the meantime — every millisecond
     spent blocking here on a library the very first screen (Routen) never
     touches is a millisecond added to every cold start. -->

<style>
  /* `dvh` is unreliable specifically inside an iOS home-screen standalone
     launch (it can resolve smaller than the true screen, exposing the
     WKWebView's default black canvas above/below the content). #app is
     therefore pinned with `position: fixed; inset: 0` (resolved against the
     UA's viewport directly, not the `dvh` custom unit) instead of a
     `height: 100dvh` — see the #app element below. html/body just need a
     matching background as a fallback so any edge-case gap reads as the
     app's own color instead of stray black. */
  /* No text selection anywhere by default — a delivery app isn't a
     document, and the native iOS/Android selection handles + callout
     menu popping up on every long-press read as "web page", not "app".
     Form fields are excluded (see below) so typing/editing still works. */
  /* `manipulation` is the double-tap-to-zoom half of the zoom lock (see the
     viewport comment in <head>): it kills double-tap zoom app-wide while
     still permitting ordinary panning. Deliberately not `pan-x pan-y`,
     which would also forbid browser pinch here — the viewport meta and the
     gesture listeners already do that, and an ancestor that forbids pinch
     outright risks the engine claiming a two-finger drag as a pan before
     MapLibre's own handler can read it as a map zoom. */
  html, body {
    height: 100%; overflow: hidden; overscroll-behavior-y: none; background: #F2F2F7;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* NOTE: safe-area padding is applied via inline style="padding-top: calc(env(...) + Nrem)"
     at each call site, not a shared class. The compiled utility stylesheet sits *after*
     this one (the second style block, further down), so a `.safe-top { padding-top: env(...) }`
     class sharing the `padding-top` property with a utility like `.pt-6` on the same
     element loses the cascade and silently gets overridden — inline styles always win
     regardless of order, which is what actually keeps content out of the iOS
     notch/Dynamic Island. */
  ::-webkit-scrollbar { display: none; }
  * { -webkit-tap-highlight-color: transparent; }
  input, textarea, [contenteditable="true"] {
    -webkit-user-select: text; user-select: text; -webkit-touch-callout: default;
  }
  .momentum { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

  /* `type="search"` is what gives the field its searchbox role for assistive
     technology, but WebKit also decorates it with a clear button of its own
     that shows only while the field has focus — landing on top of the
     always-visible one this app draws (see `stopSearchBar`). Suppressing the
     native one leaves a single clear affordance, present whether or not the
     field is focused, which on a phone it usually is not. */
  input[type="search"]::-webkit-search-cancel-button,
  input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }

  .sheet-backdrop { animation: fadeIn .18s ease-out; }
  .sheet-panel { animation: slideUp .26s cubic-bezier(.32,.72,0,1); }
  .alert-panel { animation: popIn .18s cubic-bezier(.32,.72,0,1); }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
  @keyframes popIn { from { opacity: 0; transform: scale(.92) } to { opacity: 1; transform: scale(1) } }

  /* Toasts live wherever the controls aren't — see `positionToasts`.
     Bottom is the normal case: the top of every screen carries the back
     chevron, "+" and the "..." menu, and a toast parked over those covered
     the three controls a driver reaches for most. When a sheet is open the
     roles swap — a sheet is bottom-anchored and its buttons are at the
     bottom edge — so toasts move up out of its way instead.
     `--toast-lift` is whatever bottom-anchored UI the current screen puts
     above the tab bar (the Karte tab's route card); `positionToasts` measures
     it rather than hardcoding a height that would drift. */
  #toast-container.toast-bottom { bottom: 0; top: auto; flex-direction: column; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 3.75rem + var(--toast-lift, 0px) + 0.75rem); }
  #toast-container.toast-top { top: 0; bottom: auto; flex-direction: column; padding-top: calc(env(safe-area-inset-top) + 0.75rem); }

  .toast-enter { animation: toastIn .25s cubic-bezier(.32,.72,0,1); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(.98) } to { opacity: 1; transform: translateY(0) scale(1) } }
  /* Same motion, mirrored: a toast that appears at the bottom should rise
     into place rather than drop in from somewhere off the top of itself. */
  .toast-enter-up { animation: toastInUp .25s cubic-bezier(.32,.72,0,1); }
  @keyframes toastInUp { from { opacity: 0; transform: translateY(14px) scale(.98) } to { opacity: 1; transform: translateY(0) scale(1) } }

  .spinner { border: 3px solid rgba(120,120,128,.25); border-top-color: #ED1639; border-radius: 50%; width: 22px; height: 22px; animation: spin .7s linear infinite; }
  .spinner-sm { display: inline-block; border: 2px solid rgba(120,120,128,.25); border-top-color: currentColor; border-radius: 50%; width: 13px; height: 13px; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }

  .row-enter { animation: rowIn .25s ease-out both; }
  @keyframes rowIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: translateY(0) } }

  button, a, .tappable { touch-action: manipulation; }
  .press-98:active { transform: scale(.98); }
  .press-95:active { transform: scale(.95); }
  .press-fade:active { opacity: .5; }

  /* ---- MapLibre chrome. `isolation: isolate` on .maplibregl-map is
     load-bearing, not decorative: MapLibre's internal canvas/marker/popup
     layers carry their own z-index stack, and without a new stacking
     context on the map container those internal z-indices compare
     directly against the rest of the page — a marker/popup can end up
     painting *above* a sibling dropdown or nav bar that has a nominally
     higher Tailwind z-index but lives in a different, unisolated stacking
     context. Isolating the map contains its internals to their own layer
     so this can't happen. ---- */
  #route-map, #pin-map { background: #e5e3df; }
  .maplibregl-map { font-family: inherit; z-index: 0; isolation: isolate; }
  /* The Karte tab's map div is positioned via Tailwind's `.absolute
     inset-0` (see `initMapTabMap`) so it fills `#route-map` — but
     MapLibre's own stylesheet also targets `.maplibregl-map` with
     `position: relative`, same specificity as `.absolute`. Since
     maplibre-gl.css now loads lazily on first need (see `ensureMapLibre`)
     instead of as a static <link> before the compiled utility stylesheet,
     it lands *after* the utility rules in the cascade and wins the tie,
     silently collapsing the map div to 0 height (a blank gray `#route-map`
     background showing through — no tiles, no error, nothing in the
     console). `#route-map .maplibregl-map` outguns a bare `.maplibregl-map`
     on specificity alone, so this holds regardless of load order. */
  #route-map .maplibregl-map { position: absolute; inset: 0; }
  .maplibregl-ctrl-group { background: #fff !important; border: 1px solid rgba(0,0,0,.08); box-shadow: 0 1px 4px rgba(0,0,0,.12) !important; }
  .maplibregl-ctrl-group button { background: transparent !important; }
  /* Karte tab: controls sit top-right (not bottom-right) so the route-picker
     chip row up top and the delivered-count summary card at the bottom can
     never cover them. Pushed down below the chip row's own height. */
  #route-map .maplibregl-ctrl-top-right { margin-top: calc(env(safe-area-inset-top) + 3.75rem); margin-right: .5rem; }
  .maplibregl-popup-content { background: #fff; color: #111; border-radius: .75rem; font-size: 12px; line-height: 1.5; padding: 10px 12px; box-shadow: 0 4px 20px rgba(0,0,0,.18); }
  .maplibregl-popup-tip { border-top-color: #fff !important; border-bottom-color: #fff !important; }
  .marker-badge { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; font-size: 12px; font-weight: 700; color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); border: 2px solid #fff; }
  .marker-fixed { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #fff; color: #48484a; box-shadow: 0 1px 4px rgba(0,0,0,.35); border: 2px solid #48484a; }
  /* The exact registered position of an address — see the dot marker in
     `drawRouteOnMap`. `pointer-events: none` because it sits under the
     badges' tap targets and has nothing of its own to tap. */
  .marker-dot { width: 9px; height: 9px; border-radius: 50%; background: #ED1639; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); pointer-events: none; }
  /* Basemap switch (Karte ⇄ Luftbild). Text, not an icon: "which view am I
     about to get" is not something a pictogram says unambiguously, and this
     control is used mid-delivery with one hand. */
  .basemap-toggle { width: auto !important; height: auto !important; padding: 6px 9px; font-size: 11px; font-weight: 700; letter-spacing: .02em; color: #1c1c1e; }

  /* MapLibre's own location dot, on #007AFF — the system blue every iOS map
     uses for "you are here", which is the association worth borrowing, and
     a clearer read at arm's length in daylight than the library's default
     #1da1f2. The white ring and the pulse are MapLibre's own ::after and
     ::before and are left alone apart from their colour.

     Qualified with `.maplibregl-map` purely to outrank the library's own
     rule, for exactly the reason documented on `#route-map .maplibregl-map`
     above: maplibre-gl.css is appended to <head> lazily on first map use
     (see `ensureMapLibre`), so it lands *after* this stylesheet and wins
     every tie at equal specificity. Two classes beat one regardless of
     order. Written against `.maplibregl-map` rather than a container id so
     it covers the pin-drop sheet's map as well as the Karte tab's. */
  .maplibregl-map .maplibregl-user-location-dot,
  .maplibregl-map .maplibregl-user-location-dot::before { background-color: #007AFF; }
  .maplibregl-map .maplibregl-user-location-accuracy-circle { background-color: rgba(0, 122, 255, .16); }

  .large-title { transition: opacity .15s, transform .15s; }
  .compact-title { transition: opacity .15s; }

  /* Every interactive element the app draws is at least a 44x44pt target,
     which is Apple's own minimum and the one this app was quietly missing:
     the header's back/add/menu buttons were 36pt, the delivered toggle and
     its Maps link 40pt, the search-clear 32pt. That is small for a thumb at
     the best of times and this app is used one-handed, standing at a van,
     often in gloves.

     Done with a centred pseudo-element rather than by growing the elements
     themselves, because their *drawn* size is right — a 44pt red circle
     next to every stop would dominate the row it belongs to. This grows
     only what the finger has to hit. `min-width/height: 100%` so an element
     already larger than 44pt keeps its own hit area rather than having it
     shrunk to 44. */
  /* Jetzt, and the other screens added after the Tailwind block below was
     compiled. That block holds only the utilities the file used at the time
     and there is no compiler on hand to add to it, so what these screens
     need beyond it is written out here by name. */
  .now-card { background: #fff; border-radius: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,.05); padding: 1.25rem; }
  .now-badge { flex: none; width: 1.75rem; height: 1.75rem; border-radius: 50%; background: #ED1639; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .now-name { font-size: 22px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
  .now-address { font-size: 16px; color: rgba(0,0,0,.75); margin-top: .375rem; overflow-wrap: anywhere; }
  .now-fact { display: flex; align-items: flex-start; gap: .5rem; font-size: 15px; line-height: 1.35; margin-top: .625rem; overflow-wrap: anywhere; white-space: pre-line; }
  .now-fact > span:first-child { flex: none; display: flex; margin-top: .15em; color: rgba(0,0,0,.55); }
  .now-fact.warn { color: #9A5B00; }
  .now-fact.warn > span:first-child { color: #9A5B00; }
  .wide-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: .5rem; padding: .875rem 1rem; border-radius: .875rem; font-size: 16px; font-weight: 600; text-decoration: none; }
  .wide-btn.primary { background: #34C759; color: #fff; }
  .wide-btn.accent { background: #ED1639; color: #fff; }
  .wide-btn.quiet { background: rgba(120,120,128,.14); color: #000; }
  .km-field { display: flex; align-items: center; gap: .75rem; background: #fff; border-radius: .875rem; padding: .25rem 1rem; }
  .km-field label { width: 2.25rem; font-size: 15px; color: rgba(0,0,0,.55); }
  .km-field input { flex: 1; min-width: 0; text-align: right; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; padding: .625rem 0; background: transparent; outline: none; }
  .km-field span { font-size: 15px; color: rgba(0,0,0,.55); }
  /* Mehr: a tint per row, as Settings does -- after a week the driver
     reaches for the orange tile, not for the second row down. */
  .tile { flex: none; width: 1.875rem; height: 1.875rem; border-radius: .45rem; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; }
  /* Geliefert on Jetzt and on the map's card: green by hue, not by weight,
     beside the filled Navigation -- the pairing the iOS app uses. */
  .wide-btn.done { background: rgba(52,199,89,.18); color: #1B7A35; }
  .now-carry { margin-top: .875rem; }
  .now-carry-title { display: flex; align-items: center; gap: .375rem; font-size: 15px; font-weight: 600; color: #ED1639; }
  .now-carry p { font-size: 15px; line-height: 1.35; margin-top: .25rem; overflow-wrap: anywhere; }
  .now-carry p b { font-weight: 500; }
  .now-carry p span { color: rgba(0,0,0,.55); }
  .copy-btn { flex: none; width: 2.75rem; height: 2.75rem; margin: -.5rem -.5rem -.5rem 0; display: flex; align-items: center; justify-content: center; font-size: 19px; color: #ED1639; }
  .copy-btn.copied { color: #34C759; }
  /* A house's street door, where that is not where its pin is. Only from
     close in: over a whole tour it is the same dot as the pin. */
  .marker-door { display: none; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: #fff; color: #1c1c1e; font-size: 13px; border: 1px solid #8E8E93; pointer-events: none; }
  .map-close-in .marker-door { display: flex; }
  .map-card { background: rgba(255,255,255,.96); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 1.25rem; box-shadow: 0 8px 30px rgba(0,0,0,.22); padding: 1rem 1rem 1.125rem; max-height: 60vh; overflow-y: auto; }
  .map-card .wide-btn { padding: .75rem .5rem; font-size: 15px; }
  .map-card .wide-btn + .wide-btn { margin-top: 0; }
  .map-fit { width: 2.75rem; height: 2.75rem; border-radius: 50%; background: rgba(255,255,255,.92); box-shadow: 0 2px 10px rgba(0,0,0,.2); display: flex; align-items: center; justify-content: center; font-size: 18px; color: #1c1c1e; }
  .wide-btn + .wide-btn { margin-top: .625rem; }
  .now-caption { font-size: 13px; font-weight: 500; color: rgba(0,0,0,.55); }
  .now-follow { display: flex; align-items: flex-start; gap: .5rem; text-align: left; font-size: 15px; margin-top: .5rem; }
  .now-follow > span:first-child { flex: none; display: flex; margin-top: .2em; color: #FF9500; }
  .tab-grid { display: grid; }
  .row-num { display: inline-flex; align-items: center; justify-content: center; min-width: 1.375rem; height: 1.375rem; padding: 0 .3rem; margin-right: .4rem; border-radius: 999px; background: rgba(120,120,128,.18); color: rgba(0,0,0,.7); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; vertical-align: 1px; }
  .row-num.next { background: #ED1639; color: #fff; }
  .row-num.done { background: rgba(120,120,128,.12); color: rgba(0,0,0,.4); }
  .blocker { background: #D70015; color: #fff; border-radius: 1rem; padding: .875rem 1rem 1rem; margin-bottom: 1rem; }
  .blocker-title { display: flex; align-items: center; gap: .5rem; font-size: 16px; font-weight: 700; }
  .blocker-text { font-size: 13px; line-height: 1.4; margin-top: .25rem; opacity: .92; }
  .blocker-row { display: flex; align-items: center; gap: .75rem; margin-top: .75rem; padding-top: .75rem; border-top: 1px solid rgba(255,255,255,.25); }

  .review-row { display: flex; align-items: flex-start; }
  .review-main { flex: 1; min-width: 0; text-align: left; padding: .75rem 0 .75rem 1rem; }
  .review-fact { display: flex; gap: .375rem; align-items: flex-start; font-size: 13px; line-height: 1.35; margin-top: .25rem; color: rgba(0,0,0,.7); overflow-wrap: anywhere; }

  .lade-parcels { flex: none; padding: .25rem .5rem; border-radius: .5rem; background: rgba(237,22,57,.1); color: #C4102E; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .lade-parcels.many { background: #ED1639; color: #fff; }
  .seg { display: flex; background: rgba(120,120,128,.16); border-radius: .625rem; padding: 2px; margin: .5rem 0 .75rem; }
  .seg-btn { flex: 1; padding: .4375rem 0; border-radius: .5rem; font-size: 14px; font-weight: 600; color: rgba(0,0,0,.6); }
  .seg-btn.on { background: #fff; color: #000; box-shadow: 0 1px 3px rgba(0,0,0,.14); }
  .preflight-action { margin-top: .5rem; padding: .4375rem .875rem; border-radius: 999px; background: #ED1639; color: #fff; font-size: 14px; font-weight: 600; }

// is minutes rather than seconds on purpose: that endpoint legitimately
// spends ~1.1s per uncached address against Nominatim's rate limit, so a
// 30s cap would abort perfectly healthy large imports.
const API_TIMEOUT_MS = 30000;
const API_TIMEOUT_LONG_MS = 6 * 60 * 1000;

// between attempts.
//
// A driver's phone is on a mobile connection in a moving van: cell
// handovers, courtyards, underground garages. A single dropped TCP
// connection there is not an error worth showing anyone — it is a thing
// that happens several times an hour and that resolves itself in under a
// second. The app's own bug reports were mostly this: "I press it, it loads
// and fails, I press it again and it works immediately." The second press
// worked because the first one had already paid for whatever was slow —
// warming a connection, filling the server's geocode cache, discovering a
// dead upstream. Retrying turns that into one press that takes a moment.
//
// Deliberately short and few. This is not a queue and not an offline
// buffer: three attempts inside about a second of added delay covers the
// transient case, and anything that survives it is a real failure the
// driver needs to be told about rather than have hidden behind a spinner.
const API_RETRY_ATTEMPTS = 3;
const API_RETRY_BASE_MS = 400;

// Only requests that are safe to send twice — which here means GET and
// nothing else.
//
// POST and PATCH change things, and this app's POSTs create them: a retried
// "add stop", after a reply the server sent and the phone never received,
// silently adds the stop twice. That is worse than the error it was
// avoiding, because the driver has to notice and undo it.
//
// DELETE is left out too, despite being idempotent on the server. The
// second attempt after a *successful* first one gets a 404, and the caller
// turns that into "Stopp konnte nicht entfernt werden" for a stop that is
// gone — an error message about something that worked, which is exactly the
// kind of thing that makes an app feel unreliable. Callers that know a
// particular request is safe can still opt in with `retry: true`.
const RETRY_SAFE_METHODS = ['GET'];

// Which failures are worth another attempt. Everything here is "the request
// never reached a working server, or reached one that was momentarily
// unable to answer" — never "the server considered it and said no", which
// would produce the same answer however many times it is asked.
const RETRYABLE_CODES = ['network', 'timeout', 'http_502', 'http_503', 'http_504'];

function isRetryable(err) {
  return !!err && RETRYABLE_CODES.includes(err.code);
}

async function api(path, options = {}) {
  const { retry, timeoutMs = API_TIMEOUT_MS, ...rest } = options;
  const method = (rest.method || 'GET').toUpperCase();
  const retryable = retry === undefined ? RETRY_SAFE_METHODS.includes(method) : !!retry;
  const attempts = retryable ? API_RETRY_ATTEMPTS : 1;

  // The retries share the caller's deadline rather than each getting a
  // fresh copy of it. Three 30-second attempts would be a minute and a half
  // of a driver holding a phone at a van door, which is not a better
  // outcome than one honest failure — so the budget is the same as it ever
  // was and gets divided, giving three chances inside the wait the caller
  // already accepted. The last attempt takes whatever is left over so a
  // slow-but-alive server still gets its full remaining time.
  const deadline = Date.now() + timeoutMs;
  const slice = Math.ceil(timeoutMs / attempts);

  let lastError;
  for (let attempt = 0; attempt < attempts; attempt++) {
    if (attempt > 0) {
      // Linear, not exponential: the whole budget is about a second, and
      // the failures this covers (a cell handover, a cold upstream) clear
      // on that timescale. Backing off to several seconds would just make
      // the driver wait longer for the same answer.
      await new Promise((resolve) => setTimeout(resolve, API_RETRY_BASE_MS * attempt));
      // A caller who cancelled while we were waiting (they closed the sheet,
      // they opened a different route) must not have a fresh request fired
      // on their behalf.
      if (rest.signal?.aborted) throw apiError('Abgebrochen.', 'aborted');
      if (navigator.onLine === false) throw apiError('Keine Internetverbindung.', 'offline');
    }
    const remaining = deadline - Date.now();
    // Out of budget — report the failure that used it up rather than firing
    // a request that is already past its deadline.
    if (remaining <= 0) break;
    const attemptTimeout = attempt === attempts - 1 ? remaining : Math.min(slice, remaining);
    try {
      return await apiAttempt(path, { ...rest, timeoutMs: attemptTimeout });
    } catch (err) {
      // A deliberate cancel, an offline device, and every 4xx the server
      // meant are all final answers — only genuinely transient failures go
      // round again.
      if (!isRetryable(err)) throw err;
      lastError = err;
    }

// A single request attempt. `api()` wraps this with the retry policy — see

async function apiAttempt(path, options = {}) {

    else callerSignal.addEventListener('abort', onCallerAbort, { once: true });

  // sent its headers and then stalled (a connection dying mid-response on a
  // mobile network, a proxy holding a half-written body) hung the app
  // forever: no timeout left armed to abort it, the progress bar crawling,
  // and — during a JSON import — every control in the sheet locked behind
  // a promise that was never going to settle.
  try {
    const res = await fetch('/api' + path, {
      // Only declare a JSON body when there actually is one — a
      // Content-Type on a bodyless GET/DELETE is meaningless and is exactly
      // the kind of header that turns a same-origin request into a
      // preflighted one behind some proxies.
      headers: fetchOptions.body ? { 'Content-Type': 'application/json' } : {},
      ...fetchOptions,
      signal: controller.signal,
    });

    if (!res.ok) {
      let msg = 'Ein Fehler ist aufgetreten.';
      let code = null;
      let detail = null;
      try {
        const data = await res.json();
        if (data.detail && typeof data.detail === 'object') {
          msg = data.detail.message || msg;
          code = data.detail.code || null;
          detail = data.detail;
        } else if (data.detail) {
          msg = data.detail;
        }
      } catch (_) {
        // Not JSON, or the body never arrived. The status alone still says
        // enough to pick a sentence below.
      }
      // A 429 carries no `detail` the driver can act on beyond "wait" — and
      // it's the one status where the app itself is the likely cause (a
      // retry loop), so it gets its own sentence rather than the generic one.
      if (res.status === 429 && msg === 'Ein Fehler ist aufgetreten.') {
        msg = 'Zu viele Anfragen. Bitte kurz warten und erneut versuchen.';
      }
      // The session ran out, or was ended from somewhere else. Whatever was
      // being asked for, the answer on screen is the login.
      if (res.status === 401 && path !== '/login') signedOut();
      const err = apiError(msg, code || `http_${res.status}`);
      // Structured fields the server attached next to the sentence — today
      // only `plz`, the district a wrong-district address is actually filed
      // under. Carried as data so no caller has to pick a postcode back out
      // of a German message, which would quietly make that message's exact
      // wording load-bearing. See `geocode_error_wrong_district` in
      // src/main.rs.
      if (detail && typeof detail.plz === 'string') err.plz = detail.plz;
      throw err;
    }

    // A 204 (or any empty body) would make `res.json()` throw a parse error
    // that reads to the caller like the request failed, when it succeeded.
    const text = await res.text();
    if (!text) return null;
    try {
      return JSON.parse(text);
    } catch (_) {
      throw apiError('Unerwartete Antwort vom Server.', 'bad_response');
    }
  } catch (err) {
    // Anything this function built itself is already a sentence a driver can
    // read — pass it straight through rather than relabelling it as a
    // network failure. Checked with an own flag rather than `err.code`,
    // because a DOMException (an AbortError, say) carries a numeric `code`
    // of its own and would otherwise look like one of ours.
    if (err?.isApiError) throw err;
    // `fetch` rejects with an opaque TypeError ("Failed to fetch" /
    // "Load failed") for every network-level problem, and with an
    // AbortError for both our timeout and a deliberate cancel. None of
    // those strings mean anything to a driver, so each becomes a sentence
    // that says what actually happened and what to do about it.
    if (timedOut) throw apiError('Zeitüberschreitung – der Server hat nicht rechtzeitig geantwortet.', 'timeout');
    if (err?.name === 'AbortError') throw apiError('Abgebrochen.', 'aborted');
    if (navigator.onLine === false) throw apiError('Keine Internetverbindung.', 'offline');
    throw apiError('Server nicht erreichbar.', 'network');
  } finally {
    clearTimeout(timer);
    if (callerSignal) callerSignal.removeEventListener('abort', onCallerAbort);
  }
}

function apiError(message, code) {
  const err = new Error(message);
  err.code = code;
  // Marks this as one of ours, so `api()`'s own catch can tell an error it
  // already worded apart from a raw network/abort failure it still has to.
  err.isApiError = true;
  return err;
}

// ---------------------------------------------------------------------
// In-flight indicator — a thin top progress bar (nprogress/YouTube-style),
// never a full-screen blocking modal. The app stays visible and tappable
// while a request is in flight instead of a "page reload"-style dimmed
// takeover; a small pill under the bar carries a short status message only
// for the handful of actions where the driver genuinely needs to read one
// (e.g. the JSON bulk-import's "don't close" warning). `depth` makes this
// safe for overlapping calls — the bar only actually hides once every
// caller that asked for it has finished, so one action finishing early
// can't yank the indicator out from under a still-running one.
// ---------------------------------------------------------------------
let progressDepth = 0;

function showProgress(label) {
  progressDepth++;
  const bar = document.getElementById('progress-bar');
  bar.style.transition = 'none';
  bar.style.opacity = '1';
  bar.style.transform = 'scaleX(0.08)';
  void bar.offsetWidth; // force reflow so the slow transition below starts from scaleX(0.08), not skips straight to the target
  bar.style.transition = 'transform 6s cubic-bezier(.15,.8,.4,1), opacity .2s';
  bar.style.transform = 'scaleX(0.75)';

  if (label) {
    document.getElementById('progress-pill-text').textContent = label;
    document.getElementById('progress-pill-wrap').classList.remove('hidden');
  }
}

function hideProgress() {
  progressDepth = Math.max(0, progressDepth - 1);
  if (progressDepth > 0) return; // another caller is still in flight
  const bar = document.getElementById('progress-bar');
  bar.style.transition = 'transform .25s ease-out';
  bar.style.transform = 'scaleX(1)';
  setTimeout(() => {
    bar.style.transition = 'opacity .2s';
    bar.style.opacity = '0';
    setTimeout(() => { bar.style.transform = 'scaleX(0)'; }, 200);
  }, 150);
  document.getElementById('progress-pill-wrap').classList.add('hidden');
}

const MAX_VISIBLE_TOASTS = 3;

// How long each kind stays up. A confirmation of something the driver just
// did needs only long enough to be seen out of the corner of an eye; a
// failure has to be read, and possibly acted on. Callers can still pass an
// explicit duration (the duplicate-package warning asks for nine seconds).
const TOAST_MS = { success: 2400, info: 3200, warning: 4200, error: 4200 };

// Puts the toast stack where the current screen has no controls.
//
// Everything used to appear at the top, which is precisely where the back
// chevron, "Stopp hinzufügen" and the "..." menu sit on the detail screen,
// and where the route chips sit on the Karte tab — so every confirmation
// covered the controls, and (being `pointer-events-auto` with nothing
// listening) swallowed taps on them for its whole lifetime.
//
// Bottom is the default: above the tab bar, and above whatever else the
// screen anchors down there. When a sheet or dialog is open the bottom is
// exactly where *its* buttons are, so the stack moves back to the top,
// which is empty backdrop while a sheet is up.
function positionToasts() {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const atTop = isModalOpen();
  container.classList.toggle('toast-top', atTop);
  container.classList.toggle('toast-bottom', !atTop);
  // Measured, not hardcoded: the Karte tab's route card is as tall as its
  // contents make it, and a fixed offset would either overlap it or float
  // the toasts absurdly high on every other screen.
  // The card itself, not the wrapper that positions it: the wrapper carries
  // its own tab-bar padding, and measuring that would count the tab bar
  // twice and float the toasts half a screen up.
  const lift = atTop ? 0 : (document.querySelector('[data-bottom-dock]')?.getBoundingClientRect().height || 0);
  container.style.setProperty('--toast-lift', `${Math.round(lift)}px`);
  return atTop;
}

function dismissToast(el) {
  if (!el.isConnected || el.dataset.leaving) return;
  el.dataset.leaving = '1';
  el.style.transition = 'opacity .25s, transform .25s';
  el.style.opacity = '0';
  el.style.transform = `translateY(${el.dataset.fromBottom ? '8px' : '-8px'}) scale(.98)`;
  setTimeout(() => el.remove(), 250);
}

function toast(message, type = 'info', durationMs = null) {
  const colors = {
    info: 'bg-white/95 text-black',
    error: 'bg-red-50/95 text-red-700',
    success: 'bg-emerald-50/95 text-emerald-700',
    // Same amber the app already uses for "this needs the driver's
    // attention but isn't a failure" (approximate-location badges,
    // location_precision) — the duplicate-address warning is the only
    // caller today.
    warning: 'bg-warn/15 text-warnText',
  };
  const urgent = type === 'error' || type === 'warning';
  const container = document.getElementById('toast-container');
  const atTop = positionToasts();
  const el = document.createElement('div');
  el.className = `${atTop ? 'toast-enter' : 'toast-enter-up'} pointer-events-auto cursor-pointer select-none max-w-sm w-full backdrop-blur-xl border border-black/5 ${colors[type] || colors.info} rounded-2xl px-4 py-3 text-sm font-medium shadow-xl`;
  if (!atTop) el.dataset.fromBottom = '1';
  if (urgent) el.setAttribute('role', 'alert');
  el.textContent = message;
  // A toast still covers *something*, and the driver is the one who knows
  // whether they've read it — so a tap clears it immediately instead of
  // leaving them waiting out the timer. This is also why the toast keeps
  // `pointer-events-auto` rather than being made click-through: the tap
  // now does something useful.
  el.addEventListener('click', () => dismissToast(el));
  // A burst of failures (a bulk import that can't reach the server, a
  // handful of quick taps while offline) otherwise stacks messages down
  // the screen until they cover the list underneath — the oldest ones no
  // longer being read by anyone. Keep the newest few.
  while (container.childElementCount >= MAX_VISIBLE_TOASTS) container.firstElementChild.remove();
  container.appendChild(el);
  // 'warning' is deliberately excluded from this generic buzz: its one
  // caller today (the duplicate-address warning in `toggleDelivered`)
  // fires its own distinct multi-pulse pattern immediately after calling
  // `toast()`, and `navigator.vibrate()` replaces rather than queues — the
  // generic pulse here would just be invoked and instantly overridden.
  if (navigator.vibrate && type === 'error') navigator.vibrate(30);
  setTimeout(() => dismissToast(el), durationMs ?? TOAST_MS[type] ?? TOAST_MS.info);
}

// ---------------------------------------------------------------------
// Native-feeling alert/confirm/prompt sheets — replace window.alert/
// confirm/prompt (an ugly, non-brandable OS dialog) with in-app
// UIAlertController-styled equivalents: centered card, hairline-separated
// button row, brand-tinted default action, red destructive action. Still
// just resolve a Promise, so call sites read almost like the built-ins
// they replace.
// ---------------------------------------------------------------------
function closeAlert() {
  document.getElementById('modal-root').innerHTML = '';
  onModalEscape = null;
  restoreFocusAfterModal();
  updateHistoryGuard();
  positionToasts();
}

// Whatever should happen when Escape is pressed, set by whichever modal is
// currently open. Without it there is no keyboard way out of a sheet at
// all — the backdrop is a click target only — which on a desktop browser
// means a confirm dialog that can't be dismissed without reaching for the
// mouse, and a promise that never settles if the driver assumes it can.
let onModalEscape = null;

// ---------------------------------------------------------------------
// Modal focus handling.
//
// Two problems, both invisible with a mouse and both blocking with a
// keyboard or a screen reader. First, focus stays wherever it was when a
// sheet opens, so Tab walks the *page behind* the dialog — a screen reader
// user gets read the route list they can't see instead of the question
// they're being asked. Second, focus is not put back afterwards, so
// dismissing a sheet drops the caret at the top of the document and the
// driver has to tab all the way back to where they were.
// ---------------------------------------------------------------------
let focusBeforeModal = null;

const FOCUSABLE = 'a[href], button:not([disabled]), textarea:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])';

function rememberFocusBeforeModal() {
  // Only the first modal in a chain records it: a confirm opened from
  // inside a sheet must restore to what was focused before the *sheet*,
  // not to a button inside a sheet that no longer exists.
  if (!isModalOpen()) focusBeforeModal = document.activeElement;
}

function restoreFocusAfterModal() {
  const target = focusBeforeModal;
  focusBeforeModal = null;
  // `isConnected` because render() replaces #app wholesale — the element
  // that had focus before the modal is very often no longer in the document.
  if (target && target.isConnected && typeof target.focus === 'function') {
    target.focus({ preventScroll: true });
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const menu = document.getElementById('route-menu');
    if (menu && !menu.classList.contains('hidden')) { closeRouteMenu(); return; }
    if (onModalEscape) { onModalEscape(); return; }
    // Escape empties the stop filter, the way it does in a browser's own find
    // bar — otherwise the only way out is selecting the text and deleting it,
    // which one-handed is a genuine nuisance.
    if (document.activeElement?.id === 'stop-search' && stopFilter.query) clearStopFilter();
    return;
  }
  // Arrow keys inside the "..." menu. It declares `role="menu"`, and that
  // is a promise: assistive technology puts a menu into an interaction mode
  // where the arrow keys — not Tab — are how you reach the next item, so
  // without this the later actions ("Löschen" among them) were announced as
  // a menu and then simply could not be reached the way the announcement
  // said to reach them.
  const openMenu = document.getElementById('route-menu');
  if (openMenu && !openMenu.classList.contains('hidden') && openMenu.contains(document.activeElement)) {
    const items = Array.from(openMenu.querySelectorAll('[role="menuitem"]'));
    const at = items.indexOf(document.activeElement);
    const target =
      e.key === 'ArrowDown' ? items[(at + 1) % items.length]
      : e.key === 'ArrowUp' ? items[(at - 1 + items.length) % items.length]
      : e.key === 'Home' ? items[0]
      : e.key === 'End' ? items[items.length - 1]
      : null;
    if (target) { e.preventDefault(); target.focus(); return; }
  }
  if (e.key !== 'Tab') return;
  // Focus trap: keep Tab inside the open dialog by wrapping at its ends.
  const root = document.getElementById('modal-root');
  if (!root.childElementCount) return;
  const items = Array.from(root.querySelectorAll(FOCUSABLE)).filter((el) => el.offsetParent !== null);
  if (!items.length) return;
  const first = items[0];
  const last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  } else if (!root.contains(document.activeElement)) {
    e.preventDefault();
    first.focus();
  }
});

// Shared by confirmSheet/promptSheet, which are identical apart from what
// goes in the header under the title (a plain message for one, a message
// plus a text input for the other) and whether the confirm button can be
// styled as destructive. `headerHtml` is pre-built by each caller — their
// message paragraphs differ in spacing/fallback markup just enough (see
// each function) that factoring the message rendering itself in here too
// would need more parameters than it would save lines.
function renderAlertShell(root, title, headerHtml, { confirmLabel, cancelLabel, danger = false }) {
  root.innerHTML = `
    <div class="fixed inset-0 z-[60] flex items-center justify-center px-6" role="dialog" aria-modal="true" aria-label="${escapeAttr(title)}">
      <div class="sheet-backdrop absolute inset-0 bg-black/30" data-cancel></div>
      <div class="alert-panel relative w-full max-w-[300px] bg-white/95 backdrop-blur-xl border border-black/5 rounded-2xl overflow-hidden shadow-2xl text-center">
        <div class="px-5 pt-5 pb-4">
          <h3 class="font-semibold text-[15px]">${escapeHtml(title)}</h3>
          ${headerHtml}
        </div>
        <div class="grid grid-cols-2 border-t border-black/10">
          <button data-cancel class="press-98 py-3 text-[15px] font-medium text-black/70 border-r border-black/10">${escapeHtml(cancelLabel)}</button>
          <button data-confirm class="press-98 py-3 text-[15px] font-semibold ${danger ? 'text-red-600' : 'text-brand-600'}">${escapeHtml(confirmLabel)}</button>
        </div>
      </div>
    </div>
  `;
  positionToasts();
}

function confirmSheet({ title, message, confirmLabel = 'Bestätigen', cancelLabel = 'Abbrechen', danger = false }) {
  return new Promise((resolve) => {
    rememberFocusBeforeModal();
    const root = document.getElementById('modal-root');
    const messageHtml = message ? `<p class="text-[13px] text-black/60 mt-1.5 leading-snug">${escapeHtml(message)}</p>` : '';
    renderAlertShell(root, title, messageHtml, { confirmLabel, cancelLabel, danger });
    const cancel = () => { closeAlert(); resolve(false); };
    root.querySelectorAll('[data-cancel]').forEach(el => el.addEventListener('click', cancel));
    root.querySelector('[data-confirm]').addEventListener('click', () => { closeAlert(); resolve(true); });
    onModalEscape = cancel;
    updateHistoryGuard();
    // Focus lands on the safe choice, never the destructive one: a stray
    // Enter should not confirm "delete route".
    setTimeout(() => root.querySelector('[data-cancel]:not(.absolute)')?.focus(), 60);
  });
}

function promptSheet({ title, message, placeholder = '', initial = '', confirmLabel = 'Speichern', cancelLabel = 'Abbrechen', maxLength = LIMITS.routeName }) {
  return new Promise((resolve) => {
    rememberFocusBeforeModal();
    const root = document.getElementById('modal-root');
    const messageHtml = message
      ? `<p class="text-[13px] text-black/60 mt-1 mb-3 leading-snug">${escapeHtml(message)}</p>`
      : '<div class="mt-3"></div>';
    // 16px, not 15: iOS zooms the whole page in when a focused input's
    // font-size is under 16px, and never zooms back out.
    const inputHtml = `<input data-input value="${escapeAttr(initial)}" placeholder="${escapeAttr(placeholder)}" maxlength="${maxLength}" enterkeyhint="done" class="w-full bg-black/5 rounded-lg px-3 py-2 text-base text-center focus:outline-none focus:ring-2 focus:ring-brand-600" />`;
    renderAlertShell(root, title, messageHtml + inputHtml, { confirmLabel, cancelLabel });
    const input = root.querySelector('[data-input]');
    setTimeout(() => { input.focus(); input.select(); }, 80);
    // Resolves `null` only for a real cancel, and the (possibly empty)
    // string for a confirm — collapsing "" into null would make submitting
    // a blank field indistinguishable from backing out, which is why
    // accepting the suggested default route name by just tapping
    // "Speichern" used to silently do nothing.
    const submit = () => { const v = input.value; closeAlert(); resolve(v); };
    const cancel = () => { closeAlert(); resolve(null); };
    root.querySelectorAll('[data-cancel]').forEach(el => el.addEventListener('click', cancel));
    root.querySelector('[data-confirm]').addEventListener('click', submit);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    onModalEscape = cancel;
    updateHistoryGuard();
  });
}

// ---------------------------------------------------------------------
// Maps link — deep-links with the plain address, not coordinates, so the
// chosen app does its own (usually better) geocoding/routing to the door.
// Driver's choice of app is persisted in localStorage (see Mehr tab) and
// defaults to Waze, whose waze.com/ul universal link opens the Waze app
// directly if installed (iOS and Android both) and falls back to the
// website if not — one URL for both platforms. `navigate=yes`/`dirflg=d`/
// `travelmode=driving` all start turn-by-turn directions immediately
// instead of just centering the map on the address.
// ---------------------------------------------------------------------
const MAPS_PROVIDER_KEY = 'ear_maps_provider';

// ---------------------------------------------------------------------
// Türcode decoder — a manual tool for the office's own cipher sheet
// (digit → letter), reachable from Mehr. A driver types the letters a
// Notiz gives them (e.g. "ENVV") and gets the digits back live. No
// auto-detection: a Notiz can also carry a code that's already the literal
// digits/characters to use (nothing to decode), and the two look identical
// from the text alone — so this is a tool the driver reaches for on
// purpose, not a guess the app makes for them.
// ---------------------------------------------------------------------
const SAFE_CODE_LETTER_TO_DIGIT = { C:'0', E:'1', Z:'2', D:'3', V:'4', F:'5', S:'6', '?':'7', A:'8', N:'9' };

// A character with no entry in the table (an X, a hyphen, a space) is
// passed through unchanged rather than dropped or flagged — the driver said
// that's exactly what those already are: not encoded, just written straight
// into the result as-is.
function decodeSafeLetters(letters) {
  return letters.toUpperCase().split('').map((ch) => SAFE_CODE_LETTER_TO_DIGIT[ch] ?? ch).join('');
}

function onTurcodeInput(value) {
  const out = document.getElementById('turcode-output');
  if (!out) return;
  const trimmed = value.trim();
  out.textContent = trimmed ? decodeSafeLetters(trimmed) : '—';
}

function renderTurcodeSheet() {
  renderSheetShell(`
    <h2 class="text-[22px] font-bold mb-1">Türcode</h2>
    <p class="text-[13px] text-black/55 mb-4 leading-snug">Zeichen aus der Notiz eingeben — auch das Fragezeichen, das für die 7 steht. Zeichen ohne eigene Ziffer (z. B. X oder ein Bindestrich) bleiben unverändert — die gehören dann schon direkt zum Code.</p>
    <input id="turcode-input" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"
      oninput="onTurcodeInput(this.value)" placeholder="z. B. EN?V" enterkeyhint="done"
      class="w-full bg-white rounded-xl px-4 py-3 text-[20px] font-mono tracking-wide text-center uppercase focus:outline-none focus:ring-2 focus:ring-brand-600" />
    <div class="${CARD} mt-3 p-4 text-center">
      <p class="text-[11px] font-semibold uppercase tracking-wide text-black/55 mb-1">Code</p>
      <p id="turcode-output" class="text-4xl font-bold tracking-wide text-brand-600 font-mono">—</p>
    </div>
    <div class="mt-4 pb-2">
      <button type="button" onclick="closeSheet()" class="press-98 w-full py-3 rounded-xl bg-brand-600 font-semibold text-white">Fertig</button>
    </div>
  `, { label: 'Türcode' });
  setTimeout(() => document.getElementById('turcode-input')?.focus(), 80);
}

// Each provider takes a destination two ways, because this app has two
// genuinely different kinds of destination to hand it (see `navUrl`):
// a point, or a string to look up.
const MAPS_PROVIDERS = {
  waze: {
    label: 'Waze',
    address: (addr) => `https://waze.com/ul?q=${encodeURIComponent(addr)}&navigate=yes`,
    point: (lat, lon) => `https://waze.com/ul?ll=${lat}%2C${lon}&navigate=yes`,
  },
  apple: {
    label: 'Apple Maps',
    address: (addr) => `https://maps.apple.com/?daddr=${encodeURIComponent(addr)}&dirflg=d`,
    point: (lat, lon) => `https://maps.apple.com/?daddr=${lat}%2C${lon}&dirflg=d`,
  },
  google: {
    label: 'Google Maps',
    address: (addr) => `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(addr)}&travelmode=driving`,
    point: (lat, lon) => `https://www.google.com/maps/dir/?api=1&destination=${lat}%2C${lon}&travelmode=driving`,
  },
};

function getMapsProvider() {
  let saved;
  try { saved = localStorage.getItem(MAPS_PROVIDER_KEY); } catch (_) { /* private-browsing storage lockout */ }
  // hasOwnProperty, not a plain truthy lookup: a stray stored value like
  // "toString" or "constructor" would otherwise resolve to an inherited
  // Object.prototype function instead of `undefined`, and the provider's
  // missing `.url` would then throw when a maps link is built.
  return Object.prototype.hasOwnProperty.call(MAPS_PROVIDERS, saved) ? saved : 'waze';
}

function setMapsProvider(id) {
  if (!Object.prototype.hasOwnProperty.call(MAPS_PROVIDERS, id)) return;
  try { localStorage.setItem(MAPS_PROVIDER_KEY, id); } catch (_) { /* private-browsing storage lockout */ }
}

// How precisely we know a point before it's worth sending instead of the
// address text. Six decimal places is ~10 cm — far past what any navigation
// app resolves, and short enough to keep the URL readable.
const NAV_COORD_DECIMALS = 6;

// The "In Maps öffnen" link for one stop.
//
// This used to always hand over the address text and let the navigation app
// geocode it. That made sense while this app's own coordinates came from
// generic geocoding — but they don't any more. A stop resolved against
// Vienna's address register is pinned to the registered position of *that*
// door, including the ones no navigation app can find: Waze has no
// Kleingarten-Parzellen and no Stiegen, so handing it
// "Großfeldstraße 9/Parz.68" gets the driver dropped at the colony gate,
// 130 m and a walk from the plot. There's precedent for the text failing
// outright, too — the warehouse was once stored as "Oberlaa Straße 298",
// which this app displayed happily and the phone's Maps app searched for in
// vain.
//
// So an exactly-known stop is sent as a point, which is the whole value of
// having resolved it. An approximate one (the "≈" badge — nearest known
// housenumber, or district centre) is sent as text on purpose: our point is
// an admitted guess there, and driving someone confidently to a guess is
// worse than letting their navigation app take its own shot at the address.
function navUrl(stop) {
  const provider = MAPS_PROVIDERS[getMapsProvider()];
  const point = (lat, lon) => provider.point(lat.toFixed(NAV_COORD_DECIMALS), lon.toFixed(NAV_COORD_DECIMALS));
  const usable = Number.isFinite(stop.lat) && Number.isFinite(stop.lon);
  // A pin the driver placed by hand outranks everything: they stood in
  // front of the door and said where it is.
  if (stop.pinned && usable) return point(stop.lat, stop.lon);
  // Then the house number's entrance, from the city's register. The stop's
  // own point is the building or the Stiege — right for the map, and for a
  // Gemeindebau as likely a courtyard as the street the van pulls up in.
  if (Number.isFinite(stop.entrance_lat) && Number.isFinite(stop.entrance_lon)) return point(stop.entrance_lat, stop.entrance_lon);
  // Then the address, which a navigation app resolves to the street door on
  // its own; the bare point only when there is no address to send.
  if ((stop.strasse || '').trim()) return provider.address(navAddress(stop));
  return usable ? point(stop.lat, stop.lon) : provider.address(navAddress(stop));
}

// The one place the human-readable form of a stop's address is assembled,
// so the maps deep-link, the copy button and any future consumer can never
// drift apart. Vienna-only app, hence the constant city.
/// What a navigation app is handed when there is no exact point: the city
/// with it, "Wien" only where the postcode says Vienna, and the country so
/// the search cannot wander off to a 2201 somewhere else.
function navAddress(s) {
  const vienna = !!DISTRICT_BY_PLZ[s.plz];
  // Street and house number only. Stiege, Tür and Parzelle are things the
  // city's register knows and no navigation app does: "Gentzgasse 129/1/23"
  // sent whole is a search that either fails or quietly guesses.
  // "Hauptstr. 5" goes out as "Hauptstraße 5", the "s" as it was typed.
  const street = String(s.strasse || '').trim().replace(/\s+/g, ' ')
    .replace(/(s)tr\.(?=\s|$|\d)/gi, '$1traße')
    .replace(/(s)trasse\b/gi, '$1traße')
    .replace(/^(.+?\s+\d+[a-zA-Z]?(?:-\d+[a-zA-Z]?)?)(?:[\/\s(].*)?$/, '$1');
  return `${street}, ${s.plz}${vienna ? ' Wien' : ''}, Österreich`;
}

function stopAddress(s) {
  return `${s.strasse}, ${s.plz}`;
}

// ---------------------------------------------------------------------
// Navigation — tab switching + the single shared "route in focus" that the
// Karte tab visualizes and Routen/Mehr can push a detail screen for. See
// the `state` doc comment above for the full model. `detailOrigin` must
// never be set to 'map' — that's a real tab id, and `render()`'s
// `detailOrigin === state.tab` check would then wrongly treat "picked in
// the map's own route picker" as "push the stops-list detail screen over
// the map". `null` is the correct value for "in focus, but no tab has a
// pushed detail for it".
// ---------------------------------------------------------------------
function switchTab(tab) {
  // Tapping the tab you are already on scrolls that screen back to the top,
  // which is what every tab bar on iOS does and what a driver halfway down
  // a thirty-stop list reaches for without thinking. Without it the tap was
  // simply inert — the one gesture in the app that looked like it should do
  // something and didn't.
  //
  // Pop first, then scroll — the two-stage behaviour iOS actually has: the
  // first tap on the active tab dismisses the pushed screen, and once you
  // are already at the root the tap scrolls it to the top.
  //
  // Popping here is NOT `closeDetail()`. That clears `currentRoute`, and
  // this app's route in focus is shared with the Karte tab — so a tap on
  // "Routen" would also blank the map the driver may be navigating by.
  // Clearing `detailOrigin` alone is exactly "no tab has a pushed detail
  // for this route any more" (see the `state` doc comment), which dismisses
  // the screen and leaves the map showing what it was showing.
  if (tab === state.tab) {
    if (isDetailShowing()) {
      state.detailOrigin = null;
      // The filter belonged to the screen being dismissed; leaving it set
      // would silently narrow the list again the next time this route's
      // detail is opened from the Karte tab, which does not reload the
      // route and so never clears it.
      resetStopFilter();
      render();
      return;
    }
    scrollCurrentScreenToTop();
    return;
  }
  dismissUndo();
  state.tab = tab;
  render();
  if (tab === 'admin') loadAdminUsers();
}

// The scroll container of whatever screen is showing. Every screen marks it
// with `data-scroll` (it is the same element `renderScreen` saves and
// restores scroll offsets against), and the Karte tab deliberately has
// none — a map is panned, not scrolled, and there is no "top" to return to.
function scrollCurrentScreenToTop() {
  const scroller = document.querySelector('[data-scroll]');
  if (!scroller || scroller.scrollTop === 0) return;
  scroller.scrollTo({ top: 0, behavior: scrollBehavior() });
  // Remembered too, so the position this just discarded isn't restored by
  // the next render — which would undo the scroll a moment after it
  // finished, in front of the driver.
  scrollMemory.set(currentScreenKey(), 0);
}

// Every route-list screen (Routen/Verlauf) reads from `state.routes`, a
// separate array of lightweight summaries fetched once via loadRoutes() —
// it does NOT automatically pick up changes made to `state.currentRoute`
// (rename, status toggle, a stop delivered/added/removed all shift
// customer_count/delivered_count/needs_optimize). Call this right after
// every `state.currentRoute = await api(...)` assignment so the list a
// driver lands back on is never showing stale counts/name/status — cheaper
// than a full loadRoutes() network round-trip on every single mutation.
function syncRouteSummary() {
  const r = state.currentRoute;
  if (!r) return;
  const summary = {
    id: r.id, name: r.name, status: r.status, created_at: r.created_at,
    completed_at: r.completed_at, customer_count: r.customer_count,
    delivered_count: r.delivered_count, needs_optimize: r.needs_optimize,
    // What the tour list's row says besides: the server's `list_routes`.
    settled_count: r.stops.filter((s) => s.kind === 'customer' && s.outcome && !skipsDoor(s)).length,
    not_home_count: r.stops.filter((s) => s.kind === 'customer' && s.outcome === 'notHome').length,
    total_km: r.total_km,
  };
  const idx = state.routes.findIndex(x => x.id === r.id);
  if (idx === -1) state.routes.unshift(summary); else state.routes[idx] = summary;
}

// ---------------------------------------------------------------------
// Ordering every route update the app receives.
//
// Nearly every endpoint answers with the *whole* route, and the app assigns
// that answer straight to `state.currentRoute`. That is fine when responses
// come back in the order they were sent, and responses do not come back in
// the order they were sent — especially not on mobile data, and especially
// not for the one action a driver fires in bursts: ticking off stops.
//
// Tick stop A, tick stop B a moment later. If A's reply is the slower of
// the two, it lands last, and A's reply describes a route where B was still
// outstanding. B's tick vanishes from the screen — not reverted by a
// failure, just quietly overwritten by an older truth — and the driver has
// no reason to doubt what they're looking at.
//
// Every request that will assign to `state.currentRoute` therefore takes a
// ticket first, and a reply is only allowed to land if no newer reply has
// landed already. Older replies are dropped: whatever is newer is closer to
// what the server actually holds.
// ---------------------------------------------------------------------
let mutationSeq = 0;
let lastAppliedSeq = 0;

function nextSeq() {
  return ++mutationSeq;
}

// Ticks the driver has made that the server has not confirmed yet, keyed by
// stop id.
//
// Sequence numbers alone are not quite enough. They order replies by when
// each request was *sent*, but the server is free to process two requests
// in the other order — so the reply the app discards as "older" can be the
// one carrying the newer truth, and a tick would sit on screen while the
// route object underneath it says otherwise.
//
// Rather than trying to divine the server's ordering from replies that
// carry no version, the app keeps what it knows for certain: which ticks
// the driver has made and which have not been answered yet. Every incoming
// route is re-stamped with those before it's displayed, and each entry is
// dropped the moment its own request settles. What the driver did stays on
// screen until the server has actually spoken about that exact stop.
const pendingDelivered = new Map();

// What happened at a door. The server stores one of these per stop (see
// `mod outcome` in src/main.rs); `null`/absent is an open stop. Two answers
// besides the plain tick: "Nicht angetroffen" — driven to, nobody there, the
// door stays in the route — and "Ins Lager mitnehmen", known beforehand,
// which the van does not drive to at all.
const OUTCOMES = {
  delivered: { label: 'Geliefert', short: 'geliefert' },
  notHome: { label: 'Nicht angetroffen', short: 'nicht angetroffen' },
  toLager: { label: 'Ins Lager mitnehmen', short: 'ins Lager' },
  // No longer offered; only ever on a stop from an old backup.
  neighbour: { label: 'Bei Nachbarn abgegeben', short: 'bei Nachbarn' },
  cancelled: { label: 'Abbestellt', short: 'abbestellt' },
};
const handedOver = (outcome) => outcome === 'delivered' || outcome === 'neighbour';
/// The van does not go to this door: out of the route, the counts and the
/// Ladeliste.
const skipsDoor = (s) => s.kind === 'customer' && (s.outcome === 'toLager' || s.outcome === 'cancelled');
/// Lager, Pause and Ziel, on a tour that drives them. Ticked off like a door,
/// but not deliveries. Not Start — the driver is standing in it.
const isCheckpoint = (s) => (s.kind === 'via' || s.kind === 'end' || s.kind === 'pause') && !s.excluded;
/// A stop still to be ticked off, delivery or checkpoint.
const isOpenStop = (s) => (s.kind === 'customer' || isCheckpoint(s)) && !s.outcome;
/// Which stop is next: the first one still open in the list — except that
/// Ziel waits for everything else, wherever it is listed (a stop added while
/// the order could not be recomputed sits below it), and a tour with no
/// customers has no "next" at all: its Lager and Ziel are not a round to be
/// started, just points waiting for one. The iOS app's rule.
const firstOpenIndex = (stops) => {
  if (!stops.some((s) => s.kind === 'customer' && !skipsDoor(s))) return -1;
  let end = -1;
  for (let i = 0; i < stops.length; i++) {
    if (!isOpenStop(stops[i])) continue;
    if (stops[i].kind !== 'end') return i;
    if (end < 0) end = i;
  }
  return end;
};

/// Both counts, derived from the stops and against the meals owed — the same
/// rule `get_route_detail` counts by.
function recountRoute(r) {
  const owed = r.stops.filter((s) => s.kind === 'customer' && !skipsDoor(s));
  r.customer_count = owed.length;
  r.delivered_count = owed.filter((s) => s.delivered).length;
}
/// "12 von 26 geliefert · 1 nicht angetroffen · 1 ins Lager" -- the line over
/// Jetzt and over the stop list, the iOS app's `deliveryLine`.
function deliveryLine(r) {
  const customers = r.stops.filter((s) => s.kind === 'customer');
  const count = (o) => customers.filter((s) => s.outcome === o).length;
  return [
    `${r.delivered_count} von ${r.customer_count} geliefert`,
    count('notHome') ? `${count('notHome')} nicht angetroffen` : '',
    count('cancelled') ? `${count('cancelled')} abbestellt` : '',
    count('toLager') ? `${count('toLager')} ins Lager` : '',
  ].filter(Boolean).join(' · ');
}
// Per-stop generation counter backing `toggleDelivered`'s own race guard —
// see the comment there. Not the same thing `nextSeq()`/`lastAppliedSeq`
// guard: those order which *route* snapshot wins app-wide, this orders
// which of two rapid taps on the *same stop* gets to clear/revert the
// prediction it made.
const pendingDeliveredGen = new Map();

/// Re-applies unconfirmed ticks on top of a freshly received route, and
/// recomputes the count from the stops rather than adjusting it by hand —
/// a counter nudged up and down through races drifts, a derived one cannot.
function rebasePendingDelivered() {
  const r = state.currentRoute;
  if (!r || !Array.isArray(r.stops)) return;
  for (const [stopId, outcome] of pendingDelivered) {
    const stop = r.stops.find((s) => s.id === stopId);
    if (stop) {
      stop.outcome = outcome;
      stop.delivered = handedOver(outcome);
      if (!outcome) stop.settled_at = null;
      else if (!stop.settled_at) stop.settled_at = new Date().toISOString();
    }
  }
  recountRoute(r);
}

// Everything this app draws hangs off a route object it got over the wire,
// and every screen indexes straight into `route.stops`. A response that is
// the wrong shape — a proxy's HTML error page that happened to parse, a
// half-written body from a connection cut mid-flight, a future server
// version that renamed something — would sail past `api()` (which only
// checks that the body is *JSON*) and blow up inside `render()`, where the
// driver's only symptom is a screen that goes blank and stays blank.
//
// Checked once, here, at the seam where a response becomes app state: the
// thing that arrived either looks like a route or it's an error, and an
// error is something the app already knows how to show.
function isRouteDetail(r) {
  return !!r
    && typeof r === 'object'
    && typeof r.id === 'number'
    && Array.isArray(r.stops)
    && r.stops.every((s) => s && typeof s.id === 'number' && typeof s.kind === 'string');
}

function expectRouteDetail(r) {
  if (!isRouteDetail(r)) throw apiError('Unerwartete Antwort vom Server.', 'bad_response');
  return r;
}

/// Applies a server response to the route in focus, unless it's stale.
/// Returns whether it was applied, so callers can skip their success
/// toast/haptic for a reply that changed nothing on screen.
function applyRouteUpdate(seq, routeId, updated) {
  expectRouteDetail(updated);
  // The driver moved to a different route while this was in flight.
  if (state.currentRoute?.id !== routeId) return false;
  // A newer reply already landed; this one describes an older world.
  if (seq < lastAppliedSeq) return false;
  lastAppliedSeq = seq;
  state.currentRoute = updated;
  rebasePendingDelivered();
  syncRouteSummary();
  return true;
}

/// Loading a route wholesale (tapping one in a list, the Karte picker,
/// a resume refresh) supersedes anything in flight for the previous one.
function adoptRoute(seq, route) {
  expectRouteDetail(route);
  if (seq < lastAppliedSeq) return false;
  lastAppliedSeq = seq;
  state.currentRoute = route;
  rebasePendingDelivered();
  syncRouteSummary();
  return true;
}

// `latestRouteRequestId` additionally guards *which route* wins when two
// different routes are opened in quick succession: the sequence numbers
// above would let the newer request win anyway, but this keeps the error
// toast from firing for a request the driver has already abandoned.
let latestRouteRequestId = null;

// Fetches route `id` and makes it the route in focus — shared by
// `openRoute` (pushes a detail screen over whichever tab is current) and
// `selectMapRoute` (the Karte tab's own picker, which shows the route
// in-place rather than pushing detail over it). They differ only in what
// `detailOrigin` ends up as, which is why that's a callback rather than a
// plain value: it has to be evaluated *after* the fetch resolves, at the
// same point in the control flow the original two copies of this each
// read `state.tab` — evaluating it any earlier would capture whatever tab
// was active when the request started, not when it actually completed,
// which matters if the driver switches tabs while it's in flight.
async function loadRouteIntoFocus(id, computeDetailOrigin) {
  // Cleared up front, not on arrival: the driver has already left the old
  // route's list behind, and a filter that outlived it would narrow the new
  // one by a word typed for the old.
  resetStopFilter();
  latestRouteRequestId = id;
  const seq = nextSeq();
  showProgress();
  try {
    const route = await api(`/routes/${id}`);
    if (latestRouteRequestId !== id) return;
    if (!adoptRoute(seq, route)) return;
    state.detailOrigin = computeDetailOrigin();
    render();
  } catch (err) {
    if (latestRouteRequestId === id) toast(err.message || 'Tour konnte nicht geladen werden.', 'error');
  } finally {
    hideProgress();
  }
}

async function openRoute(id) {
  await loadRouteIntoFocus(id, () => state.tab);
}

function closeDetail() {
  state.currentRoute = null;
  state.detailOrigin = null;
  resetStopFilter();
  // Predictions belong to the route that was on screen; carrying them to
  // the next one would stamp its stops with another route's ids.
  pendingDelivered.clear();
  pendingDeliveredGen.clear();
  render();
}

async function selectMapRoute(id) {
  if (state.currentRoute?.id !== id) mapCard = null;
  await loadRouteIntoFocus(id, () => null);
}

function openCurrentRouteDetail() {
  if (!state.currentRoute) return;
  state.tab = 'routes';
  state.detailOrigin = state.tab;
  render();
}

// ---------------------------------------------------------------------
// Data loading
// ---------------------------------------------------------------------
// The route *list* gets the same treatment as a route detail, one notch
// looser: every list render reads `r.id`/`r.name`/`r.status` off each entry,
// so an entry missing those is dropped rather than allowed to throw halfway
// through building the screen. A response that isn't a list at all is an
// error, not an empty list — "no routes yet" and "the server said something
// unintelligible" must not look identical to the driver.
function asRouteList(routes) {
  if (!Array.isArray(routes)) throw apiError('Unerwartete Antwort vom Server.', 'bad_response');
  return routes.filter((r) => r && typeof r.id === 'number' && typeof r.status === 'string');
}

async function loadRoutes() {
  try {
    // `|| []` rather than trusting the shape: every list render indexes
    // straight into this, and one malformed response would otherwise take
    // the whole screen down with a TypeError instead of an error message.
    state.routes = asRouteList(await api('/routes'));
    lastRefreshAt = Date.now();
    render();
  } catch (err) {
    toast(err.message || 'Touren konnten nicht geladen werden.', 'error');
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="px-6 pt-28 text-center text-black/55">
        <p class="text-sm mb-4">Verbindung zum Server fehlgeschlagen.</p>
        <button onclick="loadRoutes()" class="press-98 px-5 py-3 rounded-xl bg-brand-600 font-semibold text-white text-sm">Erneut versuchen</button>
      </div>
    `;
  } finally {
    hideSplash();
  }
}

// ---------------------------------------------------------------------
// Refresh on resume. Installed as a home-screen PWA, this app is opened,
// used, backgrounded and reopened all day — but it only ever fetched at
// startup, so a driver returning to it hours later was looking at this
// morning's list: routes someone else completed still showing as active,
// stops added on another device missing entirely, and no indication any
// of it was stale.
//
// The throttle is what keeps this from being a nuisance: switching apps
// for three seconds to check a phone number shouldn't fire a network
// request, and on a bad connection a burst of them would queue up behind
// each other.
// ---------------------------------------------------------------------
const REFRESH_ON_RESUME_AFTER_MS = 60000;
let lastRefreshAt = 0;
let refreshInFlight = false;

async function refreshOnResume() {
  if (document.visibilityState !== 'visible') return;
  if (refreshInFlight || Date.now() - lastRefreshAt < REFRESH_ON_RESUME_AFTER_MS) return;
  refreshInFlight = true;
  const seq = nextSeq();
  try {
    const routes = asRouteList(await api('/routes'));
    state.routes = routes;
    lastRefreshAt = Date.now();
    // The route in focus carries the stop list the driver is actually
    // working from, and it goes stale the same way — but only refetch it
    // if it still exists, so a route deleted elsewhere closes cleanly
    // instead of throwing a 404 toast in the driver's face on resume.
    const current = state.currentRoute;
    if (current && !routes.some((r) => r.id === current.id)) {
      closeDetail();
    } else if (current) {
      const fresh = await api(`/routes/${current.id}`);
      // Sequenced like every other update: a background refresh must never
      // overwrite a tick the driver made while it was in flight.
      applyRouteUpdate(seq, current.id, fresh);
    }
    // The most frequent render in the app — every resume, every
    // `visibilitychange`, every reconnect — and on the detail screen it
    // almost always paints the same list it just painted. Patching in place
    // keeps a resume from throwing away and rebuilding the whole screen
    // behind the driver's back.
    patchRouteDetail() || render(true);
  } catch (_) {
    // A silent background refresh that fails is not worth interrupting
    // anyone over — whatever is on screen stays, and the next resume (or
    // any deliberate action) tries again.
  } finally {
    refreshInFlight = false;
  }
}

function hideSplash() {
  const el = document.getElementById('splash');
  if (!el) return;
  el.style.transition = 'opacity .3s ease-out';
  el.style.opacity = '0';
  setTimeout(() => el.remove(), 320);
}

/// Runs a mutating request and lands its result on the route in focus,
/// with both guards applied: the wrong-route check (the driver navigated
/// away) and the stale-reply check (something newer already landed).
async function refreshCurrentRoute(makeRequest, label) {
  const routeId = state.currentRoute?.id;
  if (routeId == null) return;
  const seq = nextSeq();
  showProgress(label);
  try {
    const updated = await makeRequest();
    // `animate: true` matches the full `render()` this replaces: these are
    // the actions that genuinely reorder the list (reoptimize, address
    // recheck), and the entrance cascade is what says so.
    if (applyRouteUpdate(seq, routeId, updated)) patchRouteDetail({ animate: true }) || render();
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

// ---------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------
async function createRoute() {
  const name = await promptSheet({ title: 'Neue Tour', message: 'Start, Lager und Ziel werden automatisch gesetzt.', confirmLabel: 'Anlegen', placeholder: `Tour ${new Date().toLocaleDateString('de-AT')}` });
  if (name === null) return;
  showProgress();
  try {
    // Left blank on purpose = "use the default name" — the server fills in
    // "Route <heutiges Datum>" for an omitted name.
    const body = name.trim() ? { name: name.trim() } : {};
    const route = await api('/routes', { method: 'POST', body: JSON.stringify(body) });
    adoptRoute(nextSeq(), route);
    state.detailOrigin = 'routes';
    state.tab = 'routes';
    render();
    if (navigator.vibrate) navigator.vibrate(15);
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

// The form text is compared in when deciding whether two pieces of it mean
// the same thing — by the duplicate-address check (`addrKey`) and by the
// stop filter (`stopMatches`). Mirrors `address_match_key` in src/main.rs.
//
// Folds the three spellings of "Straße" together, then collapses punctuation
// to a single space. One door gets written "Großfeldstraße 9/Parz.68",
// "Großfeldstraße 9 Parz. 68" or "Gentzgasse 129 / 1" depending on which
// list it was copied out of, and treating those as different addresses is
// what let a second package for the same door slip past every duplicate
// warning in the app — and what would make a driver's search for
// "gentzgasse 129 1" come back empty.
//
// Collapsed to a space rather than removed outright: deleting the separators
