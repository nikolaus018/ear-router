  return total < 60 ? `${total} min` : `${Math.floor(total / 60)} h ${total % 60} min`;
};
const fmtClock = (ms) => {
  const d = new Date(ms);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
};
const fmtKm = (km) => `${km.toFixed(1).replace('.', ',')} km`;

/// Fills every arrival time on screen. Separate from the rows' own markup on
/// purpose: one tick moves the estimate for every door after it, and the
/// clock moves all of them once a minute, so they are painted over whatever
/// rows are there rather than being a reason to rebuild them.
function paintEtas() {
  const r = state.currentRoute;
  const slots = document.querySelectorAll('[data-eta], [data-eta-finish], [data-route-summary]');
  if (!r || !slots.length) return;
  const snap = routeSnapshot(r);
  const active = r.status === 'active';
  for (const el of slots) {
    if (el.hasAttribute('data-route-summary')) { el.textContent = routeSummaryText(r, snap); continue; }
    let text = '';
    if (active && el.hasAttribute('data-eta-finish')) {
      const at = snap.etaFinish();
      if (at) text = `Voraussichtlich fertig gegen ${fmtClock(at)}`;
    } else if (active) {
      const stop = r.stops.find((s) => s.id === Number(el.getAttribute('data-eta')));
      const at = stop && !stop.excluded ? snap.eta(stop) : null;
      if (at) text = `Ankunft etwa ${fmtClock(at)}`;
    }
    el.textContent = text;
  }
}
setInterval(paintEtas, 30 * 1000);

/// The line under a tour's name: what is still ahead, in customers.
function routeSummaryText(r, snap = routeSnapshot(r)) {
  if (!snap.customerCount) return 'Noch keine Stopps';
  const stops = (n) => (n === 1 ? '1 Stopp' : `${n} Stopps`);
  // A finished tour is history, and history has no "still to drive".
  if (r.status !== 'active') return [fmtDate(r.completed_at || r.created_at), stops(snap.customerCount), fmtKm(snap.totalKm)].join(' · ');
  const back = snap.remainingKm >= 0.05 ? ` · Rückfahrt ${fmtKm(snap.remainingKm)}` : '';
  if (snap.openCount <= 0) return `Alle erledigt${back}`;
  if (snap.openDoors <= 0) return `Alle Kunden erledigt${back}`;
  return `Noch ${stops(snap.openDoors)}${snap.remainingKm >= 0.05 ? ` · ${fmtKm(snap.remainingKm)}` : ''}`;
}

// ---------------------------------------------------------------------
// Tagesabschluss — the day in the form the office has to hear it.
//
// Shown when a tour is closed, and from its menu afterwards. The part that
// matters is the list of who did not get their meal: on the screen it is
// read out at a glance, and as plain text it goes to the office with one
// tap on Teilen. Same wording as the iOS app's `TourReport`.
// ---------------------------------------------------------------------
function tourReport(r) {
  const snap = routeSnapshot(r);
  const customers = r.stops.filter((s) => s.kind === 'customer');
  const count = (o) => customers.filter((s) => s.outcome === o).length;
  const entry = (s) => [s.kunde || 'Ohne Namen', [s.strasse, s.plz].filter(Boolean).join(', ')].filter(Boolean).join(', ') + (s.telefon ? ` · ${s.telefon}` : '');
  const notHome = customers.filter((s) => s.outcome === 'notHome');
  const stillOpen = customers.filter((s) => !s.outcome);
  const lager = count('toLager'), cancelled = count('cancelled'), neighbour = count('neighbour');
  const owed = customers.length - lager - cancelled;
  const handed = count('delivered') + neighbour;
  const times = customers.filter((s) => s.settled_at && !skipsDoor(s)).map((s) => Date.parse(s.settled_at)).filter(Number.isFinite).sort((a, b) => a - b);
  const day = fmtDate(r.completed_at || r.created_at);

  let span = '';
  if (times.length) {
    span = `${fmtClock(times[0])} – ${fmtClock(times[times.length - 1])}`;
    const minutes = Math.round((times[times.length - 1] - times[0]) / 60000);
    if (minutes >= 1) span += ` (${minutes >= 60 ? `${Math.floor(minutes / 60)} h ${minutes % 60} min` : `${minutes} min`})`;
  }
  const stops = (n) => (n === 1 ? '1 Stopp' : `${n} Stopps`);
  const lines = [r.name.includes(day) ? r.name : `${r.name} — ${day}`];
  if (span) lines.push(span);
  lines.push('', `Geliefert: ${handed} von ${stops(owed)}`);
  if (neighbour) lines.push(`davon bei Nachbarn abgegeben: ${neighbour}`);
  if (cancelled) lines.push(`Abbestellt: ${cancelled}`);
  if (lager) lines.push(`Ins Lager mitgenommen: ${lager}`);
  if (notHome.length) lines.push('', `Nicht angetroffen (${notHome.length}):`, ...notHome.map((s) => `· ${entry(s)}`));
  if (stillOpen.length) lines.push('', `Nicht angefahren (${stillOpen.length}):`, ...stillOpen.map((s) => `· ${entry(s)}`));
  lines.push('');
  if (snap.totalKm >= 0.05) lines.push(`Strecke laut Planung: ${fmtKm(snap.totalKm)}`);
  return { text: lines.join('\n').trim(), span, handed, owed, lager, cancelled, neighbour, notHome, stillOpen, km: snap.totalKm, day };
}

function openReportSheet() {

    ${rep.stillOpen.length ? `<p class="${SECTION_LABEL} !pt-0 flex items-center gap-1.5"><span class="flex" style="color:#FF9500">${ICONS.circle}</span>Nicht angefahren</p><div class="${GROUP} mb-4">${rep.stillOpen.map(person).join('')}</div>${foot('Diese Stopps sind offen geblieben.')}` : ''}

async function shareReport() {
  const r = state.currentRoute;
  if (!r) return;
  try {
    await navigator.share({ text: tourReport(r).text });
  } catch (err) {
    if (err?.name !== 'AbortError') toast('Teilen nicht möglich.', 'error');
  }
}

async function copyReport(button) {
  const r = state.currentRoute;
  if (!r) return;
  try {
    await navigator.clipboard.writeText(tourReport(r).text);
  } catch (_) {
    toast('Der Bericht konnte nicht kopiert werden.', 'error');
    return;
  }
  if (!button?.isConnected) return;
  button.innerHTML = `${ICONS.check} Kopiert`;
  setTimeout(() => { if (button.isConnected) button.innerHTML = `${ICONS.copy} Bericht kopieren`; }, 1500);
}

// ---------------------------------------------------------------------
// Kilometerstand — what the van's own odometer says the day was. Two
// numbers, typed in the yard: before setting off and after getting back.
// Kept on this device per day; the difference goes on the Tagesabschluss.
// ---------------------------------------------------------------------
// Per account: two drivers who share a phone do not share a van.
const kmKey = () => `ear.kilometer.v2.${state.user?.id ?? 0}`;

/// The reading "Stand merken" kept, as `{ reading, savedAt }`, or `null`.
function loadKilometer() {
  try {
    const v = JSON.parse(localStorage.getItem(kmKey()) || 'null');
    if (v && Number.isFinite(v.reading) && v.reading >= 0) return v;
  } catch (_) { /* unreadable — start clean */ }
  return null;
}

/// "48.210,5", "48210.5" and "48 210" are all one number. With both a comma
/// and a point, whichever comes last is the decimal one.
function parseKilometer(text) {
  let s = String(text || '').trim().replace(/[\s  ']/g, '');
  if (!s || !/^[\d.,]+$/.test(s)) return null;
  const comma = s.lastIndexOf(','), dot = s.lastIndexOf('.');
  if (comma >= 0 && dot >= 0) s = s.split(comma > dot ? '.' : ',').join('');
  s = s.replace(/,/g, '.');
  // More than one separator left is no number ("1.2.3").
  if ((s.match(/\./g) || []).length > 1) return null;
  const value = Number(s);
  return Number.isFinite(value) && value >= 0 ? value : null;
}
const formatKilometer = (value) => String(Math.round(value * 10) / 10).replace('.', ',');

/// Set once "Stand merken" was pressed while the sheet is open.
let kmSavedNow = false;

function openKilometerSheet() {
  const kept = loadKilometer();
  kmSavedNow = false;
  const now = new Date();
  renderSheetShell(`
    <h2 class="sheet-title">Kilometerstand</h2>
    <p class="sheet-lead">${fmtDate(now.toISOString())} · ${fmtClock(now.getTime())} Uhr</p>
    <div class="space-y-3">
      <div class="km-field"><label for="km-old">Alt</label><input id="km-old" inputmode="decimal" autocomplete="off" value="${kept ? escapeAttr(formatKilometer(kept.reading)) : ''}" placeholder="0" oninput="paintKilometer()" /><span>km</span></div>
      <div class="km-field"><label for="km-new">Neu</label><input id="km-new" inputmode="decimal" autocomplete="off" placeholder="0" oninput="paintKilometer()" /><span>km</span></div>
    </div>
    <div class="now-card" style="margin-top:1rem; text-align:center">
      <p class="now-caption">Gefahren</p>
      <p id="km-result" class="now-name" style="margin-top:.25rem; font-size:34px; font-variant-numeric: tabular-nums"></p>
      <p id="km-backwards" class="now-fact warn" style="justify-content:center; display:none"><span>${ICONS.warning}</span><span>Der neue Stand ist kleiner als der alte.</span></p>
    </div>
    <div style="margin-top:1rem">
      <button type="button" id="km-save" onclick="saveKilometer()" class="press-98 wide-btn accent">${ICONS.download} Stand merken</button>
      <p id="km-foot" class="now-caption" style="padding:.625rem .25rem 0"></p>
      <button type="button" id="km-forget" onclick="forgetKilometer()" class="press-98 wide-btn quiet" style="color:#D70015; margin-top:.875rem; display:none">Gemerkten Stand löschen</button>
    </div>
    <div class="pb-2" style="margin-top:.875rem"><button type="button" onclick="closeSheet()" class="press-98 wide-btn quiet">Fertig</button></div>
  `, { label: 'Kilometerstand' });
  paintKilometer();
  setTimeout(() => document.getElementById(kept ? 'km-new' : 'km-old')?.focus(), 350);
}

function paintKilometer() {
  const oldReading = parseKilometer(document.getElementById('km-old')?.value);
  const newReading = parseKilometer(document.getElementById('km-new')?.value);
  const out = document.getElementById('km-result');
  if (!out) return;
  const both = oldReading != null && newReading != null;
  out.textContent = both && newReading >= oldReading ? `${formatKilometer(newReading - oldReading)} km` : '—';
  document.getElementById('km-backwards').style.display = both && newReading < oldReading ? 'flex' : 'none';
  document.getElementById('km-save').disabled = newReading == null;
  const kept = loadKilometer();
  document.getElementById('km-forget').style.display = kept ? '' : 'none';
  document.getElementById('km-foot').textContent = kmSavedNow
    ? 'Gemerkt. Beim nächsten Öffnen steht dieser Wert schon oben.'
    : kept
    ? `„Alt“ ist der zuletzt gemerkte Stand${kept.savedAt ? ` · ${fmtDate(new Date(kept.savedAt).toISOString())}` : ''}. Kann überschrieben werden.`
    : 'Beide Stände eintragen. „Stand merken“ übernimmt „Neu“ für das nächste Mal.';
}

/// "Stand merken": Neu becomes the Alt of the next time.
function saveKilometer() {
  const newReading = parseKilometer(document.getElementById('km-new')?.value);
  if (newReading == null) return;
  try { localStorage.setItem(kmKey(), JSON.stringify({ reading: newReading, savedAt: Date.now() })); }
  catch (_) { toast('Der Stand konnte hier nicht gemerkt werden.', 'error'); return; }
  document.getElementById('km-old').value = formatKilometer(newReading);
  document.getElementById('km-new').value = '';
  document.getElementById('km-new').blur();
  kmSavedNow = true;
  if (navigator.vibrate) navigator.vibrate(15);
  paintKilometer();
}

async function forgetKilometer() {
  const ok = await confirmSheet({ title: 'Gemerkten Stand löschen?', message: '„Alt“ muss danach wieder von Hand eingetragen werden.', confirmLabel: 'Löschen', danger: true });
  if (ok) { try { localStorage.removeItem(kmKey()); } catch (_) { /* nothing was kept */ } }
  // The question took the sheet's place: back to it, with what is true now.
  openKilometerSheet();
}

const PDF_WIDTHS = (() => {
  const regular = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
  const bold = [278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
  return { regular, bold };
})();
// The characters outside Latin-1 that the fonts' encoding (WinAnsi) still
// has: code, then width in the regular and the bold cut.
const PDF_EXTRA = { '€': [0x80, 556, 556], '„': [0x84, 333, 500], '…': [0x85, 1000, 1000], '‘': [0x91, 222, 278], '’': [0x92, 222, 278], '“': [0x93, 333, 500], '”': [0x94, 333, 500], '•': [0x95, 350, 350], '–': [0x96, 556, 556], '—': [0x97, 1000, 1000] };

/// One character as the PDF will hold it: its byte, and how wide it is drawn.
function pdfGlyph(ch, bold) {
  const extra = PDF_EXTRA[ch];
  if (extra) return { code: extra[0], width: extra[bold ? 2 : 1] };
  const table = bold ? PDF_WIDTHS.bold : PDF_WIDTHS.regular;
  let code = ch.charCodeAt(0);
  if (code === 0xA0) return { code, width: table[0] };
  if (code >= 32 && code <= 126) return { code, width: table[code - 32] };
  if (ch === 'ß') return { code, width: 611 };
  if (code >= 0xC0 && code <= 0xFF) {
    // An accented letter is as wide as the letter under the accent.
    const base = ch.normalize('NFD').charCodeAt(0);
    return { code, width: base >= 32 && base <= 126 ? table[base - 32] : table['n'.charCodeAt(0) - 32] };
  }
  if (code > 0xA0 && code < 0xC0) return { code, width: 556 };
  // Nothing these fonts can draw: the letter without its accent, or "?".
  const plain = ch.normalize('NFD').charCodeAt(0);
  code = plain >= 32 && plain <= 126 ? plain : 63;
  return { code, width: table[code - 32] };
}
const pdfTextWidth = (text, bold, size) => [...text].reduce((w, ch) => w + pdfGlyph(ch, bold).width, 0) * size / 1000;
const pdfString = (text, bold) => '(' + [...text].map((ch) => {
  const c = String.fromCharCode(pdfGlyph(ch, bold).code);
  return c === '(' || c === ')' || c === '\\' ? '\\' + c : c;
}).join('') + ')';

/// Breaks `text` into the lines that fit `width`. A word longer than a
/// whole line — "Schenkendorfgasse" in a narrow column — is cut where the
/// line ends, as the printed list does.
function pdfWrap(text, bold, size, width) {
  const lines = [];
  for (const paragraph of String(text).split(/\r?\n/)) {
    let line = '';
    for (let word of paragraph.split(/[ \t]+/).filter(Boolean)) {
      if (line && pdfTextWidth(line + ' ' + word, bold, size) <= width) { line += ' ' + word; continue; }
      if (line) { lines.push(line); line = ''; }
      while (pdfTextWidth(word, bold, size) > width) {
        let n = 1;
        while (n < word.length && pdfTextWidth(word.slice(0, n + 1), bold, size) <= width) n++;
        lines.push(word.slice(0, n));
        word = word.slice(n);
      }
      line = word;
    }
    if (line) lines.push(line);
  }
  return lines;
}

const TOUR_PDF = {
  page: [842, 595], left: 40, top: 62, bottom: 540, padding: 3,
  headerHeight: 30, rowHeight: 34, size: 10, leading: 12,
  columns: [
    { title: 'Tour', width: 72, bold: true },
    { title: 'Stopp', width: 40, bold: true, align: 'right' },
    { title: 'Datum', width: 66, bold: true },
    { title: 'KD', width: 112 },
    { title: 'Straße', width: 132 },
    { title: 'Plz', width: 36, align: 'right' },
    { title: 'Paket', width: 124, bold: true },
    { title: 'Hinweis', width: 180, bold: true },
  ],
};

/// One row a delivery, in the order they are handed in — the driving order,
/// which the server works out the way it does for a tour. `tour` is
/// `{ name, date, entries }` — the day as "2026-10-09".
function tourPdfRows(tour) {
  const day = fmtDate(`${tour.date}T12:00:00`);
  return tour.entries.map((e, i) => [
    tour.name || '', String(i + 1), day, (e.kunde || '').trim(), (e.strasse || '').trim(),
    (e.plz || '').trim(), displayPaket(e, tour).trim(), (e.notiz || '').trim(),
  ]);
}

/// The whole file, as bytes.
function tourPdfBytes(r) {
  const T = TOUR_PDF;
  const [pageW, pageH] = T.page;
  const tableW = T.columns.reduce((w, c) => w + c.width, 0);
  const rows = tourPdfRows(r).map((values) => {
    const cells = values.map((v, i) => pdfWrap(v, !!T.columns[i].bold, T.size, T.columns[i].width - 2 * T.padding));
    const lines = Math.max(...cells.map((c) => c.length));
    return { cells, height: Math.max(T.rowHeight, lines * T.leading + 2 * T.padding) };
  });

  // A row is never split across two pages.
  const pages = [[]];
  let y = T.top + T.headerHeight;
  rows.forEach((row, index) => {
    if (y + row.height > T.bottom && pages[pages.length - 1].length) { pages.push([]); y = T.top; }
    pages[pages.length - 1].push({ ...row, index });
    y += row.height;
  });

  const n = (v) => String(Math.round(v * 100) / 100);
  // PDF counts up from the bottom of the page; everything here counts down.
  const text = (str, bold, size, x, baseline, color = '0 g') =>
    `BT ${color} /${bold ? 'F2' : 'F1'} ${size} Tf ${n(x)} ${n(pageH - baseline)} Td ${pdfString(str, bold)} Tj ET\n`;
  const centred = (str, bold, size, left, width, baseline, color) =>
    text(str, bold, size, left + (width - pdfTextWidth(str, bold, size)) / 2, baseline, color);
  const fill = (rgb, x, top, w, h) => `${rgb} rg ${n(x)} ${n(pageH - top - h)} ${n(w)} ${n(h)} re f\n`;

  // Noon, so the day is the same day in whatever zone this browser is in.
  const weekday = new Date(`${r.date}T12:00:00`).toLocaleDateString('de-AT', { weekday: 'long' });
  const dayTitle = `${weekday}, ${fmtDate(`${r.date}T12:00:00`)}`;

  const streams = pages.map((lines, pageIndex) => {
    let out = centred(dayTitle, false, 9, 0, pageW, 46) + centred(`Seite ${pageIndex + 1} von ${pages.length}`, false, 9, 0, pageW, 562);
    const hasHeader = pageIndex === 0;
    const edges = [T.top];
    if (hasHeader) edges.push(T.top + T.headerHeight);
    for (const line of lines) edges.push(edges[edges.length - 1] + line.height);
    const first = hasHeader ? 1 : 0;

    // Fills first, then one grid over all of it, then the text — so the
    // header is exactly as wide as the table and every line as heavy as
    // the next.
    if (hasHeader) out += fill('0.267 0.447 0.769', T.left, T.top, tableW, T.headerHeight);
    lines.forEach((line, i) => {
      if (line.index % 2 === 0) out += fill('0.851 0.882 0.949', T.left, edges[first + i], tableW, line.height);
    });
    out += '0 G 0.75 w 2 J\n';
    for (const edge of edges) out += `${n(T.left)} ${n(pageH - edge)} m ${n(T.left + tableW)} ${n(pageH - edge)} l\n`;
    let x = T.left;
    for (const column of [null, ...T.columns]) {
      x += column?.width || 0;
      out += `${n(x)} ${n(pageH - edges[0])} m ${n(x)} ${n(pageH - edges[edges.length - 1])} l\n`;
    }
    out += 'S\n';

    x = T.left;
    T.columns.forEach((column, c) => {
      if (hasHeader) out += centred(column.title, true, T.size, x, column.width, T.top + T.headerHeight / 2 + 3.5, '1 g');
      lines.forEach((line, i) => {
        const cell = line.cells[c];
        const bottom = edges[first + i] + line.height;
        cell.forEach((str, k) => {
          // On the bottom line of the cell, the way the printed list sets it.
          const baseline = bottom - T.padding - 2.5 - (cell.length - 1 - k) * T.leading;
          const left = column.align === 'right'
            ? x + column.width - T.padding - pdfTextWidth(str, !!column.bold, T.size)
            : x + T.padding;
          out += text(str, !!column.bold, T.size, left, baseline);
        });
      });
      x += column.width;
    });
    return out;
  });

  // The file itself: catalogue, page tree, the two fonts, then a page and
  // its drawing for each page of the table. Every character is one byte.
  const font = (name) => `<< /Type /Font /Subtype /Type1 /BaseFont /${name} /Encoding /WinAnsiEncoding >>`;
  const objects = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    `<< /Type /Pages /Count ${pages.length} /Kids [${pages.map((_, i) => `${5 + i * 2} 0 R`).join(' ')}] >>`,
    font('Helvetica'), font('Helvetica-Bold'),
  ];
  streams.forEach((stream, i) => {
    objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6 + i * 2} 0 R >>`);
    objects.push(`<< /Length ${stream.length} >>\nstream\n${stream}endstream`);
  });
  objects.push(`<< /Title ${pdfString(r.name || 'Tour', false)} >>`);

  let file = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
  const offsets = objects.map((body, i) => {
    const at = file.length;
    file += `${i + 1} 0 obj\n${body}\nendobj\n`;
    return at;
  });
  const xref = file.length;
  file += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`
    + offsets.map((at) => `${String(at).padStart(10, '0')} 00000 n \n`).join('')
    + `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R /Info ${objects.length} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  return Uint8Array.from(file, (ch) => ch.charCodeAt(0));
}

/// "VM 5 FR Vormittag 09.10.2026.pdf".
function tourPdfFilename(r) {
  const day = fmtDate(`${r.date}T12:00:00`);
  const name = String(r.name || '').replace(/[\/:\\]/g, '-').trim();
  return `${(name.includes(day) ? name : `${name} ${day}`).trim() || 'Tour'}.pdf`;
}

/// Mehr → Tour als PDF: the day's tours come from the Zusteller-Portal, the
/// way they do for a new tour — see `openGourmetSheet`.
const openTourPdfSheet = () => openGourmetSheet(null, true);

/// The tour picked in the sheet: its deliveries with their parcels and
/// notes, straight from the portal, and out as a file.
async function exportTourPdf(tour) {
  const date = gourmet.date;
  const back = `<button type="button" onclick="showGourmetTours()" class="press-98 wide-btn quiet">Zurück</button>`;
  if (!gourmetBody(sheetBusy('Stopps werden geholt und in Fahrreihenfolge gebracht …'), escapeHtml(tour.name))) return;
  try {
    const { entries } = await api('/portal/entries', { method: 'POST', body: JSON.stringify({ tour_id: tour.id, date, driving_order: true }), timeoutMs: 3 * 60 * 1000 });
    if (!gourmet.pdf || gourmet.tour?.id !== tour.id) return;
    const pdf = { name: tour.name, date, entries };
    const file = new File([tourPdfBytes(pdf)], tourPdfFilename(pdf), { type: 'application/pdf' });
    tourPdfFile = file;
    gourmetBody(`
      <div class="sheet-note" style="background:rgba(52,199,89,.14);color:#1B6B32"><span style="color:#248A3D">${ICONS.checkCircle}</span><span>${entries.length === 1 ? '1 Stopp' : `${entries.length} Stopps`}, ${dayLabel(date)}. Die Liste ist fertig.</span></div>
      <button type="button" onclick="deliverTourPdf()" class="press-98 wide-btn accent">PDF öffnen</button>
      ${back}
      <button type="button" onclick="closeSheet()" class="press-98 wide-btn quiet">Fertig</button>`, escapeHtml(tour.name));
  } catch (err) {
    if (/anmelden|Anmeldung/.test(err.message)) { showGourmetLogin(err.message); return; }
    gourmetBody(sheetError(err.message, `showGourmetDeliveries(${tour.id})`) + back, escapeHtml(tour.name));
  }
}

// Handed over on a tap of its own: a share sheet may only open from one,
// and the fetch above is long past the tap that started it.
let tourPdfFile = null;
async function deliverTourPdf() {
  const file = tourPdfFile;
  if (!file) return;
  // On a phone the share sheet — print, mail, WhatsApp — and a plain
  // download everywhere else.
  if (matchMedia('(pointer: coarse)').matches && navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (err) {
      if (err?.name === 'AbortError') return;
    }
  }
  const url = URL.createObjectURL(file);
  const link = Object.assign(document.createElement('a'), { href: url, download: file.name });
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// ---------------------------------------------------------------------
// Reihenfolge — the stops in the driver's own order.
//
// The computed order is the shortest drive, which is not always the right
// one: a customer who has to eat at eleven, a street that is closed. Here
// the stops are moved up and down with two buttons a row — no dragging,
// which on a phone in a van is how a stop ends up three places from where
// it was meant to go. The tour is then driven as listed until "Reihenfolge
// neu berechnen" is asked for again.
// ---------------------------------------------------------------------
let reorderIds = [];

function openReorderSheet() {
  const r = state.currentRoute;
  if (!r) return;
  reorderIds = r.stops.filter((s) => s.kind === 'customer').map((s) => s.id);
  if (reorderIds.length < 2) { toast('Dafür braucht die Tour mindestens zwei Stopps.', 'info'); return; }
  renderSheetShell(`
    <h2 class="sheet-title">Reihenfolge</h2>
    <p class="sheet-lead">Mit den Pfeilen einen Stopp nach oben oder unten schieben. Die Tour wird dann genau so gefahren.</p>
    <div class="${GROUP}" data-reorder-list></div>
    <div class="sheet-actions">
      <button type="button" onclick="saveReorder()" class="press-98 wide-btn accent">Reihenfolge speichern</button>
      <button type="button" onclick="closeSheet()" class="press-98 wide-btn quiet">Abbrechen</button>
    </div>
  `, { label: 'Reihenfolge' });
  paintReorder();
}

function paintReorder() {
  const list = document.querySelector('[data-reorder-list]');
  if (!list) return;
  const last = reorderIds.length - 1;
  list.innerHTML = reorderIds.map((id, i) => {
    const s = getStop(id);
    if (!s) return '';
    return `
      <div class="reorder-row" data-reorder-row="${id}">
        <span class="reorder-num">${i + 1}</span>
        <span class="flex-1 min-w-0"><span class="block font-medium truncate">${escapeHtml(s.kunde)}</span><span class="block text-[13px] text-black/55 truncate">${escapeHtml(stopAddress(s))}</span></span>
        <button type="button" onclick="moveReorder(${id}, -1)" ${i === 0 ? 'disabled' : ''} aria-label="${escapeAttr(`${s.kunde} nach oben`)}" class="reorder-btn">${ICONS.arrowUp}</button>
        <button type="button" onclick="moveReorder(${id}, 1)" ${i === last ? 'disabled' : ''} aria-label="${escapeAttr(`${s.kunde} nach unten`)}" class="reorder-btn">${ICONS.arrowDown}</button>
      </div>`;
  }).join('');
}

function moveReorder(id, by) {
  const i = reorderIds.indexOf(id);
  const j = i + by;
  if (i < 0 || j < 0 || j >= reorderIds.length) return;
  [reorderIds[i], reorderIds[j]] = [reorderIds[j], reorderIds[i]];
  paintReorder();
  // The row just moved, flashed, so the eye follows it to where it went.
  document.querySelector(`[data-reorder-row="${id}"]`)?.animate(
    [{ backgroundColor: 'rgba(237,22,57,0.16)' }, { backgroundColor: 'rgba(237,22,57,0)' }],
    { duration: 700, easing: 'ease-out' });
  if (navigator.vibrate) navigator.vibrate(8);
}

async function saveReorder() {
  const ids = [...reorderIds];
  const r = state.currentRoute;
  closeSheet();
  if (!r) return;
  const before = r.stops.filter((s) => s.kind === 'customer').map((s) => s.id);
  if (before.join() === ids.join()) return;
  await refreshCurrentRoute(
    () => api(`/routes/${r.id}/order`, { method: 'PUT', retry: true, body: JSON.stringify({ stop_ids: ids }) }),
    'Reihenfolge wird gespeichert …',
  );
}

// ---------------------------------------------------------------------
// Tour vorbereiten — the checklist that runs while the van is still in the
// yard, where every problem this app can have is still cheap to fix: an
// order that was never computed, an address the map only guessed at, ticks
// left over from the last time the tour was driven. Each line that needs
// something has the button that does it right on it.
// ---------------------------------------------------------------------
function preflightFindings(r) {
  const snap = routeSnapshot(r);
  const customers = r.stops.filter((s) => s.kind === 'customer');
  const owed = customers.filter((s) => !skipsDoor(s));
  if (!owed.length) {
    return [{ level: 'problem', icon: ICONS.box, title: 'Keine Stopps', detail: 'Lade die Tour von Gourmet oder füg Stopps mit dem + dazu.', action: `openGourmetSheet(${r.id})`, actionLabel: 'Von Gourmet laden' }];
  }
  const out = [];
  if (r.needs_optimize || !r.geometry?.length) {
    out.push({ level: 'problem', icon: ICONS.refresh, title: 'Reihenfolge nicht aktuell', detail: 'Die Reihenfolge und die Kilometer stimmen noch nicht.', action: 'manualOptimize()', actionLabel: 'Jetzt berechnen' });
  } else {
    out.push({ level: 'ok', icon: ICONS.checkCircle, title: r.hand_ordered ? 'Eigene Reihenfolge' : 'Reihenfolge ist berechnet', detail: `${fmtKm(snap.totalKm)} · ${Math.round(snap.totalMinutes)} min Fahrzeit` });
  }
  const unplaced = unplacedStops(r);
  for (const s of unplaced) {
    out.push({ level: 'problem', icon: ICONS.warning, title: `Adresse von ${s.kunde} nicht gefunden`, detail: `${stopAddress(s)} — der Pin steht nur in der Bezirksmitte. So kann die Tour nicht gefahren werden.`, action: `fixStopAddress(${s.id})`, actionLabel: 'Adresse korrigieren' });
  }
  const rough = owed.filter((s) => s.location_precision === 'street' && !s.pinned);
  if (unplaced.length) {
    // said above, one line each
  } else if (rough.length) {
    out.push({ level: 'note', icon: ICONS.warning, title: `${rough.length} ungefähre ${rough.length === 1 ? 'Adresse' : 'Adressen'}`, detail: `${rough.slice(0, 3).map((s) => s.kunde).join(', ')}${rough.length > 3 ? ' …' : ''} — Stopp antippen, „Bearbeiten“, Pin auf das Haus setzen.` });
  } else {
    out.push({ level: 'ok', icon: ICONS.mapPin, title: 'Alle Adressen gefunden' });
  }
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const stale = customers.filter((s) => s.outcome && !skipsDoor(s) && !(Date.parse(s.settled_at) >= today.getTime())).length;
  if (stale) {
    out.push({ level: 'problem', icon: ICONS.checkCircle, title: `${stale} ${stale === 1 ? 'Stopp ist' : 'Stopps sind'} noch von einem früheren Tag abgehakt`, detail: 'Setz den Lieferstatus zurück, bevor du losfährst.', action: 'resetDelivered()', actionLabel: 'Zurücksetzen' });
  }
  if (isTkTour(r)) {
    const doors = owed.length;
    out.push({ level: 'note', icon: ICONS.box, title: `${doors} ${doors === 1 ? 'Kunde' : 'Kunden'} einladen`, detail: 'Die Ladeliste zählt sie rückwärts auf — letzter Kunde zuerst.', action: 'renderLadeliste()', actionLabel: 'Ladeliste' });
  } else {
    const pieces = ladelisteItems(r, 'vm').reduce((a, x) => a + x.qty, 0);
    if (pieces) out.push({ level: 'note', icon: ICONS.box, title: `${pieces} ${pieces === 1 ? 'Position' : 'Positionen'} einladen`, detail: 'Die Ladeliste hat sie aufgeschlüsselt.', action: 'renderLadeliste()', actionLabel: 'Ladeliste' });
  }
  const notes = owed.filter((s) => (s.notiz || '').trim()).length;
  if (notes) out.push({ level: 'note', icon: ICONS.note, title: `${notes} ${notes === 1 ? 'Notiz' : 'Notizen'} auf der Tour`, detail: 'Stehen bei den Stopps — vor dem Läuten lesen.' });
  return out;
}

// When the tour is done — and, the evening before, when it would be if the
// van left at a time of the driver's choosing. Counted from now, a tour
// loaded at nine at night is "fertig" at three in the morning.
//
// The departure is a question asked of this sheet and nothing more: it is
// gone when the sheet closes, and no other screen's times move with it. Only
// the time of day last asked about is remembered, so the field opens
// somewhere sensible.
const ABFAHRT_CLOCK_KEY = 'ear_abfahrt_clock';
let preflightStart = null;

/// The next time the clock shows what was asked about last, or eight o'clock.
function suggestedDeparture(now = Date.now()) {
  let minutes = 8 * 60;
  try {
    const saved = Number(localStorage.getItem(ABFAHRT_CLOCK_KEY));
    if (localStorage.getItem(ABFAHRT_CLOCK_KEY) != null && saved >= 0 && saved < 1440) minutes = saved;
  } catch (_) { /* private-browsing storage lockout */ }
  const d = new Date(now);
  d.setHours(Math.floor(minutes / 60), minutes % 60, 0, 0);
  if (d.getTime() <= now) d.setDate(d.getDate() + 1);
  return d.getTime();
}

/// `datetime-local` speaks local wall-clock time with no zone.
function localInputValue(ms) {
  const d = new Date(ms), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function setPreflightStart(ms) {
  preflightStart = Number.isFinite(ms) ? ms : null;
  if (preflightStart != null) {
    const d = new Date(preflightStart);
    try { localStorage.setItem(ABFAHRT_CLOCK_KEY, String(d.getHours() * 60 + d.getMinutes())); } catch (_) { /* private mode */ }
  }
  const el = document.getElementById('preflight-plan');
  if (el && state.currentRoute) el.innerHTML = preflightPlanHtml(state.currentRoute);
}

function preflightPlanHtml(r) {
  const snap = routeSnapshot(r, preflightStart);
  const finish = snap.etaFinish();
  if (!finish) return '';
  const start = snap.pendingStart();
  const row = (label, value) => `
    <div class="flex items-center justify-between gap-3 px-4 py-3.5">
      <span class="text-[15px] font-medium">${label}</span>
      <span class="text-[15px] text-black/60" style="font-variant-numeric:tabular-nums">${value}</span>
    </div>`;
  return `
    <div class="${GROUP} mb-2">
      ${start ? `
        <label class="flex items-center justify-between gap-3 px-4 py-2.5">
          <span class="text-[15px] font-medium">Abfahrt</span>
          <input type="datetime-local" value="${localInputValue(start)}" min="${localInputValue(Date.now())}"
            onchange="setPreflightStart(this.value ? new Date(this.value).getTime() : null)"
            class="text-[15px]" style="background:rgba(120,120,128,.14);border-radius:8px;padding:.375rem .5rem" aria-label="Abfahrt" />
        </label>` : ''}
      ${row('Voraussichtlich fertig', fmtClock(finish))}
      ${start ? row('Dauer', `ca. ${fmtDuration(snap.plannedDuration())}`) : ''}
    </div>
    <p class="now-caption" style="padding:0 .25rem .75rem">${start
      ? 'Die Abfahrt gilt nur hier zum Nachrechnen und wird nicht gespeichert.'
      : 'Wenn du jetzt losfährst.'}</p>
    ${start
      ? `<button type="button" onclick="setPreflightStart(null)" class="press-98 wide-btn quiet" style="margin-bottom:1rem">Ab jetzt rechnen</button>`
      : (snap.underWay ? '' : `<button type="button" onclick="setPreflightStart(suggestedDeparture())" class="press-98 wide-btn quiet" style="margin-bottom:1rem">Mit Abfahrtszeit rechnen</button>`)}`;
}

function openPreflightSheet() {
  const r = state.currentRoute;
  if (!r) return;
  const findings = preflightFindings(r);
  const ready = !findings.some((f) => f.level === 'problem');
  preflightStart = null;
  const tone = { ok: '#248A3D', note: 'rgba(0,0,0,.45)', problem: '#B26A00' };
  renderSheetShell(`
    <h2 class="sheet-title">Tour vorbereiten</h2>
    <p class="sheet-lead">${ready ? 'Alles bereit — gute Fahrt.' : 'Vor der Abfahrt ist noch etwas zu tun.'}</p>
    <div class="${GROUP} mb-4">
      ${findings.map((f) => `
        <div class="flex items-start gap-3 px-4 py-3.5">
          <span class="flex shrink-0 text-xl" style="margin-top:.1rem;color:${tone[f.level]}">${f.icon}</span>
          <span class="flex-1 min-w-0">
            <span class="block text-[15px] font-medium">${escapeHtml(f.title)}</span>
            ${f.detail ? `<span class="block text-[13px] text-black/55 leading-snug mt-0.5">${escapeHtml(f.detail)}</span>` : ''}
            ${f.action ? `<button type="button" onclick="closeSheet(); ${f.action}" class="press-98 preflight-action">${f.actionLabel}</button>` : ''}
          </span>
        </div>`).join('')}
    </div>
    <div id="preflight-plan">${preflightPlanHtml(r)}</div>

// Signing in.
//
// Everybody who uses the app has an account, and sees their own tours and
// nobody else's. The server keeps them signed in on this phone for a month
// from the last use (a cookie the page itself cannot read), so the login is
// a screen most drivers see once. There is no "register": accounts are made
// by the administrator, in the Admin tab only that account has.
// ---------------------------------------------------------------------
function renderLoginScreen(message = '') {
  dismissUndo();
  document.getElementById('modal-root').innerHTML = '';
  const app = document.getElementById('app');
  app.innerHTML = `
    <div role="main" class="flex-1 min-h-0 overflow-y-auto" style="padding: calc(env(safe-area-inset-top) + 3.5rem) 1.5rem 2rem">
      <div class="text-center" style="margin-bottom:2rem">

        <p class="text-[15px] text-black/55 mt-1">Bitte anmelden, um deine Touren zu sehen.</p>
      </div>
      ${message ? `<div class="sheet-note warn"><span>${ICONS.warning}</span><span>${escapeHtml(message)}</span></div>` : ''}
      <form id="login-form" novalidate class="space-y-3">
        <div>
          <label class="${LABEL}" for="login-user">Benutzername</label>
          <input id="login-user" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" class="${FIELD}" />

      </form>
      <p class="sheet-foot">Noch kein Zugang? Den legt der Administrator für dich an.</p>
    </div>`;
  app.querySelectorAll('[data-logo-src]').forEach((img) => (img.src = APP_LOGO));
  const form = document.getElementById('login-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = form.username.value.trim();
    const password = form.password.value;
    if (!username || !password) { renderLoginScreen('Bitte Benutzername und Passwort eingeben.'); return; }
    const btn = form.querySelector('[type=submit]');
    btn.disabled = true;

}

/// Starts the app for a user who has just been recognised.
async function signedIn(user) {
  state.user = user;
  state.tab = 'routes';
  state.routes = [];
  state.currentRoute = null;
  state.detailOrigin = null;
  await loadRoutes();
  loadPaceHistory();
  loadHome();
}

/// Back to the login, with nothing of the last user left in memory — the
/// next person to sign in on this phone must not glimpse their tours.
function signedOut() {
  if (!state.user) return;
  state.user = null;
  state.routes = [];
  state.currentRoute = null;
  state.detailOrigin = null;
  state.tab = 'routes';
  pendingDelivered.clear();
  pendingDeliveredGen.clear();
  adminUsers = null;
  importController = null;
  // What the last driver's tours taught about door times is theirs.
  paceHistory = { door_minutes: null, lager_minutes: null, door_by_tour: {}, lead_minutes: null };
  homeState = { home: null };
  render();
}

async function logOut() {
  const ok = await confirmSheet({ title: 'Abmelden?', message: 'Deine Touren bleiben gespeichert und sind nach dem Anmelden wieder da.', confirmLabel: 'Abmelden' });
  if (!ok) return;
  try { await api('/logout', { method: 'POST' }); } catch (_) { /* signed out on this phone either way */ }
  signedOut();
}

/// The first thing the app does: ask who is signed in.
async function boot() {
  try {
    const user = await api('/me', { retry: true });
    await signedIn(user);

    hideSplash();
    if (err.code === 'unauthorized' || err.code === 'http_401') { state.user = null; renderLoginScreen(); return; }
    document.getElementById('app').innerHTML = `
      <div class="px-6 pt-28 text-center text-black/55">
        <p class="text-sm mb-4">Verbindung zum Server fehlgeschlagen.</p>
        <button onclick="boot()" class="press-98 px-5 py-3 rounded-xl bg-brand-600 font-semibold text-white text-sm">Erneut versuchen</button>

}

// ---------------------------------------------------------------------
// Phone numbers. A stop can carry the customer's own number (`telefon`), and
// the office's lists routinely put another one in the note — a daughter, a
// Heimhilfe. Both are offered on Jetzt, the note's only when it is not the
// same number written another way.
// ---------------------------------------------------------------------
const dialOf = (raw) => {
  const t = String(raw || '').trim();
  const digits = t.replace(/\D/g, '');
  return digits ? (t.startsWith('+') ? '+' : '') + digits : '';
};
/// One key for "+43 664 …", "0043 664 …" and "0664 …".
const sameNumberKey = (dial) => {
  let d = dial.startsWith('+') ? dial.slice(1) : dial;
  if (dial.startsWith('+') && d.startsWith('43') && d.length > 2) d = d.slice(2);
  else if (d.startsWith('0043') && d.length > 4) d = d.slice(4);
  if (d.startsWith('0') && d.length > 1) d = d.slice(1);
  return d;
};
function phonesInNote(notiz, besides) {
  const own = besides ? sameNumberKey(dialOf(besides)) : null;
  const out = [];
  for (const m of String(notiz || '').matchAll(/(?:\+|0)[\d][\d\s\/().-]{5,}\d/g)) {
    const display = m[0].trim();
    const dial = dialOf(display);
    const digits = dial.replace('+', '');
    if (digits.length < 7 || digits.length > 15) continue;
    const key = sameNumberKey(dial);
    if (key === own || out.some((p) => sameNumberKey(p.dial) === key)) continue;
    out.push({ display, dial });
  }
  return out;
}

// ---------------------------------------------------------------------
// "Gleich mitnehmen" -- the doors after this one that are a short walk away,
// carried along in one go instead of found out about from the navigation app
// once the driver is back in the van and it says "30 m". The iOS app's
// `WalkOn`, rule for rule.
//
// Jetzt shows one stop and nothing else, on purpose. This is the one thing
// about what comes next that changes what the driver does *now*: how many
// parcels leave the van.
// ---------------------------------------------------------------------
/// As the crow flies, so the real walk is somewhat more. Far enough for the
/// next Stiege across a Hof and the house two doors down; not so far that it
/// would have been quicker to drive.
const WALK_ON_REACH_M = 100;

const metresBetween = (aLat, aLon, bLat, bLon) =>
  Math.hypot((aLat - bLat) * 111000, (aLon - bLon) * 111000 * Math.cos(aLat * Math.PI / 180));

/// The box a point has to be in for the postcode it is filed under -- the
/// server's `is_plausible_for_plz`.
const plausibleForPlz = (lat, lon, plz) => Number.isFinite(lat) && Number.isFinite(lon)
  && (DISTRICT_BY_PLZ[plz]
    ? lat >= 47.7 && lat <= 48.6 && lon >= 15.8 && lon <= 16.8
    : lat >= 46.3 && lat <= 49.1 && lon >= 9.4 && lon <= 17.2);

/// A stop's street door from the register, or `null`.
const entranceOf = (s) => (Number.isFinite(s.entrance_lat) && Number.isFinite(s.entrance_lon) ? [s.entrance_lat, s.entrance_lon] : null);

/// Where a stop is: its pin on the map, and the street door when that is
/// somewhere else. Two houses are as close as their closest pair.
function walkPoints(s) {
  // Only approximately placed: the pin is the middle of a street or of a
  // district, not a house. Two addresses nobody could find are not next door
  // to each other.
  if (s.location_precision && !s.pinned) return [];
  const out = [];
  if (plausibleForPlz(s.lat, s.lon, s.plz || '')) out.push([s.lat, s.lon]);
  const entrance = entranceOf(s);
  if (!s.pinned && entrance) out.push(entrance);
  return out;
}

/// The open customers that follow `current` in driving order, for as long as
/// each is within reach of it. Stops at the first that is not: a door further
/// down the list means driving somewhere else in between.
function walkOnDoors(r, current) {
  if (current.kind !== 'customer') return [];
  const at = r.stops.findIndex((s) => s.id === current.id);
  if (at < 0) return [];
  const here = walkPoints(current);
  const out = [];
  for (const stop of r.stops.slice(at + 1)) {
    // Not driven to at all, or already answered for: neither is in the way,
    // and neither is carried.
    if (stop.excluded || stop.outcome) continue;
    if (stop.kind !== 'customer') break;
    let metres = null;
    for (const p of here) for (const q of walkPoints(stop)) {
      const d = metresBetween(p[0], p[1], q[0], q[1]);
      if (metres == null || d < metres) metres = d;
    }
    if (metres == null || metres > WALK_ON_REACH_M) break;
    out.push({
      name: stop.kunde || 'Stopp',
      paket: (displayPaket(stop, r) || '').trim(),
      // "60 m", or "hier" for the same house.
      distance: metres < 15 ? 'hier' : `${Math.round(metres / 10) * 10} m`,
    });
  }
  return out;
}

/// Puts a stop's street on the clipboard -- street and number only, which is
/// what gets pasted into a navigation app or a message to the office.
async function copyAddress(stopId, button) {
  const text = String(getStop(stopId)?.strasse || '').trim();
  if (!text) return;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (_) {
    // No clipboard API here (an old browser, or a page not served securely).
    const area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(area);
    area.select();
    try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
    area.remove();
  }
  if (!ok) { toast('Die Adresse konnte nicht kopiert werden.', 'error'); return; }
  if (!button || !button.isConnected) { toast('Adresse kopiert ✓', 'success'); return; }
  button.classList.add('copied');
  button.innerHTML = ICONS.check;
  button.setAttribute('aria-label', 'Adresse kopiert');
  setTimeout(() => {
    if (!button.isConnected) return;
    button.classList.remove('copied');
    button.innerHTML = ICONS.copy;
    button.setAttribute('aria-label', 'Adresse kopieren');
  }, 1500);
}

/// The card for the stop the driver is at.
function nowStopCard(r, stop) {
  const meta = stopKindMeta(stop);
  // The number the map's pin wears: its place among the doors the van drives.
  const number = meta ? null : r.stops.filter((s) => s.kind === 'customer' && !skipsDoor(s)).findIndex((s) => s.id === stop.id) + 1;
  const sameDoor = meta ? 1 : (sameDoorGroups(r.stops).get(stop.id)?.length || 1);
  const precision = stop.location_precision === 'street' ? 'Genaue Hausnummer nicht gefunden — Position ist nur ungefähr.'
    : stop.location_precision === 'district' ? 'Straße nicht gefunden — nur Bezirksmitte. Position bitte prüfen.' : '';
  const walkOn = walkOnDoors(r, stop);
  // Four, then a count: past that it is a list to read, and the list is one
  // tab to the left.
  const carry = walkOn.length ? `
      <div class="now-carry">
        <p class="now-carry-title"><span class="flex">${ICONS.walk}</span>Gleich mitnehmen</p>
        ${walkOn.slice(0, 4).map((d) => `<p><b>${escapeHtml(d.name)}</b>&nbsp; <span>${escapeHtml([d.distance, d.paket].filter(Boolean).join(' · '))}</span></p>`).join('')}
        ${walkOn.length > 4 ? `<p><span>und ${walkOn.length - 4} weitere</span></p>` : ''}
      </div>` : '';
  // The ellipsis: the two answers that are not the plain tick and the way
  // into the editor for a customer, the editor for Ziel. The Lager has
  // nothing to edit.
  const more = !meta
    ? `<button onclick="openStopMenu(getStop(${stop.id}))" aria-label="Mehr" title="Mehr" class="tap-target press-fade w-9 h-9 shrink-0 flex items-center justify-center text-black/60 text-lg">${ICONS.kebab}</button>`
    : stop.kind === 'end' || stop.kind === 'pause'
    ? `<button onclick="openFixedStopSheet(getStop(${stop.id}))" aria-label="Bearbeiten" title="Bearbeiten" class="tap-target press-fade w-9 h-9 shrink-0 flex items-center justify-center text-black/60 text-lg">${ICONS.kebab}</button>`
    : '';
  return `
    <div class="now-card" data-now-stop="${stop.id}">
      <div class="flex items-start gap-3">
        <span class="now-badge" aria-hidden="true">${meta ? meta.icon : number}</span>
        <div class="flex-1 min-w-0">
          <h2 class="now-name">${escapeHtml(meta ? meta.title : stop.kunde)}</h2>
          <div class="flex items-center gap-2">
            <p class="now-address flex-1 min-w-0">${escapeHtml(stopAddress(stop))}</p>
            ${(stop.strasse || '').trim() ? `<button type="button" onclick="copyAddress(${stop.id}, this)" aria-label="Adresse kopieren" title="Adresse kopieren" class="copy-btn press-fade">${ICONS.copy}</button>` : ''}
          </div>
          ${sameDoor > 1 ? `<p class="now-fact warn"><span>${ICONS.people}</span><span>${sameDoor} an dieser Tür</span></p>` : ''}
        </div>
        ${more}
      </div>
      ${displayPaket(stop, r) && !meta ? `<p class="now-fact"><span>${ICONS.box}</span><span style="font-weight:600">${escapeHtml(displayPaket(stop, r))}</span></p>` : ''}
      ${stop.notiz && !meta ? `<p class="now-fact"><span>${ICONS.note}</span><span>${escapeHtml(stop.notiz)}</span></p>` : ''}
      ${precision ? `<p class="now-fact warn"><span>${ICONS.warning}</span><span>${precision}</span></p>` : ''}
      ${carry}
      <div style="margin-top: 1.25rem">
        <a href="${navUrl(stop)}" target="_blank" rel="noopener" onclick="noteDeparture(${stop.id})" class="press-98 wide-btn accent">${ICONS.arrowTurn} Navigation</a>
        <button onclick="settleFromNow(${stop.id})" class="press-98 wide-btn done">${ICONS.check} ${meta ? 'Erledigt' : 'Geliefert'}</button>
        ${!meta && dialOf(stop.telefon) ? `<a href="tel:${dialOf(stop.telefon)}" class="press-98 wide-btn quiet">${ICONS.phone} Anrufen</a>` : ''}
        ${meta ? '' : phonesInNote(stop.notiz, stop.telefon).map((ph) => `<a href="tel:${ph.dial}" class="press-98 wide-btn quiet">${ICONS.phone} ${escapeHtml(ph.display)} anrufen</a>`).join('')}
      </div>
      <p class="eta-line" data-eta-finish style="margin-top:.875rem; font-size:13px"></p>
    </div>`;
}

/// The big button. The same tick as the list's, and then the banner that
/// takes it back — the card has already moved on to the next door by the
/// time a slip of the thumb is noticed.
function settleFromNow(stopId) {
  setOutcome(stopId, 'delivered');
}

// ---------------------------------------------------------------------
// The undo banner. Shown for a few seconds after an answer given on Jetzt,
// where the stop it was given for is gone from the screen the moment it is
// given. Held by stop id, not by the stop: the tour behind it may have been
// planned again in between, and an id still means the same door afterwards.
// Lives outside #app, like the toasts, so a re-render does not take it down.
// ---------------------------------------------------------------------
const UNDO_MS = 6000;
let undoTimer = null;

function offerUndo(stop, outcome) {
  const name = stopKindMeta(stop)?.title || stop.kunde || 'Stopp';
  const label = stop.kind !== 'customer' ? 'erledigt' : OUTCOMES[outcome]?.short || '';
  let el = document.getElementById('undo-banner');
  if (!el) {
    el = document.createElement('div');
    el.id = 'undo-banner';
    el.setAttribute('role', 'status');
    document.body.appendChild(el);
  }
  el.innerHTML = `<div>
    <span class="flex" style="color:${handedOver(outcome) ? '#34C759' : '#FF9500'}">${handedOver(outcome) ? ICONS.checkCircle : outcome === 'notHome' ? ICONS.bellOff : ICONS.box}</span>
    <span class="who"><span>„${escapeHtml(name)}“</span><span>&nbsp;— ${escapeHtml(label)}</span></span>
    <button type="button" onclick="takeBackOutcome(${stop.id})">Rückgängig</button>
  </div>`;
  clearTimeout(undoTimer);
  undoTimer = setTimeout(dismissUndo, UNDO_MS);
}

function dismissUndo() {
  clearTimeout(undoTimer);
  undoTimer = null;
  document.getElementById('undo-banner')?.remove();
}

function takeBackOutcome(stopId) {
  dismissUndo();
  // Nothing to take back for a stop this route no longer has — deleted from
  // another screen inside the banner's few seconds.
  if (state.currentRoute?.stops.some((s) => s.id === stopId)) setOutcome(stopId, null);
}

// ---------------------------------------------------------------------
// Keeps the screen on while a tour has doors left. A phone on a dashboard
// mount that dims between two stops has to be unlocked with a hand that is
// holding a meal. Released the moment there is nothing left to drive to, and
// re-requested on return: the browser drops a wake lock whenever the page is
// hidden. Not every browser has one; where it is missing this does nothing.
// ---------------------------------------------------------------------
let wakeLock = null;
let wakeLockPending = false;

function syncWakeLock() {
  if (!('wakeLock' in navigator)) return;
  const r = state.currentRoute;
  const wanted = document.visibilityState === 'visible'
    && r?.status === 'active' && r.stops.some(isOpenStop);
  if (wanted && !wakeLock && !wakeLockPending) {
    wakeLockPending = true;
    navigator.wakeLock.request('screen')
      .then((lock) => {
        wakeLock = lock;
        lock.addEventListener('release', () => { if (wakeLock === lock) wakeLock = null; });
      })
      .catch(() => { /* refused (battery saver, no gesture yet) — the screen dims as it always did */ })
      .finally(() => { wakeLockPending = false; });
  } else if (!wanted && wakeLock) {
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }
}
document.addEventListener('visibilitychange', syncWakeLock);

// "3.4 km · 8 min bis zum nächsten Stopp" under a stop row. Both numbers
// are written together by the optimizer and are null together on the last
// stop — but they arrive from the network, so each is checked on its own
// rather than letting one missing value render "NaN min".
function legLabel(stop, extraClass = 'mt-1') {
  if (stop.next_leg_km == null || stop.next_leg_min == null) return '';
  return `<p class="text-[12px] text-black/55 ${extraClass}">${fmtKm(stop.next_leg_km)} · ${Math.round(stop.next_leg_min)} min bis zum nächsten Stopp</p>`;
}

function stopKindMeta(stop) {
  if (stop.kind === 'start') return { icon: ICONS.house, title: 'Start', subtitle: `${stop.strasse}, ${stop.plz}` };
  if (stop.kind === 'via') return { icon: ICONS.box, title: 'Lager', subtitle: `${stop.strasse}, ${stop.plz}` };
  if (stop.kind === 'end') return { icon: ICONS.flag, title: 'Ziel', subtitle: `${stop.strasse}, ${stop.plz}` };
  if (stop.kind === 'pause') return { icon: ICONS.cup, title: 'Pause', subtitle: `${stop.strasse}, ${stop.plz}` };
  return null;
}

// How many customer stops on the route share each exact address — e.g. one
// customer ordering two different menus, pasted in as two separate stop
// entries instead of combined into one stop's Paket field (this is common:
// the source list a route gets built from routinely has the same name and
// address twice in a row for exactly this reason). Two rows in a
// scrollable list read as two unrelated deliveries; a driver who reads
// one, delivers it, and walks back to the car has no signal there's a
// second package waiting at the exact door they just left. Keyed with the
// same `addrKey` the "already in this route" duplicate check uses when
// adding a stop by hand, so both stay consistent with each other.
//
// Memoized per `stops` array — `toggleDelivered`'s optimistic update, its
// server-confirm reconciliation, and its error-revert path can each call
// this (via `applyDeliveredDomPatch`) for the *same* route within one tap,
// and the result can't have changed between them (nothing here depends on
// `delivered`, only on which addresses exist). `state.currentRoute.stops`
// is a fresh array every time the route is replaced wholesale from a server
// response (see `applyRouteUpdate`/`adoptRoute`), never mutated in place, so
// keying a `WeakMap` on the array itself invalidates the cache for free
// exactly when it should, with nothing to remember to clear by hand.
const dupCountsCache = new WeakMap();

// Groups the route's customer stops by *door*, returning a Map from each
// stop's id to the ids of every stop that shares that door (itself
// included).
//
// Two things make two stops one door, and both are needed:
//   - the same normalized address text (see `addrKey`), which catches the
//     ordinary case of one address entered twice; and
//   - the same resolved coordinate, when both stops were located exactly.
//     Vienna's register reconciles wordings no text normalizer could —
//     "Gentzgasse 129/1" and "Gentzgasse 129 Stiege 1" resolve to one point
//     — and the point is the closest thing this app has to "the driver will
//     be standing in the same place". Approximately located stops are left
//     out of that half of the test on purpose: several unrelated addresses
//     can share one district-centre fallback, and calling those one door
//     would cry wolf.
// Either relation can bridge a group, so the two are unioned rather than
// applied in sequence.
function sameDoorGroups(stops) {
  const cached = dupCountsCache.get(stops);
  if (cached) return cached;

  // Not a door the van does not go to: "2 an dieser Adresse" is two meals
  // carried up, and one of them going back to the Lager is not one.
  const customers = stops.filter((s) => s.kind === 'customer' && !skipsDoor(s));
  // Union-find. A route caps out around a hundred stops so the cost is
  // irrelevant, but the correctness isn't: "put each stop in the first
  // group it matches" gets the wrong answer when a third stop is the one
  // that reveals two earlier groups are the same door.
  const parent = new Map(customers.map((s) => [s.id, s.id]));
  const find = (id) => {
    let root = id;
    while (parent.get(root) !== root) root = parent.get(root);
    while (parent.get(id) !== root) { const next = parent.get(id); parent.set(id, root); id = next; }
    return root;
  };
  const union = (a, b) => {
    const ra = find(a), rb = find(b);
    if (ra !== rb) parent.set(ra, rb);
  };
  const firstBy = new Map();
  const link = (key, id) => {
    if (firstBy.has(key)) union(firstBy.get(key), id);
    else firstBy.set(key, id);
  };
  for (const s of customers) {
    link('a:' + addrKey(s.strasse, s.plz), s.id);
    if (!s.location_precision) link('p:' + pointKey(s), s.id);
  }

  const byRoot = new Map();
  for (const s of customers) {
    const root = find(s.id);
    if (!byRoot.has(root)) byRoot.set(root, []);
    byRoot.get(root).push(s.id);
  }
  const groups = new Map();
  for (const s of customers) groups.set(s.id, byRoot.get(find(s.id)));

  dupCountsCache.set(stops, groups);
  return groups;
}

// One step of the list's staggered entrance, in milliseconds, and how many
// steps deep the stagger keeps counting before every remaining row shares
// the last delay.
//
// Uncapped, this was `index * 25ms` all the way down: a 30-stop route spent
// three quarters of a second trickling its list in, and the driver watched
// it happen every single time they opened the route. The cap keeps the
// cascade — it reads as the list arriving rather than snapping in — while
// bounding how long it can possibly run at ~200 ms regardless of route
// length. Eight is about one phone screen of rows; past that the stagger is
// animating rows nobody has scrolled to yet.
const ROW_ANIM_STEP_MS = 25;
const ROW_ANIM_MAX_STEPS = 8;

/// The `class`/`style` fragments for a row's entrance animation. `null`
/// means "no animation" — a DOM-patched or filtered row, see
/// `renderCustomerRow`.
function rowAnimAttrs(animIndex) {
  if (animIndex === null) return { cls: '', style: '' };
  const delay = Math.min(animIndex, ROW_ANIM_MAX_STEPS) * ROW_ANIM_STEP_MS;
  return { cls: 'row-enter ', style: ` style="animation-delay:${delay}ms"` };
}

// A Start/Lager/Ziel row. Carries the same press handlers a customer row
// does, so the gesture that opens "this stop" is one gesture everywhere —
// it just lands on `openFixedStopSheet` instead (see `openStopSheet`).
// A skipped stop is dimmed and labelled rather than hidden: the row is the
// only way back to the switch that skipped it.
function renderFixedRow(s, meta, animIndex = null, isNext = false) {
  const url = navUrl(s);
  const skipped = !!s.excluded;
  const done = !!s.outcome;
  const { cls: animClass, style: animStyle } = rowAnimAttrs(animIndex);
  // Lager and Ziel are ticked off like a door. Start is not, and neither is
  // one this tour skips.
  const tick = isCheckpoint(s)
    ? `<button onclick="toggleDelivered(${s.id}, ${!done})" aria-pressed="${done}" aria-label="${done ? `${meta.title} wieder öffnen` : `${meta.title} abhaken`}" title="${done ? 'Wieder öffnen' : 'Abhaken'}" class="tap-target press-95 shrink-0 w-10 h-10 rounded-full flex items-center justify-center text-[20px] shadow-sm ${done ? 'bg-success text-white' : 'bg-white border-2 border-black/45 text-black/40'}">${done ? ICONS.checkCircleFill : ICONS.circle}</button>`
    : '';

  return `
    <div data-stop-row="${s.id}" ${isNext ? 'data-next-stop' : ''} class="${animClass}flex items-start gap-3 px-4 py-3.5 ${isNext ? 'bg-brand-50/60' : ''}"${animStyle}>
      <span class="w-9 h-9 shrink-0 rounded-full bg-black/5 flex items-center justify-center text-base ${skipped ? 'text-black/25' : 'text-black/60'}">${meta.icon}</span>
      <div class="flex-1 min-w-0 pt-0.5 select-none cursor-pointer rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"
        role="button" tabindex="0"
        aria-label="${escapeAttr(`${meta.title}, ${meta.subtitle} — ändern`)}"
        onclick="stopRowClick(event, ${s.id})"
        ontouchstart="stopLongPressStart(event, ${s.id})"
        ontouchend="stopLongPressEnd(event)"
        ontouchcancel="stopLongPressEnd(event)"
        ontouchmove="stopLongPressMove(event)"
        onmousedown="stopLongPressStart(event, ${s.id})"
        onmouseup="stopLongPressEnd(event)"
        onmouseleave="stopLongPressEnd(event)"
        onmousemove="stopLongPressMove(event)"
        onkeydown="stopRowKeydown(event, ${s.id})"
        oncontextmenu="stopLongPressContext(event, ${s.id})">
        <div class="flex items-center gap-1.5 flex-wrap">
          <p class="font-medium ${skipped ? 'text-black/40 line-through' : done ? 'text-black/55 line-through' : ''}">${meta.title}</p>
          ${isNext ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-brand-600 bg-brand-50 px-1.5 py-0.5 rounded">Nächster Stopp</span>` : ''}
          ${skipped ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-black/55 bg-black/[0.07] px-1.5 py-0.5 rounded">${s.kind === 'start' ? 'Ab Standort' : 'Übersprungen'}</span>` : ''}
        </div>
        <p class="text-[13px] ${skipped ? 'text-black/35' : 'text-black/55'}">${escapeHtml(meta.subtitle)}</p>
        ${skipped ? '' : legLabel(s)}
        ${s.kind === 'start' ? '' : `<p class="eta-line" data-eta="${s.id}"></p>`}
      </div>
      <a href="${url}" target="_blank" rel="noopener" onclick="noteDeparture(${s.id})" aria-label="In Maps öffnen" title="In Maps öffnen" class="tap-target press-fade shrink-0 w-9 h-9 rounded-full bg-black/5 flex items-center justify-center ${skipped ? 'text-black/25' : 'text-black/55'}">${ICONS.mapPin}</a>
      ${tick}
    </div>
  `;
}

/// Any row of the stop list. One function, so the full render and the
/// one-row patch after a tick cannot draw the same stop two ways.
function renderStopRow(s, isNext, animIndex, doors) {
  const meta = stopKindMeta(s);
  if (meta) return renderFixedRow(s, meta, animIndex, isNext);
  return renderCustomerRow(s, isNext, animIndex, doors.get(s.id)?.length, stopNumber(s));
}

/// A stop's number: its place among the doors the van drives, which is the
/// number its pin wears on the map and its card wears on Jetzt. A door the
/// van does not go to has none.
function stopNumber(s, r = state.currentRoute) {
  if (!r || skipsDoor(s)) return null;
  let n = 0;
  for (const x of r.stops) {
    if (x.kind !== 'customer' || skipsDoor(x)) continue;
    n++;
    if (x.id === s.id) return n;
  }
  return null;
}

// A single customer row's markup — factored out of renderRouteDetail so
// `applyDeliveredDomPatch` can rebuild exactly one row (or the two rows a
// "next stop" handoff touches) without going through a full list render.
// `animIndex` is only ever non-null from the full-list render path
// (`stopListHtml`); a DOM-patched row never plays the staggered entrance
// animation — it's already on screen, mid-session, and replaying it would be
// the "list just reloaded" flicker this whole patch path exists to avoid.
// Neither does a row in a filtered list, which is rebuilt on every keystroke.
function renderCustomerRow(s, isNext, animIndex = null, duplicateCount = 1, number = null) {
  const url = navUrl(s);
  // "Done" for everything the row dims and stops shouting about: any answer
  // at all, not only a delivery. The strike-through stays a delivery's own —
  // a meal that came back is not crossed off.
  const delivered = !!s.outcome;
  const struck = !!s.delivered;
  const outcomeBadge = s.outcome === 'notHome'
    ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-white bg-warn px-1.5 py-0.5 rounded">Nicht angetroffen</span>`
    : skipsDoor(s)
    ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-black/55 bg-black/5 px-1.5 py-0.5 rounded">${s.outcome === 'toLager' ? 'Ins Lager' : escapeHtml(OUTCOMES[s.outcome]?.short || '')}</span>`
    : s.outcome === 'neighbour'
    ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-black/55 bg-black/5 px-1.5 py-0.5 rounded">Bei Nachbarn</span>`
    : '';
  const tickClass = !delivered ? 'bg-white border-2 border-black/45 text-black/40'
    : struck ? 'bg-success text-white'
    : s.outcome === 'notHome' ? 'bg-warn text-white'
    : 'bg-black/10 text-black/55';
  const tickIcon = !delivered ? ICONS.circle : struck ? ICONS.checkCircleFill : s.outcome === 'notHome' ? ICONS.bellOff : ICONS.box;
  const tickLabel = !delivered ? 'Als geliefert markieren' : struck ? 'Lieferung zurücknehmen' : 'Wieder öffnen';
  const precisionBadge = s.location_precision === 'street'
    ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-warnText bg-warn/10 px-1.5 py-0.5 rounded" title="Genaue Hausnummer nicht gefunden — nächstgelegene bekannte Adresse auf der Straße verwendet.">≈ Hausnummer</span>`
    : s.location_precision === 'district'
    ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-white px-1.5 py-0.5 rounded" style="background:#D70015" title="Adresse nicht gefunden — bitte korrigieren.">Adresse fehlt</span>`
    : '';
  // Loud, solid-fill — not the quieter tinted style the precision badge
  // above uses — on purpose: missing this is the one thing it exists to
  // prevent, a second package at a door the driver has already left.
  const duplicateBadge = duplicateCount > 1
    ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-white bg-warn px-1.5 py-0.5 rounded flex items-center gap-1" title="Insgesamt ${duplicateCount} Stopps an dieser Adresse — alle Pakete mitnehmen."><span class="flex">${ICONS.warning}</span>${duplicateCount}× an dieser Adresse</span>`
    : '';
  const { cls: animClass, style: animStyle } = rowAnimAttrs(animIndex);

  return `
    <div data-stop-row="${s.id}" ${isNext && !delivered ? 'data-next-stop' : ''} class="${animClass}flex items-start gap-2 px-4 py-3.5 ${isNext && !delivered ? 'bg-brand-50/60' : ''}"${animStyle}>
      <div class="flex-1 min-w-0 select-none cursor-pointer rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"
        role="button" tabindex="0"
        aria-label="${escapeAttr(`${s.kunde}, ${s.strasse}, ${s.plz}${s.outcome ? `, ${OUTCOMES[s.outcome]?.short || ''}` : ''} — Aktionen`)}"
        onclick="stopRowClick(event, ${s.id})"
        ontouchstart="stopLongPressStart(event, ${s.id})"
        ontouchend="stopLongPressEnd(event)"
        ontouchcancel="stopLongPressEnd(event)"
        ontouchmove="stopLongPressMove(event)"
        onmousedown="stopLongPressStart(event, ${s.id})"
        onmouseup="stopLongPressEnd(event)"
        onmouseleave="stopLongPressEnd(event)"
        onmousemove="stopLongPressMove(event)"
        onkeydown="stopRowKeydown(event, ${s.id})"
        oncontextmenu="stopLongPressContext(event, ${s.id})">
        <div class="flex items-center gap-1.5 flex-wrap">
          ${isNext && !delivered ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-brand-600 bg-brand-50 px-1.5 py-0.5 rounded">Nächster Stopp</span>` : ''}
          ${outcomeBadge}
          ${duplicateBadge}
          ${precisionBadge}
          ${s.pinned ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-black/55 bg-black/5 px-1.5 py-0.5 rounded" title="Die Position wurde von Hand auf der Karte gesetzt.">Pin von Hand</span>` : ''}
        </div>
        <p class="font-medium ${delivered ? 'text-black/55' : ''}">${number != null ? `<span class="row-num ${delivered ? 'done' : isNext ? 'next' : ''}" aria-hidden="true">${number}</span>` : ''}<span class="${struck ? 'line-through' : ''}">${escapeHtml(s.kunde)}</span></p>
        <p class="text-[13px] ${delivered ? 'text-black/55' : 'text-black/60'}">${escapeHtml(s.strasse)}, ${escapeHtml(s.plz)}</p>
        ${displayPaket(s) ? (() => {
          const qty = isTkTour(state.currentRoute) ? (parcelCount(s) || 1) : paketQty(s.paket);
          // (TK: the parcels to carry up. VM: the pieces in the Paket.)
          const multi = qty > 1 && !delivered;
          return `<p class="inline-flex items-center gap-1 max-w-full text-[12px] ${multi ? 'font-bold' : 'font-medium'} mt-1.5 px-1.5 py-0.5 rounded ${
            delivered ? 'text-black/55 bg-black/5' : multi ? 'text-white bg-brand-600 shadow-sm' : 'text-brand-700 bg-brand-50'
          }">${
            multi
              ? `<span class="shrink-0 w-4 h-4 rounded-full bg-white/25 flex items-center justify-center text-[10px] font-bold">${qty}</span>`
              : `<span class="flex shrink-0">${ICONS.box}</span>`
          }<span class="truncate">${escapeHtml(displayPaket(s))}</span></p>`;
        })() : ''}
        ${s.notiz ? `<p class="inline-flex items-center gap-1 max-w-full text-[12px] italic mt-1 px-1.5 py-0.5 rounded ${delivered ? 'text-black/55 bg-black/5' : 'text-warnText bg-warn/10'}"><span class="flex shrink-0 not-italic">${ICONS.note}</span><span class="truncate">${escapeHtml(s.notiz)}</span></p>` : ''}
        ${skipsDoor(s) ? '' : legLabel(s, 'mt-1.5')}
        <p class="eta-line" data-eta="${s.id}"></p>
      </div>
      <div class="flex flex-col gap-2 shrink-0 mt-0.5">
        <button onclick="toggleDelivered(${s.id}, ${!delivered})" aria-pressed="${delivered}" aria-label="${tickLabel}" title="${tickLabel}" class="tap-target press-95 w-10 h-10 rounded-full flex items-center justify-center text-[20px] shadow-sm ${tickClass}">
          ${tickIcon}
        </button>
        <a href="${url}" target="_blank" rel="noopener" aria-label="In Maps öffnen" title="In Maps öffnen" class="tap-target press-fade w-10 h-10 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center text-[17px] shadow-sm">${ICONS.mapPin}</a>
      </div>
    </div>
  `;
}

// ---------------------------------------------------------------------
// Map engine — OpenFreeMap (tiles.openfreemap.org), a free/open vector-
// tile CDN built on OpenStreetMap data by the creator of OpenMapTiles: no
// API key, no usage cap, no billing account, self-hostable if that's ever
// needed. It ships a complete, professionally-designed style — real street
// labels, house numbers, POIs, building footprints — via MapLibre GL JS.
// Routing/geocoding stay fully server-side against Nominatim/OSRM (see
// src/main.rs); this is only the on-screen visualization. Used by both the
// Karte tab (full-screen) and the pin-drop sheet (small, embedded).
// ---------------------------------------------------------------------
const MAP_STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';
const VIENNA_CENTER = [16.3738, 48.2082]; // [lon, lat]

// ---------------------------------------------------------------------
// Aerial basemap — "which of these buildings is it, and how do I get in".
// A vector street map draws Favoritenstraße 45 as a number next to a grey
// block; the orthophoto shows the driver the actual entrance, the
// courtyard, the driveway and where a van can stop, which is the thing
// they're actually trying to work out on arrival.
//
// Sources, both free (CC-BY 4.0), no API key, no usage cap:
//   - `lb` ("Luftbild") from maps.wien.gv.at — Stadt Wien's own aerial
//     imagery, the same orthophoto the city's public map viewers show,
//     reflown yearly and served down to zoom 21 (~10cm/px). Vienna-only,
//     which is the entire operating area of this app.
//   - `bmaporthofoto30cm` (basemap.at, served from the same host) sits
//     underneath at a deliberately low `maxzoom`: it covers all of
//     Austria, so a driver who pans past the city limits sees imagery
//     instead of an empty grey void, and capping it at zoom 16 means
//     MapLibre stretches a handful of coarse tiles rather than fetching a
//     second full-resolution basemap nobody looks at.
//   - `beschriftung` — Vienna's transparent label overlay (street names,
//     house numbers) painted on top, because an orthophoto with no labels
//     is unnavigable. Tops out at zoom 19 and is overzoomed above that.
//
// Built as a style object here rather than fetched as a style URL: it's
// three raster layers with no glyphs, sprites or symbol layers to load, so
// switching basemaps costs no round-trip at all beyond the tiles.
// ---------------------------------------------------------------------
const AERIAL_ATTRIB_WIEN = '© <a href="https://data.wien.gv.at" target="_blank" rel="noopener">Stadt Wien</a>';
const AERIAL_ATTRIB_AT = '© <a href="https://basemap.at" target="_blank" rel="noopener">basemap.at</a>';

// The WMTS serves 256px tiles and has no `@2x` variant, so on a phone
// (devicePixelRatio 2–3) a tile drawn at its nominal size is upscaled and
// goes soft. Declaring a source's tiles as *half* their real size makes
// MapLibre fetch one zoom level deeper for the same ground area and draw it
// into the same box: same apparent scale, twice the detail — what a `@2x`
// endpoint would have given us.
//
// It also costs FOUR TIMES the tiles, and that bill is only worth paying
// where the tiles are small. Applied to the imagery it made the Luftbild
// crawl in over a mobile connection, one square at a time, because those
// are 8–20 KB JPEGs and a screenful of them is megabytes. Applied to the
// label overlay it costs almost nothing — those are mostly-transparent PNGs
// of a few hundred bytes to a few KB — and the labels were the part that
// actually looked pixelated, since text shows upscaling far more than an
// aerial photo does.
//
// So: labels get the retina treatment, imagery stays native. See the
// sources in `aerialStyle`.
//
// One more condition than "is this a retina screen", because a screen this
// sharp is nearly always attached to a phone on a mobile connection, and
// four times the requests is a very different bargain at the roadside than
// it is on wifi. `Save-Data` is the driver (or their OS) explicitly asking
// for less; `effectiveType` of 2g/3g is the browser reporting that the
// connection cannot carry it. In either case the labels drop to native
// size — slightly softer text, a quarter of the requests — instead of the
// overlay being the thing that makes the Luftbild crawl.
//
// Read once at load rather than per tile: `navigator.connection` is absent
// on the platform this app mostly runs on (Safari), which is why every
// access is optional and the default is the retina path.
function preferRetinaLabels() {
  if (!(typeof devicePixelRatio === 'number' && devicePixelRatio > 1.5)) return false;
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if (!conn) return true;
  if (conn.saveData) return false;
  return !['slow-2g', '2g', '3g'].includes(conn.effectiveType);
}

const RETINA_LABEL_TILE_SIZE = preferRetinaLabels() ? 128 : 256;

// The aerial layers, added *on top of* the vector basemap rather than
// swapped in as a style of their own.
//
// This started out as two styles and a `setStyle` between them, and that is
// what produced the blank map: `setStyle` with a style *object* parses it
// inside an animation frame, so anything that stalls frames — a
// backgrounded tab, a phone throttling a busy page — leaves the map holding
// neither style, with no error to catch. Diffing made it worse, a lost
// WebGL context made it worse again, and every swap also threw away the
// route line and every tile already on screen.
//
// Adding layers to the live style instead has none of those failure modes.
// Switching basemap is three `setLayoutProperty` calls: instant, no
// reload, no re-fetch of tiles already in memory, and the route line and
// markers are never touched because the style they live in never changes.
//
// The vector map is deliberately left *visible underneath* the imagery
// rather than hidden. Aerial JPEGs are opaque, so it costs nothing to look
// at — and it means that if the imagery can't load at all (no signal, the
// city's tile server down, a Vienna gap), the driver sees the street map
// through the hole instead of an empty grey screen. There is no state this
// map can get into where nothing is drawn.
function mountAerialLayers(map) {
  if (map.getSource('wien-lb')) return true;
  const sources = {
    // The two imagery layers are split by zoom so that only ONE of them is
    // ever loading a full screenful of tiles. Loading both at every zoom is
    // what made the Luftbild crawl: two complete sets of 8–20 KB JPEGs for
    // one view, one of them completely hidden behind the other.
    //
    // basemap.at's nationwide orthophoto carries the overview. It covers all
    // of Austria, so there are no holes to fall through at the city limits,
    // and 30 cm is plenty for anything below street level.
    'at-ortho': {
      type: 'raster',
      tiles: ['https://maps.wien.gv.at/basemap/bmaporthofoto30cm/normal/google3857/{z}/{y}/{x}.jpeg'],
      tileSize: 256,
      // Capped where Vienna's own imagery takes over. Above this it is a
      // couple of stretched tiles sitting behind sharper ones, there purely
      // so a gap in the city imagery shows ground rather than nothing.
      maxzoom: AERIAL_DETAIL_ZOOM,
      attribution: AERIAL_ATTRIB_AT,
    },
    // Vienna's own 10 cm imagery, from street level up — where the question
    // stops being "which block" and becomes "which door, and can the van
    // get to it".
    'wien-lb': {
      type: 'raster',
      tiles: ['https://maps.wien.gv.at/wmts/lb/farbe/google3857/{z}/{y}/{x}.jpeg'],
      // Native size: at four times the tiles this was the single slowest
      // thing about the Luftbild, and an aerial photo shows upscaling far
      // less than text does. It runs to zoom 21, so a driver who wants more
      // detail pinches in and gets it natively.
      tileSize: 256,
      minzoom: AERIAL_DETAIL_ZOOM,
      maxzoom: 21,
      attribution: AERIAL_ATTRIB_WIEN,
    },
    'wien-labels': {
      type: 'raster',
      tiles: ['https://maps.wien.gv.at/wmts/beschriftung/normal/google3857/{z}/{y}/{x}.png'],
      // Retina here and nowhere else: these are a few hundred bytes each and
      // text is what actually looked pixelated. See `RETINA_LABEL_TILE_SIZE`.
      tileSize: RETINA_LABEL_TILE_SIZE,
      // No street labels on an overview of the whole route — they would be
      // unreadable at that scale anyway, and it saves a screenful of
      // requests every time the driver zooms out to see where the tour goes.
      minzoom: 13,
