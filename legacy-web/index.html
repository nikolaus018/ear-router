      <span>${all ? 'Alle ausgewählt' : n === 0 ? 'Keine ausgewählt' : `${n} von ${deliveries.length} ausgewählt`}</span>
      <button type="button" onmousedown="event.preventDefault()" onpointerdown="event.preventDefault()" onclick="gourmetPickAll(${!all})">${all ? 'Keine auswählen' : 'Alle auswählen'}</button>
    </div>
    ${shown.length ? `<div class="${GROUP} pick-list">
      ${shown.map((d) => {
        const pos = position.get(d.id);
        return `
        <button type="button" role="checkbox" aria-checked="${!!pos}" onmousedown="event.preventDefault()" onpointerdown="event.preventDefault()" onclick="gourmetTogglePick(${d.id})" class="pick-row ${pos ? 'on' : ''}">
          <span class="pick-num ${pos ? 'on' : ''}">${pos || ''}</span>
          <span class="flex-1 min-w-0"><span class="block font-medium truncate">${escapeHtml(d.kunde || 'Ohne Namen')}</span><span class="block text-[13px] text-black/55 truncate">${escapeHtml([d.strasse, d.plz].filter(Boolean).join(', ') || 'Keine Adresse')}</span></span>
        </button>`;
      }).join('')}
    </div>` : `<p class="now-caption" style="text-align:center; padding:1.5rem 0">Keine Treffer.</p>`}`;
  actions.innerHTML = `
    <button type="button" onclick="loadGourmetEntries()" ${n ? '' : 'disabled'} class="press-98 wide-btn accent">Weiter mit ${n === 1 ? '1 Stopp' : `${n} Stopps`}</button>
    <button type="button" onclick="showGourmetTours()" class="press-98 wide-btn quiet">Zurück</button>`;
}

function gourmetTogglePick(id) {
  // The list is redrawn below; the sheet must not jump back to its top.
  const sheetScroller = () => document.querySelector('[data-pick-list]');
  const top = sheetScroller()?.scrollTop;
  if (gourmet.picked.has(id)) gourmet.picked.delete(id); else gourmet.picked.add(id);
  paintPickList();
  const scroller = sheetScroller();
  if (scroller && top != null) scroller.scrollTop = top;
  if (navigator.vibrate) navigator.vibrate(8);
}

function gourmetPickAll(on) {
  // "Alle" puts the rest behind what is already picked, in the portal's
  // order — it must not throw away an order somebody has just tapped out.
  if (on) for (const d of gourmet.deliveries) gourmet.picked.add(d.id);
  else gourmet.picked = new Set();
  paintPickList();
}

/// Step three and a half: fetch what the picked deliveries actually are —
/// the parcels, the notes, the phone numbers — and show them for checking.
/// Nothing touches a tour yet.
async function loadGourmetEntries() {
  const { tour, date, picked, deliveries } = gourmet;
  if (!tour || !picked?.size) return;
  const n = picked.size;
  gourmetBody(sheetBusy(`${n === 1 ? '1 Stopp wird' : `${n} Stopps werden`} geholt …`), escapeHtml(tour.name));
  try {
    // Always the ids, even when everything is picked: their order is the
    // order Prüfen is read in.
    const body = { tour_id: tour.id, date, delivery_ids: [...picked] };
    const { entries } = await api('/portal/entries', { method: 'POST', body: JSON.stringify(body), timeoutMs: 3 * 60 * 1000 });
    if (gourmet.tour?.id !== tour.id) return;
    gourmet.entries = entries.map((e) => ({
      kunde: e.kunde || '', strasse: e.strasse || '', plz: e.plz || '', paket: e.paket || '', notiz: e.notiz || '',
      telefon: e.telefon || '', paket_count: e.paket_count ?? null,
    }));
    gourmet.loaded = 0;
    paintReview();
  } catch (err) {
    gourmetBody(sheetError(err.message, 'loadGourmetEntries()') + `<button type="button" onclick="paintGourmetDeliveries()" class="press-98 wide-btn quiet">Zurück</button>`, escapeHtml(tour.name));
  }
}

// ---------------------------------------------------------------------
// Prüfen — the list, looked over before it lands.
//
// Every stop as the portal has it, one row each: who, where, what is in the
// parcels, the note. A row can be corrected (tap it) or taken out (the ×).
// A row that could not become a stop says why, in orange, and is left out
// until it is fixed. Only "Übernehmen" looks the addresses up and changes
// the tour — and an address that is then not found stays right here, marked,
// to be corrected and tried again, instead of being lost in a summary.
// ---------------------------------------------------------------------
/// Why this entry cannot become a stop as it stands, or `null`.
function reviewProblem(e) {
  if (!e.kunde.trim()) return 'Kein Name';
  if (!e.strasse.trim()) return 'Keine Straße';
  if (!e.plz.trim()) return 'Keine Postleitzahl';
  if (!/^[1-9]\d{3}$/.test(e.plz.trim())) return `${e.plz} ist keine gültige Postleitzahl`;
  return e.failed || null;
}

function paintReview() {
  const { entries, tour } = gourmet;
  if (!entries) return;
  const problems = entries.filter(reviewProblem).length;
  const ready = entries.length - entries.filter((e) => reviewProblem(e) && !e.failed).length;
  const count = entries.length === 1 ? '1 Eintrag' : `${entries.length} Einträge`;
  const tk = tour.name.trim().toLowerCase().startsWith('tk');
  const row = (e, i) => {
    const problem = reviewProblem(e);
    const n = tk ? parcelCount(e) : null;
    const paket = tk ? (n == null ? '' : n === 1 ? '1 Paket' : `${n} Pakete`) : e.paket;
    return `
      <div class="review-row">
        <button type="button" onclick="editReviewEntry(${i})" class="review-main">
          <span class="block font-medium">${escapeHtml(e.kunde || 'Ohne Namen')}</span>
          <span class="block text-[13px] text-black/55">${escapeHtml([e.strasse, e.plz].filter(Boolean).join(', ') || 'Keine Adresse')}</span>
          ${paket ? `<span class="review-fact"><span>${ICONS.box}</span><span>${escapeHtml(paket)}</span></span>` : ''}
          ${e.notiz ? `<span class="review-fact"><span>${ICONS.note}</span><span>${escapeHtml(e.notiz)}</span></span>` : ''}
          ${problem ? `<span class="review-fact warn"><span>${ICONS.warning}</span><span>${escapeHtml(problem)}</span></span>` : ''}
        </button>
        <button type="button" onclick="removeReviewEntry(${i})" aria-label="${escapeAttr(`${e.kunde || 'Eintrag'} entfernen`)}" title="Entfernen" class="review-x">${ICONS.close}</button>
      </div>`;
  };
  gourmetBody(`
    ${gourmet.loaded ? `<div class="sheet-note" style="background:rgba(52,199,89,.14);color:#1B6B32"><span style="color:#248A3D">${ICONS.checkCircle}</span><span>${gourmet.loaded === 1 ? '1 Stopp ist' : `${gourmet.loaded} Stopps sind`} schon in der Tour. Die folgenden fehlen noch.</span></div>` : ''}
    <p class="sheet-lead">${entries.length
      ? (problems
          ? 'Orange markierte Einträge antippen und korrigieren — oder mit dem × weglassen.'
          : 'Kurz durchsehen. Antippen zum Korrigieren, × zum Weglassen. Erst „Übernehmen“ ändert die Tour.')
      : 'Alle Einträge wurden entfernt.'}</p>
    ${entries.length ? `
      <p class="now-caption" style="padding:0 .25rem .5rem">${count}${problems ? ` · ${problems === 1 ? '1 Warnung' : `${problems} Warnungen`}` : ''}</p>
      <div class="${GROUP}">${entries.map(row).join('')}</div>` : ''}
    <div class="sheet-actions">
      <button type="button" onclick="applyReview()" ${ready ? '' : 'disabled'} class="press-98 wide-btn accent">${ready === 1 ? '1 Stopp übernehmen' : `${ready} Stopps übernehmen`}</button>
      <button type="button" onclick="leaveReview()" class="press-98 wide-btn quiet">${gourmet.loaded ? 'Fertig' : 'Zurück'}</button>
    </div>
  `, 'Prüfen');
}

function removeReviewEntry(i) {
  const top = document.querySelector('.sheet-panel > .overflow-y-auto')?.scrollTop;
  gourmet.entries.splice(i, 1);
  paintReview();
  const scroller = document.querySelector('.sheet-panel > .overflow-y-auto');
  if (scroller && top != null) scroller.scrollTop = top;
}

/// Back out of Prüfen: to the stop picker before anything was loaded, and
/// to the tour itself once part of the list is on it.
function leaveReview() {
  if (gourmet.loaded) { closeSheet(); return; }
  paintGourmetDeliveries();
}

function editReviewEntry(i, message = '') {
  const e = gourmet.entries[i];
  if (!e) return;
  gourmetBody(`
    ${message ? `<div class="sheet-note warn"><span>${ICONS.warning}</span><span>${escapeHtml(message)}</span></div>` : (e.failed ? `<div class="sheet-note warn"><span>${ICONS.warning}</span><span>${escapeHtml(e.failed)}</span></div>` : '')}
    <form id="review-form" novalidate class="space-y-3 pb-2">
      <div><label class="${LABEL}" for="rv-kunde">Kunde</label><input id="rv-kunde" name="kunde" autocomplete="off" maxlength="${LIMITS.kunde}" value="${escapeAttr(e.kunde)}" class="${FIELD}" /></div>
      <div><label class="${LABEL}" for="rv-strasse">Straße &amp; Hausnummer</label><input id="rv-strasse" name="strasse" autocomplete="off" maxlength="${LIMITS.strasse}" value="${escapeAttr(e.strasse)}" class="${FIELD}" /></div>
      <div><label class="${LABEL}" for="rv-plz">Postleitzahl</label><input id="rv-plz" name="plz" inputmode="numeric" maxlength="4" autocomplete="off" value="${escapeAttr(e.plz)}" class="${FIELD}" /></div>
      <div><label class="${LABEL}" for="rv-paket">Paket</label><input id="rv-paket" name="paket" autocomplete="off" maxlength="${LIMITS.paket}" value="${escapeAttr(e.paket)}" class="${FIELD}" /></div>
      <div><label class="${LABEL}" for="rv-notiz">Notiz</label><textarea id="rv-notiz" name="notiz" rows="2" maxlength="${LIMITS.notiz}" class="${FIELD} resize-none">${escapeHtml(e.notiz)}</textarea></div>
      <div><label class="${LABEL}" for="rv-telefon">Telefon</label><input id="rv-telefon" name="telefon" type="tel" inputmode="tel" autocomplete="off" maxlength="40" value="${escapeAttr(e.telefon)}" class="${FIELD}" /></div>
      <div style="padding-top:.5rem">
        <button type="submit" class="press-98 wide-btn accent">Speichern</button>
        <button type="button" onclick="paintReview()" class="press-98 wide-btn quiet">Abbrechen</button>
      </div>
    </form>
  `, 'Eintrag korrigieren');
  const form = document.getElementById('review-form');
  form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const next = { ...e };
    for (const k of ['kunde', 'strasse', 'plz', 'paket', 'notiz', 'telefon']) next[k] = form[k].value.trim();
    // A corrected address gets a fresh try; the old verdict was about the old one.
    if (next.strasse !== e.strasse || next.plz !== e.plz) delete next.failed;
    gourmet.entries[i] = next;
    paintReview();
  });
}

/// Übernehmen. The server looks every address up and puts the tour in
/// driving order before it answers, which takes about a minute for a full
/// round — said on screen, so the wait is not mistaken for a hang.
async function applyReview() {
  const { tour, date, entries } = gourmet;
  if (!tour || !entries || importController) return;
  const sending = entries.filter((e) => !reviewProblem(e) || e.failed);
  const held = entries.filter((e) => reviewProblem(e) && !e.failed);
  if (!sending.length) return;
  const n = sending.length;
  gourmetBody(`
    ${sheetBusy(`${n === 1 ? '1 Stopp wird' : `${n} Stopps werden`} übernommen …`)}
    <p class="sheet-lead" style="text-align:center">Adressen werden gesucht und die Tour wird sortiert. Das dauert etwa eine Minute — bitte die App offen lassen.</p>
    <button type="button" onclick="importController?.abort()" class="press-98 wide-btn quiet">Abbrechen</button>
  `, escapeHtml(tour.name));
  importController = new AbortController();
  const seq = nextSeq();
  try {
    const body = {
      tour_name: tour.name, date, route_id: gourmet.routeId,
      entries: sending.map(({ failed, ...e }) => e),
    };
    const result = await api('/portal/import', { method: 'POST', body: JSON.stringify(body), timeoutMs: 8 * 60 * 1000, signal: importController.signal });
    importController = null;
    // From here on the tour exists: a second "Übernehmen" adds to it.
    gourmet.routeId = result.id;
    adoptRoute(seq, result);
    state.tab = 'routes';
    state.detailOrigin = 'routes';
    resetStopFilter();
    render();
    if (navigator.vibrate) navigator.vibrate([12, 40, 12]);

    // What did not make it stays on the list, each with its reason.
    const key = (x) => `${(x.kunde || '').trim()}|${(x.strasse || '').trim()}|${(x.plz || '').trim()}`;
    const notFound = new Set((result.geocode_failures || []).map(key));
    const invalid = new Map((result.validation_failures || []).map((v) => [v.label, v.reason]));
    const left = sending.filter((e) => notFound.has(key(e)) || invalid.has(e.kunde.trim()))
      .map((e) => ({ ...e, failed: invalid.get(e.kunde.trim()) || 'Adresse nicht gefunden — antippen und Straße, Hausnummer und Postleitzahl korrigieren. Stimmt sie und wird trotzdem nicht gefunden: weglassen und danach mit + hinzufügen, dort lässt sich der Pin von Hand setzen.' }));
    gourmet.loaded = (gourmet.loaded || 0) + (n - left.length);
    gourmet.entries = [...left, ...held];
    if (gourmet.entries.length) {
      paintReview();
      return;
    }
    closeSheet();
    showImportResult(result, gourmet.loaded);
  } catch (err) {
    importController = null;
    if (err.code === 'aborted') { paintReview(); toast('Übernehmen abgebrochen.', 'info'); }
    else gourmetBody(sheetError(err.message, 'applyReview()') + `<button type="button" onclick="paintReview()" class="press-98 wide-btn quiet">Zurück zur Liste</button>`, escapeHtml(tour.name));
  } finally {
    // A new version of the app may have arrived while this was running and
    // been made to wait — see the reload listener near the bottom.
    reloadForUpdateIfPending();
  }
}

/// What a load did, in the words of somebody who has to act on it: how many
/// stops are there, and which ones need a look before setting off.
function showImportResult(result, loaded) {
  const rough = result.approximate || [];
  if (!rough.length) {
    toast(`${loaded === 1 ? '1 Stopp' : `${loaded} Stopps`} übernommen ✓`, 'success');
    return;
  }
  const row = (x) => `<div class="px-4 py-3"><p class="font-medium">${escapeHtml(x.kunde)}</p><p class="text-[13px] text-black/55">${escapeHtml([x.strasse, x.plz].filter(Boolean).join(', '))}</p></div>`;
  renderSheetShell(`
    <h2 class="sheet-title">${loaded === 1 ? '1 Stopp übernommen' : `${loaded} Stopps übernommen`}</h2>
    <p class="sheet-lead"><b>${rough.length === 1 ? 'Bei einem Stopp' : `Bei ${rough.length} Stopps`} ist die Position nur ungefähr.</b> Sie sind in der Liste orange markiert — Stopp antippen, „Bearbeiten“, dann den Pin auf das richtige Haus setzen.</p>
    <div class="${GROUP} mb-4">${rough.map(row).join('')}</div>
    <div class="pb-2"><button type="button" onclick="closeSheet()" class="press-98 wide-btn accent">Verstanden</button></div>
  `, { label: 'Ergebnis' });
}

// ---------------------------------------------------------------------
// Ladeliste — the pre-departure packing check.
//
// The stop list answers "where am I going". It does not answer the question
// a driver actually has standing at an open boot: did the right number of
// the right things come out of the kitchen. Reading that off 25 individual
// rows means counting the same menu name over and over and losing the
// count halfway down.
//
// So every stop's `paket` is summed across the route into one line per
// distinct item ("5× TGM7"), each one tickable. That field has always been
// free text, so the parsing is deliberately forgiving: one entry may hold
// several items separated by commas, semicolons or " + ", and each may
// carry a leading count ("2x TGM7", "2 Menüs") or none at all. Anything it
// can't read a number off stays whole and counts as one — a label that
// looks odd is a great deal better than a quantity that is quietly wrong,
// because the whole point of this screen is that the number can be trusted.
// ---------------------------------------------------------------------

// Ticks live only in this tab's memory, keyed by route. "Is the right stuff
// in the van" is a fact about this morning's loading, not a property of the
// route worth storing on the server — and a checklist that came back
// already ticked tomorrow morning would be worse than no checklist at all.
// Kept across sheet opens (closing it to glance at a stop has not unloaded
// the van), gone on reload.
//
// Persisted, because the moment this list is used is the moment it is most
// likely to be destroyed. A driver ticks it off at the depot with the van
// door open, one package at a time, over several minutes — and in that
// window this app will happily reload itself out from under them: a deploy
// landing mid-load triggers the `controllerchange` reload at the bottom of
// this file, and iOS is free to evict a backgrounded PWA whenever it wants
// the memory. An in-memory Map loses every tick to either, silently, with
// the van half loaded and no way to tell which half.
const LADELISTE_KEY = 'ear_ladeliste';

// How many routes' worth of ticks are kept. Ticks belong to a shift, not to
// a permanent record, and a driver only ever has one or two routes in play
// — this is purely a bound on a store that would otherwise grow for the
// life of the installation. Trimmed oldest-first by insertion order, which
// for this is the same as least-recently-used: a route is re-inserted at
// the end every time its ticks are written.
const LADELISTE_MAX_ROUTES = 20;

function loadLadelisteChecked() {
  const map = new Map();
  let raw;
  try { raw = localStorage.getItem(LADELISTE_KEY); } catch (_) { return map; }
  if (!raw) return map;
  try {
    const parsed = JSON.parse(raw);
    // Anything that isn't the shape this writes is treated as absent rather
    // than allowed to throw: the alternative is a corrupt storage value
    // taking down the whole module's evaluation, and with it the app.
    if (!parsed || typeof parsed !== 'object') return map;
    for (const [id, keys] of Object.entries(parsed)) {
      const routeId = Number(id);
      if (!Number.isInteger(routeId) || !Array.isArray(keys)) continue;
      map.set(routeId, new Set(keys.filter((k) => typeof k === 'string')));
    }
  } catch (_) { /* unparseable — start clean rather than fail */ }
  return map;
}

function saveLadelisteChecked() {
  // Trim before writing, so the stored object and the in-memory one never
  // disagree about what exists.
  while (ladelisteChecked.size > LADELISTE_MAX_ROUTES) {
    ladelisteChecked.delete(ladelisteChecked.keys().next().value);
  }
  const out = {};
  for (const [routeId, keys] of ladelisteChecked) {
    // An empty set is "nothing ticked", which is the default — no reason to
    // store it, and dropping it keeps the entry count meaningful.
    if (keys.size) out[routeId] = Array.from(keys);
  }
  try { localStorage.setItem(LADELISTE_KEY, JSON.stringify(out)); } catch (_) { /* private-browsing storage lockout, or quota */ }
}

const ladelisteChecked = loadLadelisteChecked();

// The exact `items` array `renderLadeliste` last built the sheet's rows
// from. `toggleLadelisteItem` reads from *this*, not a freshly recomputed
// `ladelisteItems(state.currentRoute)`, on purpose: `render()` never
// touches `#modal-root`, so the sheet's DOM (and the index baked into
// every row's `onclick`) stays exactly as painted even if `state.currentRoute`
// is replaced or edited in the background while the sheet is open (a
// `refreshOnResume()` after the driver backgrounded the app, most
// realistically). Recomputing fresh there would let a route change mid-view
// silently reorder or resize the list out from under the indices already
// baked into the visible buttons — checking off the wrong package, or
// nothing at all, with no sign anything went wrong.
let ladelisteRenderedItems = [];

// "2x TGM7" / "2 × TGM7", or a bare count followed by a space ("2 Menüs").
// Deliberately not a plain leading `\d+`: "3er Karton" is the name of one
// thing, not three of anything, and the × or the space is exactly what
// tells those two apart.
const PAKET_QTY_X_RE = /^(\d+)\s*[x×]\s*(.+)$/i;
const PAKET_QTY_SPACE_RE = /^(\d+)\s+(.+)$/;

function parsePaketItems(paket) {
  return String(paket || '')
    .split(/[,;]|\s\+\s/)
    .map((part) => part.trim())
    .filter(Boolean)
    .map((part) => {
      const m = part.match(PAKET_QTY_X_RE) || part.match(PAKET_QTY_SPACE_RE);
      if (!m) return { qty: 1, label: part };
      const qty = parseInt(m[1], 10);
      const label = m[2].trim();
      // A zero/absurd count, or a count with nothing left after it, means
      // the guess was wrong — keep the driver's original text intact.
      return qty > 0 && label ? { qty, label } : { qty: 1, label: part };
    });
}

// Sums the quantities parsed from a single stop's free-text `paket` field
// (same forgiving parser the Ladeliste uses) — used to decide whether the
// stop-detail row's Paket badge should read as "just one thing" or as a
// multi-item delivery worth flagging at a glance.
function paketQty(paket) {
  if (!paket) return 0;
  return parsePaketItems(paket).reduce((n, it) => n + it.qty, 0);
}

// Every distinct package across the route's customer stops, summed, busiest
// first. `key` is the case/whitespace-insensitive identity used for both
// grouping and the tick state; `label` is the first spelling that appeared,
// so the list reads back in the driver's own words rather than a normalized
// one nobody wrote.
/// A TK tour — frozen meals, named for it — is loaded by household, not by
/// menu: every parcel is near enough unique and has the customer's name on
/// its label. So such a tour shows how many parcels a door gets rather than
/// what is in them, and its Ladeliste goes customer by customer, last door
/// first, which is the order the van is packed in.
/// The mode in force for a tour: the driver's pick in the Ladeliste if they
/// made one, the guess from the name otherwise ("Tk1", "TK 3 …"). The one
/// place that question is answered, because every screen that draws a stop
/// asks it.
const ladelisteMode = (r) => (r?.ladeliste_mode === 'vm' || r?.ladeliste_mode === 'tk')
  ? r.ladeliste_mode
  : (r && r.name.trim().toLowerCase().startsWith('tk') ? 'tk' : 'vm');
const isTkTour = (r) => ladelisteMode(r) === 'tk';

/// The Paket as the app should *show* it. On a TK round the dish names
/// decide nothing at any door — what matters is how many parcels to carry
/// up, the portal's own count — and where that is not known the field is
/// hidden. A display rule only: the Paket itself is still edited, still
/// summed for the VM list.
function displayPaket(s, r = state.currentRoute) {
  if (!isTkTour(r)) return s.paket || '';
  const n = parcelCount(s);
  return n == null ? '' : (n === 1 ? '1 Paket' : `${n} Pakete`);
}

/// How many parcels a TK door gets: the portal's own count, and for a stop
/// typed in by hand whatever its Paket field adds up to ("2 Pakete" is 2,
/// "1x Suppe, 2x Menü" is 3). `null` only when nothing is known at all.
function parcelCount(s) {
  if (s.paket_count != null) return s.paket_count;
  return (s.paket || '').trim() ? paketQty(s.paket) : null;
}

/// What loads the van, for the mode given.
///   VM — the Pakete, summed across the tour: TGM lines first, then the
///        most of anything, then by name.
///   TK — the customers themselves, last door first, so the last one in is
///        the first one out.
/// A door the van does not go to is on neither.
function ladelisteItems(route, mode = ladelisteMode(route)) {
  const owed = route.stops.filter((s) => s.kind === 'customer' && !skipsDoor(s));
  if (mode === 'tk') {
    return owed.slice().reverse().map((s, i) => {
      const n = parcelCount(s);
      return {
        key: `stop:${s.id}`,
        qty: i + 1,
        label: (s.kunde || '').trim() || 'Stopp',
        sub: stopAddress(s),
        // What to carry out to the van for this customer — the one number
        // the list is read for, so it gets a place of its own on the row.
        parcels: n == null ? '' : (n === 1 ? '1 Paket' : `${n} Pakete`),
        parcelCount: n,
      };
    });
  }
  const byKey = new Map();
  for (const s of owed) {
    if (!s.paket) continue;
    for (const { qty, label } of parsePaketItems(s.paket)) {
      const key = label.toLowerCase().replace(/\s+/g, ' ');
      const entry = byKey.get(key);
      if (entry) entry.qty += qty;
      else byKey.set(key, { key, label, qty });
    }
  }
  const rank = (it) => (it.key.includes('tgm') ? 0 : 1);
  return Array.from(byKey.values()).sort((a, b) => rank(a) - rank(b) || b.qty - a.qty || a.label.localeCompare(b.label, 'de-AT'));
}

// Shared by the initial render and the in-place repaint below, so a ticked
// row can never drift into looking different depending on which of the two
// last touched it.
const ladeQtyClass = (on) => `shrink-0 w-12 text-[17px] font-bold tabular-nums ${on ? 'text-black/55' : 'text-brand-600'}`;
const ladeLabelClass = (on) => `block text-[15px] font-medium ${on ? 'text-black/40 line-through' : ''}`;
const ladeMarkClass = (on) => `shrink-0 w-9 h-9 rounded-full flex items-center justify-center text-[20px] shadow-sm ${on ? 'bg-success text-white' : 'bg-white border-2 border-black/45 text-black/40'}`;

function ladelisteProgress(items, checked, mode = ladelisteMode(state.currentRoute)) {
  const done = items.filter((it) => checked.has(it.key)).length;
  if (mode === 'tk') {
    const parcels = items.reduce((n, it) => n + (it.parcelCount || 0), 0);
    const total = parcels > 0 ? ` · ${parcels === 1 ? '1 Paket' : `${parcels} Pakete`}` : '';
    return done >= items.length ? `Alles geladen${total}` : `${done} von ${items.length} geladen${total}`;
  }
  const pieces = items.reduce((n, it) => n + it.qty, 0);
  const total = pieces > 0 ? ` · ${pieces} Stück` : '';
  return done >= items.length ? `Alles abgehakt${total}` : `${done} von ${items.length} abgehakt${total}`;
}

function renderLadeliste() {
  const r = state.currentRoute;
  if (!r) return;
  const mode = ladelisteMode(r);
  const items = ladelisteItems(r, mode);
  ladelisteRenderedItems = items;
  const checked = ladelisteChecked.get(r.id) || new Set();

  const row = (it, i) => {
    const on = checked.has(it.key);
    return `
      <button type="button" id="lade-row-${i}" role="checkbox" aria-checked="${on}"
        aria-label="${escapeAttr(mode === 'tk' ? `${it.qty}. ${it.label}${it.parcels ? `, ${it.parcels}` : ''}${it.sub ? `, ${it.sub}` : ''}` : `${it.qty} mal ${it.label}`)}"
        onclick="toggleLadelisteItem(${i})"
        class="w-full flex items-center gap-3 px-4 py-3.5 text-left press-fade">
        <span data-lade-qty class="${ladeQtyClass(on)}">${it.qty}${mode === 'tk' ? '' : '×'}</span>
        <span class="flex-1 min-w-0">
          <span data-lade-label class="${ladeLabelClass(on)}">${escapeHtml(it.label)}</span>
          ${it.sub ? `<span class="block text-[13px] text-black/55 truncate">${escapeHtml(it.sub)}</span>` : ''}
        </span>
        ${it.parcels ? `<span class="lade-parcels ${it.parcelCount > 1 ? 'many' : ''}">${escapeHtml(it.parcels)}</span>` : ''}
        <span data-lade-mark class="${ladeMarkClass(on)}">${on ? ICONS.checkCircleFill : ICONS.circle}</span>
      </button>`;
  };
  const seg = (m, label) => `<button type="button" role="radio" aria-checked="${mode === m}" onclick="setLadelisteMode('${m}')" class="seg-btn ${mode === m ? 'on' : ''}">${label}</button>`;

  renderSheetShell(`
    <h2 class="sheet-title">Ladeliste</h2>
    <div class="seg" role="radiogroup" aria-label="Tourart">${seg('vm', 'VM')}${seg('tk', 'TK')}</div>
    <p class="text-[13px] text-black/55 mb-3 px-1 leading-snug">${mode === 'tk'
      ? 'Tiefkühl-Tour: die Kunden, der letzte Stopp zuerst.'
      : 'Vormittags-Tour: alle Pakete der Tour, zusammengezählt.'}</p>
    ${items.length ? `
      <p id="lade-progress" aria-live="polite" class="text-[13px] font-medium text-black/55 px-1 pb-1.5">${ladelisteProgress(items, checked, mode)}</p>
      <div class="${GROUP}">${items.map(row).join('')}</div>
      <p class="text-[12px] text-black/55 mt-3 px-1 leading-snug">${mode === 'tk'
        ? 'Von oben nach unten einladen: der letzte Kunde zuerst, damit er zuletzt wieder herauskommt. Was mitkommt, steht auf den Paketen — dort steht der Name drauf.'
        : 'Tippen zum Abhaken. Die Haken gelten nur für diese Tour.'}</p>
      <div class="flex gap-3 mt-4 pb-2">
        <button type="button" onclick="resetLadeliste()" ${checked.size ? '' : 'disabled'} class="press-98 px-4 py-3 rounded-xl bg-white text-black/70 font-semibold text-sm disabled:opacity-40">Zurücksetzen</button>
        <button type="button" onclick="closeSheet()" class="press-98 flex-1 py-3 rounded-xl bg-brand-600 font-semibold text-white">Fertig</button>
      </div>
    ` : `
      <div class="${CARD} px-4 py-6 text-center">
        <p class="text-[15px] font-medium text-black/70">${mode === 'tk' ? 'Keine Kunden' : 'Keine Pakete'}</p>
        <p class="text-[13px] text-black/55 mt-1 leading-snug">${mode === 'tk' ? 'Diese Tour hat noch keine Stopps.' : 'Trag bei den Stopps im Feld „Paket“ ein, was mitkommt.'}</p>
      </div>
      <div class="mt-4 pb-2">
        <button type="button" onclick="closeSheet()" class="press-98 w-full py-3 rounded-xl bg-brand-600 font-semibold text-white">Fertig</button>
      </div>
    `}
  `, { label: 'Ladeliste' });
}

/// VM or TK, picked by hand. It belongs to the tour, not to the day: it is
/// kept on the server with the tour, survives "Zurücksetzen", and changes
/// what every stop row, Jetzt and the map show for the Paket from now on.
async function setLadelisteMode(mode) {
  const r = state.currentRoute;
  if (!r || ladelisteMode(r) === mode) return;
  const before = r.ladeliste_mode ?? null;
  r.ladeliste_mode = mode;
  renderLadeliste();
  patchRouteDetail() || render(true);
  if (navigator.vibrate) navigator.vibrate(10);
  const seq = nextSeq();
  try {
    const updated = await api(`/routes/${r.id}`, { method: 'PATCH', retry: true, body: JSON.stringify({ ladeliste_mode: mode }) });
    applyRouteUpdate(seq, r.id, updated);
  } catch (err) {
    if (state.currentRoute?.id === r.id) {
      state.currentRoute.ladeliste_mode = before;
      if (document.getElementById('lade-progress') || document.querySelector('.seg')) renderLadeliste();
      patchRouteDetail() || render(true);
    }
    toast(err.message, 'error');
  }
}

function toggleLadelisteItem(index) {
  const r = state.currentRoute;
  if (!r) return;
  // From the snapshot `renderLadeliste` built the currently-open sheet
  // from, not recomputed fresh — see the comment on `ladelisteRenderedItems`.
  const items = ladelisteRenderedItems;
  const it = items[index];
  if (!it) return;

  let checked = ladelisteChecked.get(r.id);
  if (!checked) { checked = new Set(); ladelisteChecked.set(r.id, checked); }
  const on = !checked.has(it.key);
  if (on) checked.add(it.key); else checked.delete(it.key);
  // Re-inserted so this route counts as the most recently used one for the
  // trim in `saveLadelisteChecked`.
  ladelisteChecked.delete(r.id);
  ladelisteChecked.set(r.id, checked);
  saveLadelisteChecked();

  // Repainting the one row in place rather than re-rendering the sheet: a
  // rebuild would throw away the scroll position halfway down a long list
  // and move focus off the row that was just tapped — on every single tick.
  const rowEl = document.getElementById(`lade-row-${index}`);
  if (rowEl) {
    rowEl.setAttribute('aria-checked', String(on));
    const qty = rowEl.querySelector('[data-lade-qty]');
    const label = rowEl.querySelector('[data-lade-label]');
    const mark = rowEl.querySelector('[data-lade-mark]');
    if (qty) qty.className = ladeQtyClass(on);
    if (label) label.className = ladeLabelClass(on);
    if (mark) { mark.className = ladeMarkClass(on); mark.innerHTML = on ? ICONS.checkCircleFill : ICONS.circle; }
  }
  const progress = document.getElementById('lade-progress');
  if (progress) progress.textContent = ladelisteProgress(items, checked);
  if (navigator.vibrate) navigator.vibrate(on ? [12, 40, 12] : 12);
}

function resetLadeliste() {
  const r = state.currentRoute;
  if (!r) return;
  ladelisteChecked.delete(r.id);
  saveLadelisteChecked();
  // Every row changes at once here, so a full re-render is the honest way
  // to do it — unlike a single tick, there is no scroll position worth
  // preserving through a "start over".
  renderLadeliste();
}

// ---------------------------------------------------------------------
// Manual pin-drop — the guaranteed fallback when automatic geocoding
// can't resolve an address (typo, brand-new building, service outage).
// ---------------------------------------------------------------------
let pinDropMap = null;
let pinDropMarker = null;

function openPinDropSheet(data, current = null) {
  // Opened two ways, and they need different words and a different camera:
  //   - after a geocode failure, where the app has nothing but the district
  //     and the driver is placing the very first pin; and
  //   - deliberately from the edit sheet ("Standort auf der Karte setzen"),
  //     where a pin already exists and is merely in the wrong place, so the
  //     map opens on it, close enough to see roofs.
  const correcting = !!(current && Number.isFinite(current.lat) && Number.isFinite(current.lon));
  const district = DISTRICT_BY_PLZ[data.plz];
  const center = correcting ? [current.lat, current.lon] : (district ? district.center : [48.2082, 16.3738]);
  // House level when nudging an existing pin; district level when the app
  // genuinely does not know where this is and the driver has to find it.
  const zoom = correcting ? 18 : (district ? 15 : 10);
  const heading = correcting ? 'Standort auf der Karte setzen' : 'Wo ist dieses Haus?';
  const explainer = correcting
    ? `Tippe auf das richtige Haus für „${escapeHtml(data.strasse)}, ${escapeHtml(data.plz)}" — oder ziehe den Pin dorthin. Mit „Luftbild" siehst du die Dächer.`
    : `„${escapeHtml(data.strasse)}, ${escapeHtml(data.plz)}" wurde nicht gefunden. Such das Haus auf der Karte und tippe darauf — mit „Luftbild" siehst du die Dächer. Oder geh zurück und korrigiere die Adresse.`;

  renderSheetShell(`
    <h2 class="text-[19px] font-bold mb-1">${heading}</h2>
    <p class="text-sm text-black/60 mb-3">${explainer}</p>
    <div id="pin-map" class="w-full h-72 rounded-2xl mb-4 overflow-hidden"></div>
    <div class="flex gap-3 pb-2">
      <button type="button" id="pin-back" class="press-98 px-4 py-3 rounded-xl bg-white text-black/70 font-semibold">Zurück</button>
      <button type="button" id="pin-confirm" disabled class="press-98 flex-1 py-3 rounded-xl bg-brand-600 font-semibold text-white disabled:opacity-40">Erst auf das Haus tippen</button>
    </div>
  `, { scrollable: false, label: 'Standort manuell setzen' });

  setTimeout(() => {
    const container = document.getElementById('pin-map');
    if (!container) return;
    ensureMapLibre()
      .then(() => {
        // The driver may have closed this sheet (or opened it again for a
        // different address) while MapLibre was still loading — comparing
        // object identity, not just "does #pin-map exist", is what catches
        // that: a *new* sheet has a new #pin-map element with the same id.
        if (document.getElementById('pin-map') !== container) return;
        const centerLngLat = [center[1], center[0]];
        const map = newMap(container, { center: centerLngLat, zoom });
        pinDropMap = map;
        const marker = new maplibregl.Marker({ color: '#ED1639', draggable: true }).setLngLat(centerLngLat).addTo(map);
        pinDropMarker = marker;
        // Confirming is only possible once the pin has been put somewhere.
        // It starts in the middle of the district (or wherever the stop was
        // guessed to be), and "Standort bestätigen" on a pin nobody moved
        // saved exactly the guess this sheet exists to replace — marked as
        // placed by hand, which silenced every warning about it.
        const placed = () => {
          const btn = document.getElementById('pin-confirm');
          if (btn) { btn.disabled = false; btn.textContent = 'Standort bestätigen'; }
        };
        map.on('click', (e) => { marker.setLngLat(e.lngLat); placed(); });
        marker.on('dragend', placed);
        setTimeout(() => { if (pinDropMap === map) map.resize(); }, 60);
      })
      .catch(() => { toast('Karte konnte nicht geladen werden.', 'error'); });
  }, 50);

  document.getElementById('pin-confirm').addEventListener('click', () => {
    if (!pinDropMarker) return;
    const { lat, lng } = pinDropMarker.getLngLat();
    closeSheet();
    sendStop(data, { lat, lon: lng });
  });
  document.getElementById('pin-back').addEventListener('click', () => {
    closeSheet();
    openAddSheet(data.stopId ? { ...data, id: data.stopId } : { ...data }, { notFound: !correcting });
  });
}

// ---------------------------------------------------------------------
// Hardware/browser back button.
//
// Installed to a home screen this looks and behaves like a native app, and
// on Android that sets an expectation the app was not meeting: back from an
// open sheet, or from a route's stop list, quit the app outright. Losing a
// half-typed stop to a reflex is a bad way to learn that.
//
// The mechanism is one spare history entry, not one entry per screen.
// Whenever the app is showing something that back ought to dismiss — a
// modal, or a pushed detail screen — a single guard entry exists behind it.
// Back consumes that entry, `popstate` dismisses one layer, and `render()`
// (or the modal helpers) immediately re-establish a guard if there is still
// something left to dismiss. When there is nothing left, no guard is
// pushed, and back leaves the app exactly as it should.
//
// Closing something with a button instead has to retire the guard too, or
// it would linger and turn the next back press into a no-op. `history.back()`
// does that, with `suppressPop` marking it as bookkeeping rather than a
// press to act on.
// ---------------------------------------------------------------------
let navGuardActive = false;
let suppressPop = false;

function isModalOpen() {
  return document.getElementById('modal-root').childElementCount > 0;
}

function needsNavGuard() {
  return isModalOpen() || isDetailShowing();
}

function updateHistoryGuard() {
  const needed = needsNavGuard();
  if (needed && !navGuardActive) {
    navGuardActive = true;
    history.pushState({ ear: 'guard' }, '');
  } else if (!needed && navGuardActive) {
    navGuardActive = false;
    suppressPop = true;
    history.back();
  }
}

window.addEventListener('popstate', () => {
  if (suppressPop) { suppressPop = false; return; }
  // The guard entry we pushed has just been consumed by this press.
  navGuardActive = false;
  // Dismiss exactly one layer, outermost first — a confirm dialog opened
  // over the stop list must not also close the stop list.
  if (isModalOpen()) {
    // The modal helpers resolve their promise on close; going through the
    // same path they use keeps a pending confirm from hanging forever.
    if (onModalEscape) onModalEscape();
    else closeSheet();
    updateHistoryGuard();
    return;
  }
  if (isDetailShowing()) {
    closeDetail();
    return; // closeDetail renders, and render() re-syncs the guard
  }
  // Nothing left to dismiss: the press falls through and leaves the app.
});

// Customer names, addresses and notes are free text that ends up inside
// template strings assigned to innerHTML — these are what keep an
// apostrophe or an angle bracket in a real name from being parsed as
// markup. `escapeAttr` covers both quote styles (not just the double
// quotes these templates happen to use today) so it stays correct if an
// attribute is ever written with single quotes.
function escapeAttr(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;')
    .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeHtml(str) {
  return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---------------------------------------------------------------------
// Large-title collapse — UINavigationController's large-title behavior:
// a big bold title up top that shrinks into a small centered title in a
// translucent sticky bar once the content scrolls under it. Re-attached
// after every render() since #app's innerHTML (and therefore the scroll
// container) is fully replaced each time — no explicit teardown needed,
// the old listener goes away with the old DOM node.
// ---------------------------------------------------------------------
function mountLargeTitle() {
  const scroller = document.querySelector('[data-scroll]');
  const large = document.querySelector('[data-large-title]');
  const compact = document.querySelector('[data-compact-title]');
  if (!scroller || !large || !compact) return;
  const onScroll = () => {
    const collapsed = scroller.scrollTop > 24;
    compact.style.opacity = collapsed ? '1' : '0';
    large.style.opacity = collapsed ? '0' : '1';
    large.style.transform = collapsed ? 'translateY(-6px)' : 'translateY(0)';
  };
  scroller.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

function fmtDate(iso) {
  // `new Date(garbage)` doesn't throw, it yields an Invalid Date whose
  // toLocaleDateString is the literal string "Invalid Date" — checking the
  // timestamp is what actually keeps that out of a route row.
  const d = new Date(iso);
  if (!iso || Number.isNaN(d.getTime())) return '';
  return d.toLocaleDateString('de-AT', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

// ---------------------------------------------------------------------
// Bottom tab bar
// ---------------------------------------------------------------------
function renderTabBar() {
  const tabs = [
    { id: 'routes', label: 'Touren', icon: ICONS.tabRoutes },
    { id: 'now', label: 'Jetzt', icon: ICONS.tabNow },
    { id: 'map', label: 'Karte', icon: ICONS.tabMap },
    // Only the administrator has this one: the people who use the app.
    ...(state.user?.is_admin ? [{ id: 'admin', label: 'Admin', icon: ICONS.people }] : []),
    { id: 'more', label: 'Mehr', icon: ICONS.tabMore },
  ];
  return `
    <nav class="fixed bottom-0 inset-x-0 z-40 bg-white border-t border-black/10" style="padding-bottom: env(safe-area-inset-bottom, 0px)">
      <div class="max-w-md mx-auto tab-grid" style="grid-template-columns: repeat(${tabs.length}, minmax(0, 1fr))">
        ${tabs.map(t => `
          <button onclick="switchTab('${t.id}')" ${state.tab === t.id ? 'aria-current="page"' : ''} aria-label="${t.label}" class="press-fade flex flex-col items-center justify-center gap-0.5 pt-2 pb-1.5 rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-600 ${state.tab === t.id ? 'text-brand-600' : 'text-black/55'}">
            <span class="text-[22px] flex">${t.icon}</span>
            <span class="text-[10px] font-medium">${t.label}</span>
          </button>
        `).join('')}
      </div>
    </nav>
  `;
}

// ---------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------
// Set true right before a render() that only refreshes already-visible
// content in place (e.g. the delivered-toggle's optimistic + confirm
// re-renders) — `renderRouteDetail` passes it on to `stopListHtml`, which
// skips re-triggering every row's entrance animation; otherwise the whole
// list looks like it "reloads" on every single tap.
let suppressRowAnim = false;

/// Which screen the current state resolves to. Used as the key for scroll
/// memory, so that "where was I scrolled to" is remembered per screen
/// rather than as one shared number.
function currentScreenKey() {
  return isDetailShowing() ? `detail:${state.currentRoute.id}` : `tab:${state.tab}`;
}

function isDetailShowing() {
  return !!(state.currentRoute && state.detailOrigin === state.tab);
}

// Scroll offsets, one per screen. A single shared offset — which is what
// this was — restores the *previous* screen's position onto the next one,
// so scrolling halfway down a long Routen list and then tapping Verlauf
// opened Verlauf already scrolled halfway down, past the top of a list the
// driver had never looked at. Per-screen, going back to a list returns to
// exactly where it was left, and a screen never inherits a position that
// was never its own.
const scrollMemory = new Map();
let renderedScreenKey = null;

// Every screen in this app is one `innerHTML` assignment, which makes
// `render()` a single point of failure: anything that throws while building
// a screen — one unexpected field in one stop — leaves the driver looking at
// a blank white page, mid-shift, with no button to press and no way back.
//
// So a render that throws falls back to a screen that cannot: plain markup,
// no route data in it at all, and the two ways out that always work. The
// error is re-thrown into the console for anyone debugging, but never at the
// driver.
function render(skipRowAnim) {
  try {
    renderScreen(skipRowAnim);
  } catch (err) {
    console.error('render failed', err);
    renderCrashScreen(err);
  }
}

function renderCrashScreen(err) {
  try {
    const app = document.getElementById('app');
    app.innerHTML = `
      <div role="main" class="flex-1 min-h-0 flex flex-col items-center justify-center px-8 text-center">
        <span class="text-4xl flex justify-center mb-3 text-warnText">${ICONS.warning}</span>
        <p class="text-[15px] font-semibold mb-1">Anzeige konnte nicht aufgebaut werden</p>
        <p class="text-[13px] text-black/55 leading-snug mb-5">Die Daten dieser Ansicht sind unerwartet. Deine Lieferungen sind gespeichert — nichts ist verloren.</p>
        <div class="flex flex-col gap-2 w-full max-w-[240px]">
          <button onclick="recoverToOverview()" class="press-98 w-full py-3 rounded-xl bg-brand-600 font-semibold text-white text-sm">Zur Übersicht</button>
          <button onclick="location.reload()" class="press-98 w-full py-3 rounded-xl bg-white font-semibold text-black/70 text-sm">App neu laden</button>
        </div>
      </div>
    `;
    hideSplash();
  } catch (fatal) {
    // The fallback itself failed (no #app, no ICONS — i.e. the document is
    // not what this script was written against). One last resort that needs
    // nothing but `document.body`.
    console.error('crash screen failed', fatal);
    document.body.innerHTML = '<div style="padding:2rem;font:15px system-ui;text-align:center">Die App konnte nicht geladen werden.<br><br><a href="/" style="color:#ED1639">Neu laden</a></div>';
  }
}

// The way out of a crashed detail screen: drop the route in focus (the most
// likely source of whatever the render choked on), go back to the list, and
// refetch it. Deliberately not just `render()` again — re-rendering the same
// state would reproduce the same crash.
function recoverToOverview() {
  state.currentRoute = null;
  state.detailOrigin = null;
  state.tab = 'routes';
  resetStopFilter();
  pendingDelivered.clear();
  pendingDeliveredGen.clear();
  loadRoutes();
}

function renderScreen(skipRowAnim) {
  suppressRowAnim = !!skipRowAnim;
  const app = document.getElementById('app');

  const prevScroller = document.querySelector('[data-scroll]');
  if (prevScroller && renderedScreenKey) {
    scrollMemory.set(renderedScreenKey, prevScroller.scrollTop);
  }

  // #app's innerHTML is replaced wholesale below, which destroys the stop
  // filter's field. Its *text* survives on its own — `stopSearchBar` reads it
  // back out of `stopFilter.query` — but the focus and the caret do not, and
  // a render the driver never asked for (a resume refresh, most
  // realistically) can land mid-word. Carried across by hand, and only when
  // the field genuinely had focus, so this can never steal it.
  const prevFilterInput = document.getElementById('stop-search');
  const filterCaret = prevFilterInput && document.activeElement === prevFilterInput
    ? { start: prevFilterInput.selectionStart, end: prevFilterInput.selectionEnd }
    : null;

  if (!state.user) { renderLoginScreen(); return; }

  const showingDetail = isDetailShowing();
  const screenKey = currentScreenKey();
  let screen;
  if (showingDetail) screen = renderRouteDetail();
  else if (state.tab === 'admin' && state.user.is_admin) screen = renderAdminTab();
  else if (state.tab === 'routes') screen = renderRoutesTab();
  else if (state.tab === 'now') screen = renderNowTab();
  else if (state.tab === 'map') screen = renderMapTab();
  else screen = renderMoreTab();

  app.innerHTML = screen + renderTabBar();
  document.querySelectorAll('[data-logo-src]').forEach(img => img.src = APP_LOGO);

  // innerHTML replacement above tears down and rebuilds the scroll
  // container, which resets scrollTop to 0 — restore this screen's own
  // remembered offset so a re-render (an optimistic update immediately
  // followed by the server-confirmed one, say) never visibly jumps.
  const nextScroller = document.querySelector('[data-scroll]');
  if (nextScroller) nextScroller.scrollTop = scrollMemory.get(screenKey) || 0;
  renderedScreenKey = screenKey;

  if (filterCaret) {
    const input = document.getElementById('stop-search');
    if (input) {
      input.focus({ preventScroll: true });
      // Not every browser exposes a selection range on every input type; a
      // caret that lands at the end is a great deal better than an exception
      // taking the whole render down with it.
      try { input.setSelectionRange(filterCaret.start, filterCaret.end); } catch (_) { /* caret stays where it defaulted */ }
    }
  }

  mountLargeTitle();

  // Leaving the Karte tab deliberately does *not* destroy the map: the
  // innerHTML replacement above already detached its element, which costs
  // nothing while it's off screen, and keeping the instance means coming
  // back is instant rather than a fresh style/tile download every time.
  const showingMapTab = state.tab === 'map' && !showingDetail;
  if (showingMapTab) {
    initMapTabMap();
    scrollActiveChipIntoView();
    // Only on the edge of *arriving* — calling this on every render while
    // already on the tab would be a harmless no-op (`trigger()` is only
    // invoked when a pause is actually recorded) but there's no reason to
    // even check on every single re-render of a screen the driver hasn't
    // left.
    if (mapTabMap && !mapTabWasVisible) mapTabMap._earResumeGeolocate?.();
  } else if (mapTabMap && mapTabWasVisible) {
    // The map's own GPS watch (once a driver has tapped locate-me) would
    // otherwise keep running for the rest of the session — see
    // `_earPauseGeolocate`'s own comment in `newMap` — including the whole
    // time spent on Routen/Verlauf/Mehr, which for a driver mid-shift is
    // most of it.
    mapTabMap._earPauseGeolocate?.();
  }
  mapTabWasVisible = showingMapTab;

  syncWakeLock();
  paintEtas();
  updateHistoryGuard();
  // The Karte tab docks a route card above the tab bar and the other
  // screens don't, so how far up the toasts have to sit changes with the
  // screen, not just with what's open over it.
  positionToasts();
}

// Screens the driver is no longer able to return to shouldn't keep an
// entry: a deleted route's detail position is dead weight, and without
// this the map would grow for the life of the page.
function forgetScrollMemory(key) {
  scrollMemory.delete(key);
}

// ---------------------------------------------------------------------
// Routen tab — active routes only, grouped inset list, large title.
// ---------------------------------------------------------------------
function renderRoutesTab() {
  const active = state.routes.filter(r => r.status === 'active');
  // The finished tours live under the active ones, newest first — one tab
  // for every tour there is, as in the iOS app.
  const done = state.routes.filter(r => r.status === 'completed');
  const stopsText = (n) => (n === 1 ? '1 Stopp' : `${n} Stopps`);
  // "26 Stopps · 12 von 26 geliefert · 1 nicht angetroffen · 41,3 km", with
  // the day in front once the tour is finished.
  const subtitle = (r, finished) => [
    finished ? fmtDate(r.completed_at || r.created_at) : '',
    stopsText(r.customer_count),
    !finished && r.settled_count > 0 ? (r.delivered_count === r.customer_count ? 'alle geliefert' : `${r.delivered_count} von ${r.customer_count} geliefert`) : '',
    r.not_home_count > 0 ? `${r.not_home_count} nicht angetroffen` : '',
    r.total_km > 0 ? fmtKm(r.total_km) : '',
  ].filter(Boolean).join(' · ');
  // Which of several active tours Jetzt is showing: the one in focus.
  const onNow = active.length > 1 && state.currentRoute?.status === 'active' ? state.currentRoute.id : null;
  const stale = `<p class="text-[12px] text-black/55 mt-0.5 flex items-center gap-1"><span class="flex" style="color:#FF9500">${ICONS.warning}</span>Route nicht aktuell</p>`;

  const doneRow = (r) => `
    <button onclick="openRoute(${r.id})" class="${ROW}">
      <span class="w-9 h-9 shrink-0 rounded-full bg-success/10 text-success flex items-center justify-center text-lg">${ICONS.checkCircle}</span>
      <div class="flex-1 min-w-0">
        <p class="font-medium truncate">${escapeHtml(r.name)}</p>
        <p class="text-[13px] text-black/55 mt-0.5">${subtitle(r, true)}</p>
        ${r.needs_optimize ? stale : ''}
      </div>
      <span class="text-black/25 text-lg flex shrink-0">${ICONS.chevron}</span>
    </button>`;

  const routeRow = (r) => {
    const progress = r.customer_count ? Math.round((r.settled_count / r.customer_count) * 100) : 0;
    return `
    <button onclick="openRoute(${r.id})" class="${ROW}">
      <span class="w-9 h-9 shrink-0 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center text-lg">${ICONS.box}</span>
      <div class="flex-1 min-w-0">
        <p class="font-medium truncate">${escapeHtml(r.name)}</p>
        ${r.id === onNow ? `<p class="text-[12px] font-medium text-brand-600 flex items-center gap-1"><span class="flex">${ICONS.tabNow}</span>Auf Jetzt</p>` : ''}
        <p class="text-[13px] text-black/55 mt-0.5">${subtitle(r, false)}</p>
        ${r.needs_optimize ? stale : ''}
        ${r.settled_count > 0 && r.settled_count < r.customer_count ? `<div class="h-1 bg-black/10 rounded-full overflow-hidden mt-1.5"><div class="h-full bg-success" style="width:${progress}%"></div></div>` : ''}
      </div>
      <span class="text-black/25 text-lg flex shrink-0">${ICONS.chevron}</span>
    </button>
  `;
  };

  return `
    <div data-scroll role="main" class="flex-1 min-h-0 overflow-y-auto momentum" style="padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 3.75rem)">
      <div class="sticky top-0 z-20 bg-[#F2F2F7]/85 backdrop-blur-xl border-b border-black/10" style="padding-top: calc(env(safe-area-inset-top) + 0.5rem)">
        <div class="flex items-center justify-between px-4 pb-2.5">
          <span class="w-8"></span>
          <p data-compact-title class="compact-title text-[17px] font-semibold" style="opacity:0">Touren</p>
          <button onclick="openNewTourSheet()" aria-label="Neue Tour" title="Neue Tour" class="tap-target press-fade w-8 h-8 flex items-center justify-center text-brand-600 text-lg">${ICONS.plus}</button>
        </div>
      </div>

      <div class="px-4">
        <h1 data-large-title class="large-title text-[34px] font-bold tracking-tight pt-3 pb-4">Touren</h1>

        ${active.length && done.length ? `<p class="${SECTION_LABEL} !pt-0">Aktiv</p>` : ''}
        ${active.length ? `<div class="${GROUP}">${active.map(routeRow).join('')}</div>` : `
          <div class="text-center text-black/55" style="padding: 3.5rem .5rem 1rem">
            <span class="text-4xl flex justify-center mb-3 opacity-40">${ICONS.box}</span>
            <p class="font-semibold text-black/70">${done.length ? 'Keine aktive Tour' : 'Keine Touren'}</p>
            <p class="text-[15px] mt-1 leading-snug">Lade die Tour des Tages vom Zusteller-Portal, oder leg eine Tour an und füg die Kundenstopps hinzu.</p>
            <button onclick="openGourmetSheet()" class="press-98 wide-btn accent" style="margin-top:1.25rem">${ICONS.download} Vom Zusteller-Portal</button>
            <button onclick="createRoute()" class="press-98 wide-btn quiet">Neue Tour</button>
          </div>
        `}

        ${done.length ? `
          <p class="${SECTION_LABEL}">Erledigt</p>
          <div class="${GROUP}">${done.map(doneRow).join('')}</div>` : ''}
      </div>
    </div>
  `;
}

// True while the Karte tab's "nothing in focus yet, open the first active
// route" fetch is in flight — see renderMapTab.
let mapAutoSelectPending = false;

// ---------------------------------------------------------------------
// Karte tab — the map as a first-class, edge-to-edge destination. A
// horizontal route picker up top switches which active route's geometry
// is shown; the map itself owns the rest of the screen down to the tab
// bar instead of being boxed into a small preview.
// ---------------------------------------------------------------------
// Whether the Karte tab's map has painted at least once. Until it has, the
// tab shows a placeholder instead of an unexplained empty rectangle: on a
// cold start the driver is waiting on MapLibre's script, a style, a sprite,
// a glyph set and a screenful of tiles, and a blank grey box for a couple
// of seconds reads as "the app is broken", not as "this is loading".
// Sticky once true — the map is kept alive across tab switches, so coming
// back must not flash a loading state at a map that is already drawn.
let mapTabReady = false;

// The longest the loading placeholder may cover the map — see where it is
// armed, in `initMapTabMap`.
const MAP_PLACEHOLDER_MAX_MS = 6000;

function mapLoadingOverlay() {
  return `
    <div data-map-loading role="status" aria-live="polite"
      class="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-[#F2F2F7] pointer-events-none">
      <span class="spinner"></span>
      <p class="text-[13px] text-black/55">Karte wird geladen …</p>
    </div>
  `;
}

// Called once the map has actually rendered a frame. Removes the
// placeholder in place rather than waiting for the next `render()`, so the
// map appears the moment it is ready instead of on the next state change.
function markMapTabReady() {
  if (mapTabReady) return;
  mapTabReady = true;
  document.querySelector('[data-map-loading]')?.remove();
}

function renderMapTab() {
  const pickable = state.routes.filter(r => r.status === 'active');
  if (!state.currentRoute && pickable.length && !mapAutoSelectPending) {
    // Defer selection to after this render pass — selectMapRoute() re-
    // renders itself once the full route detail (with geometry) loads.
    // The flag is what keeps that from compounding: this function runs on
    // every render, and each render before the fetch resolves would
    // otherwise queue another identical request for the same route.
    mapAutoSelectPending = true;
    setTimeout(() => {
      selectMapRoute(pickable[0].id).finally(() => { mapAutoSelectPending = false; });
    }, 0);
  }

  const r = state.currentRoute;
  // The last few finished tours too, as on the iOS app's map: where a
  // customer lives is looked up on yesterday's tour as often as on today's.
  const recent = state.routes.filter((x) => x.status === 'completed').slice(0, 5);
  if (r && r.status === 'completed' && !recent.some((x) => x.id === r.id)) recent.push(r);
  const chips = [...pickable, ...recent];

  if (!chips.length) {
    return `
      <div role="main" class="flex-1 min-h-0 flex flex-col items-center justify-center px-8 text-center text-black/55">
        <span class="text-4xl flex justify-center mb-3 opacity-40">${ICONS.tabMap}</span>
        <p class="text-[15px]">Keine Tour ausgewählt.<br/>Leg unter „Touren“ eine Tour an.</p>
      </div>
    `;
  }

  return `
    <div role="main" class="flex-1 min-h-0 relative">
      <div id="route-map" class="absolute inset-0"></div>
      ${mapTabReady ? '' : mapLoadingOverlay()}

      <div class="absolute top-0 inset-x-0 z-10 momentum overflow-x-auto flex gap-2 px-4" style="padding-top: calc(env(safe-area-inset-top) + 0.75rem); padding-bottom: 0.75rem;">
        ${chips.map(p => `
          <button onclick="selectMapRoute(${p.id})" ${r && r.id === p.id ? 'data-route-chip-active aria-current="true"' : ''} class="press-98 shrink-0 px-3.5 py-2 rounded-full text-[13px] font-semibold shadow-lg backdrop-blur-xl ${r && r.id === p.id ? 'bg-brand-600 text-white' : 'bg-white/90 text-black/70'}" ${p.status === 'completed' && !(r && r.id === p.id) ? 'style="opacity:.75"' : ''}>${p.status === 'completed' ? '✓ ' : ''}${escapeHtml(p.name)}</button>
        `).join('')}
      </div>

      ${r ? `
        <div class="absolute bottom-0 inset-x-0 z-10 px-4" style="pointer-events:none; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 3.75rem)">
          <div class="flex" style="justify-content:flex-end; margin-bottom:.625rem">
            <button type="button" onclick="fitMapToRoute()" aria-label="Ganze Route zeigen" title="Ganze Route zeigen" class="map-fit press-95" style="pointer-events:auto">${ICONS.expand}</button>
          </div>
          <div data-map-card style="pointer-events:auto">${mapCardHtml() || mapDockHtml()}</div>
        </div>
      ` : ''}
    </div>
  `;
}

// ---------------------------------------------------------------------
// Jetzt tab — the stop the driver is at, and nothing else.
//
// The route's list is the right screen for planning a tour and the wrong one
// for driving it: thirty rows, one of which matters, read at arm's length
// between two doors. This is that one row with room to breathe — who, where,
// what to hand over — and the two things done at every door, each a full
// width of thumb: start the navigation, and say it is delivered.
//
// It shows the route in focus when that is an active one, and otherwise
// picks the newest active tour the same way the Karte tab does.
// ---------------------------------------------------------------------
let nowAutoSelectPending = false;

function renderNowTab() {
  const pickable = state.routes.filter((r) => r.status === 'active');
  const r = state.currentRoute?.status === 'active' ? state.currentRoute : null;
  if (!r && pickable.length && !nowAutoSelectPending) {
    nowAutoSelectPending = true;
    setTimeout(() => {
      selectMapRoute(pickable[0].id).finally(() => { nowAutoSelectPending = false; });
    }, 0);
  }

  const frame = (title, body) => `
    <div data-scroll role="main" class="flex-1 min-h-0 overflow-y-auto momentum" style="padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8rem)">
      <div class="sticky top-0 z-20 bg-[#F2F2F7]/85 backdrop-blur-xl border-b border-black/10" style="padding-top: calc(env(safe-area-inset-top) + 0.5rem)">
        <div class="flex items-center justify-between px-4 pb-2.5">
          <span class="w-8"></span>
          <p data-compact-title class="compact-title flex-1 min-w-0 text-center truncate font-semibold px-1" style="opacity:0">${escapeHtml(title)}</p>
          ${r ? `<button onclick="showNowOnMap()" aria-label="Auf der Karte zeigen" title="Auf der Karte zeigen" class="tap-target press-fade w-8 h-8 flex items-center justify-center text-brand-600 text-lg">${ICONS.tabMap}</button>` : '<span class="w-8"></span>'}
        </div>
      </div>
      <div class="px-4">
        <h1 data-large-title class="large-title text-[22px] font-bold tracking-tight pt-3 pb-1 truncate">${escapeHtml(title)}</h1>
        ${body}
      </div>
    </div>`;
  const empty = (iconSvg, title, text, action) => `
    <div class="text-center py-20 text-black/55">
      <span class="text-4xl flex justify-center mb-3 opacity-40">${iconSvg}</span>
      <p class="font-semibold text-black/70">${title}</p>
      <p class="text-[15px] mt-1 leading-snug">${text}</p>
      ${action}
    </div>`;

  if (!pickable.length) {
    return frame('Jetzt', empty(ICONS.tabNow, 'Keine aktive Tour',
      'Sobald eine Tour läuft, steht hier der Stopp, bei dem du gerade bist.',
      `<button onclick="switchTab('routes')" class="press-98 wide-btn accent" style="margin-top:1.25rem">Zu den Touren</button>`));
  }
  if (!r) return frame('Jetzt', '');

  // Which tour this is, when there is more than one it could be.
  const chips = pickable.length > 1 ? `
    <div class="momentum overflow-x-auto flex gap-2 pb-3">
      ${pickable.map((p) => `
        <button onclick="selectMapRoute(${p.id})" ${r.id === p.id ? 'aria-current="true"' : ''} class="press-98 shrink-0 px-3.5 py-2 rounded-full text-[13px] font-semibold ${r.id === p.id ? 'bg-brand-600 text-white' : 'bg-white text-black/70'}">${escapeHtml(p.name)}</button>`).join('')}
    </div>` : '';

  const stops = r.stops;
  const customers = stops.filter((s) => s.kind === 'customer' && !skipsDoor(s));
  const settled = customers.filter((s) => s.outcome).length;
  const notHome = customers.filter((s) => s.outcome === 'notHome');
  const toLagerCount = stops.filter((s) => s.kind === 'customer' && s.outcome === 'toLager').length;
  const cancelledCount = stops.filter((s) => s.kind === 'customer' && s.outcome === 'cancelled').length;
  const caption = deliveryLine(r);
  const progress = `
    <p class="now-caption" style="padding: .25rem .25rem .5rem">${caption}</p>
    <div class="h-1.5 bg-black/10 rounded-full overflow-hidden mb-4">
      <div class="h-full bg-success transition-all duration-500" style="width: ${customers.length ? Math.round((settled / customers.length) * 100) : 0}%"></div>
    </div>`;

  // Not driven around a point where nobody lives: fix first, then go.
  if (unplacedStops(r).length) return frame(r.name, chips + optimizeBannerHtml());

  const idx = firstOpenIndex(stops);
  if (idx >= 0) return frame(r.name, chips + optimizeBannerHtml() + progress + nowStopCard(r, stops[idx]));

  if (!customers.length) {
    return frame(r.name, chips + empty(ICONS.box, 'Noch keine Stopps',
      'Stopps hinzufügen und importieren geht in der Tour selbst.',
      `<button onclick="openCurrentRouteDetail()" class="press-98 wide-btn accent" style="margin-top:1.25rem">Zur Tour</button>`));
  }

  // Every door answered for. What is left is to say so — and, if a meal came
  // back, who did not get theirs.
  const toLager = toLagerCount;
  const allDelivered = notHome.length === 0;
  const count = r.customer_count;
  const handed = r.delivered_count === count
    ? (count === 1 ? '1 Stopp geliefert' : `${count} Stopps geliefert`)
    : `${r.delivered_count} von ${count} geliefert`;
  const homeKm = routeSnapshot(r).remainingKm;
  const detail = [
    handed,
    cancelledCount ? `${cancelledCount} abbestellt` : '',
    toLager ? `${toLager} ins Lager` : '',
    homeKm >= 0.05 ? `Rückfahrt ${fmtKm(homeKm)}` : '',
  ].filter(Boolean).join(' · ');
  return frame(r.name, chips + progress + `
    <div class="text-center" style="padding: 1.5rem .5rem">
      <span class="flex justify-center mb-3" style="font-size: 3rem; color: ${allDelivered ? '#34C759' : '#FF9500'}">${allDelivered ? ICONS.checkCircle : ICONS.bellOff}</span>
      <p class="now-name">${allDelivered && r.delivered_count === count ? 'Alle geliefert' : 'Tour gefahren'}</p>
      <p class="text-[15px] text-black/55 mt-1">${detail}</p>
      ${allDelivered ? '' : `<div class="now-card" style="margin-top:1.25rem; padding: .75rem 1rem 1rem">
        ${notHome.map((s) => `<div class="now-follow"><span>${ICONS.bellOff}</span><span><span class="block font-medium">${escapeHtml(s.kunde)}</span><span class="block text-[13px] text-black/55">${escapeHtml(stopAddress(s))}</span></span></div>`).join('')}
      </div>`}
      <button onclick="toggleRouteStatus()" class="press-98 wide-btn accent" style="margin-top:1.5rem">${ICONS.checkCircle} Tour abschließen</button>
    </div>`);
}

// ---------------------------------------------------------------------
// When the driver gets there.
//
// Everything one pass of a stop list needs to know about a tour, worked out
// in a single walk of its stops — the same walk, with the same numbers, as
// the iOS app's `RouteSnapshot`, so the two cannot promise two different
// arrival times for one door.
//
// An arrival is the drive still ahead, plus a door's worth of minutes for
// every door in front of it, plus the loading at the Lager while that is
// still to come — counted from the last tick rather than from now, so the
// estimate does not slide later for as long as the driver stands at a door.
// How long a door takes starts from what the finished tours measured
// (`/api/pace`), or seven minutes where there are none, and is pulled
// towards today's own ticks as they come in.
// ---------------------------------------------------------------------
const PACE = { assumed: 7, cap: 15, priorWeight: 8, sharedDoor: 0.55, lager: 10, anchorMaxAgeMs: 90 * 60 * 1000 };
let paceHistory = { door_minutes: null, lager_minutes: null, door_by_tour: {}, lead_minutes: null };
// A departure older than this is another day's.
const DEPARTURE_STALE_MS = 4 * 3600 * 1000;
// What a tour is recognised by from one week to the next — `pace_tour_key`
// on the server is the same rule.
const tourKey = (name) => String(name || '').trim().split(/\s+/).join(' ').toLowerCase();

/// Mehr → Zuhause: where "Pause zu Hause" drives to. Kept on the account,
/// like the tours.
let homeState = { home: null };

async function loadHome() {
  try {
    const h = await api('/home');
    if (h && typeof h === 'object') homeState = h;
    paintEtas();
  } catch (_) { /* no home address is a fine place to start from */ }
}

async function loadPaceHistory() {
  try {
    const h = await api('/pace');
    if (h && typeof h === 'object') paceHistory = h;
    paintEtas();
  } catch (_) { /* the assumed pace is a fine place to start from */ }
}

/// Navigation to the Lager is when the van leaves — the one moment of the day
/// no tick marks. Told to the server, which keeps the first such tap of a tour
/// that has not begun, and learns from the finished ones what the morning
/// takes before the Lager is ticked. On the link itself, so the map app still
/// opens whatever becomes of this.
function noteDeparture(stopId) {
  const r = state.currentRoute;
  const stop = r?.stops.find((s) => s.id === stopId);
  if (!r || r.status !== 'active' || !stop || stop.kind !== 'via' || !isCheckpoint(stop) || stop.outcome) return;
  api(`/routes/${r.id}/departed`, { method: 'POST' })
    .then((res) => {
      if (state.currentRoute?.id !== r.id || !res) return;
      state.currentRoute.departed_at = res.departed_at ?? null;
      paintEtas();
    })
    .catch(() => { /* the estimate counts from now, as it did */ });
}

/// `plannedStart` is a departure to count from instead of now — a timestamp,
/// and only ever handed in by "Tour vorbereiten", which asks "and if I leave
/// at seven?". Nothing keeps it; every other screen counts from now.
function routeSnapshot(r, plannedStart = null) {
  const ordered = r.stops;
  const countsAsStop = (s) => s.kind === 'customer' || isCheckpoint(s);
  const passesLager = (s) => s.kind === 'customer' && !!s.outcome && !skipsDoor(s);
  const stamp = (s) => (s.settled_at ? Date.parse(s.settled_at) : NaN);

  const arrivals = new Map();
  const doorsBefore = new Map();
  const ownDoor = new Map();
  const loadingBefore = new Set();
  // The Lager's loading is still ahead until the first door is answered
  // for — whether the Lager itself is ticked yet or not.
  const loaded = ordered.some(passesLager);
  let loadingAhead = false;
  let customers = 0, open = 0, openDoors = 0;
  let next = null, openEnd = null, anchor = null;
  let km = 0, minutes = 0, drivenKm = 0, drivenMinutes = 0, doorsSoFar = 0;
  let previousLeg = null, previousWasCustomer = false;

  for (const stop of ordered) {
    // Before this stop's own leg is added, so it is the time the van arrives
    // here rather than the time it leaves.
    arrivals.set(stop.id, minutes);
    doorsBefore.set(stop.id, doorsSoFar);
    if (loadingAhead) loadingBefore.add(stop.id);
    if (stop.kind === 'via' && isCheckpoint(stop) && !loaded) loadingAhead = true;
    if (stop.kind === 'customer' && !skipsDoor(stop)) customers++;
    if (countsAsStop(stop) && !skipsDoor(stop)) {
      if (stop.outcome) {
        // Only while every stop up to here has been settled: a delivery made
        // out of order must not drag the mark forward past doors still owed.
        if (!next) { drivenKm = km; drivenMinutes = minutes; anchor = stop; }
      } else {
        // Ziel waits for everything else, wherever it is listed.
        if (stop.kind === 'end') openEnd = stop;
        else if (!next) next = stop;
        open++;
        if (stop.kind === 'customer') {
          openDoors++;
          // A second household at the door the van is already standing at.
          const weight = previousWasCustomer && (previousLeg ?? 1) < 0.3 ? PACE.sharedDoor : 1;
          ownDoor.set(stop.id, weight);
          doorsSoFar += weight;
        }
      }
    }
    // Only the legs actually driven count towards the tour's totals.
    if (stop.excluded && stop.kind !== 'start') continue;
    km += stop.next_leg_km || 0;
    minutes += stop.next_leg_min || 0;
    if (!skipsDoor(stop)) {
      previousLeg = stop.next_leg_min;
      previousWasCustomer = stop.kind === 'customer';
    }
  }

  // Only a tick nothing was ticked after: with doors answered for out of
  // order, the last one in the list is not where the van is.
  const latest = Math.max(...ordered.filter((s) => countsAsStop(s) && s.outcome && !skipsDoor(s)).map(stamp).filter(Number.isFinite), -Infinity);
  const anchorAt = anchor ? stamp(anchor) : NaN;

  // Today's own door times: the gap between two ticks, less the drive.
  const stamped = ordered.filter(passesLager)
    .map((s) => ({ at: stamp(s), driving: arrivals.get(s.id) }))
    .filter((x) => Number.isFinite(x.at))
    .sort((a, b) => a.at - b.at);
  const samples = [];
  for (let i = 1; i < stamped.length; i++) {
    const gap = (stamped[i].at - stamped[i - 1].at) / 60000;
    const drive = stamped[i].driving - stamped[i - 1].driving;
    if (gap >= 0.5 && gap <= 45 && drive >= 0.3) samples.push(Math.max(0.5, gap - drive));
  }
  // This tour's own doors where it has been driven before: a round is the
  // same customers every week, and the rounds are not alike.
  const prior = paceHistory.door_by_tour?.[tourKey(r.name)] ?? paceHistory.door_minutes ?? PACE.assumed;
  const minutesPerStop = samples.length
    ? (samples.reduce((a, x) => a + Math.min(x, PACE.cap), 0) + PACE.priorWeight * prior) / (samples.length + PACE.priorWeight)
    : prior;
  const lagerMinutes = paceHistory.lager_minutes ?? PACE.lager;

  const snap = {
    customerCount: customers,
    // A tour with no customers yet has nothing to drive.
    openCount: customers > 0 ? open : 0,
    openDoors,
    nextOpen: customers > 0 ? (next || openEnd) : null,
    totalKm: km,
    totalMinutes: minutes,
    // Clamped: legs written by two different optimization runs can be
    // slightly inconsistent, and a negative "still to drive" is worse than 0.
    remainingKm: Math.max(0, km - drivenKm),
    remainingMinutes: Math.max(0, minutes - drivenMinutes),
    minutesPerStop,
  };

  const minutesAhead = (stop) =>
    Math.max(0, (arrivals.get(stop.id) || 0) - drivenMinutes)
    + (doorsBefore.get(stop.id) || 0) * minutesPerStop
    + (loadingBefore.has(stop.id) ? lagerMinutes : 0);

  // Whether the van has been anywhere yet. Not an abbestellt customer, who is
  // ticked off the evening before when the office rings.
  const underWay = ordered.some((s) => countsAsStop(s) && s.outcome && !skipsDoor(s));
  snap.underWay = underWay;

  /// The departure being asked about, while it is still ahead and the tour
  /// has not begun — `null` once the first stop is ticked, when the ticks say
  /// where the van is, and once the time has passed.
  snap.pendingStart = (now = Date.now()) =>
    !underWay && Number.isFinite(plannedStart) && plannedStart > now ? plannedStart : null;

  // The Lager, while its tick is still ahead of everything else: the stretch
  // of the morning no tick measures. There the clock starts at the departure,
  // when the driver's tap on navigation gave one, and the Lager is left —
  // which is to say ticked — however long after leaving the tours before
  // this one took (`lead_minutes`), rather than when the drive there would
  // end. `planning` is an estimate for a departure still to come, which
  // today's own stamp has no part in.
  const lagerAhead = !underWay && next && next.kind === 'via' ? next : null;
  const departedAt = r.departed_at ? Date.parse(r.departed_at) : NaN;

  const nextStopTimes = (now, planning = false) => {
    const nextStop = snap.nextOpen;
    if (!nextStop) return null;
    if (lagerAhead && lagerAhead.id === nextStop.id) {
      const left = !planning && Number.isFinite(departedAt) && departedAt <= now && now - departedAt <= DEPARTURE_STALE_MS;
      const since = left ? departedAt : now;
      const drive = minutesAhead(nextStop);
      const lead = Math.max(paceHistory.lead_minutes ?? drive, drive);
      return { stop: nextStop, arrival: Math.max(since + drive * 60000, now), departure: Math.max(since + lead * 60000, now) };
    }
    const since = Number.isFinite(anchorAt) && anchorAt === latest && anchorAt <= now && now - anchorAt <= PACE.anchorMaxAgeMs ? anchorAt : now;
    const planned = since + minutesAhead(nextStop) * 60000;
    const door = (ownDoor.get(nextStop.id) || 0) * minutesPerStop;
    // A minute at least, at a door the plan says the driver should already
    // have left: they have not ticked it yet.
    const departure = Math.max(planned + door * 60000, now + (door > 0 ? 60000 : 0));
    return { stop: nextStop, arrival: Math.max(planned, now), departure };
  };

  /// When the van reaches `stop`, as a timestamp — or `null` for a stop
  /// that is settled, behind the van, or on a tour with no legs yet.
  snap.eta = (stop, now = Date.now()) => {
    const start = snap.pendingStart(now);
    now = start ?? now;
    if (!(minutes > 0) || stop.outcome || !arrivals.has(stop.id)) return null;
    const n = nextStopTimes(now, start != null);
    if (!n) return null;
    if (stop.id === n.stop.id) return n.arrival;
    // Only for a point the van has not reached: Start can never be
    // "settled", and would otherwise promise an arrival of now all day.
    if (!isOpenStop(stop) && !(arrivals.get(stop.id) > drivenMinutes)) return null;
    const beyond = minutesAhead(stop) - minutesAhead(n.stop) - (ownDoor.get(n.stop.id) || 0) * minutesPerStop;
    return Math.max(now, n.departure + beyond * 60000);
  };

  /// When the whole tour is done, back at Ziel.
  snap.etaFinish = (now = Date.now()) => {
    const start = snap.pendingStart(now);
    now = start ?? now;
    if (!(minutes > 0) || snap.openCount <= 0) return null;
    const n = nextStopTimes(now, start != null);
    if (!n) return null;
    const loading = loadingBefore.size && doorsSoFar > 0 ? lagerMinutes : 0;
    const whole = snap.remainingMinutes + doorsSoFar * minutesPerStop + loading;
    const beyond = whole - minutesAhead(n.stop) - (ownDoor.get(n.stop.id) || 0) * minutesPerStop;
    return Math.max(now, n.departure + Math.max(0, beyond) * 60000);
  };

  /// Minutes from setting off to the last point the tour drives to.
  snap.plannedDuration = (now = Date.now()) => {
    const finish = snap.etaFinish(now);
    return finish == null ? null : (finish - (snap.pendingStart(now) ?? now)) / 60000;
  };

  return snap;
}

const fmtDuration = (minutes) => {
  const total = Math.round(minutes);
