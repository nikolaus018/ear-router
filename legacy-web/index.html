/// Called when the route in focus is replaced. Without it, opening a second
/// route while a filter is set would show that route already narrowed by a
/// word the driver typed for a different one — most likely as an empty list
/// with no obvious cause.
function resetStopFilter() {
  stopFilter.query = '';
}

function stopSearchBar() {
  return `
    <div role="search" class="pb-2">
      <label for="stop-search" class="sr-only">Kunde, Adresse, Paket oder Notiz in dieser Tour suchen</label>
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-black/55 text-[17px] flex pointer-events-none">${ICONS.search}</span>
        <input id="stop-search" type="search" value="${escapeAttr(stopFilter.query)}"
          placeholder="Kunde, Adresse, Paket oder Notiz"
          autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
          enterkeyhint="search" maxlength="${LIMITS.strasse}"
          oninput="onStopFilterInput(this.value)"
          class="w-full bg-black/[0.06] rounded-xl pl-10 pr-11 py-2.5 text-base placeholder:text-black/55 focus:outline-none focus:ring-2 focus:ring-brand-600" />
        <button data-stop-filter-clear type="button" onclick="clearStopFilter()" aria-label="Suche löschen" title="Suche löschen"
          class="${stopFilter.query ? '' : 'hidden'} tap-target press-95 absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full flex items-center justify-center text-[13px] text-black/55 bg-black/[0.08]">${ICONS.close}</button>
      </div>
    </div>
  `;
}

/// "3 von 27 Stopps". Lives in its own persistent `role="status"` element
/// rather than inside the list, so a screen reader hears the count change
/// instead of having every matching row read back on each keystroke.
function stopFilterStatusText() {
  const tokens = stopFilterTokens();
  const r = state.currentRoute;
  if (!tokens || !r) return '';
  const customers = r.stops.filter((s) => s.kind === 'customer');
  const shown = customers.filter((s) => stopMatches(s, tokens)).length;
  return `${shown} von ${customers.length} ${customers.length === 1 ? 'Stopp' : 'Stopps'}`;
}

/// The stop list, filtered or not.
///
/// Reads the route out of `state` rather than taking it as an argument so
/// `paintStopFilter` can rebuild this one block on a keystroke without going
/// anywhere near `render()`.
function stopListHtml({ animate = false } = {}) {
  const r = state.currentRoute;
  if (!r) return '';
  const stops = r.stops;
  const doors = sameDoorGroups(stops);
  const firstOpenIdx = firstOpenIndex(stops);
  // Identified by id, not by position in the list being rendered: a filtered
  // list has its own indices, and "next stop" is a fact about the route
  // rather than about what happens to be on screen.
  const nextId = firstOpenIdx >= 0 ? stops[firstOpenIdx].id : null;
  const tokens = stopFilterTokens();

  const row = (s, i) => {
    // Never staggered while filtering: the list is rebuilt on every
    // keystroke, and replaying the entrance animation each time makes it
    // flicker rather than narrow.
    const animIndex = animate && !tokens ? i : null;
    return renderStopRow(s, s.id === nextId, animIndex, doors);
  };

  if (!tokens) return `<div class="${GROUP}">${stops.map(row).join('')}</div>`;

  // Start/Lager/Ziel are dropped while filtering: they are not customers,
  // and leaving them above a single matching row reads as though they had
  // matched it.
  const matches = stops.filter((s) => s.kind === 'customer' && stopMatches(s, tokens));
  if (!matches.length) {
    return `
      <div class="${CARD} px-4 py-7 text-center">
        <span class="text-3xl flex justify-center mb-2 opacity-40">${ICONS.search}</span>
        <p class="text-[15px] font-medium text-black/70">Kein Stopp gefunden</p>
        <p class="text-[13px] text-black/55 mt-1 leading-snug">In dieser Tour passt kein Stopp zu „${escapeHtml(stopFilter.query.trim())}".</p>
      </div>`;
  }
  return `<div class="${GROUP}">${matches.map(row).join('')}</div>`;
}

/// Repaints exactly what the filter owns, and nothing else.
///
/// Deliberately not `render()`: that replaces all of #app's innerHTML, which
/// would tear out the field the driver is typing into and take the caret
/// with it — on every keystroke.
function paintStopFilter() {
  const filtering = stopFilterActive();
  document.querySelector('[data-stop-filter-clear]')?.classList.toggle('hidden', !stopFilter.query);
  const status = document.querySelector('[data-stop-filter-status]');
  if (status) {
    status.textContent = stopFilterStatusText();
    status.classList.toggle('hidden', !filtering);
  }
  const list = document.querySelector('[data-stop-list]');
  if (list) list.innerHTML = stopListHtml();
  const barSlot = document.querySelector('[data-next-stop-bar-slot]');
  if (barSlot) barSlot.innerHTML = nextStopBarHtml();
  const foot = document.querySelector('[data-route-foot]');
  if (foot) foot.innerHTML = routeFootHtml();
  paintEtas();
}

/// The "Nächster Stopp" banner, or nothing while the list is filtered.
///
/// It is a claim about the whole route and it scrolls to a row a narrowed
/// list may not be showing at all — so it stands down rather than offering a
/// jump that lands nowhere. Shared by the full render, the filter repaint and
/// `applyDeliveredDomPatch`, so those three can't disagree about when it is
/// there.
function nextStopBarHtml() {
  if (stopFilterActive()) return '';
  const stops = state.currentRoute?.stops || [];
  return nextStopBar(stops, firstOpenIndex(stops));
}

/// The "Route nicht aktuell" banner, or nothing. Split out of
/// `renderRouteDetail` for the same reason `nextStopBarHtml` was: the full
/// render and `patchRouteDetail` both need it, and two copies of the
/// condition are two things that can drift apart.
/// The customers the van is meant to drive to whose position is only the
/// middle of their district. Such a stop is no longer let onto a tour at
/// all (the server refuses the address and asks for a pin instead), so this
/// is about the ones that were there before — and about a tour never being
/// driven around a point where nobody lives.
const unplacedStops = (r) => (r?.stops || []).filter((s) => s.kind === 'customer' && !skipsDoor(s) && s.location_precision === 'district' && !s.pinned);

/// The way out for a stop that could not be placed: its form, opened on
/// the address, with the map as the fallback underneath.
function fixStopAddress(stopId) {
  const s = getStop(stopId);
  if (s) openAddSheet(s, { notFound: true });
}

function optimizeBannerHtml() {
  const r = state.currentRoute;
  const unplaced = unplacedStops(r);
  // This one stops the tour, so it does not look like the amber "not up to
  // date" beside it: red, by name, each with the one button that fixes it.
  if (unplaced.length) {
    return `
      <div class="blocker" role="alert">
        <p class="blocker-title"><span class="flex">${ICONS.warning}</span>${unplaced.length === 1 ? 'Eine Adresse wurde nicht gefunden' : `${unplaced.length} Adressen wurden nicht gefunden`}</p>
        <p class="blocker-text">Die Tour kann erst berechnet und gefahren werden, wenn ${unplaced.length === 1 ? 'diese Adresse stimmt' : 'diese Adressen stimmen'}. Meist ist es ein Tippfehler oder die falsche Postleitzahl.</p>
        ${unplaced.map((s) => `
          <div class="blocker-row">
            <span class="flex-1 min-w-0"><span class="block font-semibold truncate">${escapeHtml(s.kunde)}</span><span class="block text-[13px] truncate" style="opacity:.8">${escapeHtml(stopAddress(s))}</span></span>
            <button type="button" onclick="fixStopAddress(${s.id})" class="press-98 blocker-btn">${ICONS.pencil} Adresse korrigieren</button>
          </div>`).join('')}
      </div>`;
  }
  if (!r?.needs_optimize) return '';
  // Sorted by hand, only the line and the distances are stale: the order is
  // the driver's, and bringing the tour up to date leaves it alone.
  return `
    <button onclick="manualOptimize()" class="press-98 w-full flex items-center gap-3 text-left bg-warn/10 text-warnText px-4 py-2.5 rounded-xl mb-3">
      <span class="flex shrink-0 text-lg">${ICONS.warning}</span>
      <span class="flex-1 min-w-0">
        <span class="block text-[14px] font-semibold">Route nicht aktuell</span>
        <span class="block text-[12px]">${r.hand_ordered ? 'Linie und Distanzen stimmen nicht mehr.' : 'Reihenfolge und Distanzen stimmen nicht mehr.'}</span>
      </span>
      <span class="shrink-0 text-[14px] font-semibold underline">${r.hand_ordered ? 'Aktualisieren' : 'Optimieren'}</span>
    </button>`;
}

/// Under the stop list: what the whole tour comes to, and -- once every door
/// is answered for -- the button that closes it.
function routeFootHtml() {
  const r = state.currentRoute;
  if (!r || stopFilterActive()) return '';
  const complete = r.status === 'active' && r.customer_count > 0 && !r.stops.some(isOpenStop);
  return `
    ${r.total_km > 0 ? `<p class="now-caption" style="padding:.625rem .25rem 0">Gesamt ${fmtKm(r.total_km)} · ${fmtDuration(r.total_min)}</p>` : ''}
    ${complete ? `<button onclick="toggleRouteStatus()" class="press-98 wide-btn accent" style="margin-top:1rem">${ICONS.checkCircle} Tour abschließen</button>` : ''}`;
}

/// Repaints the route-detail screen in place — the stop list and every
/// header field that depends on the route's data — instead of `render()`'s
/// wholesale `#app.innerHTML` replace.
///
/// The broad sibling of `applyDeliveredDomPatch`: that one knows a single
/// stop changed and touches three rows, this one assumes the whole list may
/// have (a stop added or deleted, a reoptimization reordering everything, a
/// background refresh landing) and rebuilds it — but still leaves the
/// screen's frame, the scroll container and the tab bar alone.
///
/// What that buys, beyond the parse itself: the scroll position and search
/// caret never need saving and restoring (`renderScreen` does both by hand
/// purely because it destroys them), the large-title listener isn't torn
/// down and re-mounted, and the Karte tab's map element isn't detached and
/// re-attached. Those are all workarounds for the full replace, and none of
/// them run on this path.
///
/// Returns `false`, having touched nothing, when the route detail isn't what
/// is actually on screen — the driver is on Routen/Karte/Verlauf/Mehr, where
/// something else needs painting. Callers fall back to a full `render()`,
/// the same contract `applyDeliveredDomPatch` already uses.
function patchRouteDetail({ animate = false } = {}) {
  const r = state.currentRoute;
  if (!r || !isDetailShowing()) return false;

  const list = document.querySelector('[data-stop-list]');
  // No list element means the detail screen isn't built the way this
  // expects (a crash screen, or a render still in flight). Falling back is
  // safer than patching half a header onto a list that isn't there.
  if (!list) return false;

  // `textContent`, not the `escapeHtml(...)` + innerHTML the full render
  // uses: both titles are plain text, and assigning it directly is the same
  // result without routing the driver's own route name back through an HTML
  // parser.
  const large = document.querySelector('[data-large-title]');
  if (large) large.textContent = r.name;
  const compact = document.querySelector('[data-compact-title]');
  if (compact) compact.textContent = r.name;

  const optimizeSlot = document.querySelector('[data-optimize-slot]');
  if (optimizeSlot) optimizeSlot.innerHTML = optimizeBannerHtml();

  const countEl = document.querySelector('[data-delivered-count-text]');
  if (countEl) countEl.textContent = deliveryLine(r);
  const footEl = document.querySelector('[data-route-foot]');
  if (footEl) footEl.innerHTML = routeFootHtml();
  const progress = r.customer_count ? Math.round((r.delivered_count / r.customer_count) * 100) : 0;
  const barEl = document.querySelector('[data-progress-bar]');
  if (barEl) barEl.style.width = `${progress}%`;

  const barSlot = document.querySelector('[data-next-stop-bar-slot]');
  if (barSlot) barSlot.innerHTML = nextStopBarHtml();

  const filtering = stopFilterActive();
  document.querySelector('[data-stop-filter-clear]')?.classList.toggle('hidden', !stopFilter.query);
  const status = document.querySelector('[data-stop-filter-status]');
  if (status) {
    status.textContent = stopFilterStatusText();
    status.classList.toggle('hidden', !filtering);
  }

  list.innerHTML = stopListHtml({ animate });
  paintEtas();
  return true;
}

function closeRouteMenu() {
  const menu = document.getElementById('route-menu');
  if (!menu || menu.classList.contains('hidden')) return;
  const btn = document.getElementById('route-menu-btn');
  // Read before hiding: once the menu is `hidden` its buttons are no longer
  // focusable, and the browser has already dropped focus to <body>. Without
  // putting it back, dismissing the menu with Escape leaves a keyboard user
  // at the top of the document with no indication of where they were.
  const hadFocus = menu.contains(document.activeElement);
  menu.classList.add('hidden');
  btn?.setAttribute('aria-expanded', 'false');
  if (hadFocus) btn?.focus({ preventScroll: true });
}

function toggleRouteMenu() {
  let menu = document.getElementById('route-menu');
  if (!menu) return;
  // Drawn afresh on opening. A partial repaint of the list leaves the menu
  // as it was first drawn, and what it offers depends on the tour as it is
  // now: a pause on it or not, anything ticked to reset.
  if (menu.classList.contains('hidden') && state.currentRoute) {
    menu.outerHTML = renderRouteMenu();
    menu = document.getElementById('route-menu');
  }
  const open = menu.classList.toggle('hidden') === false;
  document.getElementById('route-menu-btn')?.setAttribute('aria-expanded', String(open));
  // Move into the menu when it opens so a keyboard user lands on the first
  // action rather than having to tab through the rest of the header.
  if (open) menu.querySelector('[role="menuitem"]')?.focus();
  else document.getElementById('route-menu-btn')?.focus({ preventScroll: true });
}

function renderRouteMenu() {
  const r = state.currentRoute;
  // Every item closes the menu before running its action. Most end in a
  // render() that rebuilds the (hidden) menu anyway — but the ones that
  // open a confirm sheet first do not, so cancelling out of "Route
  // löschen?" used to leave the menu still hanging open over the route.
  const item = (onclick, iconSvg, label, danger) => `<button onclick="closeRouteMenu(); ${onclick}" role="menuitem" class="w-full flex items-center gap-3 text-left px-4 py-3 text-[15px] ${danger ? 'text-red-600' : ''} active:bg-black/5">
    <span class="w-5 flex shrink-0 ${danger ? 'text-red-600' : 'text-black/55'}">${iconSvg}</span>${label}
  </button>`;
  // A row that cannot do anything now is shown and greyed, so the menu is the
  // same list every time it is opened.
  const off = (iconSvg, label) => `<button disabled role="menuitem" aria-disabled="true" class="w-full flex items-center gap-3 text-left px-4 py-3 text-[15px]" style="opacity:.35">
    <span class="w-5 flex shrink-0 text-black/55">${iconSvg}</span>${label}
  </button>`;
  const gap = `<div aria-hidden="true" style="height:6px; background:rgba(0,0,0,.06)"></div>`;
  const settled = r.stops.some((s) => s.outcome);
  return `
    <div id="route-menu" role="menu" aria-label="Weitere Aktionen" style="width: 17rem; max-height: 75vh; overflow-y: auto" class="hidden absolute right-0 top-10 bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl z-30 divide-y divide-black/10">
      ${item("openPreflightSheet()", ICONS.checkCircle, "Tour vorbereiten")}
      ${item("openReportSheet()", ICONS.doc, "Tagesabschluss")}
      ${gap}
      ${item("renderLadeliste()", ICONS.box, "Ladeliste")}
      ${item(`openGourmetSheet(${r.id})`, ICONS.download, "Stopps vom Zusteller-Portal laden")}
      ${gap}
      ${item("reoptimizeAfresh()", ICONS.refresh, "Neu optimieren")}
      ${r.customer_count < 2 && r.stops.filter((s) => s.kind === 'customer').length < 2 ? off(ICONS.sort, "Reihenfolge ändern") : item("openReorderSheet()", ICONS.sort, "Reihenfolge ändern")}
      ${item("recheckAddresses()", ICONS.mapPin, "Adressen prüfen")}
      ${r.status === 'completed' ? '' : r.stops.some((s) => s.kind === 'pause')
        ? item("setPause(false)", ICONS.cup, "Pause zu Hause entfernen")
        : item("previewPause()", ICONS.cup, "Pause zu Hause")}
      ${gap}
      ${item("renameRoute()", ICONS.pencil, "Umbenennen")}
      ${settled ? item("resetDelivered()", ICONS.refresh, "Lieferstatus zurücksetzen", true) : off(ICONS.refresh, "Lieferstatus zurücksetzen")}
      ${item("toggleRouteStatus()", r.status === 'completed' ? ICONS.back : ICONS.checkCircle, r.status === 'completed' ? 'Wieder aktivieren' : 'Tour abschließen')}
      ${gap}
      ${item("deleteRoute()", ICONS.trash, "Tour löschen", true)}
    </div>
  `;
}

// ---------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------
document.querySelectorAll('[data-logo-src]').forEach(img => img.src = APP_LOGO);

// ---------------------------------------------------------------------
// Zoom lock — the half of it that has to be JavaScript.
//
// `user-scalable=no` in the viewport meta is honored by Android/Chrome and
// has been ignored outright by iOS Safari since iOS 10, so on the platform
// this app mostly runs on these listeners *are* the mechanism. Safari
// reports a page pinch as its own `gesture*` events; cancelling those is
// what stops a stray two-finger touch leaving the app stuck at 1.4×.
//
// The map needs no exemption, and that is precisely why this is done with
// event handlers rather than a `touch-action: pan-x pan-y` blanket:
// MapLibre implements pinch and wheel zoom itself, from raw touch/wheel
// events, and never asks the browser to zoom. `preventDefault()` cancels
// the browser's default action without stopping propagation, so every one
// of these events still reaches MapLibre's own handlers intact. Pinching
// the map still zooms the map — it just no longer resizes the whole app
// around it at the same time.
//
// Not covered, because a page cannot: the desktop browser's own Ctrl/Cmd
// +/- keyboard zoom. That is browser chrome, it is not reachable from
// here, and it is not a gesture anyone hits by accident in a van.
// ---------------------------------------------------------------------
for (const gestureType of ['gesturestart', 'gesturechange', 'gestureend']) {
  document.addEventListener(gestureType, (e) => e.preventDefault(), { passive: false });
}
// A trackpad pinch (and Ctrl+scroll) arrives as a wheel event with ctrlKey
// set — the desktop equivalent of the above. MapLibre's own scroll zoom is
// plain-wheel and is unaffected either way.
document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

window.addEventListener('online', () => { toast('Wieder online', 'success'); refreshOnResume(); });
window.addEventListener('offline', () => toast('Keine Internetverbindung – Änderungen können nicht gespeichert werden.', 'error'));

document.addEventListener('visibilitychange', refreshOnResume);
// iOS restores a backgrounded standalone PWA from the back/forward cache,
// which in some versions skips visibilitychange entirely — pageshow is the
// event that always fires there.
window.addEventListener('pageshow', refreshOnResume);

document.addEventListener('click', (e) => {
  const menu = document.getElementById('route-menu');
  if (menu && !menu.classList.contains('hidden') && !e.target.closest('#route-menu') && !e.target.closest('#route-menu-btn')) {
    closeRouteMenu();
  }
});

// Top-level (not nested in the `if` block below) so `applyReview` can
// call `reloadForUpdateIfPending()` from wherever it's defined in the
// file — see the comments inside the `if` block for why this exists.
let reloadingForUpdate = false;
let reloadForUpdatePending = false;
function reloadForUpdateIfPending() {
  if (!reloadForUpdatePending || importController || reloadingForUpdate) return;
  reloadForUpdatePending = false;
  reloadingForUpdate = true;
  window.location.reload();
}

// Not fully offline-capable — adding/editing a stop still calls Nominatim/
// Wien-OGD (geocoding) and OSRM (routing) live, and the map needs its
// vector tiles from OpenFreeMap. What this buys: the app shell and any
// already-visited page load instantly from cache and still work with no
// connection at all. See /sw.js (served straight off disk the same way as
// this file — src/main.rs).
// ---------------------------------------------------------------------
// Last-resort reporting.
//
// Everything this app does deliberately has its own error path — `api()`
// turns network failures into sentences, every action's `catch` toasts, and
// `render()` has a fallback screen. What's left is what nobody planned for:
// a listener that throws, a promise nobody awaited, a browser API behaving
// differently than expected. Those used to be entirely silent, which for a
// driver means "I tapped it and nothing happened" with nothing to report to
// anyone afterwards.
//
// Deliberately quiet about detail (a stack trace helps no one in a van) and
// rate-limited, because the failure mode that matters here is a loop: one
// broken thing firing every frame must not paper the screen in toasts.
let lastUnexpectedErrorAt = 0;
function reportUnexpectedError(what, detail) {
  console.error(what, detail);
  const now = Date.now();
  if (now - lastUnexpectedErrorAt < 10000) return;
  lastUnexpectedErrorAt = now;
  toast('Unerwarteter Fehler. Wenn etwas fehlt, bitte die App neu laden.', 'error');
}
window.addEventListener('error', (e) => reportUnexpectedError('uncaught error', e.error || e.message));
window.addEventListener('unhandledrejection', (e) => {
  // An aborted request is not a fault: `api()` aborts in-flight fetches on
  // timeout and on deliberate cancel, and both are already reported by
  // whoever started them.
  if (e.reason?.code === 'aborted' || e.reason?.name === 'AbortError') return;
  reportUnexpectedError('unhandled rejection', e.reason);
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });

  // A deployed update installs and takes over immediately (the worker calls
  // skipWaiting/clients.claim), but the *page* keeps running whatever
  // JavaScript it started with. That leaves an old app talking to a new
  // server for as long as the driver keeps the tab open — which for an
  // installed PWA is days. Reloading once when control changes hands puts
  // the two back in step.
  //
  // The flag is the whole safety of this: a reload that itself triggers
  // another controllerchange would loop forever, and a reload loop on a
  // delivery app in the field is far worse than a stale tab.
  //
  // Only when a worker *replaces* another one. On a first-ever visit the
  // page starts with no controller at all, and the freshly installed worker
  // claiming it also fires `controllerchange` — reloading there would mean
  // every new install, and every visit after the caches are cleared, paying
  // a pointless second page load. There is nothing stale to correct in that
  // case: the JavaScript running *is* the JavaScript that was just fetched.
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloadingForUpdate) return;
    // Not during a save: an import can legitimately run for minutes, and a
    // reload mid-request abandons it with no way to know what landed. The
    // reload isn't dropped, only deferred — `applyReview`'s `finally`
    // calls `reloadForUpdateIfPending()` the moment the save settles, so a
    // deploy landing mid-import still gets picked up instead of leaving
    // this tab running stale JavaScript against a new server indefinitely
    // (which, for an installed PWA a driver might not close for days, is a
    // real gap — not just a theoretical one).
    if (importController) {
      reloadForUpdatePending = true;
      return;
    }
    reloadingForUpdate = true;
    window.location.reload();
  });
}

boot();
</script>
</body>
</html>
