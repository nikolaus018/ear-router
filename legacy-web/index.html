// would make "Gentzgasse 129/1" and "Gentzgasse 12/91" the same text. Digits
// and letters are otherwise untouched, so "9" and "9a" stay the different
// houses they are.
function normalizeMatchText(str) {
  return String(str || '')
    .trim().toLowerCase()
    .replace(/\s+/g, ' ')
    .replace(/str\.(\s|$|\d)/g, 'straße$1')
    .replace(/strasse\b/g, 'straße')
    // ß and the umlauts spelled out, as `address_match_key` in src/main.rs
    // does: "Doebling" finds "Döbling" on a keyboard without the dots.
    .replace(/ß/g, 'ss').replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue')
    .replace(/[^\p{L}\p{N}]+/gu, ' ')
    .trim();
}

// Mirrors `addr_key` in src/main.rs closely enough to catch the case that
// matters here: the same address typed twice with different spellings of
// "Straße". Only used to decide whether to ask a question — the server
// remains the authority on what actually matches what.
function addrKey(strasse, plz) {
  return `${normalizeMatchText(strasse)}|${String(plz || '').trim()}`;
}

async function submitStop(form, stopId) {
  const kunde = form.kunde.value.trim();
  const strasse = form.strasse.value.trim();
  const plz = form.plz.value.trim();
  const paket = form.paket.value.trim();
  const notiz = form.notiz.value.trim();
  const telefon = form.telefon.value.trim();
  if (!kunde || !strasse || !plz) { toast('Bitte Kunde, Straße und Postleitzahl ausfüllen.', 'error'); return; }
  if (!/^[1-9]\d{3}$/.test(plz)) { toast('Die Postleitzahl hat vier Ziffern, z.B. 1100.', 'error'); return; }

  lastUsedPlz = plz;
  const data = { kunde, strasse, plz, paket, notiz, telefon, stopId };
  // closeSheet() first, always: the confirm dialog below shares #modal-root
  // with this sheet, so closing afterwards would wipe the dialog out of the
  // DOM while it's still being awaited.
  closeSheet();

  // Two menus for the same address on one route is occasionally real (two
  // flats in one building) and much more often a double entry — worth one
  // question, not worth blocking.
  const key = addrKey(strasse, plz);
  const duplicate = state.currentRoute?.stops?.find(
    (s) => s.kind === 'customer' && s.id !== stopId && addrKey(s.strasse, s.plz) === key
  );
  if (duplicate) {
    const ok = await confirmSheet({
      title: 'Adresse schon in der Tour',
      message: `„${duplicate.kunde}" steht bereits unter ${strasse}, ${plz}. Trotzdem hinzufügen?`,
      confirmLabel: 'Trotzdem',
    });
    if (!ok) { openAddSheet(stopId ? { ...data, id: stopId } : data); return; }
  }

  await sendStop(data);
}

async function sendStop(data, coords) {
  // Geocoding can take well over a second — captures the route this stop
  // was meant for so a driver who's since navigated to a different route
  // doesn't get that route's screen silently overwritten (or, on failure,
  // a pin-drop sheet popped open for a route they're no longer looking at)
  // once this finally resolves.
  // The pin-drop sheet can outlive the route it was opened for (the driver
  // is free to close it and navigate away, then come back and confirm the
  // pin), so this genuinely can run with no route in focus.
  if (!state.currentRoute) { toast('Keine Tour ausgewählt.', 'error'); return; }
  const routeId = state.currentRoute.id;
  const payload = { kunde: data.kunde, strasse: data.strasse, plz: data.plz, paket: data.paket, notiz: data.notiz };
  // Only when the form carried one: the pin-drop retry path passes plain
  // stop data through here, and a missing field must not clear the number.
  if (data.telefon !== undefined) payload.telefon = data.telefon || '';
  if (coords) { payload.lat = coords.lat; payload.lon = coords.lon; }
  const body = JSON.stringify(payload);

  const seq = nextSeq();
  showProgress(data.stopId ? 'Adresse wird aktualisiert …' : 'Stopp wird hinzugefügt …');
  try {
    const updated = data.stopId
      ? await api(`/stops/${data.stopId}`, { method: 'PATCH', body })
      : await api(`/routes/${routeId}/stops`, { method: 'POST', body });
    if (!applyRouteUpdate(seq, routeId, updated)) {
      // Saved, but there is nothing on screen to redraw it into: the driver
      // moved to a different route while this was in flight, or a newer
      // reply already landed. Confirm it anyway — a form that was submitted
      // and then answered with complete silence reads as "that didn't work",
      // and the obvious response to that is to enter the same stop again.
      toast(data.stopId ? 'Stopp aktualisiert ✓' : 'Stopp hinzugefügt ✓', 'success');
      return;
    }
    // A stop that was just *added* almost never matches whatever the list
    // happens to be filtered by, so leaving the filter on would answer
    // "Stopp hinzugefügt ✓" with a list the new stop is nowhere in — and the
    // obvious response to that is to add it a second time. An *edit* keeps
    // the filter: that stop was found through it, and the driver is working
    // their way down a narrowed list.
    if (!data.stopId) resetStopFilter();
    // Skips the staggered row-enter replay across the whole list for what
    // is, from the driver's point of view, a one-row add/edit — the same
    // reasoning `toggleDelivered` already applies below.
    patchRouteDetail() || render(true);
    if (navigator.vibrate) navigator.vibrate(15);
    if (coords) toast('Standort manuell gesetzt ✓', 'success');
    else toast(data.stopId ? 'Stopp aktualisiert ✓' : 'Stopp hinzugefügt ✓', 'success');
  } catch (err) {
    // The register knows this address, just in another district — the
    // dropdown was left on the wrong one (see `geocode_error_wrong_district`
    // on the server). The form comes back with the right district already
    // selected, so the fix is one tap on "Speichern" rather than a hunt
    // through 23 entries. The message still says what happened; nothing is
    // corrected silently.
    if (!coords && err.code === 'wrong_district' && state.currentRoute?.id === routeId) {
      const suggested = err.plz;
      toast(err.message, 'warning', 8000);
      const corrected = suggested && DISTRICT_BY_PLZ[suggested] ? { ...data, plz: suggested } : data;
      openAddSheet(corrected.stopId ? { ...corrected, id: corrected.stopId } : corrected);
      return;
    }
    if (!coords && err.code === 'address_not_found' && state.currentRoute?.id === routeId) {
      openAddSheet(data.stopId ? { ...data, id: data.stopId } : data, { notFound: true });
      return;
    }
    // The lookup itself is down — nothing about the address to correct.
    if (!coords && err.code === 'geocode_unavailable' && state.currentRoute?.id === routeId) {
      toast('Die Adresssuche ist gerade nicht erreichbar. Später noch einmal versuchen — oder den Pin von Hand setzen.', 'warning', 8000);
      openPinDropSheet(data);
      return;
    }
    // Everything the driver typed lives only in `data` at this point — the
    // sheet was closed before the request went out. Losing a connection
    // must not also lose the address they just keyed in one-handed in a
    // van, so the form comes back with every field exactly as it was and
    // the error explains why. Without this, "Server nicht erreichbar" and
    // a blank slate were the same event.
    toast(err.message, 'error');
    if (state.currentRoute?.id === routeId) {
      openAddSheet(data.stopId ? { ...data, id: data.stopId } : data);
    }
  } finally {
    hideProgress();
  }
}

// Patches exactly the DOM a delivered-toggle can affect — the tapped row,
// the (at most two) rows a "next stop" handoff touches, the next-stop
// banner, and the progress header — instead of `render()`'s full
// innerHTML replace-and-reparse of the whole stop list. This is the app's
// single most-tapped action, so on a route with dozens of stops the saved
// work compounds all shift long.
//
// Returns `false` (having touched nothing) when the route-detail screen
// for the current route isn't actually what's on screen — most
// realistically the driver switched to the Karte tab or backed out to the
// Routen list while a toggle was still in flight, in which case whatever
// *is* visible (map markers, a route card's counts) needs the full
// `render()` this was called instead of, and the caller falls back to it.
function applyDeliveredDomPatch(stopId) {
  const r = state.currentRoute;
  if (!r || !isDetailShowing()) return false;

  const stops = r.stops;
  const firstOpenIdx = firstOpenIndex(stops);
  const newNextId = firstOpenIdx >= 0 ? stops[firstOpenIdx].id : null;
  const oldNextRow = document.querySelector('[data-next-stop]');
  const oldNextId = oldNextRow ? Number(oldNextRow.getAttribute('data-stop-row')) : null;
  const doors = sameDoorGroups(stops);

  const patchRow = (id) => {
    const el = document.querySelector(`[data-stop-row="${id}"]`);
    const stop = stops.find(s => s.id === id);
    if (!el || !stop) return false;
    // Replacing a row destroys its elements, and with them the focus of
    // anyone driving this app from a keyboard or a screen reader: pressing
    // Enter on a stop's delivered toggle dropped the caret to the top of the
    // document every single time, on the app's most-used control. The
    // equivalent element in the rebuilt row is found by its position among
    // the row's focusables, which is stable — a customer row always renders
    // the same three, in the same order (the row itself, the toggle, the
    // maps link).
    const focusedIndex = Array.from(el.querySelectorAll(FOCUSABLE)).indexOf(document.activeElement);
    el.outerHTML = renderStopRow(stop, id === newNextId, null, doors);
    if (focusedIndex >= 0) {
      const rebuilt = document.querySelector(`[data-stop-row="${id}"]`);
      rebuilt?.querySelectorAll(FOCUSABLE)[focusedIndex]?.focus({ preventScroll: true });
    }
    return true;
  };

  // The tapped row is the one thing guaranteed to need a patch; if its
  // element isn't even on screen, this isn't the render this route is
  // currently showing (a stale call, or `stops` doesn't contain it), and
  // the safest thing is to fall back to a full render rather than leave
  // the next-stop banner/progress header patched against a list that
  // wasn't actually touched.
  if (!patchRow(stopId)) return false;
  if (oldNextId !== newNextId) {
    if (oldNextId !== null && oldNextId !== stopId) patchRow(oldNextId);
    if (newNextId !== null && newNextId !== stopId) patchRow(newNextId);
  }

  const barSlot = document.querySelector('[data-next-stop-bar-slot]');
  if (barSlot) barSlot.innerHTML = nextStopBarHtml();

  const countEl = document.querySelector('[data-delivered-count-text]');
  if (countEl) countEl.textContent = deliveryLine(r);
  const progress = r.customer_count ? Math.round((r.delivered_count / r.customer_count) * 100) : 0;
  const barEl = document.querySelector('[data-progress-bar]');
  if (barEl) barEl.style.width = `${progress}%`;
  const foot = document.querySelector('[data-route-foot]');
  if (foot) foot.innerHTML = routeFootHtml();

  paintEtas();
  return true;
}

// Optimistic — the delivered-toggle is the single most-tapped action in
// the app, so it flips instantly instead of waiting on a network
// round-trip, then reconciles with the server response in the background.
// Safe to predict: toggling delivered never reorders stops or changes
// route geometry (see update_stop in src/main.rs), only the flag itself
// and delivered_count move. Reverts precisely on failure; guards against
// the driver having navigated to a different route before the response
// lands, so a slow/failed request can never stomp whatever's on screen by
// then.
/// The plain tick: on means geliefert, off means not answered for yet.
function toggleDelivered(stopId, delivered) {
  return setOutcome(stopId, delivered ? 'delivered' : null);
}

/// Everything in the route a tick can change besides the ticked row itself:
/// which stops there are, in what order, and what each one's answer is.
const outcomeSignature = (r, exceptId) =>
  r.stops.map((s) => `${s.id}:${s.id === exceptId ? '' : s.outcome || ''}`).join(',');

async function setOutcome(stopId, outcome) {
  const route = state.currentRoute;
  if (!route) return;
  const stop = route.stops.find((s) => s.id === stopId);
  if (!stop) return;
  const delivered = handedOver(outcome);

  const prevOutcome = stop.outcome || null;
  const prevDelivered = stop.delivered;
  // A generation counter per stop, not just the presence of a
  // `pendingDelivered` entry: a rapid double-tap of the same checkbox
  // starts a second request while the first is still in flight, and
  // whichever settles first must not clear a prediction the *other* one is
  // still relying on — only the response matching this call's own
  // generation is allowed to clear/revert it below.
  const gen = (pendingDeliveredGen.get(stopId) || 0) + 1;
  pendingDeliveredGen.set(stopId, gen);
  pendingDelivered.set(stopId, outcome);
  stop.outcome = outcome;
  stop.delivered = delivered;
  // The arrival times are counted from the last tick, so the prediction
  // carries the time too; the server's own stamp replaces it a moment later.
  stop.settled_at = outcome ? new Date().toISOString() : null;
  recountRoute(route);
  // The list screens read their counts from `state.routes`, not from the
  // route in focus — without this the prediction only shows on the detail
  // screen, and backing out to Routen before the server answers shows the
  // old count next to a row the driver just ticked off.
  syncRouteSummary();
  applyDeliveredDomPatch(stopId) || render(true);
  if (navigator.vibrate) navigator.vibrate(delivered ? [12, 40, 12] : 12);
  // On Jetzt the stop is off the screen as soon as it is answered for, so
  // the way back has to follow it. In the list the row is still there, with
  // its tick to tap again.
  if (outcome && state.tab === 'now' && !isDetailShowing()) offerUndo(stop, outcome);
  else dismissUndo();

  // The exact moment a second package at the same door is easiest to
  // miss: right after marking the first one delivered, about to walk back
  // to the car. The badge on the row (see `renderCustomerRow`) covers
  // "browsing the list", but this covers "standing at the door" — a loud
  // toast + distinct vibration pattern for the specific case that still
  // needs a driver's attention, not just a quiet visual that's easy to
  // have already scrolled past.
  if (delivered && stop.kind === 'customer') {
    // The same memoized grouping the on-row badge uses (see
    // `sameDoorGroups`), so "same door" means one thing everywhere in the
    // app — including the pair of stops whose addresses are written
    // differently but resolve to one point.
    const door = sameDoorGroups(route.stops).get(stopId);
    if (door && door.length > 1) {
      // Every still-open sibling, not just the first: three stops can share
      // one door (a household ordering three different diet menus), and
      // naming one of them would leave the others unmentioned even though
      // the on-row badge counts them all.
      const openSiblings = route.stops.filter(
        (s) => s.id !== stopId && !s.outcome && door.includes(s.id)
      );
      if (openSiblings.length) {
        const names = openSiblings.map((s) => s.kunde).join(', ');
        const noun = openSiblings.length > 1 ? 'Pakete' : 'ein Paket';
        toast(`⚠ Noch ${noun} an dieser Adresse offen — ${names}`, 'warning', 9000);
        if (navigator.vibrate) navigator.vibrate([15, 60, 15, 60, 15]);
      }
    }
  }

  // "Ins Lager mitnehmen" takes the door out of the tour, and taking it back
  // puts it in again — the server plans the route afresh for either, which
  // takes as long as OSRM does.
  const replans = skipsDoor(stop) !== (stop.kind === 'customer' && (prevOutcome === 'toLager' || prevOutcome === 'cancelled'));
  if (replans) showProgress('Tour wird neu geplant …');

  const seq = nextSeq();
  const before = outcomeSignature(route, stopId);
  try {
    // `retry: true`: this PATCH is a pure "set this stop to this answer"
    // (see `record_outcome` in src/main.rs) — sending it twice lands on the
    // same row in the same state, so it is safe to resend in a way the
    // app's creating POSTs are not. Opted in because this is the single
    // most-tapped action in the app AND the one taken in the worst possible
    // conditions: standing between buildings, phone handing over between
    // cells. Without it a dropped packet flips the tick back and shows an
    // error for something that was about to work.
    const updated = await api(`/stops/${stopId}`, { method: 'PATCH', retry: true, body: JSON.stringify({ outcome: outcome || 'open' }) });
    // Confirmed: this stop's own request has been answered, so the
    // prediction for it is no longer needed to hold the screen steady —
    // unless a newer tap for the same stop has since started, in which
    // case this reply is stale and must not clear *its* prediction.
    if (pendingDeliveredGen.get(stopId) === gen) pendingDelivered.delete(stopId);
    if (!applyRouteUpdate(seq, route.id, updated)) return;
    // One row, unless the answer moved something else too: the Lager ticked
    // along with the first door, or the list in a new order after a re-plan.
    const sameElsewhere = outcomeSignature(state.currentRoute, stopId) === before && !replans;
    (sameElsewhere && applyDeliveredDomPatch(stopId)) || patchRouteDetail() || render(true);
  } catch (err) {
    if (pendingDeliveredGen.get(stopId) === gen) pendingDelivered.delete(stopId);
    // Looked up fresh, not the `route`/`stop` captured at the top of this
    // call: a route refresh that landed while this request was in flight
    // (`refreshOnResume` after the driver backgrounded the app, most
    // realistically) replaces `state.currentRoute` with a new object
    // entirely. Reverting the *old* object's stop would silently leave the
    // checkmark on screen — the one actually rendered — stuck showing the
    // optimistic value forever, with no correction and no visible link to
    // this error toast.
    const currentRoute = state.currentRoute;
    if (currentRoute?.id === route.id) {
      const currentStop = currentRoute.stops.find((s) => s.id === stopId);
      if (currentStop) { currentStop.outcome = prevOutcome; currentStop.delivered = prevDelivered; }
      // Derived, never nudged: a count adjusted by ±1 through a sequence of
      // races ends up describing a route that doesn't exist.
      recountRoute(currentRoute);
      syncRouteSummary();
      applyDeliveredDomPatch(stopId) || render(true);
    }
    toast(err.message, 'error');
  } finally {
    if (replans) hideProgress();
  }
}

// NOTE for call sites: the confirm dialog and the bottom sheets share one
// `#modal-root`, so anything that calls this from inside an open sheet has
// to `closeSheet()` *first*. Calling it after (`deleteStop(id);
// closeSheet();`) wipes the confirm dialog this function is still awaiting
// out of the DOM the moment it appears — the promise then never settles
// and the stop is never deleted.
async function deleteStop(stopId) {
  const ok = await confirmSheet({ title: 'Stopp entfernen?', message: 'Der Stopp wird aus dieser Tour gelöscht.', confirmLabel: 'Entfernen', danger: true });
  if (!ok) return;
  await refreshCurrentRoute(() => api(`/stops/${stopId}`, { method: 'DELETE' }), 'Stopp wird entfernt …');
}

// Each of these captures the route's id *before* its confirm/prompt sheet
// (and then the network request) resolves, and checks it again afterward —
// the driver is free to close the sheet/navigate to a different route
// while either is pending, and without the check a slow response could
// silently overwrite (or, for deleteRoute, close) whatever route they've
// since navigated to instead of the one this action was actually for.
async function renameRoute() {
  const routeId = state.currentRoute?.id;
  if (routeId == null) return;
  const name = await promptSheet({ title: 'Tour umbenennen', initial: state.currentRoute.name });
  if (name === null) return;
  if (!name.trim()) { toast('Name darf nicht leer sein.', 'error'); return; }
  const seq = nextSeq();
  showProgress();
  try {
    const updated = await api(`/routes/${routeId}`, { method: 'PATCH', retry: true, body: JSON.stringify({ name: name.trim() }) });
    // Renaming touches only the header text, never the stop list — a full
    // staggered row-enter replay across every stop for a header-only edit
    // reads as "the list just reloaded" when nothing in it did.
    if (applyRouteUpdate(seq, routeId, updated)) patchRouteDetail() || render(true);
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

async function resetDelivered() {
  const routeId = state.currentRoute?.id;
  if (routeId == null) return;
  // Settled, not delivered: this clears a "nicht angetroffen" too, and a
  // dialog that promised to reset three stops while quietly reopening five
  // would be understating what the button does.
  const n = state.currentRoute.stops.filter((s) => s.outcome).length;
  const what = n === 1 ? '1 abgehakter Stopp wird wieder auf offen gesetzt' : `${n} abgehakte Stopps werden wieder auf offen gesetzt`;
  const message = state.currentRoute.status === 'completed' ? `${what}, und die Tour wird wieder aktiviert.` : `${what}.`;
  const ok = await confirmSheet({ title: 'Lieferstatus zurücksetzen?', message, confirmLabel: 'Zurücksetzen', danger: true });
  if (!ok) return;
  const seq = nextSeq();
  showProgress();
  try {
    // A POST, but one that sets every stop on the route to not-delivered —
    // running it twice is the same as running it once, which is what makes
    // opting in safe here where the app's other POSTs (which create things)
    // could not.
    const updated = await api(`/routes/${routeId}/reset-delivered`, { method: 'POST', retry: true });
    // The Ladeliste starts the day again with the doors: its ticks outliving
    // the reset opened a tour driven again with yesterday's boxes already
    // marked as loaded.
    ladelisteChecked.delete(routeId);
    saveLadelisteChecked();
    if (!applyRouteUpdate(seq, routeId, updated)) return;
    patchRouteDetail({ animate: true }) || render();
    toast('Lieferstatus zurückgesetzt ✓', 'success');
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

async function toggleRouteStatus() {
  const routeId = state.currentRoute?.id;
  if (routeId == null) return;
  // Not asked about first, as on the iOS app: finishing is followed by the
  // Tagesabschluss, and "Wieder aktivieren" in the same menu takes it back.
  const newStatus = state.currentRoute.status === 'completed' ? 'active' : 'completed';
  const seq = nextSeq();
  showProgress();
  try {
    const updated = await api(`/routes/${routeId}`, { method: 'PATCH', retry: true, body: JSON.stringify({ status: newStatus }) });
    if (!applyRouteUpdate(seq, routeId, updated)) return;
    // A completed route belongs in Verlauf and an active one in Routen, so
    // the detail screen follows it across rather than being left in a tab
    // whose list no longer contains it.
    state.tab = 'routes';
    state.detailOrigin = state.tab;
    render();
    if (newStatus === 'completed') openReportSheet();
    else toast('Tour wieder aktiv ✓', 'success');
    // A tour just finished is one more to learn door times from.
    loadPaceHistory();
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

async function deleteRoute() {
  const routeId = state.currentRoute?.id;
  if (routeId == null) return;
  const ok = await confirmSheet({ title: 'Tour löschen?', message: `„${state.currentRoute.name}" wird mit allen Stopps endgültig gelöscht. Das kann nicht rückgängig gemacht werden.`, confirmLabel: 'Löschen', danger: true });
  if (!ok) return;
  showProgress('Tour wird gelöscht …');
  try {
    await api(`/routes/${routeId}`, { method: 'DELETE' });
    // Ladeliste ticks for a route that no longer exists describe a van
    // loaded for a job that isn't happening.
    ladelisteChecked.delete(routeId);
    saveLadelisteChecked();
    // Close the detail screen *before* reloading the list: closeDetail()
    // renders, and rendering a detail screen for a route that no longer
    // exists would read its stops off an object the server has forgotten.
    if (state.currentRoute?.id === routeId) closeDetail();
    // Only *after* that close, never before it: render() opens by writing
    // the outgoing screen's scroll offset under `renderedScreenKey`, which
    // is still this route's detail screen until closeDetail() has run. Drop
    // the entry any earlier and the very next render puts it straight back.
    forgetScrollMemory(`detail:${routeId}`);
    await loadRoutes();
    toast('Tour gelöscht ✓', 'success');
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

// Re-resolves every address on the route against the geocoders as they are
// today, and says what changed.
//
// Worth its own action because a stop's coordinates are worked out once,
// when it is entered, and never looked at again — so a route that was built
// before the resolver learned something (Stiegen, Kleingarten-Parzellen,
// refusing a confident answer for the wrong district) keeps the pins it was
// given, including the wrong ones. This is how a driver gets those fixed
// without re-typing the route.
//
// Hand-placed pins are left alone by the server; the summary says how many.
async function recheckAddresses() {
  const routeId = state.currentRoute?.id;
  if (routeId == null) return;
  const ok = await confirmSheet({
    title: 'Adressen neu prüfen?',
    message: 'Jede Kundenadresse dieser Tour wird noch einmal im Adressregister nachgeschlagen. Selbst gesetzte Pins bleiben unverändert. Das kann eine Minute dauern.',
    confirmLabel: 'Prüfen',
  });
  if (!ok) return;
  const seq = nextSeq();
  showProgress('Adressen werden geprüft — bitte nicht schließen …');
  try {
    const data = await api(`/routes/${routeId}/recheck-addresses`, { method: 'POST', timeoutMs: API_TIMEOUT_LONG_MS });
    const report = data?.report || {};
    if (!applyRouteUpdate(seq, routeId, data?.route)) return;
    render();
    // Spelled out rather than a bare "done": the whole point is that the
    // driver knows which stops moved and which still need a human look.
    const parts = [];
    parts.push(report.moved ? `${report.moved} Stopp(s) korrigiert` : 'Keine Änderungen');
    if (report.approximate) parts.push(`${report.approximate} weiterhin nur ungefähr (≈)`);
    if (report.skipped_pinned) parts.push(`${report.skipped_pinned} selbst gesetzte(r) Pin unverändert`);
    toast(`${parts.join(' · ')}`, report.moved ? 'success' : 'info', 7000);
    if (report.unresolved?.length) {
      toast(`Nicht gefunden, bitte prüfen: ${report.unresolved.slice(0, 4).join(', ')}${report.unresolved.length > 4 ? ' …' : ''}`, 'warning', 12000);
    }
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

/// `afresh` asks for a new order whatever the tour's own is. Without it a
/// tour sorted by hand keeps its order and only gets its line and distances
/// again -- "Aktualisieren", where a tour the app ordered gets "Optimieren".
async function manualOptimize(afresh = false) {
  const route = state.currentRoute;
  if (!route) return;
  // Nothing to ask the server it would only refuse: say what is in the way.
  const unplaced = unplacedStops(route);
  if (unplaced.length) {
    toast(`Erst die Adresse von „${unplaced[0].kunde}“${unplaced.length > 1 ? ` und ${unplaced.length - 1} weiteren` : ''} korrigieren — sie wurde nicht gefunden.`, 'error', 7000);
    document.querySelector('.blocker')?.scrollIntoView({ block: 'center', behavior: scrollBehavior() });
    return;
  }
  const keepOrder = route.hand_ordered && !afresh;
  // A tour that starts where the driver is has to be told where that is.
  await sendPositionIfStartingHere(route, route.stops.some((s) => s.kind === 'start' && s.excluded));
  await refreshCurrentRoute(
    () => api(`/routes/${route.id}/optimize${keepOrder ? '?keep_order=1' : ''}`, { method: 'POST' }),
    keepOrder ? 'Route wird aktualisiert …' : 'Route wird optimiert …');
}

/// "Neu optimieren" in the tour's menu. An order the driver made by hand is
/// not thrown away without asking.
async function reoptimizeAfresh() {
  const route = state.currentRoute;
  if (!route) return;
  if (route.hand_ordered) {
    const ok = await confirmSheet({ title: 'Neu optimieren?', message: 'Deine eigene Reihenfolge wird durch die optimierte ersetzt.', confirmLabel: 'Neu optimieren' });
    if (!ok) return;
  }
  await manualOptimize(true);
}

// "App neu laden" in Mehr: what is kept on this phone of the app itself goes
// -- the app's files and the map tiles -- and the page is fetched again. The
// row used to empty those and stop there, with the same app still on screen:
// a button called "neu laden" that reloaded nothing.
async function reloadApp() {
  const ok = await confirmSheet({ title: 'App neu laden?', message: 'Die App wird frisch vom Server geholt. Deine Touren bleiben erhalten.', confirmLabel: 'Neu laden' });
  if (!ok) return;
  showProgress('App wird neu geladen …');
  try {
    const names = await caches.keys();
    await Promise.all(names.map((n) => caches.delete(n)));
  } catch (_) { /* no cache storage here (private mode) -- the reload still helps */ }
  window.location.reload();
}

// ---------------------------------------------------------------------
// Generic bottom-sheet shell — shared by the add/edit-stop sheet, the
// JSON-import sheet and the pin-drop fallback.
// ---------------------------------------------------------------------
// Bound once, not per sheet-open: `#modal-root` is a persistent node
// `renderSheetShell` never recreates (only its `innerHTML`), so a listener
// attached inside that function on every call — as this one used to be —
// stacks a duplicate on every single add/edit-stop, JSON-import, and
// Ladeliste open for the life of the page. A driver who opens 30-40 sheets
// over a shift (routine for this app) ended up with 30-40 permanent
// duplicate `focusin` handlers, each independently scheduling a
// `scrollIntoView` on every future field focus — a real, unbounded leak on
// a PWA meant to stay open all day. Attached once at module load instead,
// against the one `#modal-root` element that always exists.
document.getElementById('modal-root').addEventListener('focusin', (e) => {
  // The on-screen keyboard covers roughly the bottom half of the screen,
  // and iOS does not shrink the visual viewport for a `position: fixed`
  // sheet — so focusing Notiz on a phone puts the caret in a field the
  // driver cannot see while typing into it. Scrolling the focused field to
  // the middle of the sheet is what keeps it visible.
  if (!e.target.matches('input, textarea, select')) return;
  setTimeout(() => e.target.scrollIntoView({ block: 'center', behavior: scrollBehavior() }), 250);
});

function renderSheetShell(bodyHtml, { scrollable = true, label = '' } = {}) {
  rememberFocusBeforeModal();
  const root = document.getElementById('modal-root');
  // Whatever sheet was up is about to be replaced wholesale by the
  // innerHTML below. If it was the pin-drop sheet, its map goes with it —
  // and a MapLibre instance whose element is torn out from under it is not
  // garbage: it keeps its WebGL context, its GPU buffers and its event
  // listeners. Browsers cap live WebGL contexts (around 16), and losing the
  // *oldest* one is how they enforce that — which on this app is the Karte
  // tab's own map, the one thing kept alive for the whole session. Enough
  // pin drops in a shift and the driver's map goes permanently blank with
  // no error. `closeSheet` already does this on the paths that go through
  // it; this covers a sheet replaced directly by another sheet.
  if (pinDropMap) { try { pinDropMap.remove(); } catch (_) { /* already gone */ } pinDropMap = null; pinDropMarker = null; }
  root.innerHTML = `
    <div class="fixed inset-0 z-50 flex items-end justify-center" style="bottom: var(--kb, 0px)" role="dialog" aria-modal="true" ${label ? `aria-label="${escapeAttr(label)}"` : ''}>
      <div id="sheet-backdrop" class="sheet-backdrop absolute inset-0 bg-black/30" onclick="closeSheet()"></div>
      <div class="sheet-panel relative w-full max-w-md bg-[#F2F2F7] rounded-t-3xl flex flex-col ${scrollable ? 'max-h-[92vh]' : ''} shadow-sheet" style="padding-bottom: calc(env(safe-area-inset-bottom) * var(--kb-off, 1) + 1.25rem); ${scrollable ? 'max-height: calc(var(--vvh, 100vh) * .92)' : ''}">
        <div class="w-9 h-1.5 bg-black/15 rounded-full mx-auto mt-3 mb-1 shrink-0"></div>
        <div class="${scrollable ? 'overflow-y-auto momentum' : ''} px-5 pt-3">${bodyHtml}</div>
      </div>
    </div>
  `;
  onModalEscape = closeSheet;
  updateHistoryGuard();
  // A toast already on screen has to move too — a sheet opening under one
  // parked at the bottom would put it straight over the sheet's buttons.
  positionToasts();
}

// The on-screen keyboard shrinks only the visual viewport, so a sheet pinned
// to the layout viewport would sit half behind it and its list would run
// under the keys. Track the visible area and let the sheet end above them.
(function trackKeyboard() {
  const vv = window.visualViewport;
  if (!vv) return;
  const update = () => {
    // Only while a field has focus: in a home-screen launch the two viewports
    // can differ by a few dozen px with no keyboard anywhere, and that must
    // not lift the sheet.
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
    const kb = typing ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
    const root = document.documentElement.style;
    root.setProperty('--kb', `${kb > 80 ? kb : 0}px`);
    root.setProperty('--kb-off', kb > 80 ? '0' : '1');
    root.setProperty('--vvh', `${vv.height}px`);
    document.documentElement.classList.toggle('kb-open', kb > 80);
  };
  vv.addEventListener('resize', update);
  vv.addEventListener('scroll', update);
  document.addEventListener('focusin', update);
  document.addEventListener('focusout', () => setTimeout(update, 50));
  update();
})();

function closeSheet() {
  // A load from Gourmet in flight has deliberately locked the sheet (see
  // `importController`) — Escape and the back button must not be a way
  // around that. Its own Abbrechen button is.
  if (importController) return;
  document.getElementById('modal-root').innerHTML = '';
  onModalEscape = null;
  if (pinDropMap) { pinDropMap.remove(); pinDropMap = null; pinDropMarker = null; }
  restoreFocusAfterModal();
  updateHistoryGuard();
  positionToasts();
}

// ---------------------------------------------------------------------
// Add / edit stop — a single-stop form (POST /stops or PATCH /stops/:id).
// Bulk-editing the whole route as JSON is a separate, deliberately
// separate flow reachable only from the route's "..." menu ("Als JSON
// bearbeiten") — see update_route_from_json in src/main.rs — not offered
// here too, so there's exactly one place to reach for each: "+" always
// means "one stop", "..." always means "the whole route".
// ---------------------------------------------------------------------
/// `notFound` opens the form on an address the lookup could not place: it
/// says so at the top, puts the caret in the street, and offers the map as
/// the second way out. Correcting the address comes first — a typo fixed is
/// an exact position and an entrance to navigate to, where a pin is one
/// person's guess at a roof.
function openAddSheet(stop, { notFound = false } = {}) {
  renderManualForm(stop, { notFound });
  if (notFound) setTimeout(() => { const f = document.querySelector('#stop-form [name=strasse]'); f?.focus(); f?.select?.(); }, 80);
  else if (!stop?.id) setTimeout(() => document.querySelector('#stop-form [name=kunde]')?.focus(), 80);
}

// Every gesture that opens "the sheet for this stop" comes through here.
// Start/Lager/Ziel have nothing editable about them — the address is fixed
// and the server rejects changing it — so they get their own sheet with the
// one decision that *is* theirs to make, whether this tour drives them at
// all. `stop` is sometimes a plain form-data object with no `kind` at all
// (the retry path in `sendStop`), which is always a customer stop.
function openStopSheet(stop) {
  if (stop?.kind && stop.kind !== 'customer') openFixedStopSheet(stop);
  else if (stop?.kind && stop.id) openStopMenu(stop);
  else openAddSheet(stop);
}

// The hold on a customer row: the two answers that are not the plain tick,
// and the way into the editor. "Nicht angetroffen" and "Ins Lager mitnehmen"
// live here and nowhere else — at twenty-nine doors out of thirty the tick
// is the whole answer, and these stay out of its way.
function openStopMenu(stop) {
  const item = (onclick, iconSvg, label, sub = '') => `
    <button type="button" onclick="closeSheet(); ${onclick}" class="w-full flex items-center gap-3 text-left px-4 py-3.5 active:bg-black/5">
      <span class="w-5 flex shrink-0 text-black/55 text-lg">${iconSvg}</span>
      <span class="flex-1 min-w-0">
        <span class="block text-[15px] font-medium">${label}</span>
        ${sub ? `<span class="block text-[13px] text-black/55 leading-snug mt-0.5">${sub}</span>` : ''}
      </span>
    </button>`;
  // A link, so the navigation app and the dialler open on the tap itself.
  const link = (href, extra, iconSvg, label) => `
    <a href="${href}" ${extra} onclick="closeSheet()" class="w-full flex items-center gap-3 text-left px-4 py-3.5 active:bg-black/5">
      <span class="w-5 flex shrink-0 text-black/55 text-lg">${iconSvg}</span>
      <span class="flex-1 min-w-0 text-[15px] font-medium">${label}</span>
    </a>`;
  const o = stop.outcome || null;
  const onMap = !stop.excluded && Number.isFinite(stop.lat) && Number.isFinite(stop.lon);
  renderSheetShell(`
    <h2 class="text-[22px] font-bold mb-1 truncate">${escapeHtml(stop.kunde)}</h2>
    <p class="text-[13px] text-black/55 mb-4 leading-snug">${escapeHtml(stopAddress(stop))}${o ? ` · ${OUTCOMES[o]?.short || ''}` : ''}</p>
    <div class="${GROUP} mb-3">
      ${link(navUrl(stop), 'target="_blank" rel="noopener"', ICONS.arrowTurn, 'Navigation starten')}
      ${onMap ? item(`showStopOnMap(${stop.id})`, ICONS.tabMap, 'Auf der Karte zeigen') : ''}
      ${(stop.strasse || '').trim() ? item(`copyAddress(${stop.id})`, ICONS.copy, 'Adresse kopieren') : ''}
      ${dialOf(stop.telefon) ? link(`tel:${dialOf(stop.telefon)}`, '', ICONS.phone, 'Anrufen') : ''}
      ${phonesInNote(stop.notiz, stop.telefon).map((ph) => link(`tel:${ph.dial}`, '', ICONS.phone, `${escapeHtml(ph.display)} anrufen`)).join('')}
    </div>
    <div class="${GROUP} mb-3">
      ${o ? item(`setOutcome(${stop.id}, null)`, ICONS.refresh, 'Als offen markieren') : item(`setOutcome(${stop.id}, 'delivered')`, ICONS.checkCircle, 'Als geliefert markieren')}
      ${!o ? item(`setOutcome(${stop.id}, 'notHome')`, ICONS.bellOff, 'Nicht angetroffen', 'Angefahren, niemand da. Bleibt in der Tour.') : ''}
      ${!o ? item(`setOutcome(${stop.id}, 'toLager')`, ICONS.box, 'Ins Lager mitnehmen', 'Wird nicht angefahren und nicht mitgezählt.') : ''}
    </div>
    <div class="${GROUP} mb-4">
      ${item(`openAddSheet(getStop(${stop.id}))`, ICONS.pencil, 'Bearbeiten', 'Name, Adresse, Paket, Notiz, Telefon')}
      <button type="button" onclick="closeSheet(); deleteStop(${stop.id})" class="w-full flex items-center gap-3 text-left px-4 py-3.5 text-red-600 active:bg-black/5">
        <span class="w-5 flex shrink-0 text-lg">${ICONS.trash}</span>
        <span class="text-[15px] font-medium">Löschen</span>
      </button>
    </div>
    <div class="pb-2">
      <button type="button" onclick="closeSheet()" class="press-98 w-full py-3 rounded-xl bg-white text-black/70 font-semibold">Abbrechen</button>
    </div>
  `, { label: `${stop.kunde}: Aktionen` });
}

// ---------------------------------------------------------------------
// Stop row press handling — tapping a stop row used to open the edit
// sheet immediately, which meant a stray tap while scrolling/scanning
// the list could yank the driver into an edit form. Editing now needs a
// deliberate hold (touch) or right-click (desktop, via oncontextmenu);
// a plain tap does nothing. Only a real drag (finger moves more than a
// few px — scrolling the list) cancels the hold; a finger is never
// perfectly still, so cancelling on any movement at all meant the hold
// almost never survived long enough to fire on a real touchscreen.
//
// "A plain tap does nothing" is right for avoiding stray edits and wrong
// as the *only* feedback a driver ever gets: there is nothing on the row
// that says a hold does anything at all, so the whole edit flow is
// invisible until someone happens to rest a finger on it. A tap that was
// clearly a tap — released early, no movement — therefore says so once,
// which teaches the gesture without ever acting on the stray taps this
// was built to ignore. It says it *once*: after the first time, a driver
// who taps a row is not asking to be told again.
// ---------------------------------------------------------------------
let stopPressTimer = null;
let stopPressEl = null;
let stopPressFired = false;
let stopPressStart = null;
let lastTouchTime = 0;

function getStop(stopOrId) {
  if (typeof stopOrId === 'object' && stopOrId !== null) return stopOrId;
  const numId = Number(stopOrId);
  return state.currentRoute?.stops?.find(s => s.id === numId);
}

function stopLongPressStart(e, stopOrId) {
  if (e.type === 'touchstart') {
    lastTouchTime = Date.now();
  } else if (e.type === 'mousedown') {
    if (e.button !== 0) return;
    if (Date.now() - lastTouchTime < 500) return;
  }
  clearTimeout(stopPressTimer);
  const stop = getStop(stopOrId);
  if (!stop) return;
  stopPressEl = e.currentTarget;
  stopPressFired = false;
  const t = e.touches ? e.touches[0] : e;
  stopPressStart = { x: t.clientX, y: t.clientY };
  stopPressEl.classList.add('opacity-60');
  stopPressTimer = setTimeout(() => {
    stopPressEl?.classList.remove('opacity-60');
    stopPressTimer = null;
    stopPressFired = true;
    if (navigator.vibrate) navigator.vibrate(10);
    openStopSheet(stop);
  }, 450);
}

function stopLongPressMove(e) {
  if (!stopPressTimer || !stopPressStart) return;
  const t = e.touches ? e.touches[0] : e;
  const dx = t.clientX - stopPressStart.x;
  const dy = t.clientY - stopPressStart.y;
  if (Math.hypot(dx, dy) > 12) stopLongPressEnd();
}

function stopLongPressEnd() {
  clearTimeout(stopPressTimer);
  stopPressEl?.classList.remove('opacity-60');
  stopPressTimer = null;
  stopPressEl = null;
  stopPressStart = null;
}

// A tap opens the same sheet a hold does. It used to do nothing but say
// "hold to edit", from when the sheet behind it was the edit form and a
// stray tap could change a stop; what opens now is a list of things to
// choose from, and a row that looks tappable and is not is the harder thing
// to explain to somebody on their first day.
//
// On the click itself, not on the release that precedes it: a sheet opened
// on touchend is already under the finger when the browser delivers the
// click that follows, and that click lands on the sheet's backdrop and
// closes it again. A scroll produces no click, and a hold that has already
// opened the sheet swallows the one its release makes.
function stopRowClick(e, stopOrId) {
  if (stopPressFired) { stopPressFired = false; return; }
  const stop = getStop(stopOrId);
  if (stop) openStopSheet(stop);
}

function stopLongPressContext(e, stopOrId) {
  e.preventDefault();
  const stop = getStop(stopOrId);
  if (!stop) return;
  stopLongPressEnd();
  openStopSheet(stop);
}

// The keyboard equivalent of the long-press. A touch gesture is the only
// way to reach the edit sheet otherwise, which leaves it unreachable with
// a keyboard or a screen reader — and unlike a stray tap, pressing Enter
// on a focused row is unambiguously deliberate, so it opens the sheet
// directly rather than showing the hint.
function stopRowKeydown(e, stopOrId) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const stop = getStop(stopOrId);
  if (!stop) return;
  e.preventDefault();
  openStopSheet(stop);
}

// ---------------------------------------------------------------------
// Start/Lager/Ziel sheet — the three fixed points every route is created
// with. Their address is not editable (the server refuses it outright), so
// the only thing this sheet offers is whether this particular tour drives
// them: a shift that begins at the warehouse, or hands the van over instead
// of returning it, would otherwise be planned around two legs nobody
// drives, inflating the route's distance and its "bis zum nächsten Stopp"
// figures all day.
//
// Switched off, the stop stays in the list — greyed and labelled — rather
// than disappearing, because it is the only place the switch lives: a stop
// removed from the screen is a stop the driver can never turn back on.
// ---------------------------------------------------------------------
function openFixedStopSheet(stop) {
  const meta = stopKindMeta(stop);
  if (!meta) return;
  const excluded = !!stop.excluded;
  // What each fixed point can be asked to do. Start can be swapped for
  // "where I am"; the Lager can be left out; Ziel stays — without it the
  // tour would end wherever happens to be cheapest — and only moves.
  const toggle = stop.kind === 'pause'
    ? null
    : stop.kind === 'start'
    ? { title: 'Von meinem Standort starten', sub: 'Die Tour beginnt dort, wo du gerade bist, statt an dieser Adresse.' }
    : stop.kind === 'via'
    ? { title: 'In dieser Tour überspringen', sub: 'Das Lager wird nicht angefahren und nicht in Strecke und Fahrzeit eingerechnet.' }
    : excluded
    ? { title: 'In dieser Tour überspringen', sub: 'Ausschalten, damit die Tour wieder hier endet.' }
    : null;
  renderSheetShell(`
    <h2 class="sheet-title">${meta.title}</h2>
    <p class="sheet-lead">${stop.kind === 'start' ? 'Wo die Tour beginnt.' : stop.kind === 'via' ? 'Wo das Essen geladen wird.' : stop.kind === 'pause' ? 'Wo du vor dem Ziel Pause machst.' : 'Wo die Tour endet.'} Gilt nur für diese Tour.</p>

    ${toggle ? `
    <div class="${GROUP} mb-4">
      <label class="flex items-start gap-3 px-4 py-3.5 cursor-pointer">
        <input type="checkbox" id="fixed-stop-exclude" ${excluded ? 'checked' : ''} onchange="document.getElementById('fixed-address').style.opacity = this.checked ? .4 : 1"
          class="mt-0.5 w-6 h-6 shrink-0 accent-brand-600" />
        <span class="flex-1 min-w-0">
          <span class="block text-[15px] font-medium">${toggle.title}</span>
          <span class="block text-[13px] text-black/55 leading-snug mt-0.5">${toggle.sub}</span>
        </span>
      </label>
    </div>` : ''}

    <div id="fixed-address" class="space-y-3" style="opacity:${excluded ? .4 : 1}">
      <div>
        <label class="${LABEL}" for="fixed-strasse">Straße &amp; Hausnummer</label>
        <input id="fixed-strasse" autocomplete="off" maxlength="${LIMITS.strasse}" value="${escapeAttr(stop.strasse || '')}" class="${FIELD}" />
      </div>
      <div>
        <label class="${LABEL}" for="fixed-plz">Postleitzahl</label>
        <input id="fixed-plz" inputmode="numeric" maxlength="4" autocomplete="off" value="${escapeAttr(stop.plz || '')}" class="${FIELD}" />
      </div>
    </div>

    <div class="pb-2" style="margin-top:1.25rem">
      <button type="button" onclick="saveFixedStop(${stop.id})" class="press-98 wide-btn accent">Speichern</button>
      ${stop.kind === 'pause' ? `<button type="button" onclick="closeSheet(); setPause(false)" class="press-98 wide-btn quiet" style="color:#D70015">Pause entfernen</button>` : ''}
      <button type="button" onclick="closeSheet()" class="press-98 wide-btn quiet">Abbrechen</button>
    </div>
  `, { label: meta.title });
}

// ---------------------------------------------------------------------
// Pause zu Hause — the driver's home as the last stop before Ziel, once
// they know there is time for it. Until then the tour is planned to Ziel as
// if it did not exist. Switching it on re-plans the doors still open so
// they finish near home; the iOS app's `RouteStore.setPause`.
// ---------------------------------------------------------------------
function openHomeSheet() {
  const h = homeState.home;
  renderSheetShell(`
    <h2 class="sheet-title">Zuhause</h2>
    <p class="sheet-lead">Für „Pause zu Hause“ in einer Tour: die Pause kommt als letzter Stopp vor das Ziel.</p>
    <form id="home-form" novalidate class="space-y-3">
      <div>
        <label class="${LABEL}" for="home-strasse">Straße &amp; Hausnummer</label>
        <input id="home-strasse" autocomplete="street-address" maxlength="${LIMITS.strasse}" value="${escapeAttr(h?.strasse || '')}" class="${FIELD}" />
      </div>
      <div>
        <label class="${LABEL}" for="home-plz">Postleitzahl</label>
        <input id="home-plz" inputmode="numeric" maxlength="4" autocomplete="postal-code" value="${escapeAttr(h?.plz || '')}" class="${FIELD}" />
      </div>
      <div style="padding-top:.5rem">
        <button type="submit" class="press-98 wide-btn accent">Speichern</button>
        ${h ? `<button type="button" onclick="clearHome()" class="press-98 wide-btn quiet" style="color:#D70015">Adresse löschen</button>` : ''}
        <button type="button" onclick="closeSheet()" class="press-98 wide-btn quiet">Abbrechen</button>
      </div>
    </form>
  `, { label: 'Zuhause' });
  const form = document.getElementById('home-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const strasse = document.getElementById('home-strasse').value.trim();
    const plz = document.getElementById('home-plz').value.trim();
    if (!strasse || !/^[1-9]\d{3}$/.test(plz)) { toast('Bitte Straße und eine vierstellige Postleitzahl eintragen.', 'error'); return; }
    if (strasse === (h?.strasse || '') && plz === (h?.plz || '')) { closeSheet(); return; }
    const btn = form.querySelector('[type=submit]');
    btn.disabled = true;
    btn.textContent = 'Adresse wird gesucht …';
    try {
      homeState = await api('/home', { method: 'PUT', body: JSON.stringify({ strasse, plz }) });
      closeSheet();
      toast('Gespeichert ✓', 'success');
      render();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Speichern';
      toast(err.message, 'error');
    }
  });
}

async function clearHome() {
  closeSheet();
  try {
    homeState = await api('/home', { method: 'PUT', body: JSON.stringify({ clear: true }) });
    render();
  } catch (err) { toast(err.message, 'error'); }
}

/// The sentence the confirmation asks with — the iOS app's
/// `PauseDetour.summary`. `zielBefore` is the arrival at Ziel as the tour
/// stands; the detour moves it, and so does the pause — by however long the
/// driver takes, which nobody can say beforehand, so it is named and not
/// counted.
function pauseSummary(detour, zielBefore, endsAtHome) {
  if (!detour) return 'Der Umweg konnte gerade nicht berechnet werden.';
  const first = `Umweg +${fmtDuration(detour.minutes)} · ${fmtKm(detour.km)}.`;
  if (endsAtHome) return `${first} Die Tour endet dann zu Hause.`;
  if (zielBefore == null) return first;
  const after = zielBefore + detour.minutes * 60000;
  return `${first} Am Ziel ca. ${fmtClock(after)} statt ${fmtClock(zielBefore)}, plus die Pause.`;
}

/// Works out what the pause would cost before it goes on the tour —
/// whether there is time for it is the question the driver is asking.
async function previewPause() {
  const r = state.currentRoute;
  if (!r) return;
  if (!homeState.home) { toast('Zuerst unter Mehr → Zuhause die eigene Adresse eintragen.', 'error'); return; }
  showProgress('Umweg wird berechnet …');
  let detour = null;
  try { detour = await api(`/routes/${r.id}/pause-detour`); } catch (_) { /* asked blind, below */ }
  finally { hideProgress(); }
  if (state.currentRoute?.id !== r.id) return;
  const ziel = r.stops.find((s) => s.kind === 'end' && !s.excluded);
  const zielBefore = ziel ? routeSnapshot(r).eta(ziel) : null;
  const ok = await confirmSheet({
    title: 'Pause zu Hause einplanen?',
    message: pauseSummary(detour, zielBefore, !ziel),
    confirmLabel: 'Einplanen',
  });
  if (ok) setPause(true);
}

async function setPause(on) {
  const r = state.currentRoute;
  if (!r) return;
  await refreshCurrentRoute(
    () => api(`/routes/${r.id}/pause`, { method: 'POST', retry: true, body: JSON.stringify({ on }) }),
    on ? 'Pause wird eingeplant …' : 'Pause wird entfernt …',
  );
}

/// The driver's position, or `null` when the phone will not say within a
/// few seconds. Never an error: a tour that cannot start from "here" starts
/// from its first stop, as it did before, and says so.
function currentPosition(timeoutMs = 6000) {
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 60000 },
    );
  });
}

/// Tells the server where the van is, for a tour that starts from there.
/// Only when it matters: Start switched off (`startOff` says what it is
/// about to be) and no door answered for yet.
async function sendPositionIfStartingHere(route, startOff) {
  if (!route || !startOff || route.stops.some((s) => s.kind === 'customer' && s.outcome && !skipsDoor(s))) return true;
  const here = await currentPosition();
  if (!here) return false;
  try { await api(`/routes/${route.id}/position`, { method: 'POST', retry: true, body: JSON.stringify(here) }); return true; }
  catch (_) { return false; }
}

async function saveFixedStop(stopId) {
  const stop = getStop(stopId);
  const checkbox = document.getElementById('fixed-stop-exclude');
  const strasse = document.getElementById('fixed-strasse')?.value.trim() ?? '';
  const plz = document.getElementById('fixed-plz')?.value.trim() ?? '';
  // Read before `closeSheet()` tears the sheet (and its fields) out of the
  // DOM — after that there is nothing left to read the choice from.
  const excluded = checkbox ? checkbox.checked : !!stop?.excluded;
  if (!stop) { closeSheet(); return; }
  const moved = !excluded && (strasse !== (stop.strasse || '') || plz !== (stop.plz || ''));
  if (moved && (!strasse || !/^[1-9]\d{3}$/.test(plz))) { toast('Bitte Straße und eine vierstellige Postleitzahl eintragen.', 'error'); return; }
  closeSheet();
  const route = state.currentRoute;
  const toggled = !!stop.excluded !== excluded;
  // Saving "no change" would still cost a full re-plan to arrive back at
  // exactly the current tour, so it is treated as the cancel it is.
  if (!toggled && !moved) return;

  if (toggled) {
    if (stop.kind === 'start' && excluded) {
      showProgress('Standort wird bestimmt …');
      const located = await sendPositionIfStartingHere(route, true);
      hideProgress();
      if (!located) toast('Standort nicht verfügbar — die Tour beginnt beim ersten Stopp. Standortfreigabe im Browser erlauben und „Reihenfolge neu berechnen“ wählen.', 'warning', 9000);
    }
    await refreshCurrentRoute(
      // Idempotent field set, same as the delivered toggle — see there.
      () => api(`/stops/${stopId}`, { method: 'PATCH', retry: true, body: JSON.stringify({ excluded }) }),
      'Tour wird neu geplant …',
    );
  }
  if (moved) {
    await refreshCurrentRoute(
      () => api(`/stops/${stopId}`, { method: 'PATCH', body: JSON.stringify({ strasse, plz }) }),
      'Adresse wird gesucht …',
    );
  }
}

const FIELD = 'mt-1 w-full bg-white rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-brand-600';
const LABEL = 'text-[13px] font-medium text-black/55';

function renderManualForm(stop, { notFound = false } = {}) {
  const isEdit = !!stop?.id;
  // Not found now, or carried on the stop from before such stops were refused.
  const unplaced = notFound || stop?.location_precision === 'district';
  const defaultPlz = stop?.plz || (isEdit ? '' : lastUsedPlz) || '';

  // Every field is wired to its input with a real for/id pair rather than
  // a bare floating <label>: an unassociated label is not a label at all —
  // tapping it doesn't focus the field, and a screen reader announces the
  // input as unlabelled.
  const uid = (name) => `stop-field-${name}`;

  renderSheetShell(`
    <h2 class="text-[22px] font-bold mb-4">${isEdit ? 'Stopp bearbeiten' : 'Neuer Stopp'}</h2>
    ${unplaced ? `<div class="sheet-note" style="background:#D70015;color:#fff"><span style="color:#fff">${ICONS.warning}</span><span><b>Diese Adresse wurde nicht gefunden.</b> Bitte Straße, Hausnummer und Postleitzahl prüfen — oft ist es ein Tippfehler oder die falsche Postleitzahl.</span></div>` : ''}
    <form id="stop-form" novalidate class="space-y-3 pb-2">
      <div>
        <label class="${LABEL}" for="${uid('kunde')}">Kunde</label>
        <input id="${uid('kunde')}" name="kunde" required autocomplete="off" maxlength="${LIMITS.kunde}" enterkeyhint="next" value="${escapeAttr(stop?.kunde || '')}" placeholder="z.B. Fam. Gruber" class="${FIELD}" />
      </div>
      <div>
        <label class="${LABEL}" for="${uid('strasse')}">Straße &amp; Hausnummer</label>
        <input id="${uid('strasse')}" name="strasse" required autocomplete="off" maxlength="${LIMITS.strasse}" enterkeyhint="next" value="${escapeAttr(stop?.strasse || '')}" placeholder="z.B. Favoritenstraße 45 (Adresse einfügen geht auch)" class="${FIELD}" />
      </div>
      <div>
        <label class="${LABEL}" for="${uid('plz')}">Postleitzahl</label>
        <input id="${uid('plz')}" name="plz" required inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" enterkeyhint="next" value="${escapeAttr(defaultPlz)}" placeholder="z.B. 1100" class="${FIELD}" />
      </div>
      <div>
        <label class="${LABEL}" for="${uid('paket')}">Paket</label>
        <input id="${uid('paket')}" name="paket" autocomplete="off" maxlength="${LIMITS.paket}" enterkeyhint="next" value="${escapeAttr(stop?.paket || '')}" placeholder="z.B. 2 Pakete, 1x Kühlware" class="${FIELD}" />
      </div>
      <div>
        <label class="${LABEL}" for="${uid('notiz')}">Notiz</label>
        <textarea id="${uid('notiz')}" name="notiz" rows="2" maxlength="${LIMITS.notiz}" placeholder="z.B. persönlich übergeben, Lift im Hof, Code 1234" class="${FIELD} resize-none">${escapeHtml(stop?.notiz || '')}</textarea>
      </div>
      <div>
        <label class="${LABEL}" for="${uid('telefon')}">Telefon</label>
        <input id="${uid('telefon')}" name="telefon" type="tel" inputmode="tel" autocomplete="off" maxlength="40" enterkeyhint="done" value="${escapeAttr(stop?.telefon || '')}" placeholder="z.B. 0664 1234567" class="${FIELD}" />
      </div>
      ${isEdit || unplaced ? `
        <button type="button" onclick="pinDropFromForm(${isEdit ? stop.id : 'null'})"
          class="press-98 w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left bg-white text-black/70">
          <span class="flex shrink-0 text-[17px]">${ICONS.mapPin}</span>
          <span class="flex-1 min-w-0">
            <span class="block text-[15px] font-medium">${unplaced ? 'Adresse stimmt, wird aber nicht gefunden?' : 'Standort auf der Karte setzen'}</span>
            <span class="block text-[12px] leading-snug text-black/55">${
              unplaced
                ? 'Dann das Haus auf der Karte suchen und den Pin von Hand setzen.'
                : stop.location_precision === 'street'
                ? 'Nur ungefähr — die genaue Hausnummer ist nicht registriert.'
                : 'Pin von Hand auf das richtige Haus setzen.'
            }</span>
          </span>
        </button>
      ` : ''}
      <div class="flex gap-3 pt-2">
        ${isEdit ? `<button type="button" onclick="closeSheet(); deleteStop(${stop.id});" class="press-98 px-4 py-3 rounded-xl bg-red-50 text-red-600 font-semibold">Löschen</button>` : ''}
        <button type="submit" class="press-98 flex-1 py-3 rounded-xl bg-brand-600 font-semibold text-white">${isEdit ? 'Speichern' : 'Hinzufügen'}</button>
      </div>
    </form>
  `, { label: isEdit ? 'Stopp bearbeiten' : 'Neuer Stopp' });

  const form = document.getElementById('stop-form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    submitStop(e.target, stop?.id);
  });

  // `enterkeyhint="next"` puts "Weiter" on the iOS return key — and until
  // now that was a lie. In a form with a submit button, Enter in a text
  // input submits the form, so the key labelled "next field" saved the
  // stop: mid-way through typing, from the Kunde field, before the district
  // had been chosen. Wiring it to actually advance is what makes the
  // keyboard's own promise true.
  //
  // `required` stays on the fields (assistive technology announces it) but
  // the form is `novalidate`: the browser's native "Please fill out this
  // field" bubble is unstyleable OS chrome of exactly the kind this app
  // replaced `alert`/`confirm` to avoid, and `submitStop` already says the
  // same thing in the app's own voice.
  const advanceable = Array.from(form.querySelectorAll('[enterkeyhint="next"]'));
  for (const field of advanceable) {
    field.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      // The next control in DOM order that a driver can actually type in or
      // choose from — never a button, which is what "next" would otherwise
      // land on from the last field.
      const controls = Array.from(form.querySelectorAll('input, select, textarea'));
      const next = controls[controls.indexOf(field) + 1];
      if (next) next.focus();
      else form.requestSubmit?.();
    });
  }

  // Paste a full address ("Clementinengasse 11, 1150 Wien") straight from a
  // chat/SMS into the Straße field: pull the district PLZ out of it and
  // select it automatically instead of making the driver do it by hand.
  const strasseInput = form.strasse;
  const plzSelect = form.plz;
  strasseInput.addEventListener('input', (e) => {
    if (e.inputType !== 'insertFromPaste') return;
    autoFillDistrictFromText(strasseInput, plzSelect);
  });
  strasseInput.addEventListener('blur', () => autoFillDistrictFromText(strasseInput, plzSelect));
}

// "Standort auf der Karte setzen", from the edit sheet.
//
// The pin-drop sheet used to be reachable only when geocoding failed
// outright, which left the approximate cases — the ones wearing an "≈"
// badge, where the app already admits it put the pin on the nearest known
// housenumber or in the middle of the district — with no way to be
// corrected at all short of rewriting the address text and hoping. This is
// that way: the same sheet, opened deliberately, centred on where the stop
// currently sits so the driver is nudging a pin rather than hunting for
// the district.
//
// Reads the *form's* current values rather than the saved stop, so an
// address the driver has just retyped is what gets saved with the pin,
// and nothing typed is lost by taking this detour.
function pinDropFromForm(stopId) {
  const form = document.getElementById('stop-form');
  if (!form) return;
  const stop = stopId == null ? null : getStop(stopId);
  const data = {
    kunde: form.kunde.value.trim(),
    strasse: form.strasse.value.trim(),
    plz: form.plz.value.trim(),
    paket: form.paket.value.trim(),
    notiz: form.notiz.value.trim(),
    telefon: form.telefon.value.trim(),
  };
  if (stopId != null) data.stopId = stopId;
  if (!data.kunde || !data.strasse || !/^[1-9]\d{3}$/.test(data.plz)) {
    toast('Bitte zuerst Kunde, Straße und Postleitzahl ausfüllen.', 'error');
    return;
  }
  closeSheet();
  // A stop that only has its district's centre has no position worth
  // opening on: the sheet starts as it does for an address never found.
  openPinDropSheet(data, stop && stop.location_precision !== 'district' ? { lat: stop.lat, lon: stop.lon } : null);
}

function autoFillDistrictFromText(strasseInput, plzSelect) {
  const text = strasseInput.value;
  // Prefers a match after a comma — the expected "Straße Hausnummer, PLZ"
  // paste shape the comment above describes — over the first matching
  // token anywhere in the string. Without this, a housenumber that happens
  // to coincide with a real Vienna PLZ (e.g. a combined house/door number
  // like "12 1200") could get read as the district instead, stripping it
  // out of the address text. `DISTRICT_BY_PLZ` still has the final say
  // either way: only one of the 23 real Vienna postal codes ever matches.
  const afterComma = text.slice(text.indexOf(',') + 1);
  const match = afterComma.match(/\b1\d{3}\b/) || text.match(/\b1\d{3}\b/);
  if (!match || !DISTRICT_BY_PLZ[match[0]]) return;
  plzSelect.value = match[0];
  let cleaned = strasseInput.value.replace(match[0], '');
  cleaned = cleaned.replace(/,?\s*(wien|austria|österreich)\.?/gi, '');
  cleaned = cleaned.replace(/,\s*,/g, ',').replace(/,\s*$/, '').replace(/\s{2,}/g, ' ').trim();
  strasseInput.value = cleaned;
}

// ---------------------------------------------------------------------
// Tour von Gourmet laden.
//
// The one way a list of stops gets into this app besides typing them in: the
// day's tour, straight from the Zusteller-Portal. Three steps, each a sheet
// of its own with one thing to do on it — sign in (once), pick the tour,
// look over who is on it — and then the tour opens with its stops in driving
// order. The server does the talking to the portal and keeps the login; see
// the `Zusteller-Portal` section of src/main.rs.
// ---------------------------------------------------------------------
// Set while stops are being loaded. The sheet cannot be closed then (see
// `closeSheet`) and a new version of the app waits its turn (see
// `reloadForUpdateIfPending`): a load takes a minute, and abandoning it
// halfway leaves nobody knowing what arrived.
let importController = null;
const gourmet = { routeId: null, pdf: false, date: null, tours: null, tour: null, deliveries: null, picked: null, entries: null, loaded: 0 };

const isoDay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const dayLabel = (iso) => {
  const today = new Date();
  const tomorrow = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1);
  if (iso === isoDay(today)) return 'Heute';
  if (iso === isoDay(tomorrow)) return 'Morgen';
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('de-AT', { weekday: 'long', day: 'numeric', month: 'long' });
};
const sheetBusy = (text) => `<div class="sheet-busy"><div class="spinner"></div><p>${text}</p></div>`;
const sheetError = (message, retry) => `
  <div class="sheet-note warn"><span>${ICONS.warning}</span><span>${escapeHtml(message)}</span></div>
  <button type="button" onclick="${retry}" class="press-98 wide-btn quiet">Noch einmal versuchen</button>`;

/// The "+" on Routen. Two choices, the usual one first and larger.
function openNewTourSheet() {
  renderSheetShell(`
    <h2 class="sheet-title">Neue Tour</h2>
    <p class="sheet-lead">Woher kommen die Stopps?</p>
    <button type="button" onclick="openGourmetSheet()" class="press-98 choice primary">
      <span class="choice-icon">${ICONS.download}</span>
      <span><span class="choice-title">Vom Zusteller-Portal</span><span class="choice-sub">Die Tour des Tages aus dem Zusteller-Portal. Alle Stopps kommen fertig sortiert.</span></span>
      <span class="choice-chevron">${ICONS.chevron}</span>
    </button>
    <button type="button" onclick="closeSheet(); createRoute()" class="press-98 choice">
      <span class="choice-icon">${ICONS.pencil}</span>
      <span><span class="choice-title">Leere Tour</span><span class="choice-sub">Stopps selbst eintragen, einen nach dem anderen.</span></span>
      <span class="choice-chevron">${ICONS.chevron}</span>
    </button>
    <div class="pb-2" style="margin-top:1rem"><button type="button" onclick="closeSheet()" class="press-98 wide-btn quiet">Abbrechen</button></div>
  `, { label: 'Neue Tour' });
}

/// Opens the Gourmet flow — for a new tour, or with `routeId` to add a
/// tour's stops to the one that is open.
async function openGourmetSheet(routeId = null, pdf = false) {
  Object.assign(gourmet, { routeId, pdf, date: isoDay(new Date()), tours: null, tour: null, deliveries: null, picked: null, entries: null, loaded: 0 });
  renderSheetShell(`<div data-gourmet><h2 class="sheet-title">${gourmetTitle()}</h2>${sheetBusy('Einen Moment …')}</div>`, { label: gourmetTitle() });
  try {
    const status = await api('/portal/status');
    if (status.logged_in) showGourmetTours(); else showGourmetLogin();
  } catch (err) {
    gourmetBody(sheetError(err.message, `openGourmetSheet(${routeId}, ${pdf})`));
  }
}

/// The same two steps — sign in, pick the day's tour — lead either to a
/// tour's stops or, from Mehr, to its list as a PDF.
const gourmetTitle = () => (gourmet.pdf ? 'Tour als PDF' : 'Von Gourmet laden');

/// Replaces everything under the sheet's title, if the sheet is still the
/// Gourmet one — the driver may have closed it while a request was out.
function gourmetBody(html, title = gourmetTitle()) {
  const body = document.querySelector('[data-gourmet]');
  if (!body) {
    if (!document.getElementById('modal-root').innerHTML) return false;
    renderSheetShell(`<div data-gourmet></div>`, { label: title });
  }
  document.querySelector('[data-gourmet]').classList.remove('pick-mode');
  document.querySelector('[data-gourmet]').innerHTML = `<h2 class="sheet-title">${title}</h2>${html}`;
  return true;
}

function showGourmetLogin(message = '') {
  renderSheetShell(`<div data-gourmet></div>`, { label: 'Bei Gourmet anmelden' });
  gourmetBody(`
    <p class="sheet-lead">Mit den Zugangsdaten vom Zusteller-Portal anmelden. Das ist nur einmal nötig.</p>
    ${message ? `<div class="sheet-note warn"><span>${ICONS.warning}</span><span>${escapeHtml(message)}</span></div>` : ''}
    <form id="gourmet-login" novalidate class="space-y-3">
      <div>
        <label class="${LABEL}" for="gourmet-user">Benutzername</label>
        <input id="gourmet-user" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" class="${FIELD}" />
      </div>
      <div>
        <label class="${LABEL}" for="gourmet-pass">Passwort</label>
        <input id="gourmet-pass" name="password" type="password" autocomplete="current-password" enterkeyhint="go" class="${FIELD}" />
      </div>
      <div style="padding-top:.5rem">
        <button type="submit" class="press-98 wide-btn accent">Anmelden</button>
        <button type="button" onclick="closeSheet()" class="press-98 wide-btn quiet">Abbrechen</button>
      </div>
    </form>
    <p class="sheet-foot">Die Anmeldung wird bei deinem Konto gespeichert, damit du sie nicht jeden Tag neu eingeben musst.</p>
  `, 'Bei Gourmet anmelden');
  const form = document.getElementById('gourmet-login');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = form.username.value.trim();
    const password = form.password.value;
    if (!username || !password) { toast('Bitte Benutzername und Passwort eingeben.', 'error'); return; }
    const btn = form.querySelector('[type=submit]');
    btn.disabled = true;
    btn.textContent = 'Wird angemeldet …';
    try {
      await api('/portal/login', { method: 'POST', body: JSON.stringify({ username, password }) });
      showGourmetTours();
    } catch (err) {
      showGourmetLogin(err.message);
    }
  });
  setTimeout(() => document.getElementById('gourmet-user')?.focus(), 80);
}

/// Mehr → Gourmet-Anmeldung: who is signed in, and the way out.
async function openGourmetAccount() {
  showProgress();
  let status;
  try { status = await api('/portal/status'); }
  catch (err) { toast(err.message, 'error'); return; }
  finally { hideProgress(); }
  if (!status.logged_in) { gourmet.routeId = null; gourmet.pdf = false; gourmet.date = isoDay(new Date()); showGourmetLogin(); return; }
  renderSheetShell(`
    <h2 class="sheet-title">Gourmet-Anmeldung</h2>
    <div class="sheet-note" style="background:rgba(52,199,89,.14);color:#1B6B32"><span style="color:#248A3D">${ICONS.checkCircle}</span><span>Angemeldet als <b>${escapeHtml(status.username || '')}</b>. Touren können geladen werden.</span></div>
    <div class="pb-2">
      <button type="button" onclick="closeSheet(); gourmetLogout()" class="press-98 wide-btn quiet" style="color:#D70015">Abmelden</button>
      <button type="button" onclick="closeSheet()" class="press-98 wide-btn quiet">Schließen</button>
    </div>
  `, { label: 'Gourmet-Anmeldung' });
}

async function gourmetLogout() {
  const ok = await confirmSheet({ title: 'Von Gourmet abmelden?', message: 'Zum Laden einer Tour ist dann wieder eine Anmeldung nötig.', confirmLabel: 'Abmelden' });
  if (!ok) return;
  try { await api('/portal/logout', { method: 'POST' }); toast('Abgemeldet ✓', 'success'); } catch (err) { toast(err.message, 'error'); }
}

/// Step two: which tour. Today's are asked for straight away; the day can
/// be changed for a tour prepared the evening before.
async function showGourmetTours(date = gourmet.date) {
  gourmet.date = date;
  gourmet.tours = null;
  const today = new Date();
  const days = [0, 1].map((n) => isoDay(new Date(today.getFullYear(), today.getMonth(), today.getDate() + n)));
  const head = `
    <p class="sheet-lead">${gourmet.pdf ? 'Welche Tour soll als Liste zum Ausdrucken heraus?' : 'Welche Tour fährst du?'}</p>
    <div class="day-row">
      ${days.map((d) => `<button type="button" onclick="showGourmetTours('${d}')" class="press-98 day-chip ${d === date ? 'on' : ''}">${dayLabel(d)}</button>`).join('')}
      <label class="day-chip ${days.includes(date) ? '' : 'on'}">${days.includes(date) ? 'Anderer Tag' : dayLabel(date)}
        <input type="date" value="${date}" onchange="if (this.value) showGourmetTours(this.value)" aria-label="Anderen Tag wählen" />
      </label>
    </div>`;
  if (!gourmetBody(head + sheetBusy('Touren werden geladen …'))) return;
  try {
    const { tours } = await api(`/portal/tours?date=${date}`);
    if (gourmet.date !== date) return;
    gourmet.tours = tours;
    gourmetBody(head + (tours.length ? `
      <div class="${GROUP}">
        ${tours.map((t) => `
          <button type="button" onclick="showGourmetDeliveries(${t.id})" class="${ROW}" style="padding-top:.875rem;padding-bottom:.875rem">
            <span class="w-9 h-9 shrink-0 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center text-lg">${ICONS.box}</span>
            <span class="flex-1 min-w-0 font-medium truncate">${escapeHtml(t.name)}</span>
            <span class="text-black/25 text-lg flex shrink-0">${ICONS.chevron}</span>
          </button>`).join('')}
      </div>` : `<div class="sheet-note"><span>${ICONS.box}</span><span>${dayLabel(date)} fährt laut Portal keine Tour. Oben einen anderen Tag wählen.</span></div>`) + `
      <button type="button" onclick="closeSheet()" class="press-98 wide-btn quiet" style="margin-top:1rem">Abbrechen</button>
      <p class="sheet-foot"><button type="button" onclick="closeSheet(); gourmetLogout()" class="underline">Von Gourmet abmelden</button></p>`);
  } catch (err) {
    if (/anmelden|Anmeldung/.test(err.message)) { showGourmetLogin(err.message); return; }
    gourmetBody(head + sheetError(err.message, `showGourmetTours('${date}')`));
  }
}

/// Step three: who is on it. Everybody is ticked; a stop another driver is
/// taking is unticked here rather than deleted afterwards.
async function showGourmetDeliveries(tourId) {
  const tour = gourmet.tours?.find((t) => t.id === tourId);
  if (!tour) return;
  gourmet.tour = tour;
  gourmet.deliveries = null;
  if (gourmet.pdf) return exportTourPdf(tour);
  const back = `<button type="button" onclick="showGourmetTours()" class="press-98 wide-btn quiet">Zurück</button>`;
  if (!gourmetBody(sheetBusy('Stopps werden geladen …'), escapeHtml(tour.name))) return;
  try {
    const { deliveries } = await api(`/portal/deliveries?tour_id=${tourId}&date=${gourmet.date}`);
    if (gourmet.tour?.id !== tourId) return;
    gourmet.deliveries = deliveries;
    gourmet.picked = new Set();
    gourmet.pickQuery = '';
    if (!deliveries.length) {
      gourmetBody(`<div class="sheet-note"><span>${ICONS.box}</span><span>Für diese Tour gibt es ${dayLabel(gourmet.date).toLowerCase()} keine offenen Lieferungen.</span></div>${back}`, escapeHtml(tour.name));
      return;
    }
    paintGourmetDeliveries();
  } catch (err) {
    gourmetBody(sheetError(err.message, `showGourmetDeliveries(${tourId})`) + back, escapeHtml(tour.name));
  }
}

// The picked stops are a `Set`, which keeps the order things were added in —
// and that order is the point. Tapping a stop off and on again moves it to
// the back, so a driver can tick the whole list in the order of the printed
// one; the numbers on the rows show it, and Prüfen arrives in that order.
// It is the checking order and nothing more: the tour itself is put in
// driving order once it is saved.
function paintGourmetDeliveries() {
  const { deliveries, tour } = gourmet;
  gourmet.pickQuery = gourmet.pickQuery || '';
  gourmetBody(`
    <p class="sheet-lead">${dayLabel(gourmet.date)} · ${deliveries.length === 1 ? '1 Stopp' : `${deliveries.length} Stopps`}. Tippe die Stopps an, die du fährst.</p>
    <div class="relative mb-3 pick-search">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-black/55 text-[17px] flex pointer-events-none">${ICONS.search}</span>
      <input id="pick-search" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false"
        placeholder="Name oder Adresse suchen" aria-label="Stopps durchsuchen" value="${escapeAttr(gourmet.pickQuery)}"
        oninput="gourmet.pickQuery = this.value; paintPickList()"
        class="w-full bg-white rounded-xl pl-10 py-2.5 text-base placeholder:text-black/55 focus:outline-none focus:ring-2 focus:ring-brand-600" />
    </div>
    <div data-pick-list></div>
    <div class="sheet-actions" data-pick-actions></div>
  `, escapeHtml(tour.name));
  document.querySelector('[data-gourmet]')?.classList.add('pick-mode');
  paintPickList();
}

/// The rows and the buttons under them — everything a tap or a keystroke
/// changes, repainted without touching the search field above.
function paintPickList() {
  const { deliveries, picked } = gourmet;
  const list = document.querySelector('[data-pick-list]');
  const actions = document.querySelector('[data-pick-actions]');
  if (!list || !actions) return;
  const n = picked.size;
  const all = n === deliveries.length;
  const position = new Map([...picked].map((id, i) => [id, i + 1]));
  // Tokenised the way the tour's own search is, so "gruber gentz" finds
  // Fam. Gruber in the Gentzgasse.
  const tokens = normalizeMatchText(gourmet.pickQuery || '').split(' ').filter(Boolean);
  const shown = tokens.length
    ? deliveries.filter((d) => { const hay = normalizeMatchText(`${d.kunde} ${d.strasse} ${d.plz}`); return tokens.every((t) => hay.includes(t)); })
    : deliveries;
  list.innerHTML = `
    <div class="pick-bar">
