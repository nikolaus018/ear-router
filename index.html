<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<!-- Zoom is locked. Installed to a home screen this is an app, not a page,
     and browser zoom on an app reads as breakage: a stray two-finger touch
     while steadying the phone in a van leaves the whole UI at 1.4× with the
     tab bar half off screen and no visible way back.

     Deliberate trade, recorded here so it isn't "fixed" by accident: this
     is the one thing that let a driver enlarge a house number they couldn't
     quite read. Nothing replaces it — the app's own type is sized for that
     (nothing readable below 13px, addresses at 13–15px), and the OS-level
     accessibility zoom still works, but in-app pinch does not. Reverting is
     just dropping `maximum-scale`/`user-scalable` below and the zoom-lock
     listeners in the Init section.

     `user-scalable=no` is honored by Android/Chrome and ignored outright by
     iOS Safari since iOS 10, so it is the `gesturestart` handlers in the
     Init section that actually do the work on the platform this mostly runs
     on. The map is exempt — see there for why it needs no exemption code.

     Keeping every focusable field at ≥16px still matters independently: it
     is the threshold iOS checks before auto-zooming a focused input, and
     that auto-zoom fires regardless of these settings. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>EAR Routing</title>
<meta name="description" content="Essen auf Rädern – Routenplanung für Zusteller des Arbeiter-Samariter-Bundes Österreichs" />
<meta name="color-scheme" content="light" />

<!-- PWA / "add to home screen". Light mode only, intentionally — see the
     module doc comment. theme-color matches the app's actual grouped
     background; apple-mobile-web-app-status-bar-style is "default" (dark
     status-bar icons), which reads correctly against that light background. -->
<meta name="theme-color" content="#F2F2F7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="EAR Routing" />
<meta name="format-detection" content="telephone=no" />

<script>
  // The ASBÖ logo (Arbeiter-Samariter-Bund Österreichs) is served
  // from disk as /icon.png (see src/main.rs) — reused for the favicon,
  // apple-touch-icon, the inline manifest's icon and the in-app
  // header/empty-states, all via this one constant.
  const APP_LOGO = "/icon.png";
  const MANIFEST = {
    name: "EAR Routing – Essen auf Rädern",
    short_name: "EAR Routing",
    description: "Routenplanung für Essen auf Rädern – Arbeiter-Samariter-Bund Österreichs",
    start_url: "/",
    scope: "/",
    display: "standalone",
    orientation: "portrait",
    background_color: "#F2F2F7",
    theme_color: "#F2F2F7",
    icons: [
      { src: APP_LOGO, sizes: "512x512", type: "image/png", purpose: "any" },
      { src: APP_LOGO, sizes: "512x512", type: "image/png", purpose: "maskable" },
    ],
  };
  // Appended to <head> directly rather than via document.write(): same
  // result, but document.write is blocked outright in a few contexts a PWA
  // can legitimately end up in (a parser-inserted async script, some
  // in-app browsers) and would silently take the icons and the manifest —
  // i.e. "add to home screen" itself — down with it.
  const head = document.head;
  const addTag = (tag, attrs) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    head.appendChild(el);
  };
  addTag('link', { rel: 'icon', type: 'image/png', href: APP_LOGO });
  addTag('link', { rel: 'apple-touch-icon', href: APP_LOGO });
  addTag('link', {
    rel: 'manifest',
    href: 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(MANIFEST)),
  });
  addTag('meta', { name: 'apple-mobile-web-app-status-bar-style', content: 'default' });
</script>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>

<style>
  /* `dvh` is unreliable specifically inside an iOS home-screen standalone
     launch (it can resolve smaller than the true screen, exposing the
     WKWebView's default black canvas above/below the content). #app is
     therefore pinned with `position: fixed; inset: 0` (resolved against the
     UA's viewport directly, not the `dvh` custom unit) instead of a
     `height: 100dvh` — see the #app element below. html/body just need a
     matching background as a fallback so any edge-case gap reads as the
     app's own color instead of stray black. */
  /* No text selection anywhere by default — a delivery app isn't a
     document, and the native iOS/Android selection handles + callout
     menu popping up on every long-press read as "web page", not "app".
     Form fields are excluded (see below) so typing/editing still works. */
  /* `manipulation` is the double-tap-to-zoom half of the zoom lock (see the
     viewport comment in <head>): it kills double-tap zoom app-wide while
     still permitting ordinary panning. Deliberately not `pan-x pan-y`,
     which would also forbid browser pinch here — the viewport meta and the
     gesture listeners already do that, and an ancestor that forbids pinch
     outright risks the engine claiming a two-finger drag as a pan before
     MapLibre's own handler can read it as a map zoom. */
  html, body {
    height: 100%; overflow: hidden; overscroll-behavior-y: none; background: #F2F2F7;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* NOTE: safe-area padding is applied via inline style="padding-top: calc(env(...) + Nrem)"
     at each call site, not a shared class. The Tailwind CDN script injects its utility
     stylesheet *after* this one, so a `.safe-top { padding-top: env(...) }` class sharing
     the `padding-top` property with a Tailwind class like `.pt-6` on the same element loses
     the cascade and silently gets overridden — inline styles always win regardless of
     injection order, which is what actually keeps content out of the iOS notch/Dynamic Island. */
  ::-webkit-scrollbar { display: none; }
  * { -webkit-tap-highlight-color: transparent; }
  input, textarea, [contenteditable="true"] {
    -webkit-user-select: text; user-select: text; -webkit-touch-callout: default;
  }
  .momentum { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

  .sheet-backdrop { animation: fadeIn .18s ease-out; }
  .sheet-panel { animation: slideUp .26s cubic-bezier(.32,.72,0,1); }
  .alert-panel { animation: popIn .18s cubic-bezier(.32,.72,0,1); }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
  @keyframes popIn { from { opacity: 0; transform: scale(.92) } to { opacity: 1; transform: scale(1) } }

  .toast-enter { animation: toastIn .25s cubic-bezier(.32,.72,0,1); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(.98) } to { opacity: 1; transform: translateY(0) scale(1) } }

  .spinner { border: 3px solid rgba(120,120,128,.25); border-top-color: #ED1639; border-radius: 50%; width: 22px; height: 22px; animation: spin .7s linear infinite; }
  .spinner-sm { display: inline-block; border: 2px solid rgba(120,120,128,.25); border-top-color: currentColor; border-radius: 50%; width: 13px; height: 13px; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }

  .row-enter { animation: rowIn .25s ease-out both; }
  @keyframes rowIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: translateY(0) } }

  button, a, .tappable { touch-action: manipulation; }
  .press-98:active { transform: scale(.98); }
  .press-95:active { transform: scale(.95); }
  .press-fade:active { opacity: .5; }

  /* ---- MapLibre chrome. `isolation: isolate` on .maplibregl-map is
     load-bearing, not decorative: MapLibre's internal canvas/marker/popup
     layers carry their own z-index stack, and without a new stacking
     context on the map container those internal z-indices compare
     directly against the rest of the page — a marker/popup can end up
     painting *above* a sibling dropdown or nav bar that has a nominally
     higher Tailwind z-index but lives in a different, unisolated stacking
     context. Isolating the map contains its internals to their own layer
     so this can't happen. ---- */
  #route-map, #pin-map { background: #e5e3df; }
  .maplibregl-map { font-family: inherit; z-index: 0; isolation: isolate; }
  .maplibregl-ctrl-group { background: #fff !important; border: 1px solid rgba(0,0,0,.08); box-shadow: 0 1px 4px rgba(0,0,0,.12) !important; }
  .maplibregl-ctrl-group button { background: transparent !important; }
  /* Karte tab: controls sit top-right (not bottom-right) so the route-picker
     chip row up top and the delivered-count summary card at the bottom can
     never cover them. Pushed down below the chip row's own height. */
  #route-map .maplibregl-ctrl-top-right { margin-top: calc(env(safe-area-inset-top) + 3.75rem); margin-right: .5rem; }
  .maplibregl-popup-content { background: #fff; color: #111; border-radius: .75rem; font-size: 12px; line-height: 1.5; padding: 10px 12px; box-shadow: 0 4px 20px rgba(0,0,0,.18); }
  .maplibregl-popup-tip { border-top-color: #fff !important; border-bottom-color: #fff !important; }
  .marker-badge { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; font-size: 12px; font-weight: 700; color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); border: 2px solid #fff; }
  .marker-fixed { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #fff; color: #48484a; box-shadow: 0 1px 4px rgba(0,0,0,.35); border: 2px solid #48484a; }

  .large-title { transition: opacity .15s, transform .15s; }
  .compact-title { transition: opacity .15s; }
</style>

     interactive and visible while something loads instead of a "page
     reload"-style dimmed takeover. An optional pill below it carries a
     short status message for the few actions where that matters (e.g. the
     JSON bulk-import's "don't close" warning). -->
<div id="progress-bar" class="fixed top-0 left-0 right-0 z-[80] h-[3px] bg-brand-600 origin-left scale-x-0 opacity-0 pointer-events-none" style="transition: transform .5s cubic-bezier(.4,0,.2,1), opacity .2s;"></div>

  info: icon('<circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r=".9" fill="currentColor" stroke="none"/>'),
  archive: icon('<path d="M4 5h16v4H4Z"/><path d="M5 9v10h14V9"/><path d="M10 13h4"/>'),
  person: icon('<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/>'),
};

// A stalled mobile connection never rejects a `fetch` on its own — the
// request just hangs, forever, with the progress bar crawling and (in the
// JSON sheet's case) every control disabled behind it. These are the
// deadlines after which the app gives up and says so. The bulk-import one
// is minutes rather than seconds on purpose: that endpoint legitimately
// spends ~1.1s per uncached address against Nominatim's rate limit, so a
// 30s cap would abort perfectly healthy large imports.
const API_TIMEOUT_MS = 30000;
const API_TIMEOUT_LONG_MS = 6 * 60 * 1000;

async function api(path, options = {}) {
  const { timeoutMs = API_TIMEOUT_MS, signal: callerSignal, ...fetchOptions } = options;

  // AbortSignal.any() would be tidier but isn't in older mobile WebKit,
  // which is exactly the platform this app runs on.
  const controller = new AbortController();
  const onCallerAbort = () => controller.abort();
  if (callerSignal) {
    if (callerSignal.aborted) controller.abort();
    else callerSignal.addEventListener('abort', onCallerAbort, { once: true });
  }
  let timedOut = false;
  const timer = setTimeout(() => { timedOut = true; controller.abort(); }, timeoutMs);

  let res;
  try {
    res = await fetch('/api' + path, {
      // Only declare a JSON body when there actually is one — a
      // Content-Type on a bodyless GET/DELETE is meaningless and is exactly
      // the kind of header that turns a same-origin request into a
      // preflighted one behind some proxies.
      headers: fetchOptions.body ? { 'Content-Type': 'application/json' } : {},
      ...fetchOptions,
      signal: controller.signal,
    });
  } catch (err) {
    // `fetch` rejects with an opaque TypeError ("Failed to fetch" /
    // "Load failed") for every network-level problem, and with an
    // AbortError for both our timeout and a deliberate cancel. None of
    // those strings mean anything to a driver, so each becomes a sentence
    // that says what actually happened and what to do about it.
    if (timedOut) throw apiError('Zeitüberschreitung – der Server hat nicht rechtzeitig geantwortet.', 'timeout');
    if (err?.name === 'AbortError') throw apiError('Abgebrochen.', 'aborted');
    if (navigator.onLine === false) throw apiError('Keine Internetverbindung.', 'offline');
    throw apiError('Server nicht erreichbar.', 'network');
  } finally {
    clearTimeout(timer);
    if (callerSignal) callerSignal.removeEventListener('abort', onCallerAbort);
  }

  if (!res.ok) {
    let msg = 'Ein Fehler ist aufgetreten.';
    let code = null;
    try {
      const data = await res.json();
      if (data.detail && typeof data.detail === 'object') {
        msg = data.detail.message || msg;
        code = data.detail.code || null;
      } else if (data.detail) {
        msg = data.detail;
      }
    } catch (_) {}
    // A 429 carries no `detail` the driver can act on beyond "wait" — and
    // it's the one status where the app itself is the likely cause (a
    // retry loop), so it gets its own sentence rather than the generic one.
    if (res.status === 429 && msg === 'Ein Fehler ist aufgetreten.') {
      msg = 'Zu viele Anfragen. Bitte kurz warten und erneut versuchen.';
    }
    throw apiError(msg, code || `http_${res.status}`);
  }
  // A 204 (or any empty body) would make `res.json()` throw a parse error
  // that reads to the caller like the request failed, when it succeeded.
  const text = await res.text();
  if (!text) return null;
  try {
    return JSON.parse(text);
  } catch (_) {
    throw apiError('Unerwartete Antwort vom Server.', 'bad_response');
  }
}

function apiError(message, code) {
  const err = new Error(message);
  err.code = code;
  return err;
}

// ---------------------------------------------------------------------
// In-flight indicator — a thin top progress bar (nprogress/YouTube-style),
// never a full-screen blocking modal. The app stays visible and tappable
// while a request is in flight instead of a "page reload"-style dimmed
// takeover; a small pill under the bar carries a short status message only
// for the handful of actions where the driver genuinely needs to read one
// (e.g. the JSON bulk-import's "don't close" warning). `depth` makes this
// safe for overlapping calls — the bar only actually hides once every
// caller that asked for it has finished, so one action finishing early
// can't yank the indicator out from under a still-running one.
// ---------------------------------------------------------------------
let progressDepth = 0;

function showProgress(label) {
  progressDepth++;
  const bar = document.getElementById('progress-bar');
  bar.style.transition = 'none';
  bar.style.opacity = '1';
  bar.style.transform = 'scaleX(0.08)';
  void bar.offsetWidth; // force reflow so the slow transition below starts from scaleX(0.08), not skips straight to the target
  bar.style.transition = 'transform 6s cubic-bezier(.15,.8,.4,1), opacity .2s';
  bar.style.transform = 'scaleX(0.75)';

  if (label) {
    document.getElementById('progress-pill-text').textContent = label;
    document.getElementById('progress-pill-wrap').classList.remove('hidden');
  }
}

function hideProgress() {
  progressDepth = Math.max(0, progressDepth - 1);
  if (progressDepth > 0) return; // another caller is still in flight
  const bar = document.getElementById('progress-bar');
  bar.style.transition = 'transform .25s ease-out';
  bar.style.transform = 'scaleX(1)';
  setTimeout(() => {
    bar.style.transition = 'opacity .2s';
    bar.style.opacity = '0';
    setTimeout(() => { bar.style.transform = 'scaleX(0)'; }, 200);
  }, 150);
  document.getElementById('progress-pill-wrap').classList.add('hidden');
}

const MAX_VISIBLE_TOASTS = 3;

function toast(message, type = 'info', durationMs = 3800) {
  const colors = {
    info: 'bg-white/95 text-black',
    error: 'bg-red-50/95 text-red-700',
    success: 'bg-emerald-50/95 text-emerald-700',
  };
  const el = document.createElement('div');
  el.className = `toast-enter pointer-events-auto max-w-sm w-full backdrop-blur-xl border border-black/5 ${colors[type] || colors.info} rounded-2xl px-4 py-3 text-sm font-medium shadow-xl`;
  if (type === 'error') el.setAttribute('role', 'alert');
  el.textContent = message;
  const container = document.getElementById('toast-container');
  // A burst of failures (a bulk import that can't reach the server, a
  // handful of quick taps while offline) otherwise stacks messages down
  // the screen until they cover the list underneath — the oldest ones no
  // longer being read by anyone. Keep the newest few.
  while (container.childElementCount >= MAX_VISIBLE_TOASTS) container.firstElementChild.remove();
  container.appendChild(el);
  if (navigator.vibrate && type === 'error') navigator.vibrate(30);
  setTimeout(() => { el.style.transition = 'opacity .3s, transform .3s'; el.style.opacity = '0'; el.style.transform = 'translateY(-8px)'; setTimeout(() => el.remove(), 300); }, durationMs);
}

// ---------------------------------------------------------------------
// Native-feeling alert/confirm/prompt sheets — replace window.alert/
// confirm/prompt (an ugly, non-brandable OS dialog) with in-app
// UIAlertController-styled equivalents: centered card, hairline-separated
// button row, brand-tinted default action, red destructive action. Still
// just resolve a Promise, so call sites read almost like the built-ins
// they replace.
// ---------------------------------------------------------------------
function closeAlert() {
  document.getElementById('modal-root').innerHTML = '';
  onModalEscape = null;
  restoreFocusAfterModal();
  updateHistoryGuard();
}

// Whatever should happen when Escape is pressed, set by whichever modal is
// currently open. Without it there is no keyboard way out of a sheet at
// all — the backdrop is a click target only — which on a desktop browser
// means a confirm dialog that can't be dismissed without reaching for the
// mouse, and a promise that never settles if the driver assumes it can.
let onModalEscape = null;

// ---------------------------------------------------------------------
// Modal focus handling.
//
// Two problems, both invisible with a mouse and both blocking with a
// keyboard or a screen reader. First, focus stays wherever it was when a
// sheet opens, so Tab walks the *page behind* the dialog — a screen reader
// user gets read the route list they can't see instead of the question
// they're being asked. Second, focus is not put back afterwards, so
// dismissing a sheet drops the caret at the top of the document and the
// driver has to tab all the way back to where they were.
// ---------------------------------------------------------------------
let focusBeforeModal = null;

const FOCUSABLE = 'a[href], button:not([disabled]), textarea:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])';

function rememberFocusBeforeModal() {
  // Only the first modal in a chain records it: a confirm opened from
  // inside a sheet must restore to what was focused before the *sheet*,
  // not to a button inside a sheet that no longer exists.
  if (!isModalOpen()) focusBeforeModal = document.activeElement;
}

function restoreFocusAfterModal() {
  const target = focusBeforeModal;
  focusBeforeModal = null;
  // `isConnected` because render() replaces #app wholesale — the element
  // that had focus before the modal is very often no longer in the document.
  if (target && target.isConnected && typeof target.focus === 'function') {
    target.focus({ preventScroll: true });
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const menu = document.getElementById('route-menu');
    if (menu && !menu.classList.contains('hidden')) { closeRouteMenu(); return; }
    if (onModalEscape) onModalEscape();
    return;
  }
  if (e.key !== 'Tab') return;
  // Focus trap: keep Tab inside the open dialog by wrapping at its ends.
  const root = document.getElementById('modal-root');
  if (!root.childElementCount) return;
  const items = Array.from(root.querySelectorAll(FOCUSABLE)).filter((el) => el.offsetParent !== null);
  if (!items.length) return;
  const first = items[0];
  const last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault();
    last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault();
    first.focus();
  } else if (!root.contains(document.activeElement)) {
    e.preventDefault();
    first.focus();
  }
});

function confirmSheet({ title, message, confirmLabel = 'Bestätigen', cancelLabel = 'Abbrechen', danger = false }) {
  return new Promise((resolve) => {
    rememberFocusBeforeModal();
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="fixed inset-0 z-[60] flex items-center justify-center px-6" role="dialog" aria-modal="true" aria-label="${escapeAttr(title)}">
        <div class="sheet-backdrop absolute inset-0 bg-black/30" data-cancel></div>
        <div class="alert-panel relative w-full max-w-[300px] bg-white/95 backdrop-blur-xl border border-black/5 rounded-2xl overflow-hidden shadow-2xl text-center">
          <div class="px-5 pt-5 pb-4">
            <h3 class="font-semibold text-[15px]">${escapeHtml(title)}</h3>
            ${message ? `<p class="text-[13px] text-black/60 mt-1.5 leading-snug">${escapeHtml(message)}</p>` : ''}
          </div>
          <div class="grid grid-cols-2 border-t border-black/10">
            <button data-cancel class="press-98 py-3 text-[15px] font-medium text-black/70 border-r border-black/10">${escapeHtml(cancelLabel)}</button>
            <button data-confirm class="press-98 py-3 text-[15px] font-semibold ${danger ? 'text-red-600' : 'text-brand-600'}">${escapeHtml(confirmLabel)}</button>
          </div>
        </div>
      </div>
    `;
    const cancel = () => { closeAlert(); resolve(false); };
    root.querySelectorAll('[data-cancel]').forEach(el => el.addEventListener('click', cancel));
    root.querySelector('[data-confirm]').addEventListener('click', () => { closeAlert(); resolve(true); });
    onModalEscape = cancel;
    updateHistoryGuard();
    // Focus lands on the safe choice, never the destructive one: a stray
    // Enter should not confirm "delete route".
    setTimeout(() => root.querySelector('[data-cancel]:not(.absolute)')?.focus(), 60);
  });
}

function promptSheet({ title, message, placeholder = '', initial = '', confirmLabel = 'Speichern', cancelLabel = 'Abbrechen', maxLength = LIMITS.routeName }) {
  return new Promise((resolve) => {
    rememberFocusBeforeModal();
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="fixed inset-0 z-[60] flex items-center justify-center px-6" role="dialog" aria-modal="true" aria-label="${escapeAttr(title)}">
        <div class="sheet-backdrop absolute inset-0 bg-black/30" data-cancel></div>
        <div class="alert-panel relative w-full max-w-[300px] bg-white/95 backdrop-blur-xl border border-black/5 rounded-2xl overflow-hidden shadow-2xl text-center">
          <div class="px-5 pt-5 pb-4">
            <h3 class="font-semibold text-[15px]">${escapeHtml(title)}</h3>
            ${message ? `<p class="text-[13px] text-black/60 mt-1 mb-3 leading-snug">${escapeHtml(message)}</p>` : '<div class="mt-3"></div>'}
            <!-- 16px, not 15: iOS zooms the whole page in when a focused
                 input's font-size is under 16px, and never zooms back out. -->
            <input data-input value="${escapeAttr(initial)}" placeholder="${escapeAttr(placeholder)}" maxlength="${maxLength}" enterkeyhint="done" class="w-full bg-black/5 rounded-lg px-3 py-2 text-base text-center focus:outline-none focus:ring-2 focus:ring-brand-600" />
          </div>
          <div class="grid grid-cols-2 border-t border-black/10">
            <button data-cancel class="press-98 py-3 text-[15px] font-medium text-black/70 border-r border-black/10">${escapeHtml(cancelLabel)}</button>
            <button data-confirm class="press-98 py-3 text-[15px] font-semibold text-brand-600">${escapeHtml(confirmLabel)}</button>
          </div>
        </div>
      </div>
    `;
    const input = root.querySelector('[data-input]');
    setTimeout(() => { input.focus(); input.select(); }, 80);
    // Resolves `null` only for a real cancel, and the (possibly empty)
    // string for a confirm — collapsing "" into null would make submitting
    // a blank field indistinguishable from backing out, which is why
    // accepting the suggested default route name by just tapping
    // "Speichern" used to silently do nothing.
    const submit = () => { const v = input.value; closeAlert(); resolve(v); };
    const cancel = () => { closeAlert(); resolve(null); };
    root.querySelectorAll('[data-cancel]').forEach(el => el.addEventListener('click', cancel));
    root.querySelector('[data-confirm]').addEventListener('click', submit);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    onModalEscape = cancel;
    updateHistoryGuard();
  });
}

// ---------------------------------------------------------------------
// Maps link — deep-links with the plain address, not coordinates, so the
// chosen app does its own (usually better) geocoding/routing to the door.
// Driver's choice of app is persisted in localStorage (see Mehr tab) and
// defaults to Waze, whose waze.com/ul universal link opens the Waze app
// directly if installed (iOS and Android both) and falls back to the
// website if not — one URL for both platforms. `navigate=yes`/`dirflg=d`/
// `travelmode=driving` all start turn-by-turn directions immediately
// instead of just centering the map on the address.
// ---------------------------------------------------------------------
const MAPS_PROVIDER_KEY = 'ear_maps_provider';
const MAPS_PROVIDERS = {
  waze: { label: 'Waze', url: (addr) => `https://waze.com/ul?q=${encodeURIComponent(addr)}&navigate=yes` },
  apple: { label: 'Apple Maps', url: (addr) => `https://maps.apple.com/?daddr=${encodeURIComponent(addr)}&dirflg=d` },
  google: { label: 'Google Maps', url: (addr) => `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(addr)}&travelmode=driving` },
};

function getMapsProvider() {
  let saved;
  try { saved = localStorage.getItem(MAPS_PROVIDER_KEY); } catch (_) { /* private-browsing storage lockout */ }
  // hasOwnProperty, not a plain truthy lookup: a stray stored value like
  // "toString" or "constructor" would otherwise resolve to an inherited
  // Object.prototype function instead of `undefined`, and the provider's
  // missing `.url` would then throw when a maps link is built.
  return Object.prototype.hasOwnProperty.call(MAPS_PROVIDERS, saved) ? saved : 'waze';
}

function setMapsProvider(id) {
  if (!Object.prototype.hasOwnProperty.call(MAPS_PROVIDERS, id)) return;
  try { localStorage.setItem(MAPS_PROVIDER_KEY, id); } catch (_) { /* private-browsing storage lockout */ }
}

function mapsUrl(address) {
  return MAPS_PROVIDERS[getMapsProvider()].url(address || '');
}

// ---------------------------------------------------------------------
// Navigation — tab switching + the single shared "route in focus" that the
// Karte tab visualizes and Routen/Mehr can push a detail screen for. See
// the `state` doc comment above for the full model. `detailOrigin` must
// never be set to 'map' — that's a real tab id, and `render()`'s
// `detailOrigin === state.tab` check would then wrongly treat "picked in
// the map's own route picker" as "push the stops-list detail screen over
// the map". `null` is the correct value for "in focus, but no tab has a
// pushed detail for it".
// ---------------------------------------------------------------------
function switchTab(tab) {
  state.tab = tab;
  render();
}

// Every route-list screen (Routen/Verlauf) reads from `state.routes`, a
// separate array of lightweight summaries fetched once via loadRoutes() —
// it does NOT automatically pick up changes made to `state.currentRoute`
// (rename, status toggle, a stop delivered/added/removed all shift
// customer_count/delivered_count/needs_optimize). Call this right after
// every `state.currentRoute = await api(...)` assignment so the list a
// driver lands back on is never showing stale counts/name/status — cheaper
// than a full loadRoutes() network round-trip on every single mutation.
function syncRouteSummary() {
  const r = state.currentRoute;
  if (!r) return;
  const summary = {
    id: r.id, name: r.name, status: r.status, created_at: r.created_at,
    completed_at: r.completed_at, customer_count: r.customer_count,
    delivered_count: r.delivered_count, needs_optimize: r.needs_optimize,
  };
  const idx = state.routes.findIndex(x => x.id === r.id);
  if (idx === -1) state.routes.unshift(summary); else state.routes[idx] = summary;
}

// ---------------------------------------------------------------------
// Ordering every route update the app receives.
//
// Nearly every endpoint answers with the *whole* route, and the app assigns
// that answer straight to `state.currentRoute`. That is fine when responses
// come back in the order they were sent, and responses do not come back in
// the order they were sent — especially not on mobile data, and especially
// not for the one action a driver fires in bursts: ticking off stops.
//
// Tick stop A, tick stop B a moment later. If A's reply is the slower of
// the two, it lands last, and A's reply describes a route where B was still
// outstanding. B's tick vanishes from the screen — not reverted by a
// failure, just quietly overwritten by an older truth — and the driver has
// no reason to doubt what they're looking at.
//
// Every request that will assign to `state.currentRoute` therefore takes a
// ticket first, and a reply is only allowed to land if no newer reply has
// landed already. Older replies are dropped: whatever is newer is closer to
// what the server actually holds.
// ---------------------------------------------------------------------
let mutationSeq = 0;
let lastAppliedSeq = 0;

function nextSeq() {
  return ++mutationSeq;
}

// Ticks the driver has made that the server has not confirmed yet, keyed by
// stop id.
//
// Sequence numbers alone are not quite enough. They order replies by when
// each request was *sent*, but the server is free to process two requests
// in the other order — so the reply the app discards as "older" can be the
// one carrying the newer truth, and a tick would sit on screen while the
// route object underneath it says otherwise.
//
// Rather than trying to divine the server's ordering from replies that
// carry no version, the app keeps what it knows for certain: which ticks
// the driver has made and which have not been answered yet. Every incoming
// route is re-stamped with those before it's displayed, and each entry is
// dropped the moment its own request settles. What the driver did stays on
// screen until the server has actually spoken about that exact stop.
const pendingDelivered = new Map();
// Per-stop generation counter backing `toggleDelivered`'s own race guard —
// see the comment there. Not the same thing `nextSeq()`/`lastAppliedSeq`
// guard: those order which *route* snapshot wins app-wide, this orders
// which of two rapid taps on the *same stop* gets to clear/revert the
// prediction it made.
const pendingDeliveredGen = new Map();

/// Re-applies unconfirmed ticks on top of a freshly received route, and
/// recomputes the count from the stops rather than adjusting it by hand —
/// a counter nudged up and down through races drifts, a derived one cannot.
function rebasePendingDelivered() {
  const r = state.currentRoute;
  if (!r || !Array.isArray(r.stops)) return;
  for (const [stopId, delivered] of pendingDelivered) {
    const stop = r.stops.find((s) => s.id === stopId);
    if (stop) stop.delivered = delivered;
  }
  r.delivered_count = r.stops.filter((s) => s.kind === 'customer' && s.delivered).length;
}

/// Applies a server response to the route in focus, unless it's stale.
/// Returns whether it was applied, so callers can skip their success
/// toast/haptic for a reply that changed nothing on screen.
function applyRouteUpdate(seq, routeId, updated) {
  // The driver moved to a different route while this was in flight.
  if (state.currentRoute?.id !== routeId) return false;
  // A newer reply already landed; this one describes an older world.
  if (seq < lastAppliedSeq) return false;
  lastAppliedSeq = seq;
  state.currentRoute = updated;
  rebasePendingDelivered();
  syncRouteSummary();
  return true;
}

/// Loading a route wholesale (tapping one in a list, the Karte picker,
/// a resume refresh) supersedes anything in flight for the previous one.
function adoptRoute(seq, route) {
  if (seq < lastAppliedSeq) return false;
  lastAppliedSeq = seq;
  state.currentRoute = route;
  rebasePendingDelivered();
  syncRouteSummary();
  return true;
}

// `latestRouteRequestId` additionally guards *which route* wins when two
// different routes are opened in quick succession: the sequence numbers
// above would let the newer request win anyway, but this keeps the error
// toast from firing for a request the driver has already abandoned.
let latestRouteRequestId = null;

async function openRoute(id) {
  latestRouteRequestId = id;
  const seq = nextSeq();
  showProgress();
  try {
    const route = await api(`/routes/${id}`);
    if (latestRouteRequestId !== id) return;
    if (!adoptRoute(seq, route)) return;
    state.detailOrigin = state.tab;
    render();
  } catch (err) {
    if (latestRouteRequestId === id) toast(err.message || 'Route konnte nicht geladen werden.', 'error');
  } finally {
    hideProgress();
  }
}

function closeDetail() {
  state.currentRoute = null;
  state.detailOrigin = null;
  // Predictions belong to the route that was on screen; carrying them to
  // the next one would stamp its stops with another route's ids.
  pendingDelivered.clear();
  pendingDeliveredGen.clear();
  render();
}

async function selectMapRoute(id) {
  latestRouteRequestId = id;
  const seq = nextSeq();
  showProgress();
  try {
    const route = await api(`/routes/${id}`);
    if (latestRouteRequestId !== id) return;
    if (!adoptRoute(seq, route)) return;
    state.detailOrigin = null;
    render();
  } catch (err) {
    if (latestRouteRequestId === id) toast(err.message || 'Route konnte nicht geladen werden.', 'error');
  } finally {
    hideProgress();
  }
}

function openCurrentRouteDetail() {
  if (!state.currentRoute) return;
  state.tab = state.currentRoute.status === 'completed' ? 'verlauf' : 'routes';
  state.detailOrigin = state.tab;
  render();
}

// ---------------------------------------------------------------------
// Data loading
// ---------------------------------------------------------------------
async function loadRoutes() {
  try {
    // `|| []` rather than trusting the shape: every list render indexes
    // straight into this, and one malformed response would otherwise take
    // the whole screen down with a TypeError instead of an error message.
    state.routes = (await api('/routes')) || [];
    lastRefreshAt = Date.now();
    render();
  } catch (err) {
    toast(err.message || 'Routen konnten nicht geladen werden.', 'error');
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="px-6 pt-28 text-center text-black/50">
        <p class="text-sm mb-4">Verbindung zum Server fehlgeschlagen.</p>
        <button onclick="loadRoutes()" class="press-98 px-5 py-3 rounded-xl bg-brand-600 font-semibold text-white text-sm">Erneut versuchen</button>
      </div>
    `;
  } finally {
    hideSplash();
  }
}

// ---------------------------------------------------------------------
// Refresh on resume. Installed as a home-screen PWA, this app is opened,
// used, backgrounded and reopened all day — but it only ever fetched at
// startup, so a driver returning to it hours later was looking at this
// morning's list: routes someone else completed still showing as active,
// stops added on another device missing entirely, and no indication any
// of it was stale.
//
// The throttle is what keeps this from being a nuisance: switching apps
// for three seconds to check a phone number shouldn't fire a network
// request, and on a bad connection a burst of them would queue up behind
// each other.
// ---------------------------------------------------------------------
const REFRESH_ON_RESUME_AFTER_MS = 60000;
let lastRefreshAt = 0;
let refreshInFlight = false;

async function refreshOnResume() {
  if (document.visibilityState !== 'visible') return;
  if (refreshInFlight || Date.now() - lastRefreshAt < REFRESH_ON_RESUME_AFTER_MS) return;
  refreshInFlight = true;
  const seq = nextSeq();
  try {
    const routes = (await api('/routes')) || [];
    state.routes = routes;
    lastRefreshAt = Date.now();
    // The route in focus carries the stop list the driver is actually
    // working from, and it goes stale the same way — but only refetch it
    // if it still exists, so a route deleted elsewhere closes cleanly
    // instead of throwing a 404 toast in the driver's face on resume.
    const current = state.currentRoute;
    if (current && !routes.some((r) => r.id === current.id)) {
      closeDetail();
    } else if (current) {
      const fresh = await api(`/routes/${current.id}`);
      // Sequenced like every other update: a background refresh must never
      // overwrite a tick the driver made while it was in flight.
      applyRouteUpdate(seq, current.id, fresh);
    }
    render(true);
  } catch (_) {
    // A silent background refresh that fails is not worth interrupting
    // anyone over — whatever is on screen stays, and the next resume (or
    // any deliberate action) tries again.
  } finally {
    refreshInFlight = false;
  }
}

function hideSplash() {
  const el = document.getElementById('splash');
  if (!el) return;
  el.style.transition = 'opacity .3s ease-out';
  el.style.opacity = '0';
  setTimeout(() => el.remove(), 320);
}

/// Runs a mutating request and lands its result on the route in focus,
/// with both guards applied: the wrong-route check (the driver navigated
/// away) and the stale-reply check (something newer already landed).
async function refreshCurrentRoute(makeRequest, label) {
  const routeId = state.currentRoute?.id;
  if (routeId == null) return;
  const seq = nextSeq();
  showProgress(label);
  try {
    const updated = await makeRequest();
    if (applyRouteUpdate(seq, routeId, updated)) render();
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

// ---------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------
async function createRoute() {
  const name = await promptSheet({ title: 'Neue Route', message: 'Name (z. B. Kundenname, Bezirk, Tour):', placeholder: `Route ${new Date().toLocaleDateString('de-AT')}` });
  if (name === null) return;
  showProgress();
  try {
    // Left blank on purpose = "use the default name" — the server fills in
    // "Route <heutiges Datum>" for an omitted name.
    const body = name.trim() ? { name: name.trim() } : {};
    const route = await api('/routes', { method: 'POST', body: JSON.stringify(body) });
    adoptRoute(nextSeq(), route);
    state.detailOrigin = 'routes';
    state.tab = 'routes';
    render();
    if (navigator.vibrate) navigator.vibrate(15);
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

// Mirrors `addr_key` in src/main.rs closely enough to catch the case that
// matters here: the same address typed twice with different spellings of
// "Straße". Only used to decide whether to ask a question — the server
// remains the authority on what actually matches what.
function addrKey(strasse, plz) {
  const s = String(strasse || '')
    .trim().toLowerCase()
    .replace(/\s+/g, ' ')
    .replace(/str\.(\s|$|\d)/g, 'straße$1')
    .replace(/strasse\b/g, 'straße');
  return `${s}|${String(plz || '').trim()}`;
}

async function submitStop(form, stopId) {
  const kunde = form.kunde.value.trim();
  const strasse = form.strasse.value.trim();
  const plz = form.plz.value.trim();
  const paket = form.paket.value.trim();
  const notiz = form.notiz.value.trim();
  if (!kunde || !strasse || !plz) { toast('Bitte Kunde, Straße und Bezirk ausfüllen.', 'error'); return; }

  lastUsedPlz = plz;
  const data = { kunde, strasse, plz, paket, notiz, stopId };
  // closeSheet() first, always: the confirm dialog below shares #modal-root
  // with this sheet, so closing afterwards would wipe the dialog out of the
  // DOM while it's still being awaited.
  closeSheet();

  // Two menus for the same address on one route is occasionally real (two
  // flats in one building) and much more often a double entry — worth one
  // question, not worth blocking.
  const key = addrKey(strasse, plz);
  const duplicate = state.currentRoute?.stops?.find(
    (s) => s.kind === 'customer' && s.id !== stopId && addrKey(s.strasse, s.plz) === key
  );
  if (duplicate) {
    const ok = await confirmSheet({
      title: 'Adresse schon in der Route',
      message: `„${duplicate.kunde}" steht bereits unter ${strasse}, ${plz} Wien. Trotzdem hinzufügen?`,
      confirmLabel: 'Trotzdem',
    });
    if (!ok) { openAddSheet(stopId ? { ...data, id: stopId } : data); return; }
  }

  await sendStop(data);
}

async function sendStop(data, coords) {
  // Geocoding can take well over a second — captures the route this stop
  // was meant for so a driver who's since navigated to a different route
  // doesn't get that route's screen silently overwritten (or, on failure,
  // a pin-drop sheet popped open for a route they're no longer looking at)
  // once this finally resolves.
  // The pin-drop sheet can outlive the route it was opened for (the driver
  // is free to close it and navigate away, then come back and confirm the
  // pin), so this genuinely can run with no route in focus.
  if (!state.currentRoute) { toast('Keine Route ausgewählt.', 'error'); return; }
  const routeId = state.currentRoute.id;
  const payload = { kunde: data.kunde, strasse: data.strasse, plz: data.plz, paket: data.paket, notiz: data.notiz };
  if (coords) { payload.lat = coords.lat; payload.lon = coords.lon; }
  const body = JSON.stringify(payload);

  const seq = nextSeq();
  showProgress(data.stopId ? 'Adresse wird aktualisiert …' : 'Stopp wird hinzugefügt …');
  try {
    const updated = data.stopId
      ? await api(`/stops/${data.stopId}`, { method: 'PATCH', body })
      : await api(`/routes/${routeId}/stops`, { method: 'POST', body });
    if (!applyRouteUpdate(seq, routeId, updated)) return;
    // Skips the staggered row-enter replay across the whole list for what
    // is, from the driver's point of view, a one-row add/edit — the same
    // reasoning `toggleDelivered` already applies below.
    render(true);
    if (navigator.vibrate) navigator.vibrate(15);
    if (coords) toast('Standort manuell gesetzt ✓', 'success');
    else toast(data.stopId ? 'Stopp aktualisiert ✓' : 'Stopp hinzugefügt ✓', 'success');
  } catch (err) {
    if (!coords && (err.code === 'address_not_found' || err.code === 'geocode_unavailable') && state.currentRoute?.id === routeId) {
      openPinDropSheet(data);
      return;
    }
    // Everything the driver typed lives only in `data` at this point — the
    // sheet was closed before the request went out. Losing a connection
    // must not also lose the address they just keyed in one-handed in a
    // van, so the form comes back with every field exactly as it was and
    // the error explains why. Without this, "Server nicht erreichbar" and
    // a blank slate were the same event.
    toast(err.message, 'error');
    if (state.currentRoute?.id === routeId) {
      openAddSheet(data.stopId ? { ...data, id: data.stopId } : data);
    }
  } finally {
    hideProgress();
  }
}

// Optimistic — the delivered-toggle is the single most-tapped action in
// the app, so it flips instantly instead of waiting on a network
// round-trip, then reconciles with the server response in the background.
// Safe to predict: toggling delivered never reorders stops or changes
// route geometry (see update_stop in src/main.rs), only the flag itself
// and delivered_count move. Reverts precisely on failure; guards against
// the driver having navigated to a different route before the response
// lands, so a slow/failed request can never stomp whatever's on screen by
// then.
async function toggleDelivered(stopId, delivered) {
  const route = state.currentRoute;
  if (!route) return;
  const stop = route.stops.find((s) => s.id === stopId);
  if (!stop) return;

  const prevDelivered = stop.delivered;
  // A generation counter per stop, not just the presence of a
  // `pendingDelivered` entry: a rapid double-tap of the same checkbox
  // starts a second request while the first is still in flight, and
  // whichever settles first must not clear a prediction the *other* one is
  // still relying on — only the response matching this call's own
  // generation is allowed to clear/revert it below.
  const gen = (pendingDeliveredGen.get(stopId) || 0) + 1;
  pendingDeliveredGen.set(stopId, gen);
  pendingDelivered.set(stopId, delivered);
  stop.delivered = delivered;
  route.delivered_count = route.stops.filter((s) => s.kind === 'customer' && s.delivered).length;
  // The list screens read their counts from `state.routes`, not from the
  // route in focus — without this the prediction only shows on the detail
  // screen, and backing out to Routen before the server answers shows the
  // old count next to a row the driver just ticked off.
  syncRouteSummary();
  render(true);
  if (navigator.vibrate) navigator.vibrate(delivered ? [12, 40, 12] : 12);

  const seq = nextSeq();
  try {
    const updated = await api(`/stops/${stopId}`, { method: 'PATCH', body: JSON.stringify({ delivered }) });
    // Confirmed: this stop's own request has been answered, so the
    // prediction for it is no longer needed to hold the screen steady —
    // unless a newer tap for the same stop has since started, in which
    // case this reply is stale and must not clear *its* prediction.
    if (pendingDeliveredGen.get(stopId) === gen) pendingDelivered.delete(stopId);
    if (!applyRouteUpdate(seq, route.id, updated)) return;
    render(true);
  } catch (err) {
    if (pendingDeliveredGen.get(stopId) === gen) pendingDelivered.delete(stopId);
    // Looked up fresh, not the `route`/`stop` captured at the top of this
    // call: a route refresh that landed while this request was in flight
    // (`refreshOnResume` after the driver backgrounded the app, most
    // realistically) replaces `state.currentRoute` with a new object
    // entirely. Reverting the *old* object's stop would silently leave the
    // checkmark on screen — the one actually rendered — stuck showing the
    // optimistic value forever, with no correction and no visible link to
    // this error toast.
    const currentRoute = state.currentRoute;
    if (currentRoute?.id === route.id) {
      const currentStop = currentRoute.stops.find((s) => s.id === stopId);
      if (currentStop) currentStop.delivered = prevDelivered;
      // Derived, never nudged: a count adjusted by ±1 through a sequence of
      // races ends up describing a route that doesn't exist.
      currentRoute.delivered_count = currentRoute.stops.filter((s) => s.kind === 'customer' && s.delivered).length;
      syncRouteSummary();
      render(true);
    }
    toast(err.message, 'error');
  }
}

// NOTE for call sites: the confirm dialog and the bottom sheets share one
// `#modal-root`, so anything that calls this from inside an open sheet has
// to `closeSheet()` *first*. Calling it after (`deleteStop(id);
// closeSheet();`) wipes the confirm dialog this function is still awaiting
// out of the DOM the moment it appears — the promise then never settles
// and the stop is never deleted.
async function deleteStop(stopId) {
  const ok = await confirmSheet({ title: 'Stopp löschen?', message: 'Dieser Kundenstopp wird endgültig entfernt.', confirmLabel: 'Löschen', danger: true });
  if (!ok) return;
  await refreshCurrentRoute(() => api(`/stops/${stopId}`, { method: 'DELETE' }), 'Stopp wird entfernt …');
}

// Each of these captures the route's id *before* its confirm/prompt sheet
// (and then the network request) resolves, and checks it again afterward —
// the driver is free to close the sheet/navigate to a different route
// while either is pending, and without the check a slow response could
// silently overwrite (or, for deleteRoute, close) whatever route they've
// since navigated to instead of the one this action was actually for.
async function renameRoute() {
  const routeId = state.currentRoute?.id;
  if (routeId == null) return;
  const name = await promptSheet({ title: 'Route umbenennen', initial: state.currentRoute.name });
  if (name === null) return;
  if (!name.trim()) { toast('Name darf nicht leer sein.', 'error'); return; }
  const seq = nextSeq();
  showProgress();
  try {
    const updated = await api(`/routes/${routeId}`, { method: 'PATCH', body: JSON.stringify({ name: name.trim() }) });
    // Renaming touches only the header text, never the stop list — a full
    // staggered row-enter replay across every stop for a header-only edit
    // reads as "the list just reloaded" when nothing in it did.
    if (applyRouteUpdate(seq, routeId, updated)) render(true);
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

async function resetDelivered() {
  const routeId = state.currentRoute?.id;
  if (routeId == null) return;
  const ok = await confirmSheet({ title: 'Zustellungen zurücksetzen?', message: 'Alle Häkchen dieser Route werden entfernt. Adressen und Reihenfolge bleiben erhalten.', confirmLabel: 'Zurücksetzen' });
  if (!ok) return;
  const seq = nextSeq();
  showProgress();
  try {
    const updated = await api(`/routes/${routeId}/reset-delivered`, { method: 'POST' });
    if (!applyRouteUpdate(seq, routeId, updated)) return;
    render();
    toast('Zustellungen zurückgesetzt ✓', 'success');
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

async function toggleRouteStatus() {
  const routeId = state.currentRoute?.id;
  if (routeId == null) return;
  const newStatus = state.currentRoute.status === 'completed' ? 'active' : 'completed';
  const ok = await confirmSheet({
    title: newStatus === 'completed' ? 'Route abschließen?' : 'Route reaktivieren?',
    message: `„${state.currentRoute.name}" ${newStatus === 'completed' ? 'als abgeschlossen markieren.' : 'wieder als aktiv markieren.'}`,
    confirmLabel: newStatus === 'completed' ? 'Abschließen' : 'Reaktivieren',
  });
  if (!ok) return;
  const seq = nextSeq();
  showProgress();
  try {
    const updated = await api(`/routes/${routeId}`, { method: 'PATCH', body: JSON.stringify({ status: newStatus }) });
    if (!applyRouteUpdate(seq, routeId, updated)) return;
    // A completed route belongs in Verlauf and an active one in Routen, so
    // the detail screen follows it across rather than being left in a tab
    // whose list no longer contains it.
    state.tab = newStatus === 'completed' ? 'verlauf' : 'routes';
    state.detailOrigin = state.tab;
    render();
    toast(newStatus === 'completed' ? 'Route abgeschlossen ✓' : 'Route wieder aktiv ✓', 'success');
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

async function deleteRoute() {
  const routeId = state.currentRoute?.id;
  if (routeId == null) return;
  const ok = await confirmSheet({ title: 'Route löschen?', message: `„${state.currentRoute.name}" wird mit allen Stopps endgültig gelöscht. Das kann nicht rückgängig gemacht werden.`, confirmLabel: 'Löschen', danger: true });
  if (!ok) return;
  showProgress('Route wird gelöscht …');
  try {
    await api(`/routes/${routeId}`, { method: 'DELETE' });
    // Ladeliste ticks for a route that no longer exists describe a van
    // loaded for a job that isn't happening.
    ladelisteChecked.delete(routeId);
    // Close the detail screen *before* reloading the list: closeDetail()
    // renders, and rendering a detail screen for a route that no longer
    // exists would read its stops off an object the server has forgotten.
    if (state.currentRoute?.id === routeId) closeDetail();
    // Only *after* that close, never before it: render() opens by writing
    // the outgoing screen's scroll offset under `renderedScreenKey`, which
    // is still this route's detail screen until closeDetail() has run. Drop
    // the entry any earlier and the very next render puts it straight back.
    forgetScrollMemory(`detail:${routeId}`);
    await loadRoutes();
    toast('Route gelöscht ✓', 'success');
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

async function manualOptimize() {
  await refreshCurrentRoute(() => api(`/routes/${state.currentRoute.id}/optimize`, { method: 'POST' }), 'Route wird optimiert …');
}

async function clearOfflineCache() {
  const ok = await confirmSheet({ title: 'Offline-Daten leeren?', message: 'Zwischengespeicherte Kartenkacheln und App-Dateien werden gelöscht und beim nächsten Öffnen neu geladen.', confirmLabel: 'Leeren' });
  if (!ok) return;
  try {
    const names = await caches.keys();
    await Promise.all(names.map((n) => caches.delete(n)));
    toast('Offline-Daten geleert ✓', 'success');
  } catch (_) {
    toast('Offline-Daten konnten nicht geleert werden.', 'error');
  }
}

// ---------------------------------------------------------------------
// Generic bottom-sheet shell — shared by the add/edit-stop sheet, the
// JSON-import sheet and the pin-drop fallback.
// ---------------------------------------------------------------------
// Bound once, not per sheet-open: `#modal-root` is a persistent node
// `renderSheetShell` never recreates (only its `innerHTML`), so a listener
// attached inside that function on every call — as this one used to be —
// stacks a duplicate on every single add/edit-stop, JSON-import, and
// Ladeliste open for the life of the page. A driver who opens 30-40 sheets
// over a shift (routine for this app) ended up with 30-40 permanent
// duplicate `focusin` handlers, each independently scheduling a
// `scrollIntoView` on every future field focus — a real, unbounded leak on
// a PWA meant to stay open all day. Attached once at module load instead,
// against the one `#modal-root` element that always exists.
document.getElementById('modal-root').addEventListener('focusin', (e) => {
  // The on-screen keyboard covers roughly the bottom half of the screen,
  // and iOS does not shrink the visual viewport for a `position: fixed`
  // sheet — so focusing Notiz on a phone puts the caret in a field the
  // driver cannot see while typing into it. Scrolling the focused field to
  // the middle of the sheet is what keeps it visible.
  if (!e.target.matches('input, textarea, select')) return;
  setTimeout(() => e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }), 250);
});

function renderSheetShell(bodyHtml, { scrollable = true, label = '' } = {}) {
  rememberFocusBeforeModal();
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="fixed inset-0 z-50 flex items-end justify-center" role="dialog" aria-modal="true" ${label ? `aria-label="${escapeAttr(label)}"` : ''}>
      <div id="sheet-backdrop" class="sheet-backdrop absolute inset-0 bg-black/30" onclick="closeSheet()"></div>
      <div class="sheet-panel relative w-full max-w-md bg-[#F2F2F7] rounded-t-3xl flex flex-col ${scrollable ? 'max-h-[92vh]' : ''} shadow-sheet" style="padding-bottom: calc(env(safe-area-inset-bottom) + 1.25rem)">
        <div class="w-9 h-1.5 bg-black/15 rounded-full mx-auto mt-3 mb-1 shrink-0"></div>
        <div class="${scrollable ? 'overflow-y-auto momentum' : ''} px-5 pt-3">${bodyHtml}</div>
      </div>
    </div>
  `;
  onModalEscape = closeSheet;
  updateHistoryGuard();
}

function closeSheet() {
  // A bulk import in flight has deliberately locked the sheet (see
  // setJsonSheetBusy) — Escape and the back button must not be a way around
  // that, or the sheet can be dismissed mid-save after all.
  if (jsonSaveController) return;
  document.getElementById('modal-root').innerHTML = '';
  onModalEscape = null;
  if (pinDropMap) { pinDropMap.remove(); pinDropMap = null; pinDropMarker = null; }
  restoreFocusAfterModal();
  updateHistoryGuard();
}

// ---------------------------------------------------------------------
// Add / edit stop — a single-stop form (POST /stops or PATCH /stops/:id).
// Bulk-editing the whole route as JSON is a separate, deliberately
// separate flow reachable only from the route's "..." menu ("Als JSON
// bearbeiten") — see update_route_from_json in src/main.rs — not offered
// here too, so there's exactly one place to reach for each: "+" always
// means "one stop", "..." always means "the whole route".
// ---------------------------------------------------------------------
const EXAMPLE_CUSTOMER_STOP = {
  kunde: 'BEISPIEL – Fam. Mustermann',
  strasse: 'Beispielgasse 12',
  plz: '1190',
  paket: '1x Mittagsmenü',
  notiz: 'Bitte klingeln, 2. Stock',
};
function stopToCustomerJson(s) {
  return { kunde: s.kunde, strasse: s.strasse, plz: s.plz, paket: s.paket || '', notiz: s.notiz || '' };
}

function openAddSheet(stop) {
  renderManualForm(stop);
  if (!stop?.id) setTimeout(() => document.querySelector('#stop-form [name=kunde]')?.focus(), 80);
}

// ---------------------------------------------------------------------
// Stop row press handling — tapping a stop row used to open the edit
// sheet immediately, which meant a stray tap while scrolling/scanning
// the list could yank the driver into an edit form. Editing now needs a
// deliberate hold (touch) or right-click (desktop, via oncontextmenu);
// a plain tap does nothing. Only a real drag (finger moves more than a
// few px — scrolling the list) cancels the hold; a finger is never
// perfectly still, so cancelling on any movement at all meant the hold
// almost never survived long enough to fire on a real touchscreen.
//
// "A plain tap does nothing" is right for avoiding stray edits and wrong
// as the *only* feedback a driver ever gets: there is nothing on the row
// that says a hold does anything at all, so the whole edit flow is
// invisible until someone happens to rest a finger on it. A tap that was
// clearly a tap — released early, no movement — therefore says so once,
// which teaches the gesture without ever acting on the stray taps this
// was built to ignore. It says it *once*: after the first time, a driver
// who taps a row is not asking to be told again.
// ---------------------------------------------------------------------
let stopPressTimer = null;
let stopPressEl = null;
let stopPressStart = null;
let lastTouchTime = 0;
let editHintShown = false;

function hintLongPressToEdit() {
  if (editHintShown) return;
  editHintShown = true;
  toast('Zum Bearbeiten den Stopp gedrückt halten.', 'info', 3000);
}

function getStop(stopOrId) {
  if (typeof stopOrId === 'object' && stopOrId !== null) return stopOrId;
  const numId = Number(stopOrId);
  return state.currentRoute?.stops?.find(s => s.id === numId);
}

function stopLongPressStart(e, stopOrId) {
  if (e.type === 'touchstart') {
    lastTouchTime = Date.now();
  } else if (e.type === 'mousedown') {
    if (e.button !== 0) return;
    if (Date.now() - lastTouchTime < 500) return;
  }
  clearTimeout(stopPressTimer);
  const stop = getStop(stopOrId);
  if (!stop) return;
  stopPressEl = e.currentTarget;
  const t = e.touches ? e.touches[0] : e;
  stopPressStart = { x: t.clientX, y: t.clientY };
  stopPressEl.classList.add('opacity-60');
  stopPressTimer = setTimeout(() => {
    stopPressEl?.classList.remove('opacity-60');
    stopPressTimer = null;
    if (navigator.vibrate) navigator.vibrate(10);
    openAddSheet(stop);
  }, 450);
}

function stopLongPressMove(e) {
  if (!stopPressTimer || !stopPressStart) return;
  const t = e.touches ? e.touches[0] : e;
  const dx = t.clientX - stopPressStart.x;
  const dy = t.clientY - stopPressStart.y;
  if (Math.hypot(dx, dy) > 12) stopLongPressEnd();
}

function stopLongPressEnd() {
  // A pending timer at release time means the press ended before the hold
  // fired — i.e. this was a tap, not a hold, and not a scroll (which
  // clears the timer via stopLongPressMove).
  const wasTap = stopPressTimer !== null;
  clearTimeout(stopPressTimer);
  stopPressEl?.classList.remove('opacity-60');
  stopPressTimer = null;
  stopPressEl = null;
  stopPressStart = null;
  if (wasTap) hintLongPressToEdit();
}

function stopLongPressContext(e, stopOrId) {
  e.preventDefault();
  const stop = getStop(stopOrId);
  if (!stop) return;
  stopLongPressEnd();
  openAddSheet(stop);
}

// The keyboard equivalent of the long-press. A touch gesture is the only
// way to reach the edit sheet otherwise, which leaves it unreachable with
// a keyboard or a screen reader — and unlike a stray tap, pressing Enter
// on a focused row is unambiguously deliberate, so it opens the sheet
// directly rather than showing the hint.
function stopRowKeydown(e, stopOrId) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const stop = getStop(stopOrId);
  if (!stop) return;
  e.preventDefault();
  openAddSheet(stop);
}

const FIELD = 'mt-1 w-full bg-white rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-brand-600';
const LABEL = 'text-[13px] font-medium text-black/50';

function renderManualForm(stop) {
  const isEdit = !!stop?.id;
  const defaultPlz = stop?.plz || (isEdit ? '' : lastUsedPlz) || '';

  // Every field is wired to its input with a real for/id pair rather than
  // a bare floating <label>: an unassociated label is not a label at all —
  // tapping it doesn't focus the field, and a screen reader announces the
  // input as unlabelled.
  const uid = (name) => `stop-field-${name}`;

  renderSheetShell(`
    <h2 class="text-[22px] font-bold mb-4">${isEdit ? 'Stopp bearbeiten' : 'Neuer Stopp'}</h2>
    <form id="stop-form" class="space-y-3 pb-2">
      <div>
        <label class="${LABEL}" for="${uid('kunde')}">Kunde</label>
        <input id="${uid('kunde')}" name="kunde" required autocomplete="off" maxlength="${LIMITS.kunde}" enterkeyhint="next" value="${escapeAttr(stop?.kunde || '')}" placeholder="z.B. Fam. Gruber" class="${FIELD}" />
      </div>
      <div>
        <label class="${LABEL}" for="${uid('strasse')}">Straße &amp; Hausnummer</label>
        <input id="${uid('strasse')}" name="strasse" required autocomplete="off" maxlength="${LIMITS.strasse}" enterkeyhint="next" value="${escapeAttr(stop?.strasse || '')}" placeholder="z.B. Favoritenstraße 45 (Adresse einfügen geht auch)" class="${FIELD}" />
      </div>
      <div>
        <label class="${LABEL}" for="${uid('plz')}">Bezirk</label>
        <select id="${uid('plz')}" name="plz" required class="${FIELD}">
          <option value="" disabled ${!defaultPlz ? 'selected' : ''}>Bezirk wählen …</option>
          ${VIENNA_DISTRICTS.map(d => `<option value="${d.plz}" ${defaultPlz === d.plz ? 'selected' : ''}>${d.bezirk}. Bezirk – ${d.name} (${d.plz})</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="${LABEL}" for="${uid('paket')}">Paket</label>
        <input id="${uid('paket')}" name="paket" autocomplete="off" maxlength="${LIMITS.paket}" enterkeyhint="next" value="${escapeAttr(stop?.paket || '')}" placeholder="z.B. 2 Pakete, 1x Kühlware" class="${FIELD}" />
      </div>
      <div>
        <label class="${LABEL}" for="${uid('notiz')}">Notiz</label>
        <textarea id="${uid('notiz')}" name="notiz" rows="2" maxlength="${LIMITS.notiz}" placeholder="z.B. persönlich übergeben, Lift im Hof, Code 1234" class="${FIELD} resize-none">${escapeHtml(stop?.notiz || '')}</textarea>
      </div>
      <div class="flex gap-3 pt-2">
        ${isEdit ? `<button type="button" onclick="closeSheet(); deleteStop(${stop.id});" class="press-98 px-4 py-3 rounded-xl bg-red-50 text-red-600 font-semibold">Löschen</button>` : ''}
        <button type="submit" class="press-98 flex-1 py-3 rounded-xl bg-brand-600 font-semibold text-white">${isEdit ? 'Speichern' : 'Hinzufügen & Optimieren'}</button>
      </div>
    </form>
  `, { label: isEdit ? 'Stopp bearbeiten' : 'Neuer Stopp' });

  const form = document.getElementById('stop-form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    submitStop(e.target, stop?.id);
  });

  // Paste a full address ("Clementinengasse 11, 1150 Wien") straight from a
  // chat/SMS into the Straße field: pull the district PLZ out of it and
  // select it automatically instead of making the driver do it by hand.
  const strasseInput = form.strasse;
  const plzSelect = form.plz;
  strasseInput.addEventListener('input', (e) => {
    if (e.inputType !== 'insertFromPaste') return;
    autoFillDistrictFromText(strasseInput, plzSelect);
  });
  strasseInput.addEventListener('blur', () => autoFillDistrictFromText(strasseInput, plzSelect));
}

function autoFillDistrictFromText(strasseInput, plzSelect) {
  const text = strasseInput.value;
  // Prefers a match after a comma — the expected "Straße Hausnummer, PLZ"
  // paste shape the comment above describes — over the first matching
  // token anywhere in the string. Without this, a housenumber that happens
  // to coincide with a real Vienna PLZ (e.g. a combined house/door number
  // like "12 1200") could get read as the district instead, stripping it
  // out of the address text. `DISTRICT_BY_PLZ` still has the final say
  // either way: only one of the 23 real Vienna postal codes ever matches.
  const afterComma = text.slice(text.indexOf(',') + 1);
  const match = afterComma.match(/\b1\d{3}\b/) || text.match(/\b1\d{3}\b/);
  if (!match || !DISTRICT_BY_PLZ[match[0]]) return;
  plzSelect.value = match[0];
  let cleaned = strasseInput.value.replace(match[0], '');
  cleaned = cleaned.replace(/,?\s*(wien|austria|österreich)\.?/gi, '');
  cleaned = cleaned.replace(/,\s*,/g, ',').replace(/,\s*$/, '').replace(/\s{2,}/g, ' ').trim();
  strasseInput.value = cleaned;
}
