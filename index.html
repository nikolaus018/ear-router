async function copyJsonToClipboard() {
  const editor = document.getElementById('json-editor');
  if (!editor) return;
  try {
    await navigator.clipboard.writeText(editor.value);
    toast('JSON kopiert ✓', 'success');
  } catch (_) {
    toast('Kopieren nicht möglich – bitte im Feld manuell markieren.', 'error');
  }
}

async function pasteIntoJsonEditor() {
  const editor = document.getElementById('json-editor');
  if (!editor) return;
  try {
    const text = await navigator.clipboard.readText();
    if (!text) { toast('Zwischenablage ist leer.', 'error'); return; }
    editor.value = text;
    editor.focus();
    toast('Eingefügt ✓', 'success');
  } catch (_) {
    toast('Einfügen aus Zwischenablage nicht möglich – bitte manuell ins Feld einfügen (lange drücken → Einfügen).', 'error');
  }
}

function clearJsonEditor() {
  const editor = document.getElementById('json-editor');
  if (!editor) return;
  editor.value = '[]';
  editor.focus();
}

// Disables every control in the JSON sheet (including the backdrop, so a
// stray tap can't dismiss it) while the bulk-import request is in flight —
// now that there's no full-screen blocking modal to physically stop a
// second tap, this is what actually prevents a double-submit or the sheet
// being closed mid-save (this endpoint can legitimately run for a minute
// or more against Nominatim's rate limit).
//
// The one control deliberately left alive is the cancel button: without
// it, a request that stalls on a dead mobile connection leaves the driver
// staring at a locked sheet with no way out but force-quitting the app.
function setJsonSheetBusy(busy) {
  const root = document.getElementById('modal-root');
  root.querySelectorAll('button, textarea').forEach((el) => {
    if (el.id !== 'json-cancel-btn') el.disabled = busy;
  });
  // The backdrop is deliberately left clickable here, not set to
  // `pointer-events: none` — it's `position: absolute; inset: 0`, covering
  // the *entire* viewport (the sheet panel only occupies the bottom
  // portion), so it's the only thing standing between a stray tap and
  // whatever's behind the modal in `#app`. Disabling its pointer events
  // let clicks in the exposed strip above the sheet fall straight through
  // to the route detail screen underneath — which could open a *second*
  // sheet on top of this "locked" one (wiping this one's DOM, including
  // its own cancel button, via the next `renderSheetShell`'s
  // `root.innerHTML = ...`) while `jsonSaveController` was still set, at
  // which point `closeSheet()`'s own guard for that same controller
  // refused to close *anything* until the original import — which can
  // legitimately run for minutes — finally settled in the background.
  // `closeSheet()` already no-ops while `jsonSaveController` is set (see
  // its own guard), so simply leaving the backdrop's clicks intact and
  // routed to it, as normal, is what actually keeps a stray tap from
  // reaching anything behind the sheet during a save.
  const saveBtn = document.getElementById('json-save-btn');
  if (saveBtn) saveBtn.textContent = busy ? 'Wird gespeichert …' : 'Speichern & Optimieren';
  const cancelBtn = document.getElementById('json-cancel-btn');
  if (cancelBtn) cancelBtn.classList.toggle('hidden', !busy);
}

let jsonSaveController = null;

function cancelJsonSave() {
  if (jsonSaveController) jsonSaveController.abort();
}

async function saveJsonEdits() {
  const editor = document.getElementById('json-editor');
  if (!editor || !state.currentRoute) return;
  let parsed;
  try {
    parsed = JSON.parse(editor.value);
  } catch (err) {
    toast('Ungültiges JSON: ' + err.message, 'error');
    return;
  }
  if (!Array.isArray(parsed)) {
    toast('Erwarte eine Liste von Kundenstopps ([...]).', 'error');
    return;
  }
  // Caught here as well as on the server so an oversized paste is rejected
  // instantly, instead of after a full upload that can only end in the
  // same refusal.
  if (parsed.length > MAX_BULK_STOPS) {
    toast(`Zu viele Stopps auf einmal (${parsed.length}, max. ${MAX_BULK_STOPS}). Bitte in kleineren Gruppen importieren.`, 'error', 7000);
    return;
  }
  const routeId = state.currentRoute.id;
  const seq = nextSeq();
  jsonSaveController = new AbortController();
  setJsonSheetBusy(true);
  showProgress('Adressen werden abgeglichen — bitte nicht schließen …');
  try {
    const data = await api(`/routes/${routeId}/json`, {
      method: 'PUT',
      body: JSON.stringify(parsed),
      timeoutMs: API_TIMEOUT_LONG_MS,
      signal: jsonSaveController.signal,
    });
    // Cleared the moment the request resolves, not in `finally`: it's what
    // closeSheet() checks to refuse dismissing a save that's still running,
    // and the success path below closes the sheet itself.
    jsonSaveController = null;
    // This request can legitimately run for a minute against the
    // geocoders' rate limit — long enough for the driver to have moved to
    // another route, whose screen must not be replaced by this one's result.
    if (!applyRouteUpdate(seq, routeId, data)) { closeSheet(); return; }
    closeSheet();
    render();
    // Independent counts, not mutually exclusive: a batch can have both
    // addresses that failed outright AND separate ones that only resolved
    // approximately. A plain if/else-if here would silently drop the
    // approximate-location warning whenever failures were also present —
    // those stops still saved and still need the pin double-checked, so
    // the note is folded into the failure toast instead of lost.
    const failureCount = data.geocode_failures ? data.geocode_failures.length : 0;
    const approxCount = data.approximate ? data.approximate.length : 0;
    if (failureCount) {
      const names = data.geocode_failures.map((f) => `${f.kunde} (${f.strasse}, ${f.plz})`).join('; ');
      const skipNote = data.deletions_skipped ? ' Entfernte Adressen wurden diesmal nicht gelöscht, bis alle Adressen aufgelöst sind.' : '';
      const approxNote = approxCount ? ` Außerdem ${approxCount} Adresse(n) nur ungefähr lokalisiert, bitte im Kartenpin prüfen.` : '';
      toast(`${failureCount} Adresse(n) nicht gefunden, übersprungen: ${names}.${skipNote}${approxNote} Restliche Route wurde gespeichert.`, 'error', 12000);
    } else if (approxCount) {
      toast(`Route aktualisiert ✓ — ${approxCount} Adresse(n) nur ungefähr lokalisiert, bitte im Kartenpin prüfen.`, 'success', 6000);
    } else {
      toast('Route aktualisiert & optimiert ✓', 'success');
    }
  } catch (err) {
    // A cancel is the driver's own decision, not a failure to apologize
    // for — and it explicitly cannot promise nothing was saved, since the
    // server may well have finished the import after the connection was
    // dropped. Saying so is what stops a driver from pasting it all again
    // on top of a route that already has it.
    if (err.code === 'aborted') {
      toast('Abgebrochen. Bitte die Route prüfen — Teile könnten schon gespeichert sein.', 'info', 7000);
    } else {
      toast(err.message || 'Speichern fehlgeschlagen.', 'error');
    }
    setJsonSheetBusy(false); // sheet stays open on failure — let the driver retry/edit
  } finally {
    jsonSaveController = null;
    hideProgress();
  }
}

// ---------------------------------------------------------------------
// Ladeliste — the pre-departure packing check.
//
// The stop list answers "where am I going". It does not answer the question
// a driver actually has standing at an open boot: did the right number of
// the right things come out of the kitchen. Reading that off 25 individual
// rows means counting the same menu name over and over and losing the
// count halfway down.
//
// So every stop's `paket` is summed across the route into one line per
// distinct item ("5× TGM7"), each one tickable. That field has always been
// free text, so the parsing is deliberately forgiving: one entry may hold
// several items separated by commas, semicolons or " + ", and each may
// carry a leading count ("2x TGM7", "2 Menüs") or none at all. Anything it
// can't read a number off stays whole and counts as one — a label that
// looks odd is a great deal better than a quantity that is quietly wrong,
// because the whole point of this screen is that the number can be trusted.
// ---------------------------------------------------------------------

// Ticks live only in this tab's memory, keyed by route. "Is the right stuff
// in the van" is a fact about this morning's loading, not a property of the
// route worth storing on the server — and a checklist that came back
// already ticked tomorrow morning would be worse than no checklist at all.
// Kept across sheet opens (closing it to glance at a stop has not unloaded
// the van), gone on reload.
const ladelisteChecked = new Map();

// "2x TGM7" / "2 × TGM7", or a bare count followed by a space ("2 Menüs").
// Deliberately not a plain leading `\d+`: "3er Karton" is the name of one
// thing, not three of anything, and the × or the space is exactly what
// tells those two apart.
const PAKET_QTY_X_RE = /^(\d+)\s*[x×]\s*(.+)$/i;
const PAKET_QTY_SPACE_RE = /^(\d+)\s+(.+)$/;

function parsePaketItems(paket) {
  return String(paket || '')
    .split(/[,;]|\s\+\s/)
    .map((part) => part.trim())
    .filter(Boolean)
    .map((part) => {
      const m = part.match(PAKET_QTY_X_RE) || part.match(PAKET_QTY_SPACE_RE);
      if (!m) return { qty: 1, label: part };
      const qty = parseInt(m[1], 10);
      const label = m[2].trim();
      // A zero/absurd count, or a count with nothing left after it, means
      // the guess was wrong — keep the driver's original text intact.
      return qty > 0 && label ? { qty, label } : { qty: 1, label: part };
    });
}

// Sums the quantities parsed from a single stop's free-text `paket` field
// (same forgiving parser the Ladeliste uses) — used to decide whether the
// stop-detail row's Paket badge should read as "just one thing" or as a
// multi-item delivery worth flagging at a glance.
function paketQty(paket) {
  if (!paket) return 0;
  return parsePaketItems(paket).reduce((n, it) => n + it.qty, 0);
}

// Every distinct package across the route's customer stops, summed, busiest
// first. `key` is the case/whitespace-insensitive identity used for both
// grouping and the tick state; `label` is the first spelling that appeared,
// so the list reads back in the driver's own words rather than a normalized
// one nobody wrote.
function ladelisteItems(route) {
  const byKey = new Map();
  for (const s of route.stops) {
    if (s.kind !== 'customer' || !s.paket) continue;
    for (const { qty, label } of parsePaketItems(s.paket)) {
      const key = label.toLowerCase().replace(/\s+/g, ' ');
      const entry = byKey.get(key);
      if (entry) entry.qty += qty;
      else byKey.set(key, { key, label, qty });
    }
  }
  return Array.from(byKey.values()).sort((a, b) => b.qty - a.qty || a.label.localeCompare(b.label, 'de'));
}

// Shared by the initial render and the in-place repaint below, so a ticked
// row can never drift into looking different depending on which of the two
// last touched it.
const ladeQtyClass = (on) => `shrink-0 w-12 text-[17px] font-bold tabular-nums ${on ? 'text-black/30' : 'text-brand-600'}`;
const ladeLabelClass = (on) => `flex-1 min-w-0 text-[15px] font-medium ${on ? 'text-black/40 line-through' : ''}`;
const ladeMarkClass = (on) => `shrink-0 w-9 h-9 rounded-full flex items-center justify-center text-[20px] shadow-sm ${on ? 'bg-success text-white' : 'bg-white border-2 border-black/15 text-black/30'}`;

function ladelisteProgress(items, checked) {
  // Counted from the items actually on screen, not from `checked.size` —
  // the set can still hold a key from a package that has since been edited
  // away, and "4 von 3 abgehakt" is a great way to lose a driver's trust in
  // the whole list.
  const done = items.filter((it) => checked.has(it.key)).length;
  const pieces = items.reduce((n, it) => n + it.qty, 0);
  return done >= items.length
    ? `Alles abgehakt ✓ · ${pieces} Stück gesamt`
    : `${done} von ${items.length} Positionen abgehakt · ${pieces} Stück gesamt`;
}

function renderLadeliste() {
  const r = state.currentRoute;
  if (!r) return;
  const items = ladelisteItems(r);
  const checked = ladelisteChecked.get(r.id) || new Set();
  const withoutPaket = r.stops.filter((s) => s.kind === 'customer' && !s.paket).length;

  // The row index, not the label, is what goes into `onclick`: the label is
  // the driver's own free text and has no business being interpolated into
  // an attribute as a JS string literal. Indices are stable while the sheet
  // is open — `ladelisteItems` is deterministic and the route underneath it
  // can't change without a re-render.
  const row = (it, i) => {
    const on = checked.has(it.key);
    return `
      <button type="button" id="lade-row-${i}" role="checkbox" aria-checked="${on}"
        aria-label="${escapeAttr(`${it.qty} mal ${it.label}`)}"
        onclick="toggleLadelisteItem(${i})"
        class="w-full flex items-center gap-3 px-4 py-3.5 text-left press-fade">
        <span data-lade-qty class="${ladeQtyClass(on)}">${it.qty}×</span>
        <span data-lade-label class="${ladeLabelClass(on)}">${escapeHtml(it.label)}</span>
        <span data-lade-mark class="${ladeMarkClass(on)}">${on ? ICONS.checkCircleFill : ICONS.circle}</span>
      </button>`;
  };

  renderSheetShell(`
    <h2 class="text-[22px] font-bold mb-1">Ladeliste</h2>
    <p class="text-[13px] text-black/55 mb-4 leading-snug">Alle Pakete dieser Route zusammengezählt. Vor der Abfahrt abhaken, was tatsächlich im Auto liegt.</p>
    ${items.length ? `
      <p id="lade-progress" aria-live="polite" class="text-[13px] font-medium text-black/50 px-1 pb-1.5">${ladelisteProgress(items, checked)}</p>
      <div class="${GROUP}">${items.map(row).join('')}</div>
      ${withoutPaket ? `<p class="text-[12px] text-black/45 mt-3 px-1 leading-snug">${withoutPaket} Kundenstopp(e) ohne Paketangabe – die stehen hier nicht drin.</p>` : ''}
      <div class="flex gap-3 mt-4 pb-2">
        <button type="button" onclick="resetLadeliste()" class="press-98 px-4 py-3 rounded-xl bg-white text-black/70 font-semibold text-sm">Zurücksetzen</button>
        <button type="button" onclick="closeSheet()" class="press-98 flex-1 py-3 rounded-xl bg-brand-600 font-semibold text-white">Fertig</button>
      </div>
    ` : `
      <div class="${CARD} px-4 py-6 text-center">
        <p class="text-[15px] font-medium text-black/70">Keine Paketangaben</p>
        <p class="text-[13px] text-black/50 mt-1 leading-snug">Kein Stopp dieser Route hat etwas im Feld „Paket" stehen. Trag es beim Stopp ein (z.B. „2x TGM7"), dann wird hier automatisch zusammengezählt.</p>
      </div>
      <div class="mt-4 pb-2">
        <button type="button" onclick="closeSheet()" class="press-98 w-full py-3 rounded-xl bg-brand-600 font-semibold text-white">Schließen</button>
      </div>
    `}
  `, { label: 'Ladeliste' });
}

function toggleLadelisteItem(index) {
  const r = state.currentRoute;
  if (!r) return;
  const items = ladelisteItems(r);
  const it = items[index];
  if (!it) return;

  let checked = ladelisteChecked.get(r.id);
  if (!checked) { checked = new Set(); ladelisteChecked.set(r.id, checked); }
  const on = !checked.has(it.key);
  if (on) checked.add(it.key); else checked.delete(it.key);

  // Repainting the one row in place rather than re-rendering the sheet: a
  // rebuild would throw away the scroll position halfway down a long list
  // and move focus off the row that was just tapped — on every single tick.
  const rowEl = document.getElementById(`lade-row-${index}`);
  if (rowEl) {
    rowEl.setAttribute('aria-checked', String(on));
    const qty = rowEl.querySelector('[data-lade-qty]');
    const label = rowEl.querySelector('[data-lade-label]');
    const mark = rowEl.querySelector('[data-lade-mark]');
    if (qty) qty.className = ladeQtyClass(on);
    if (label) label.className = ladeLabelClass(on);
    if (mark) { mark.className = ladeMarkClass(on); mark.innerHTML = on ? ICONS.checkCircleFill : ICONS.circle; }
  }
  const progress = document.getElementById('lade-progress');
  if (progress) progress.textContent = ladelisteProgress(items, checked);
  if (navigator.vibrate) navigator.vibrate(on ? [12, 40, 12] : 12);
}

function resetLadeliste() {
  const r = state.currentRoute;
  if (!r) return;
  ladelisteChecked.delete(r.id);
  // Every row changes at once here, so a full re-render is the honest way
  // to do it — unlike a single tick, there is no scroll position worth
  // preserving through a "start over".
  renderLadeliste();
}

// ---------------------------------------------------------------------
// Manual pin-drop — the guaranteed fallback when automatic geocoding
// can't resolve an address (typo, brand-new building, service outage).
// ---------------------------------------------------------------------
let pinDropMap = null;
let pinDropMarker = null;

function openPinDropSheet(data) {
  const district = DISTRICT_BY_PLZ[data.plz];
  const center = district ? district.center : [48.2082, 16.3738];

  renderSheetShell(`
    <h2 class="text-[19px] font-bold mb-1">Adresse nicht automatisch gefunden</h2>
    <p class="text-sm text-black/60 mb-3">„${escapeHtml(data.strasse)}, ${escapeHtml(data.plz)} Wien" – tippe auf die Karte, um den Standort selbst zu markieren. Der Stopp wird trotzdem hinzugefügt.</p>
    <div id="pin-map" class="w-full h-72 rounded-2xl mb-4 overflow-hidden"></div>
    <div class="flex gap-3 pb-2">
      <button type="button" id="pin-back" class="press-98 px-4 py-3 rounded-xl bg-white text-black/70 font-semibold">Zurück</button>
      <button type="button" id="pin-confirm" class="press-98 flex-1 py-3 rounded-xl bg-brand-600 font-semibold text-white">Standort bestätigen</button>
    </div>
  `, { scrollable: false, label: 'Standort manuell setzen' });

  setTimeout(() => {
    const container = document.getElementById('pin-map');
    if (!container || typeof maplibregl === 'undefined') return;
    const centerLngLat = [center[1], center[0]];
    const map = newMap(container, { center: centerLngLat, zoom: 15 });
    pinDropMap = map;
    const marker = new maplibregl.Marker({ color: '#ED1639', draggable: true }).setLngLat(centerLngLat).addTo(map);
    pinDropMarker = marker;
    map.on('click', (e) => marker.setLngLat(e.lngLat));
    setTimeout(() => { if (pinDropMap === map) map.resize(); }, 60);
  }, 50);

  document.getElementById('pin-confirm').addEventListener('click', () => {
    if (!pinDropMarker) return;
    const { lat, lng } = pinDropMarker.getLngLat();
    closeSheet();
    sendStop(data, { lat, lon: lng });
  });
  document.getElementById('pin-back').addEventListener('click', () => {
    closeSheet();
    openAddSheet(data.stopId ? { ...data, id: data.stopId } : { ...data });
  });
}

// ---------------------------------------------------------------------
// Hardware/browser back button.
//
// Installed to a home screen this looks and behaves like a native app, and
// on Android that sets an expectation the app was not meeting: back from an
// open sheet, or from a route's stop list, quit the app outright. Losing a
// half-typed stop to a reflex is a bad way to learn that.
//
// The mechanism is one spare history entry, not one entry per screen.
// Whenever the app is showing something that back ought to dismiss — a
// modal, or a pushed detail screen — a single guard entry exists behind it.
// Back consumes that entry, `popstate` dismisses one layer, and `render()`
// (or the modal helpers) immediately re-establish a guard if there is still
// something left to dismiss. When there is nothing left, no guard is
// pushed, and back leaves the app exactly as it should.
//
// Closing something with a button instead has to retire the guard too, or
// it would linger and turn the next back press into a no-op. `history.back()`
// does that, with `suppressPop` marking it as bookkeeping rather than a
// press to act on.
// ---------------------------------------------------------------------
let navGuardActive = false;
let suppressPop = false;

function isModalOpen() {
  return document.getElementById('modal-root').childElementCount > 0;
}

function needsNavGuard() {
  return isModalOpen() || isDetailShowing();
}

function updateHistoryGuard() {
  const needed = needsNavGuard();
  if (needed && !navGuardActive) {
    navGuardActive = true;
    history.pushState({ ear: 'guard' }, '');
  } else if (!needed && navGuardActive) {
    navGuardActive = false;
    suppressPop = true;
    history.back();
  }
}

window.addEventListener('popstate', () => {
  if (suppressPop) { suppressPop = false; return; }
  // The guard entry we pushed has just been consumed by this press.
  navGuardActive = false;
  // Dismiss exactly one layer, outermost first — a confirm dialog opened
  // over the stop list must not also close the stop list.
  if (isModalOpen()) {
    // The modal helpers resolve their promise on close; going through the
    // same path they use keeps a pending confirm from hanging forever.
    if (onModalEscape) onModalEscape();
    else closeSheet();
    updateHistoryGuard();
    return;
  }
  if (isDetailShowing()) {
    closeDetail();
    return; // closeDetail renders, and render() re-syncs the guard
  }
  // Nothing left to dismiss: the press falls through and leaves the app.
});

// Customer names, addresses and notes are free text that ends up inside
// template strings assigned to innerHTML — these are what keep an
// apostrophe or an angle bracket in a real name from being parsed as
// markup. `escapeAttr` covers both quote styles (not just the double
// quotes these templates happen to use today) so it stays correct if an
// attribute is ever written with single quotes.
function escapeAttr(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;')
    .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeHtml(str) {
  return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---------------------------------------------------------------------
// Large-title collapse — UINavigationController's large-title behavior:
// a big bold title up top that shrinks into a small centered title in a
// translucent sticky bar once the content scrolls under it. Re-attached
// after every render() since #app's innerHTML (and therefore the scroll
// container) is fully replaced each time — no explicit teardown needed,
// the old listener goes away with the old DOM node.
// ---------------------------------------------------------------------
function mountLargeTitle() {
  const scroller = document.querySelector('[data-scroll]');
  const large = document.querySelector('[data-large-title]');
  const compact = document.querySelector('[data-compact-title]');
  if (!scroller || !large || !compact) return;
  const onScroll = () => {
    const collapsed = scroller.scrollTop > 24;
    compact.style.opacity = collapsed ? '1' : '0';
    large.style.opacity = collapsed ? '0' : '1';
    large.style.transform = collapsed ? 'translateY(-6px)' : 'translateY(0)';
  };
  scroller.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

function fmtDate(iso) {
  // `new Date(garbage)` doesn't throw, it yields an Invalid Date whose
  // toLocaleDateString is the literal string "Invalid Date" — checking the
  // timestamp is what actually keeps that out of a route row.
  const d = new Date(iso);
  if (!iso || Number.isNaN(d.getTime())) return '';
  return d.toLocaleDateString('de-AT', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

// ---------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------
// Set true right before a render() that only refreshes already-visible
// content in place (e.g. the delivered-toggle's optimistic + confirm
// re-renders) — stopRow reads this to skip re-triggering every row's
// entrance animation, which otherwise makes the whole list look like it
// "reloads" on every single tap.
let suppressRowAnim = false;

/// Which screen the current state resolves to. Used as the key for scroll
/// memory, so that "where was I scrolled to" is remembered per screen
/// rather than as one shared number.
function currentScreenKey() {
  return isDetailShowing() ? `detail:${state.currentRoute.id}` : `tab:${state.tab}`;
}

function isDetailShowing() {
  return !!(state.currentRoute && state.detailOrigin === state.tab);
}

// Scroll offsets, one per screen. A single shared offset — which is what
// this was — restores the *previous* screen's position onto the next one,
// so scrolling halfway down a long Routen list and then tapping Verlauf
// opened Verlauf already scrolled halfway down, past the top of a list the
// driver had never looked at. Per-screen, going back to a list returns to
// exactly where it was left, and a screen never inherits a position that
// was never its own.
const scrollMemory = new Map();
let renderedScreenKey = null;

function render(skipRowAnim) {
  suppressRowAnim = !!skipRowAnim;
  const app = document.getElementById('app');

  const prevScroller = document.querySelector('[data-scroll]');
  if (prevScroller && renderedScreenKey) {
    scrollMemory.set(renderedScreenKey, prevScroller.scrollTop);
  }

  const showingDetail = isDetailShowing();
  const screenKey = currentScreenKey();
  let screen;
  if (showingDetail) screen = renderRouteDetail();
  else if (state.tab === 'routes') screen = renderRoutesTab();
  else if (state.tab === 'map') screen = renderMapTab();
  else if (state.tab === 'verlauf') screen = renderVerlaufTab();
  else screen = renderMoreTab();

  app.innerHTML = screen + renderTabBar();
  document.querySelectorAll('[data-logo-src]').forEach(img => img.src = APP_LOGO);

  // innerHTML replacement above tears down and rebuilds the scroll
  // container, which resets scrollTop to 0 — restore this screen's own
  // remembered offset so a re-render (an optimistic update immediately
  // followed by the server-confirmed one, say) never visibly jumps.
  const nextScroller = document.querySelector('[data-scroll]');
  if (nextScroller) nextScroller.scrollTop = scrollMemory.get(screenKey) || 0;
  renderedScreenKey = screenKey;

  mountLargeTitle();

  // Leaving the Karte tab deliberately does *not* destroy the map: the
  // innerHTML replacement above already detached its element, which costs
  // nothing while it's off screen, and keeping the instance means coming
  // back is instant rather than a fresh style/tile download every time.
  if (state.tab === 'map' && !showingDetail) {
    initMapTabMap();
    scrollActiveChipIntoView();
  }

  updateHistoryGuard();
}

// Screens the driver is no longer able to return to shouldn't keep an
// entry: a deleted route's detail position is dead weight, and without
// this the map would grow for the life of the page.
function forgetScrollMemory(key) {
  scrollMemory.delete(key);
}

function legLabel(stop, extraClass = 'mt-1') {

function stopKindMeta(stop) {

// ---------------------------------------------------------------------
// Map engine — OpenFreeMap (tiles.openfreemap.org), a free/open vector-
// tile CDN built on OpenStreetMap data by the creator of OpenMapTiles: no
// API key, no usage cap, no billing account, self-hostable if that's ever
// needed. It ships a complete, professionally-designed style — real street
// labels, house numbers, POIs, building footprints — via MapLibre GL JS.
// Routing/geocoding stay fully server-side against Nominatim/OSRM (see
// src/main.rs); this is only the on-screen visualization. Used by both the
// Karte tab (full-screen) and the pin-drop sheet (small, embedded).
// ---------------------------------------------------------------------
const MAP_STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';
const VIENNA_CENTER = [16.3738, 48.2082]; // [lon, lat]

function elFromHtml(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function newMap(container, opts) {
  const map = new maplibregl.Map({
    container,
    style: MAP_STYLE_URL,
    center: opts.center || VIENNA_CENTER,
    zoom: opts.zoom || 12,
    dragRotate: false,
    touchPitch: false,
    pitchWithRotate: false,
    ...opts.extra,
  });
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  map.addControl(
    new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: true, showUserHeading: true }),
    'top-right'
  );
  return map;
}

function drawRouteOnMap(map, r, { fit = true } = {}) {
  if (map.getLayer('route-line')) map.removeLayer('route-line');
  if (map.getSource('route-line')) map.removeSource('route-line');
  // Scoped to this map's own container. A document-wide query would also
  // rip the markers out of any *other* map that happens to be open — the
  // pin-drop sheet's, most obviously — which is a bug waiting for the day
  // two maps are on screen at once rather than a hypothetical.
  (map._earMarkers || []).forEach((m) => m.remove());
  map._earMarkers = [];

  map.addSource('route-line', {
    type: 'geojson',
    data: {
      type: 'Feature',
      properties: {},
      geometry: { type: 'LineString', coordinates: (r.geometry || []).map(([lat, lon]) => [lon, lat]) },
    },
  });
  map.addLayer({
    id: 'route-line',
    type: 'line',
    source: 'route-line',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ED1639', 'line-width': 4, 'line-opacity': 0.9 },
  });

  const bounds = new maplibregl.LngLatBounds();
  if (r.geometry && r.geometry.length > 1) {
    for (const [lat, lon] of r.geometry) bounds.extend([lon, lat]);
  }

  const firstOpenIdx = r.stops.findIndex(s => s.kind === 'customer' && !s.delivered);
  let customerNum = 0;

  r.stops.forEach((s, i) => {
    const meta = stopKindMeta(s);
    let el;
    if (meta) {
      el = elFromHtml(`<div class="marker-fixed">${meta.icon}</div>`);
    } else {
      customerNum++;
      const isNext = i === firstOpenIdx;
      const bg = s.delivered ? '#34C759' : isNext ? '#ED1639' : '#8E8E93';
      const ring = s.location_precision ? 'box-shadow:0 0 0 3px #FF9500,0 1px 4px rgba(0,0,0,.4);' : '';
      el = elFromHtml(`<div class="marker-badge" style="background:${bg};${ring}">${s.delivered ? '✓' : customerNum}</div>`);
    }
    el.classList.add('ear-route-marker');
    const precisionNote = s.location_precision === 'street' ? '<br><i>≈ nächstgelegene bekannte Hausnummer</i>'
      : s.location_precision === 'district' ? '<br><i>≈ nur Bezirksmitte, Adresse unbekannt</i>' : '';
    const popup = new maplibregl.Popup({ offset: 16, closeButton: false }).setHTML(
      `<b>${escapeHtml(meta ? meta.title : s.kunde)}</b><br>${escapeHtml(s.strasse)}, ${escapeHtml(s.plz)} Wien${precisionNote}`
    );
    const marker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([s.lon, s.lat]).setPopup(popup).addTo(map);
    map._earMarkers.push(marker);
    bounds.extend([s.lon, s.lat]);
  });

  // Only frame the route when it's a route the map wasn't already showing.
  // Redrawing after a stop is ticked off (or after any other in-place
  // update) must leave the camera exactly where the driver put it —
  // re-fitting on every redraw would silently undo their zoom/pan each
  // time, which is maddening while actually using the map to navigate.
  if (!fit) return;
  if (!bounds.isEmpty()) {
    map.fitBounds(bounds, { padding: 48, maxZoom: 16, duration: 0 });
  } else {
    map.jumpTo({ center: VIENNA_CENTER, zoom: 12 });
  }
}

// ---------------------------------------------------------------------
// The Karte tab's map is built exactly once and then kept alive for the
// life of the page.
//
// It can't simply live in the markup `renderMapTab()` returns: render()
// replaces all of #app's innerHTML, so any element written there is a
// brand new DOM node every single pass, and a map bound to the old one
// would have to be torn down and rebuilt — refetching the style JSON,
// glyphs and sprites, and throwing away the driver's zoom and pan — on
// every re-render, including something as routine as tapping a different
// route chip.
//
// So MapLibre gets its own element that render() never touches
// (`mapTabEl`, created detached), and each render just re-parents that
// element into the empty `#route-map` slot the freshly built screen
// provides. Moving a node between parents preserves its canvas and its
// WebGL context — the map keeps its tiles, its camera and its state, and
// switching routes becomes "swap the line and the markers".
// ---------------------------------------------------------------------
let mapTabMap = null;
let mapTabEl = null;
let mapTabRouteId = null;

function initMapTabMap() {
  const slot = document.getElementById('route-map');
  if (!slot || typeof maplibregl === 'undefined' || !state.currentRoute) return;

  if (!mapTabEl) {
    mapTabEl = document.createElement('div');
    mapTabEl.className = 'absolute inset-0';
  }
  if (mapTabEl.parentElement !== slot) slot.appendChild(mapTabEl);

  if (!mapTabMap) {
    const map = newMap(mapTabEl, {});
    mapTabMap = map;
    // The element's real size is still settling the tick it's inserted
    // (Tailwind's CDN runtime applies utility classes asynchronously,
    // safe-area values resolve) — and it's detached and re-attached on
    // every tab switch from then on. A ResizeObserver keeps the canvas in
    // sync with whatever the box actually turns out to be, each time,
    // instead of guessing at one fixed delay.
    const resizeObserver = new ResizeObserver(() => map.resize());
    resizeObserver.observe(mapTabEl);
    map.once('remove', () => resizeObserver.disconnect());
    map.on('load', () => { if (mapTabMap === map) syncMapTabRoute(); });
    return;
  }

  // Re-attached from a previous tab visit: the element had no layout box
  // while it was detached, so the canvas needs one explicit nudge before
  // the ResizeObserver takes over again.
  mapTabMap.resize();
  syncMapTabRoute();
}

// One outstanding "try again once more of the style has landed" listener at
// a time. render() can call syncMapTabRoute() many times while the map is
// still coming up, and without this each of those would arm its own
// `styledata` handler — every one of which fires on the same event and arms
// another.
let mapTabSyncPending = false;

function syncMapTabRoute() {
  const map = mapTabMap;
  const r = state.currentRoute;
  if (!map || !r) return;
  // Before the style has finished loading there are no sources or layers to
  // add to. The map's own 'load' handler calls back here — but `load` is not
  // a guarantee that `isStyleLoaded()` is true: it also requires every
  // *source* to have its tiles, which on a van's connection can still be in
  // flight when `load` fires. Simply returning there left the Karte tab
  // showing a bare basemap with no route line and no stop markers, and
  // nothing scheduled to fix it — it only came right if some unrelated
  // re-render happened to call back in. `styledata` fires again each time
  // more of the style and its sources arrive, so re-arming on it turns that
  // dead end into a short wait.
  if (!map.isStyleLoaded()) {
    if (!mapTabSyncPending) {
      mapTabSyncPending = true;
      map.once('styledata', () => {
        mapTabSyncPending = false;
        if (mapTabMap === map) syncMapTabRoute();
      });
    }
    return;
  }
  drawRouteOnMap(map, r, { fit: mapTabRouteId !== r.id });
  mapTabRouteId = r.id;
}

// Keeps the selected route's chip visible in the horizontally scrolling
// picker — auto-selecting the first active route, or picking one far down
// a long list, otherwise leaves the highlighted chip off-screen with no
// hint that the map is showing anything at all.
let chipScrolledOnce = false;
function scrollActiveChipIntoView() {
  const chip = document.querySelector('[data-route-chip-active]');
  if (!chip) return;
  // The very first paint has nowhere to animate *from*, and a smooth scroll
  // there just looks like the row drifting on arrival.
  chip.scrollIntoView({ inline: 'center', block: 'nearest', behavior: chipScrolledOnce ? 'smooth' : 'auto' });
  chipScrolledOnce = true;
}

// ---------------------------------------------------------------------
// Route detail — pushed screen (stops only; the map lives in its own
// Karte tab now). Large-title collapse, back chevron, "..." overflow menu.
// ---------------------------------------------------------------------
function renderRouteDetail() {
  const r = state.currentRoute;
  const stops = r.stops;
  const firstOpenIdx = stops.findIndex(s => s.kind === 'customer' && !s.delivered);
  const progress = r.customer_count ? Math.round((r.delivered_count / r.customer_count) * 100) : 0;

  let customerNum = 0;

  const stopRow = (s, i) => {
    const isNext = i === firstOpenIdx;
    const meta = stopKindMeta(s);
    const address = `${s.strasse}, ${s.plz} Wien`;
    const url = mapsUrl(address);

    if (meta) {
      return `
        <div class="${suppressRowAnim ? '' : 'row-enter '}flex items-start gap-3 px-4 py-3.5" ${suppressRowAnim ? '' : `style="animation-delay:${i * 25}ms"`}>
          <span class="w-9 h-9 shrink-0 rounded-full bg-black/5 text-black/60 flex items-center justify-center text-base">${meta.icon}</span>
          <div class="flex-1 min-w-0 pt-0.5">
            <p class="font-medium">${meta.title}</p>
            <p class="text-[13px] text-black/50">${escapeHtml(meta.subtitle)}</p>
            ${legLabel(s)}
          </div>
          <a href="${url}" target="_blank" rel="noopener" aria-label="In Maps öffnen" title="In Maps öffnen" class="press-fade shrink-0 w-9 h-9 rounded-full bg-black/5 text-black/50 flex items-center justify-center">${ICONS.mapPin}</a>
        </div>
      `;
    }

    customerNum++;
    const delivered = s.delivered;
    const precisionBadge = s.location_precision === 'street'
      ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-warnText bg-warn/10 px-1.5 py-0.5 rounded" title="Genaue Hausnummer nicht gefunden — nächstgelegene bekannte Adresse auf der Straße verwendet.">≈ Straße</span>`
      : s.location_precision === 'district'
      ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-warnText bg-warn/10 px-1.5 py-0.5 rounded" title="Straße nicht gefunden — nur Bezirksmitte verwendet. Position bitte prüfen.">≈ Bezirk</span>`
      : '';

    return `
      <div ${isNext && !delivered ? 'data-next-stop' : ''} class="${suppressRowAnim ? '' : 'row-enter '}flex items-start gap-2 px-4 py-3.5 ${isNext && !delivered ? 'bg-brand-50/60' : ''}" ${suppressRowAnim ? '' : `style="animation-delay:${i * 25}ms"`}>
        <div class="flex-1 min-w-0 select-none cursor-pointer rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"
          role="button" tabindex="0"
          aria-label="${escapeAttr(`${s.kunde}, ${s.strasse}, ${s.plz} Wien — bearbeiten`)}"
          ontouchstart="stopLongPressStart(event, ${s.id})"
          ontouchend="stopLongPressEnd(event)"
          ontouchcancel="stopLongPressEnd(event)"
          ontouchmove="stopLongPressMove(event)"
          onmousedown="stopLongPressStart(event, ${s.id})"
          onmouseup="stopLongPressEnd(event)"
          onmouseleave="stopLongPressEnd(event)"
          onmousemove="stopLongPressMove(event)"
          onkeydown="stopRowKeydown(event, ${s.id})"
          oncontextmenu="stopLongPressContext(event, ${s.id})">
          <div class="flex items-center gap-1.5 flex-wrap">
            ${isNext && !delivered ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-brand-600 bg-brand-50 px-1.5 py-0.5 rounded">Nächster Stopp</span>` : ''}
            ${precisionBadge}
          </div>
          <p class="font-medium ${delivered ? 'text-black/50 line-through' : ''}">${escapeHtml(s.kunde)}</p>
          <p class="text-[13px] ${delivered ? 'text-black/50' : 'text-black/60'}">${escapeHtml(s.strasse)}, ${escapeHtml(s.plz)} Wien</p>
          ${s.paket ? (() => {
            const qty = paketQty(s.paket);
            const multi = qty > 1 && !delivered;
            return `<p class="inline-flex items-center gap-1 max-w-full text-[12px] ${multi ? 'font-bold' : 'font-medium'} mt-1.5 px-1.5 py-0.5 rounded ${
              delivered ? 'text-black/55 bg-black/5' : multi ? 'text-white bg-brand-600 shadow-sm' : 'text-brand-700 bg-brand-50'
            }">${
              multi
                ? `<span class="shrink-0 w-4 h-4 rounded-full bg-white/25 flex items-center justify-center text-[10px] font-bold">${qty}</span>`
                : `<span class="flex shrink-0">${ICONS.box}</span>`
            }<span class="truncate">${escapeHtml(s.paket)}</span></p>`;
          })() : ''}
          ${s.notiz ? `<p class="inline-flex items-center gap-1 max-w-full text-[12px] italic mt-1 px-1.5 py-0.5 rounded ${delivered ? 'text-black/55 bg-black/5' : 'text-warnText bg-warn/10'}"><span class="flex shrink-0 not-italic">${ICONS.note}</span><span class="truncate">${escapeHtml(s.notiz)}</span></p>` : ''}
          ${legLabel(s, 'mt-1.5')}
        </div>
        <div class="flex flex-col gap-2 shrink-0 mt-0.5">
          <button onclick="toggleDelivered(${s.id}, ${!delivered})" aria-pressed="${delivered}" aria-label="${delivered ? 'Zustellung zurücknehmen' : 'Als zugestellt markieren'}" title="${delivered ? 'Zustellung zurücknehmen' : 'Als zugestellt markieren'}" class="press-95 w-10 h-10 rounded-full flex items-center justify-center text-[20px] shadow-sm ${delivered ? 'bg-success text-white' : 'bg-white border-2 border-black/15 text-black/30'}">
            ${delivered ? ICONS.checkCircleFill : ICONS.circle}
          </button>
          <a href="${url}" target="_blank" rel="noopener" aria-label="In Maps öffnen" title="In Maps öffnen" class="press-fade w-10 h-10 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center text-[17px] shadow-sm">${ICONS.mapPin}</a>
        </div>
      </div>
    `;
  };

  return `
    <div data-scroll class="flex-1 min-h-0 overflow-y-auto momentum" style="padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 3.75rem)">
      <div class="sticky top-0 z-20 bg-[#F2F2F7]/85 backdrop-blur-xl border-b border-black/10" style="padding-top: calc(env(safe-area-inset-top) + 0.5rem)">
        <div class="flex items-center gap-1 px-2 pb-2.5">
          <button onclick="closeDetail()" aria-label="Zurück zur Übersicht" title="Zurück" class="press-fade w-9 h-9 flex items-center justify-center text-brand-600 text-lg shrink-0">${ICONS.back}</button>
          <p data-compact-title class="compact-title flex-1 min-w-0 text-[15px] font-semibold text-center truncate px-1" style="opacity:0">${escapeHtml(r.name)}</p>
          <button onclick="openAddSheet()" aria-label="Stopp hinzufügen" title="Stopp hinzufügen" class="press-fade w-9 h-9 flex items-center justify-center text-brand-600 text-lg shrink-0">${ICONS.plus}</button>
          <div class="relative shrink-0">
            <button id="route-menu-btn" onclick="toggleRouteMenu()" aria-label="Weitere Aktionen" title="Weitere Aktionen" aria-haspopup="menu" aria-expanded="false" aria-controls="route-menu" class="press-fade w-9 h-9 flex items-center justify-center text-black/60 text-lg">${ICONS.kebab}</button>
            ${renderRouteMenu()}
          </div>
        </div>
      </div>

      <div class="px-4">
        <h1 data-large-title class="large-title text-[22px] font-bold tracking-tight pt-3 pb-1 truncate">${escapeHtml(r.name)}</h1>
        <p class="text-[13px] text-black/50 pb-3">${r.status === 'active' ? 'Aktiv' : 'Abgeschlossen'} · ${fmtDate(r.created_at)}</p>

        ${r.needs_optimize ? `
          <button onclick="manualOptimize()" class="press-98 w-full flex items-center justify-between gap-2 bg-warn/10 text-warnText text-[13px] font-semibold px-4 py-2.5 rounded-xl mb-3">
            <span class="flex items-center gap-1.5"><span class="flex">${ICONS.warning}</span>Route nicht aktuell</span>
            <span class="underline">Jetzt optimieren</span>
          </button>
        ` : ''}

        <button onclick="switchTab('map')" class="${CARD} w-full text-left px-4 py-3.5 flex items-center gap-3 mb-4">
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-baseline mb-1.5">
              <p class="text-[15px] font-semibold">${r.delivered_count} / ${r.customer_count} zugestellt</p>
              <p class="text-[12px] text-black/50">≈ ${r.total_km} km · ${r.total_min} min</p>
            </div>
            <div class="h-1.5 bg-black/10 rounded-full overflow-hidden">
              <div class="h-full bg-success transition-all duration-500" style="width: ${progress}%"></div>
            </div>
          </div>
          <span class="text-brand-600 shrink-0 flex items-center gap-1 text-[13px] font-medium">${ICONS.mapPin} Karte<span class="flex">${ICONS.chevron}</span></span>
        </button>

        ${nextStopBar(stops, firstOpenIdx)}

        <div class="${GROUP}">
          ${stops.map(stopRow).join('')}
        </div>
      </div>
    </div>
  `;
}

// A route is 20–30 stops, and the one that matters is whichever is next.
// Partway through a shift that row is somewhere in the middle of a list
// the driver has to scroll and scan to find — every single time they come
// back to the app after a delivery. This puts it one tap away, and names
// the customer so it doubles as an answer to "who am I going to?" without
// scrolling at all. Hidden once everything is delivered, when there is no
// next stop to go to.
function nextStopBar(stops, firstOpenIdx) {
  if (firstOpenIdx < 0) return '';
  const next = stops[firstOpenIdx];
  return `
    <button onclick="scrollToNextStop()" class="press-98 w-full flex items-center gap-3 bg-brand-600 text-white rounded-2xl px-4 py-3 mb-4 shadow-sm text-left">
      <span class="w-8 h-8 shrink-0 rounded-full bg-white/20 flex items-center justify-center">${ICONS.mapPin}</span>
      <span class="flex-1 min-w-0">
        <span class="block text-[11px] font-semibold uppercase tracking-wide text-white/75">Nächster Stopp</span>
        <span class="block text-[15px] font-semibold truncate">${escapeHtml(next.kunde)}</span>
        <span class="block text-[12px] text-white/80 truncate">${escapeHtml(next.strasse)}, ${escapeHtml(next.plz)} Wien</span>
      </span>
      <span class="shrink-0 text-white/70 flex">${ICONS.chevron}</span>
    </button>
  `;
}

function scrollToNextStop() {
  const row = document.querySelector('[data-next-stop]');
  if (!row) return;
  row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  // A brief highlight so the eye lands on the right row rather than on
  // wherever the scroll happened to stop.
  row.animate(
    [{ backgroundColor: 'rgba(237,22,57,0.22)' }, { backgroundColor: 'rgba(237,22,57,0)' }],
    { duration: 1200, easing: 'ease-out' }
  );
}

function closeRouteMenu() {
  document.getElementById('route-menu')?.classList.add('hidden');
  document.getElementById('route-menu-btn')?.setAttribute('aria-expanded', 'false');
}

function toggleRouteMenu() {
  const menu = document.getElementById('route-menu');
  if (!menu) return;
  const open = menu.classList.toggle('hidden') === false;
  document.getElementById('route-menu-btn')?.setAttribute('aria-expanded', String(open));
  // Move into the menu when it opens so a keyboard user lands on the first
  // action rather than having to tab through the rest of the header.
  if (open) menu.querySelector('button')?.focus();
}

function renderRouteMenu() {
  const r = state.currentRoute;
  // Every item closes the menu before running its action. Most end in a
  // render() that rebuilds the (hidden) menu anyway — but the ones that
  // open a confirm sheet first do not, so cancelling out of "Route
  // löschen?" used to leave the menu still hanging open over the route.
  const item = (onclick, iconSvg, label, danger) => `<button onclick="closeRouteMenu(); ${onclick}" role="menuitem" class="w-full flex items-center gap-3 text-left px-4 py-3 text-[15px] ${danger ? 'text-red-600' : ''} active:bg-black/5">
    <span class="w-5 flex shrink-0 ${danger ? 'text-red-600' : 'text-black/50'}">${iconSvg}</span>${label}
  </button>`;
  return `
    <div id="route-menu" role="menu" aria-label="Weitere Aktionen" class="hidden absolute right-0 top-10 w-56 bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl overflow-hidden z-30 divide-y divide-black/10">
      ${item("renderLadeliste()", ICONS.box, "Ladeliste")}
      ${item("renameRoute()", ICONS.pencil, "Umbenennen")}
      ${item("manualOptimize()", ICONS.compass, "Neu optimieren")}
      ${item("renderJsonForm();", ICONS.doc, "Als JSON bearbeiten")}
      ${item("resetDelivered()", ICONS.refresh, "Zustellungen zurücksetzen")}
      ${item("toggleRouteStatus()", ICONS.checkCircle, r.status === 'completed' ? 'Wieder aktivieren' : 'Route abschließen')}
      ${item("deleteRoute()", ICONS.trash, "Löschen", true)}
    </div>
  `;
}

// ---------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------
document.querySelectorAll('[data-logo-src]').forEach(img => img.src = APP_LOGO);

// ---------------------------------------------------------------------
// Zoom lock — the half of it that has to be JavaScript.
//
// `user-scalable=no` in the viewport meta is honored by Android/Chrome and
// has been ignored outright by iOS Safari since iOS 10, so on the platform
// this app mostly runs on these listeners *are* the mechanism. Safari
// reports a page pinch as its own `gesture*` events; cancelling those is
// what stops a stray two-finger touch leaving the app stuck at 1.4×.
//
// The map needs no exemption, and that is precisely why this is done with
// event handlers rather than a `touch-action: pan-x pan-y` blanket:
// MapLibre implements pinch and wheel zoom itself, from raw touch/wheel
// events, and never asks the browser to zoom. `preventDefault()` cancels
// the browser's default action without stopping propagation, so every one
// of these events still reaches MapLibre's own handlers intact. Pinching
// the map still zooms the map — it just no longer resizes the whole app
// around it at the same time.
//
// Not covered, because a page cannot: the desktop browser's own Ctrl/Cmd
// +/- keyboard zoom. That is browser chrome, it is not reachable from
// here, and it is not a gesture anyone hits by accident in a van.
// ---------------------------------------------------------------------
for (const gestureType of ['gesturestart', 'gesturechange', 'gestureend']) {
  document.addEventListener(gestureType, (e) => e.preventDefault(), { passive: false });
}
// A trackpad pinch (and Ctrl+scroll) arrives as a wheel event with ctrlKey
// set — the desktop equivalent of the above. MapLibre's own scroll zoom is
// plain-wheel and is unaffected either way.
document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

window.addEventListener('online', () => { toast('Wieder online', 'success'); refreshOnResume(); });
window.addEventListener('offline', () => toast('Keine Internetverbindung – Änderungen können nicht gespeichert werden.', 'error'));

document.addEventListener('visibilitychange', refreshOnResume);
// iOS restores a backgrounded standalone PWA from the back/forward cache,
// which in some versions skips visibilitychange entirely — pageshow is the
// event that always fires there.
window.addEventListener('pageshow', refreshOnResume);

document.addEventListener('click', (e) => {
  const menu = document.getElementById('route-menu');
  if (menu && !menu.classList.contains('hidden') && !e.target.closest('#route-menu') && !e.target.closest('#route-menu-btn')) {
    closeRouteMenu();
  }
});

// Not fully offline-capable — adding/editing a stop still calls Nominatim/
// Wien-OGD (geocoding) and OSRM (routing) live, and the map needs its
// vector tiles from OpenFreeMap. What this buys: the app shell and any
// already-visited page load instantly from cache and still work with no
// connection at all. See /sw.js (served straight off disk the same way as
// this file — src/main.rs).
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });

  // A deployed update installs and takes over immediately (the worker calls
  // skipWaiting/clients.claim), but the *page* keeps running whatever
  // JavaScript it started with. That leaves an old app talking to a new
  // server for as long as the driver keeps the tab open — which for an
  // installed PWA is days. Reloading once when control changes hands puts
  // the two back in step.
  //
  // The flag is the whole safety of this: a reload that itself triggers
  // another controllerchange would loop forever, and a reload loop on a
  // delivery app in the field is far worse than a stale tab.
  //
  // Only when a worker *replaces* another one. On a first-ever visit the
  // page starts with no controller at all, and the freshly installed worker
  // claiming it also fires `controllerchange` — reloading there would mean
  // every new install, and every visit after the caches are cleared, paying
  // a pointless second page load. There is nothing stale to correct in that
  // case: the JavaScript running *is* the JavaScript that was just fetched.
  const hadController = !!navigator.serviceWorker.controller;
  let reloadingForUpdate = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloadingForUpdate) return;
    // Not during a save: an import can legitimately run for minutes, and a
    // reload mid-request abandons it with no way to know what landed.
    if (jsonSaveController) return;
    reloadingForUpdate = true;
    window.location.reload();
  });
}

loadRoutes();
</script>
</body>
</html>
