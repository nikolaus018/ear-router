<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>

<style>
  html, body { height: 100%; overscroll-behavior-y: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #F2F2F7;
  }
  @media (prefers-color-scheme: dark) { body { background: #000; } }
  /* NOTE: safe-area padding is applied via inline style="padding-top: calc(env(...) + Nrem)"
     at each call site, not a shared class. The Tailwind CDN script injects its utility
     stylesheet *after* this one, so a `.safe-top { padding-top: env(...) }` class sharing
     the `padding-top` property with a Tailwind class like `.pt-6` on the same element loses
     the cascade and silently gets overridden — inline styles always win regardless of
     injection order, which is what actually keeps content out of the iOS notch/Dynamic Island. */
  ::-webkit-scrollbar { display: none; }
  * { -webkit-tap-highlight-color: transparent; }
  .momentum { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

  .sheet-backdrop { animation: fadeIn .18s ease-out; }
  .sheet-panel { animation: slideUp .26s cubic-bezier(.32,.72,0,1); }
  .alert-panel { animation: popIn .18s cubic-bezier(.32,.72,0,1); }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
  @keyframes popIn { from { opacity: 0; transform: scale(.92) } to { opacity: 1; transform: scale(1) } }

  .toast-enter { animation: toastIn .25s cubic-bezier(.32,.72,0,1); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(.98) } to { opacity: 1; transform: translateY(0) scale(1) } }

  .spinner { border: 3px solid rgba(120,120,128,.25); border-top-color: #ED1639; border-radius: 50%; width: 22px; height: 22px; animation: spin .7s linear infinite; }
  .spinner-sm { display: inline-block; border: 2px solid rgba(120,120,128,.25); border-top-color: currentColor; border-radius: 50%; width: 13px; height: 13px; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }

  .row-enter { animation: rowIn .25s ease-out both; }

  warning: icon('<path d="M12 4.2 2.5 20h19L12 4.2Z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.3" r=".9" fill="currentColor" stroke="none"/>'),
  note: icon('<path d="M5 4h14v13.2l-3.8 2.8H5Z"/><path d="M8.5 9h7"/><path d="M8.5 13h7"/>'),
  info: icon('<circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r=".9" fill="currentColor" stroke="none"/>'),
  archive: icon('<path d="M4 5h16v4H4Z"/><path d="M5 9v10h14V9"/><path d="M10 13h4"/>'),
  person: icon('<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/>'),
};

async function api(path, options = {}) {
  const res = await fetch('/api' + path, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  if (!res.ok) {
    let msg = 'Ein Fehler ist aufgetreten.';
    let code = null;
    try {
      const data = await res.json();
      if (data.detail && typeof data.detail === 'object') {
        msg = data.detail.message || msg;
        code = data.detail.code || null;
      } else if (data.detail) {
        msg = data.detail;
      }
    } catch (_) {}
    const err = new Error(msg);
    err.code = code;
    throw err;
  }
  return res.json();
}

// ---------------------------------------------------------------------
// In-flight indicator — a thin top progress bar (nprogress/YouTube-style),
// never a full-screen blocking modal. The app stays visible and tappable
// while a request is in flight instead of a "page reload"-style dimmed
// takeover; a small pill under the bar carries a short status message only
// for the handful of actions where the driver genuinely needs to read one
// (e.g. the JSON bulk-import's "don't close" warning). `depth` makes this
// safe for overlapping calls — the bar only actually hides once every
// caller that asked for it has finished, so one action finishing early
// can't yank the indicator out from under a still-running one.
// ---------------------------------------------------------------------
let progressDepth = 0;

function showProgress(label) {
  progressDepth++;
  const bar = document.getElementById('progress-bar');
  bar.style.transition = 'none';
  bar.style.opacity = '1';
  bar.style.transform = 'scaleX(0.08)';
  void bar.offsetWidth; // force reflow so the slow transition below starts from scaleX(0.08), not skips straight to the target
  bar.style.transition = 'transform 6s cubic-bezier(.15,.8,.4,1), opacity .2s';
  bar.style.transform = 'scaleX(0.75)';

  if (label) {
    document.getElementById('progress-pill-text').textContent = label;
    document.getElementById('progress-pill-wrap').classList.remove('hidden');
  }
}

function hideProgress() {
  progressDepth = Math.max(0, progressDepth - 1);
  if (progressDepth > 0) return; // another caller is still in flight
  const bar = document.getElementById('progress-bar');
  bar.style.transition = 'transform .25s ease-out';
  bar.style.transform = 'scaleX(1)';
  setTimeout(() => {
    bar.style.transition = 'opacity .2s';
    bar.style.opacity = '0';
    setTimeout(() => { bar.style.transform = 'scaleX(0)'; }, 200);
  }, 150);
  document.getElementById('progress-pill-wrap').classList.add('hidden');
}

function toast(message, type = 'info', durationMs = 3800) {
  const colors = {
    info: 'bg-white/95 dark:bg-[#1C1C1E]/95 text-black dark:text-white',
    error: 'bg-red-50/95 dark:bg-red-950/90 text-red-700 dark:text-red-300',
    success: 'bg-emerald-50/95 dark:bg-emerald-950/90 text-emerald-700 dark:text-emerald-300',
  };
  const el = document.createElement('div');
  el.className = `toast-enter pointer-events-auto max-w-sm w-full backdrop-blur-xl border border-black/5 dark:border-white/10 ${colors[type]} rounded-2xl px-4 py-3 text-sm font-medium shadow-xl`;
  el.textContent = message;
  document.getElementById('toast-container').appendChild(el);
  if (navigator.vibrate && type === 'error') navigator.vibrate(30);
  setTimeout(() => { el.style.transition = 'opacity .3s, transform .3s'; el.style.opacity = '0'; el.style.transform = 'translateY(-8px)'; setTimeout(() => el.remove(), 300); }, durationMs);
}

// ---------------------------------------------------------------------
// Native-feeling alert/confirm/prompt sheets — replace window.alert/
// confirm/prompt (an ugly, non-brandable OS dialog) with in-app
// UIAlertController-styled equivalents: centered card, hairline-separated
// button row, brand-tinted default action, red destructive action. Still
// just resolve a Promise, so call sites read almost like the built-ins
// they replace.
// ---------------------------------------------------------------------
function closeAlert() {
  document.getElementById('modal-root').innerHTML = '';
}

function confirmSheet({ title, message, confirmLabel = 'Bestätigen', cancelLabel = 'Abbrechen', danger = false }) {
  return new Promise((resolve) => {
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="fixed inset-0 z-[60] flex items-center justify-center px-6">
        <div class="sheet-backdrop absolute inset-0 bg-black/30 dark:bg-black/60" data-cancel></div>
        <div class="alert-panel relative w-full max-w-[300px] bg-white/95 dark:bg-[#2C2C2E]/95 backdrop-blur-xl border border-black/5 dark:border-white/10 rounded-2xl overflow-hidden shadow-2xl text-center">
          <div class="px-5 pt-5 pb-4">
            <h3 class="font-semibold text-[15px]">${escapeHtml(title)}</h3>
            ${message ? `<p class="text-[13px] text-black/60 dark:text-white/60 mt-1.5 leading-snug">${escapeHtml(message)}</p>` : ''}
          </div>
          <div class="grid grid-cols-2 border-t border-black/10 dark:border-white/10">
            <button data-cancel class="press-98 py-3 text-[15px] font-medium text-black/70 dark:text-white/70 border-r border-black/10 dark:border-white/10">${escapeHtml(cancelLabel)}</button>
            <button data-confirm class="press-98 py-3 text-[15px] font-semibold ${danger ? 'text-red-600' : 'text-brand-600'}">${escapeHtml(confirmLabel)}</button>
          </div>
        </div>
      </div>
    `;
    root.querySelectorAll('[data-cancel]').forEach(el => el.addEventListener('click', () => { closeAlert(); resolve(false); }));
    root.querySelector('[data-confirm]').addEventListener('click', () => { closeAlert(); resolve(true); });
  });
}

function promptSheet({ title, message, placeholder = '', initial = '', confirmLabel = 'Speichern', cancelLabel = 'Abbrechen' }) {
  return new Promise((resolve) => {
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="fixed inset-0 z-[60] flex items-center justify-center px-6">
        <div class="sheet-backdrop absolute inset-0 bg-black/30 dark:bg-black/60" data-cancel></div>
        <div class="alert-panel relative w-full max-w-[300px] bg-white/95 dark:bg-[#2C2C2E]/95 backdrop-blur-xl border border-black/5 dark:border-white/10 rounded-2xl overflow-hidden shadow-2xl text-center">
          <div class="px-5 pt-5 pb-4">
            <h3 class="font-semibold text-[15px]">${escapeHtml(title)}</h3>
            ${message ? `<p class="text-[13px] text-black/60 dark:text-white/60 mt-1 mb-3 leading-snug">${escapeHtml(message)}</p>` : '<div class="mt-3"></div>'}
            <input data-input value="${escapeAttr(initial)}" placeholder="${escapeAttr(placeholder)}" class="w-full bg-black/5 dark:bg-white/10 rounded-lg px-3 py-2 text-[15px] text-center focus:outline-none focus:ring-2 focus:ring-brand-600" />
          </div>
          <div class="grid grid-cols-2 border-t border-black/10 dark:border-white/10">
            <button data-cancel class="press-98 py-3 text-[15px] font-medium text-black/70 dark:text-white/70 border-r border-black/10 dark:border-white/10">${escapeHtml(cancelLabel)}</button>
            <button data-confirm class="press-98 py-3 text-[15px] font-semibold text-brand-600">${escapeHtml(confirmLabel)}</button>
          </div>
        </div>
      </div>
    `;
    const input = root.querySelector('[data-input]');
    setTimeout(() => { input.focus(); input.select(); }, 80);
    const submit = () => { const v = input.value; closeAlert(); resolve(v === '' ? null : v); };
    root.querySelectorAll('[data-cancel]').forEach(el => el.addEventListener('click', () => { closeAlert(); resolve(null); }));
    root.querySelector('[data-confirm]').addEventListener('click', submit);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  });
}

// ---------------------------------------------------------------------
// Maps link (platform-aware) — deep-links with the plain address, not
// coordinates, so the phone's own Maps app does its own (usually better)
// geocoding/routing to the door.
// ---------------------------------------------------------------------
function mapsUrl(address) {
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const encAddr = encodeURIComponent(address || '');
  if (isIOS) return `https://maps.apple.com/?daddr=${encAddr}&dirflg=d`;
  return `https://www.google.com/maps/dir/?api=1&destination=${encAddr}&travelmode=driving`;
}

// ---------------------------------------------------------------------
// Navigation — tab switching + the single shared "route in focus" that the
// Karte tab visualizes and Routen/Mehr can push a detail screen for. See
// the `state` doc comment above for the full model. `detailOrigin` must
// never be set to 'map' — that's a real tab id, and `render()`'s
// `detailOrigin === state.tab` check would then wrongly treat "picked in
// the map's own route picker" as "push the stops-list detail screen over
// the map". `null` is the correct value for "in focus, but no tab has a
// pushed detail for it".
// ---------------------------------------------------------------------
function switchTab(tab) {
  state.tab = tab;
  render();
}

// Every route-list screen (Routen/Verlauf) reads from `state.routes`, a
// separate array of lightweight summaries fetched once via loadRoutes() —
// it does NOT automatically pick up changes made to `state.currentRoute`
// (rename, status toggle, a stop delivered/added/removed all shift
// customer_count/delivered_count/needs_optimize). Call this right after
// every `state.currentRoute = await api(...)` assignment so the list a
// driver lands back on is never showing stale counts/name/status — cheaper
// than a full loadRoutes() network round-trip on every single mutation.
function syncRouteSummary() {
  const r = state.currentRoute;
  if (!r) return;
  const summary = {
    id: r.id, name: r.name, status: r.status, created_at: r.created_at,
    completed_at: r.completed_at, customer_count: r.customer_count,
    delivered_count: r.delivered_count, needs_optimize: r.needs_optimize,
  };
  const idx = state.routes.findIndex(x => x.id === r.id);
  if (idx === -1) state.routes.unshift(summary); else state.routes[idx] = summary;
}

async function openRoute(id) {
  showProgress();
  try {
    state.currentRoute = await api(`/routes/${id}`);
    syncRouteSummary();

async function createRoute() {
  const name = await promptSheet({ title: 'Neue Route', message: 'Name (z. B. Kundenname, Bezirk, Tour):', placeholder: `Route ${new Date().toLocaleDateString('de-AT')}` });
  if (name === null) return;
  showProgress();
  try {
    const body = name.trim() ? { name: name.trim() } : {};
    const route = await api('/routes', { method: 'POST', body: JSON.stringify(body) });
    state.currentRoute = route;
    syncRouteSummary();
    state.detailOrigin = 'routes';
    state.tab = 'routes';
    render();
    if (navigator.vibrate) navigator.vibrate(15);
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

async function submitStop(form, stopId) {
  const kunde = form.kunde.value.trim();
  const strasse = form.strasse.value.trim();
  const plz = form.plz.value.trim();
  const paket = form.paket.value.trim();
  const notiz = form.notiz.value.trim();
  if (!kunde || !strasse || !plz) { toast('Bitte Kunde, Straße und Bezirk ausfüllen.', 'error'); return; }

  lastUsedPlz = plz;
  const data = { kunde, strasse, plz, paket, notiz, stopId };
  closeSheet();
  await sendStop(data);
}

async function sendStop(data, coords) {
  const routeId = state.currentRoute.id;
  const payload = { kunde: data.kunde, strasse: data.strasse, plz: data.plz, paket: data.paket, notiz: data.notiz };
  if (coords) { payload.lat = coords.lat; payload.lon = coords.lon; }
  const body = JSON.stringify(payload);

  showProgress(data.stopId ? 'Adresse wird aktualisiert …' : 'Stopp wird hinzugefügt …');
  try {
    state.currentRoute = data.stopId
      ? await api(`/stops/${data.stopId}`, { method: 'PATCH', body })
      : await api(`/routes/${routeId}/stops`, { method: 'POST', body });
    syncRouteSummary();
    render();
    if (navigator.vibrate) navigator.vibrate(15);
    if (coords) toast('Standort manuell gesetzt ✓', 'success');
    else toast(data.stopId ? 'Stopp aktualisiert ✓' : 'Stopp hinzugefügt ✓', 'success');
  } catch (err) {
    if (!coords && (err.code === 'address_not_found' || err.code === 'geocode_unavailable')) {
      openPinDropSheet(data);
      return;
    }
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

// Optimistic — the delivered-toggle is the single most-tapped action in
// the app, so it flips instantly instead of waiting on a network
// round-trip, then reconciles with the server response in the background.
// Safe to predict: toggling delivered never reorders stops or changes
// route geometry (see update_stop in src/main.rs), only the flag itself
// and delivered_count move. Reverts precisely on failure; guards against
// the driver having navigated to a different route before the response
// lands, so a slow/failed request can never stomp whatever's on screen by
// then.
async function toggleDelivered(stopId, delivered) {
  const route = state.currentRoute;
  if (!route) return;
  const stop = route.stops.find((s) => s.id === stopId);
  if (!stop) return;

  const prevDelivered = stop.delivered;
  const prevDeliveredCount = route.delivered_count;
  stop.delivered = delivered;
  route.delivered_count += delivered ? 1 : -1;
  render();
  if (navigator.vibrate) navigator.vibrate(delivered ? [12, 40, 12] : 12);

  try {
    const updated = await api(`/stops/${stopId}`, { method: 'PATCH', body: JSON.stringify({ delivered }) });
    if (state.currentRoute?.id !== route.id) return;
    state.currentRoute = updated;
    syncRouteSummary();
    render();
  } catch (err) {
    if (state.currentRoute?.id === route.id) {
      stop.delivered = prevDelivered;
      route.delivered_count = prevDeliveredCount;
      render();
    }
    toast(err.message, 'error');
  }
}

async function deleteStop(stopId) {
  const ok = await confirmSheet({ title: 'Stopp löschen?', message: 'Dieser Kundenstopp wird endgültig entfernt.', confirmLabel: 'Löschen', danger: true });
  if (!ok) return;

async function toggleRouteStatus() {
  const newStatus = state.currentRoute.status === 'completed' ? 'active' : 'completed';
  const ok = await confirmSheet({
    title: newStatus === 'completed' ? 'Route abschließen?' : 'Route reaktivieren?',
    message: `„${state.currentRoute.name}" ${newStatus === 'completed' ? 'als abgeschlossen markieren.' : 'wieder als aktiv markieren.'}`,
    confirmLabel: newStatus === 'completed' ? 'Abschließen' : 'Reaktivieren',

async function deleteRoute() {
  const ok = await confirmSheet({ title: 'Route löschen?', message: `„${state.currentRoute.name}" wird mit allen Stopps endgültig gelöscht. Das kann nicht rückgängig gemacht werden.`, confirmLabel: 'Löschen', danger: true });

async function manualOptimize() {

}

async function clearOfflineCache() {
  const ok = await confirmSheet({ title: 'Offline-Daten leeren?', message: 'Zwischengespeicherte Kartenkacheln und App-Dateien werden gelöscht und beim nächsten Öffnen neu geladen.', confirmLabel: 'Leeren' });

  try {

// ---------------------------------------------------------------------
// Add / edit stop — a single-stop form (POST /stops or PATCH /stops/:id).
// Bulk-editing the whole route as JSON is a separate, deliberately
// separate flow reachable only from the route's "..." menu ("Als JSON
// bearbeiten") — see update_route_from_json in src/main.rs — not offered
// here too, so there's exactly one place to reach for each: "+" always
// means "one stop", "..." always means "the whole route".
// ---------------------------------------------------------------------
const EXAMPLE_CUSTOMER_STOP = {
  kunde: 'BEISPIEL – Fam. Mustermann',
  strasse: 'Beispielgasse 12',
  plz: '1190',
  paket: '1x Mittagsmenü',
  notiz: 'Bitte klingeln, 2. Stock',
};
function stopToCustomerJson(s) {
  return { kunde: s.kunde, strasse: s.strasse, plz: s.plz, paket: s.paket || '', notiz: s.notiz || '' };
}

function openAddSheet(stop) {
  renderManualForm(stop);
  if (!stop?.id) setTimeout(() => document.querySelector('#stop-form [name=kunde]')?.focus(), 80);
}

const FIELD = 'mt-1 w-full bg-white dark:bg-[#2C2C2E] rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-brand-600';
const LABEL = 'text-[13px] font-medium text-black/50 dark:text-white/50';

function renderManualForm(stop) {
  const isEdit = !!stop?.id;
  const defaultPlz = stop?.plz || (isEdit ? '' : lastUsedPlz) || '';

  renderSheetShell(`
    <h2 class="text-[22px] font-bold mb-4">${isEdit ? 'Stopp bearbeiten' : 'Neuer Stopp'}</h2>
    <form id="stop-form" class="space-y-3 pb-2">
      <div>
        <label class="${LABEL}">Kunde</label>
        <input name="kunde" required autocomplete="off" value="${escapeAttr(stop?.kunde || '')}" placeholder="z.B. Fam. Gruber" class="${FIELD}" />
      </div>
      <div>
        <label class="${LABEL}">Straße &amp; Hausnummer</label>
        <input name="strasse" required autocomplete="off" value="${escapeAttr(stop?.strasse || '')}" placeholder="z.B. Favoritenstraße 45 (Adresse einfügen geht auch)" class="${FIELD}" />
      </div>
      <div>
        <label class="${LABEL}">Bezirk</label>
        <select name="plz" required class="${FIELD}">
          <option value="" disabled ${!defaultPlz ? 'selected' : ''}>Bezirk wählen …</option>
          ${VIENNA_DISTRICTS.map(d => `<option value="${d.plz}" ${defaultPlz === d.plz ? 'selected' : ''}>${d.bezirk}. Bezirk – ${d.name} (${d.plz})</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="${LABEL}">Paket</label>
        <input name="paket" autocomplete="off" value="${escapeAttr(stop?.paket || '')}" placeholder="z.B. 2 Pakete, 1x Kühlware" class="${FIELD}" />
      </div>
      <div>
        <label class="${LABEL}">Notiz</label>
        <textarea name="notiz" rows="2" placeholder="z.B. persönlich übergeben, Lift im Hof, Code 1234" class="${FIELD} resize-none">${escapeHtml(stop?.notiz || '')}</textarea>
      </div>
      <div class="flex gap-3 pt-2">
        ${isEdit ? `<button type="button" onclick="deleteStop(${stop.id}); closeSheet();" class="press-98 px-4 py-3 rounded-xl bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 font-semibold">Löschen</button>` : ''}
        <button type="submit" class="press-98 flex-1 py-3 rounded-xl bg-brand-600 font-semibold text-white">${isEdit ? 'Speichern' : 'Hinzufügen & Optimieren'}</button>
      </div>
    </form>
  `);

  const form = document.getElementById('stop-form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    submitStop(e.target, stop?.id);
  });

  // Paste a full address ("Clementinengasse 11, 1150 Wien") straight from a
  // chat/SMS into the Straße field: pull the district PLZ out of it and
  // select it automatically instead of making the driver do it by hand.
  const strasseInput = form.strasse;
  const plzSelect = form.plz;
  strasseInput.addEventListener('input', (e) => {
    if (e.inputType !== 'insertFromPaste') return;
    autoFillDistrictFromText(strasseInput, plzSelect);
  });
  strasseInput.addEventListener('blur', () => autoFillDistrictFromText(strasseInput, plzSelect));
}

function autoFillDistrictFromText(strasseInput, plzSelect) {
  const match = strasseInput.value.match(/\b1\d{3}\b/);
  if (!match || !DISTRICT_BY_PLZ[match[0]]) return;
  plzSelect.value = match[0];
  let cleaned = strasseInput.value.replace(match[0], '');
  cleaned = cleaned.replace(/,?\s*(wien|austria|österreich)\.?/gi, '');
  cleaned = cleaned.replace(/,\s*,/g, ',').replace(/,\s*$/, '').replace(/\s{2,}/g, ' ').trim();
  strasseInput.value = cleaned;
}

async function copyJsonToClipboard() {
  const editor = document.getElementById('json-editor');

    await navigator.clipboard.writeText(editor.value);

async function pasteIntoJsonEditor() {
  const editor = document.getElementById('json-editor');

  try {
    const text = await navigator.clipboard.readText();
    if (!text) { toast('Zwischenablage ist leer.', 'error'); return; }
    editor.value = text;
    editor.focus();
    toast('Eingefügt ✓', 'success');
  } catch (_) {
    toast('Einfügen aus Zwischenablage nicht möglich – bitte manuell ins Feld einfügen (lange drücken → Einfügen).', 'error');
  }

function clearJsonEditor() {
  const editor = document.getElementById('json-editor');
  if (!editor) return;
  editor.value = '[]';
  editor.focus();

// Disables every control in the JSON sheet (including the backdrop, so a
// stray tap can't dismiss it) while the bulk-import request is in flight —
// now that there's no full-screen blocking modal to physically stop a
// second tap, this is what actually prevents a double-submit or the sheet
// being closed mid-save (this endpoint can legitimately run for a minute
// or more against Nominatim's rate limit).
function setJsonSheetBusy(busy) {
  const root = document.getElementById('modal-root');
  root.querySelectorAll('button, textarea').forEach((el) => { el.disabled = busy; });
  const backdrop = document.getElementById('sheet-backdrop');
  if (backdrop) backdrop.style.pointerEvents = busy ? 'none' : '';
  const saveBtn = document.getElementById('json-save-btn');
  if (saveBtn) saveBtn.textContent = busy ? 'Wird gespeichert …' : 'Speichern & Optimieren';
}

async function saveJsonEdits() {
  const editor = document.getElementById('json-editor');
  let parsed;
  try {
    parsed = JSON.parse(editor.value);
  } catch (err) {
    toast('Ungültiges JSON: ' + err.message, 'error');
    return;
  }
  if (!Array.isArray(parsed)) {
    toast('Erwarte eine Liste von Kundenstopps ([...]).', 'error');
    return;
  }
  setJsonSheetBusy(true);
  showProgress('Adressen werden abgeglichen — bitte nicht schließen …');
  try {
    const data = await api(`/routes/${state.currentRoute.id}/json`, {
      method: 'PUT',
      body: JSON.stringify(parsed),
    });
    state.currentRoute = data;
    syncRouteSummary();
    closeSheet();
    render();
    if (data.geocode_failures && data.geocode_failures.length) {
      const names = data.geocode_failures.map((f) => `${f.kunde} (${f.strasse}, ${f.plz})`).join('; ');
      const skipNote = data.deletions_skipped ? ' Entfernte Adressen wurden diesmal nicht gelöscht, bis alle Adressen aufgelöst sind.' : '';
      toast(`${data.geocode_failures.length} Adresse(n) nicht gefunden, übersprungen: ${names}.${skipNote} Restliche Route wurde gespeichert.`, 'error', 12000);
    } else if (data.approximate && data.approximate.length) {
      toast(`Route aktualisiert ✓ — ${data.approximate.length} Adresse(n) nur ungefähr lokalisiert, bitte im Kartenpin prüfen.`, 'success', 6000);
    } else {
      toast('Route aktualisiert & optimiert ✓', 'success');
    }
  } catch (err) {
    toast(err.message || 'Speichern fehlgeschlagen.', 'error');
    setJsonSheetBusy(false); // sheet stays open on failure — let the driver retry/edit
  } finally {
    hideProgress();
  }
}

// ---------------------------------------------------------------------
// Manual pin-drop — the guaranteed fallback when automatic geocoding
// can't resolve an address (typo, brand-new building, service outage).
// ---------------------------------------------------------------------
let pinDropMap = null;
let pinDropMarker = null;

function openPinDropSheet(data) {
  const district = DISTRICT_BY_PLZ[data.plz];
  const center = district ? district.center : [48.2082, 16.3738];

  renderSheetShell(`
    <h2 class="text-[19px] font-bold mb-1">Adresse nicht automatisch gefunden</h2>
    <p class="text-sm text-black/60 dark:text-white/60 mb-3">„${escapeHtml(data.strasse)}, ${escapeHtml(data.plz)} Wien" – tippe auf die Karte, um den Standort selbst zu markieren. Der Stopp wird trotzdem hinzugefügt.</p>
    <div id="pin-map" class="w-full h-72 rounded-2xl mb-4 overflow-hidden"></div>
    <div class="flex gap-3 pb-2">
      <button type="button" id="pin-back" class="press-98 px-4 py-3 rounded-xl bg-white dark:bg-[#2C2C2E] text-black/70 dark:text-white/70 font-semibold">Zurück</button>
      <button type="button" id="pin-confirm" class="press-98 flex-1 py-3 rounded-xl bg-brand-600 font-semibold text-white">Standort bestätigen</button>
    </div>
  `, { scrollable: false });

  setTimeout(() => {
    const container = document.getElementById('pin-map');
    if (!container || typeof maplibregl === 'undefined') return;
    const centerLngLat = [center[1], center[0]];
    const map = newMap(container, { center: centerLngLat, zoom: 15 });
    pinDropMap = map;
    const marker = new maplibregl.Marker({ color: '#ED1639', draggable: true }).setLngLat(centerLngLat).addTo(map);
    pinDropMarker = marker;
    map.on('click', (e) => marker.setLngLat(e.lngLat));
    setTimeout(() => { if (pinDropMap === map) map.resize(); }, 60);
  }, 50);

  document.getElementById('pin-confirm').addEventListener('click', () => {
    if (!pinDropMarker) return;
    const { lat, lng } = pinDropMarker.getLngLat();
    closeSheet();
    sendStop(data, { lat, lon: lng });
  });
  document.getElementById('pin-back').addEventListener('click', () => {
    closeSheet();
    openAddSheet(data.stopId ? { ...data, id: data.stopId } : { ...data });
  });
}

function escapeAttr(str) {
  return String(str ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}
function escapeHtml(str) {
  return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
// For JSON blobs embedded inside a single-quoted onclick="..." attribute.
function escapeJsonForAttr(json) {
  return json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/'/g, '&#39;');
}

// ---------------------------------------------------------------------
// Large-title collapse — UINavigationController's large-title behavior:
// a big bold title up top that shrinks into a small centered title in a
// translucent sticky bar once the content scrolls under it. Re-attached
// after every render() since #app's innerHTML (and therefore the scroll
// container) is fully replaced each time — no explicit teardown needed,
// the old listener goes away with the old DOM node.
// ---------------------------------------------------------------------
function mountLargeTitle() {
  const scroller = document.querySelector('[data-scroll]');
  const large = document.querySelector('[data-large-title]');
  const compact = document.querySelector('[data-compact-title]');
  if (!scroller || !large || !compact) return;
  const onScroll = () => {
    const collapsed = scroller.scrollTop > 24;
    compact.style.opacity = collapsed ? '1' : '0';
    large.style.opacity = collapsed ? '0' : '1';
    large.style.transform = collapsed ? 'translateY(-6px)' : 'translateY(0)';
  };
  scroller.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

function fmtDate(iso) {
  try {
    return new Date(iso).toLocaleDateString('de-AT', { day: '2-digit', month: '2-digit', year: 'numeric' });
  } catch (_) { return ''; }
}

// ---------------------------------------------------------------------
// Rendering

function render() {
  const app = document.getElementById('app');
  const showingDetail = state.currentRoute && state.detailOrigin === state.tab;
  let screen;
  if (showingDetail) screen = renderRouteDetail();
  else if (state.tab === 'routes') screen = renderRoutesTab();
  else if (state.tab === 'map') screen = renderMapTab();
  else if (state.tab === 'verlauf') screen = renderVerlaufTab();
  else screen = renderMoreTab();

  app.innerHTML = screen + renderTabBar();
  document.querySelectorAll('[data-logo-src]').forEach(img => img.src = APP_LOGO);
  mountLargeTitle();

  if (state.tab === 'map' && !showingDetail) {
    initMapTabMap();
  } else if (mapTabMap) {
    mapTabMap.remove();
    mapTabMap = null;
  }
}

function stopKindMeta(stop) {
  if (stop.kind === 'start') return { icon: ICONS.house, title: 'Start', subtitle: `${stop.strasse}, ${stop.plz} Wien` };
  if (stop.kind === 'via') return { icon: ICONS.box, title: 'Lager', subtitle: `${stop.strasse}, ${stop.plz} Wien` };
  if (stop.kind === 'end') return { icon: ICONS.flag, title: 'Ziel', subtitle: `${stop.strasse}, ${stop.plz} Wien` };
  return null;
}

// ---------------------------------------------------------------------
// Map engine — OpenFreeMap (tiles.openfreemap.org), a free/open vector-
// tile CDN built on OpenStreetMap data by the creator of OpenMapTiles: no
// API key, no usage cap, no billing account, self-hostable if that's ever
// needed. It ships a complete, professionally-designed style — real street
// labels, house numbers, POIs, building footprints — via MapLibre GL JS.
// Routing/geocoding stay fully server-side against Nominatim/OSRM (see
// src/main.rs); this is only the on-screen visualization. Used by both the
// Karte tab (full-screen) and the pin-drop sheet (small, embedded).
// ---------------------------------------------------------------------
const MAP_STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';
const VIENNA_CENTER = [16.3738, 48.2082]; // [lon, lat]

function elFromHtml(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function newMap(container, opts) {
  const map = new maplibregl.Map({
    container,
    style: MAP_STYLE_URL,
    center: opts.center || VIENNA_CENTER,
    zoom: opts.zoom || 12,
    dragRotate: false,
    touchPitch: false,
    pitchWithRotate: false,
    ...opts.extra,
  });
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
  map.addControl(
    new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: true, showUserHeading: true }),
    'bottom-right'
  );
  return map;
}

function drawRouteOnMap(map, r) {
  if (map.getLayer('route-line')) map.removeLayer('route-line');
  if (map.getSource('route-line')) map.removeSource('route-line');
  document.querySelectorAll('.ear-route-marker').forEach(el => el._marker?.remove());

  map.addSource('route-line', {
    type: 'geojson',
    data: {
      type: 'Feature',
      properties: {},
      geometry: { type: 'LineString', coordinates: (r.geometry || []).map(([lat, lon]) => [lon, lat]) },
    },
  });
  map.addLayer({
    id: 'route-line',
    type: 'line',
    source: 'route-line',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ED1639', 'line-width': 4, 'line-opacity': 0.9 },
  });

  const bounds = new maplibregl.LngLatBounds();
  if (r.geometry && r.geometry.length > 1) {
    for (const [lat, lon] of r.geometry) bounds.extend([lon, lat]);
  }

  const firstOpenIdx = r.stops.findIndex(s => s.kind === 'customer' && !s.delivered);
  let customerNum = 0;

  r.stops.forEach((s, i) => {
    const meta = stopKindMeta(s);
    let el;
    if (meta) {
      el = elFromHtml(`<div class="marker-fixed">${meta.icon}</div>`);
    } else {
      customerNum++;
      const isNext = i === firstOpenIdx;
      const bg = s.delivered ? '#34C759' : isNext ? '#ED1639' : '#8E8E93';
      const ring = s.location_precision ? 'box-shadow:0 0 0 3px #FF9500,0 1px 4px rgba(0,0,0,.4);' : '';
      el = elFromHtml(`<div class="marker-badge" style="background:${bg};${ring}">${s.delivered ? '✓' : customerNum}</div>`);
    }
    el.classList.add('ear-route-marker');
    const precisionNote = s.location_precision === 'street' ? '<br><i>≈ nächstgelegene bekannte Hausnummer</i>'
      : s.location_precision === 'district' ? '<br><i>≈ nur Bezirksmitte, Adresse unbekannt</i>' : '';
    const popup = new maplibregl.Popup({ offset: 16, closeButton: false }).setHTML(
      `<b>${escapeHtml(meta ? meta.title : s.kunde)}</b><br>${escapeHtml(s.strasse)}, ${escapeHtml(s.plz)} Wien${precisionNote}`
    );
    const marker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([s.lon, s.lat]).setPopup(popup).addTo(map);
    el._marker = marker;
    bounds.extend([s.lon, s.lat]);
  });

  if (!bounds.isEmpty()) {
    map.fitBounds(bounds, { padding: 48, maxZoom: 16, duration: 0 });
  } else {
    map.jumpTo({ center: VIENNA_CENTER, zoom: 12 });
  }
}

let mapTabMap = null;

function initMapTabMap() {
  const container = document.getElementById('route-map');
  if (!container || typeof maplibregl === 'undefined' || !state.currentRoute) return;

  if (mapTabMap) { mapTabMap.remove(); mapTabMap = null; }
  const map = newMap(container, {});
  mapTabMap = map;
  map.on('load', () => {
    if (mapTabMap !== map) return;
    drawRouteOnMap(map, state.currentRoute);
    setTimeout(() => { if (mapTabMap === map) map.resize(); }, 60);
  });
}

          ${s.notiz ? `<p class="text-[12px] ${delivered ? 'text-black/35 dark:text-white/35' : 'text-black/55 dark:text-white/55'} mt-1 flex items-center gap-1"><span class="flex">${ICONS.note}</span>${escapeHtml(s.notiz)}</p>` : ''}
          ${s.next_leg_km != null ? `<p class="text-[12px] text-black/40 dark:text-white/40 mt-1">${s.next_leg_km.toFixed(1)} km · ${Math.round(s.next_leg_min)} min bis zum nächsten Stopp</p>` : ''}

  return `
    <div data-scroll class="h-[100dvh] overflow-y-auto momentum pb-24">
      <div class="sticky top-0 z-20 bg-[#F2F2F7]/85 dark:bg-black/80 backdrop-blur-xl border-b border-black/10 dark:border-white/10" style="padding-top: calc(env(safe-area-inset-top) + 0.5rem)">
        <div class="flex items-center gap-1 px-2 pb-2.5">
          <button onclick="closeDetail()" class="press-fade w-9 h-9 flex items-center justify-center text-brand-600 text-lg shrink-0">${ICONS.back}</button>
          <p data-compact-title class="compact-title flex-1 min-w-0 text-[15px] font-semibold text-center truncate px-1" style="opacity:0">${escapeHtml(r.name)}</p>
          <button onclick="openAddSheet()" class="press-fade w-9 h-9 flex items-center justify-center text-brand-600 text-lg shrink-0">${ICONS.plus}</button>
          <div class="relative shrink-0">
            <button onclick="document.getElementById('route-menu').classList.toggle('hidden')" class="press-fade w-9 h-9 flex items-center justify-center text-black/60 dark:text-white/60 text-lg">${ICONS.kebab}</button>
            ${renderRouteMenu()}
          </div>
        </div>
      </div>

      <div class="px-4">
        <h1 data-large-title class="large-title text-[22px] font-bold tracking-tight pt-3 pb-1 truncate">${escapeHtml(r.name)}</h1>
        <p class="text-[13px] text-black/50 dark:text-white/50 pb-3">${r.status === 'active' ? 'Aktiv' : 'Abgeschlossen'} · ${fmtDate(r.created_at)}</p>

        ${r.needs_optimize ? `
          <button onclick="manualOptimize()" class="press-98 w-full flex items-center justify-between gap-2 bg-warn/10 text-warn text-[13px] font-semibold px-4 py-2.5 rounded-xl mb-3">
            <span class="flex items-center gap-1.5"><span class="flex">${ICONS.warning}</span>Route nicht aktuell</span>
            <span class="underline">Jetzt optimieren</span>
          </button>
        ` : ''}

        <button onclick="switchTab('map')" class="${CARD} w-full text-left px-4 py-3.5 flex items-center gap-3 mb-4">
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-baseline mb-1.5">
              <p class="text-[15px] font-semibold">${r.delivered_count} / ${r.customer_count} zugestellt</p>
              <p class="text-[12px] text-black/50 dark:text-white/50">≈ ${r.total_km} km · ${r.total_min} min</p>
            </div>
            <div class="h-1.5 bg-black/10 dark:bg-white/10 rounded-full overflow-hidden">
              <div class="h-full bg-success transition-all duration-500" style="width: ${progress}%"></div>
            </div>
          </div>
          <span class="text-brand-600 shrink-0 flex items-center gap-1 text-[13px] font-medium">${ICONS.mapPin} Karte<span class="flex">${ICONS.chevron}</span></span>
        </button>

        <div class="${GROUP}">
          ${stops.map(stopRow).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderRouteMenu() {
  const r = state.currentRoute;
  const item = (onclick, iconSvg, label, danger) => `<button onclick="${onclick}" class="w-full flex items-center gap-3 text-left px-4 py-3 text-[15px] ${danger ? 'text-red-600' : ''} active:bg-black/5 dark:active:bg-white/10">
    <span class="w-5 flex shrink-0 ${danger ? 'text-red-600' : 'text-black/50 dark:text-white/50'}">${iconSvg}</span>${label}
  </button>`;
  return `
    <div id="route-menu" class="hidden absolute right-0 top-10 w-56 bg-white/95 dark:bg-[#2C2C2E]/95 backdrop-blur-xl rounded-2xl shadow-2xl overflow-hidden z-30 divide-y divide-black/10 dark:divide-white/10">
      ${item("renameRoute()", ICONS.pencil, "Umbenennen")}
      ${item("manualOptimize()", ICONS.compass, "Neu optimieren")}
      ${item("document.getElementById('route-menu').classList.add('hidden'); renderJsonForm();", ICONS.doc, "Als JSON bearbeiten")}
      ${item("resetDelivered()", ICONS.refresh, "Zustellungen zurücksetzen")}
      ${item("toggleRouteStatus()", ICONS.checkCircle, r.status === 'completed' ? 'Wieder aktivieren' : 'Route abschließen')}
      ${item("deleteRoute()", ICONS.trash, "Löschen", true)}
    </div>
  `;
}

// ---------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------
document.querySelectorAll('[data-logo-src]').forEach(img => img.src = APP_LOGO);

window.addEventListener('online', () => toast('Wieder online', 'success'));
window.addEventListener('offline', () => toast('Keine Internetverbindung – Änderungen können nicht gespeichert werden.', 'error'));

document.addEventListener('click', (e) => {
  const menu = document.getElementById('route-menu');
  if (menu && !menu.classList.contains('hidden') && !e.target.closest('#route-menu') && !e.target.closest('button[onclick*="route-menu"]')) {
    menu.classList.add('hidden');
  }
});

// Not fully offline-capable — adding/editing a stop still calls Nominatim/
// Wien-OGD (geocoding) and OSRM (routing) live, and the map needs its
// vector tiles from OpenFreeMap. What this buys: the app shell and any
// already-visited page load instantly from cache and still work with no
// connection at all. See /sw.js (embedded into the binary the same way as
// this file — src/main.rs).
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}

loadRoutes();
</script>
</body>
</html>
