function stopKindMeta(stop) {
  if (stop.kind === 'start') return { icon: ICONS.house, title: 'Start', subtitle: `${stop.strasse}, ${stop.plz} Wien` };
  if (stop.kind === 'via') return { icon: ICONS.box, title: 'Lager', subtitle: `${stop.strasse}, ${stop.plz} Wien` };
  if (stop.kind === 'end') return { icon: ICONS.flag, title: 'Ziel', subtitle: `${stop.strasse}, ${stop.plz} Wien` };
  return null;
}

// How many customer stops on the route share each exact address — e.g. one
// customer ordering two different menus, pasted in as two separate stop
// entries instead of combined into one stop's Paket field (this is common:
// the source list a route gets built from routinely has the same name and
// address twice in a row for exactly this reason). Two rows in a
// scrollable list read as two unrelated deliveries; a driver who reads
// one, delivers it, and walks back to the car has no signal there's a
// second package waiting at the exact door they just left. Keyed with the
// same `addrKey` the "already in this route" duplicate check uses when
// adding a stop by hand, so both stay consistent with each other.
//
// Memoized per `stops` array — `toggleDelivered`'s optimistic update, its
// server-confirm reconciliation, and its error-revert path can each call
// this (via `applyDeliveredDomPatch`) for the *same* route within one tap,
// and the result can't have changed between them (nothing here depends on
// `delivered`, only on which addresses exist). `state.currentRoute.stops`
// is a fresh array every time the route is replaced wholesale from a server
// response (see `applyRouteUpdate`/`adoptRoute`), never mutated in place, so
// keying a `WeakMap` on the array itself invalidates the cache for free
// exactly when it should, with nothing to remember to clear by hand.
const dupCountsCache = new WeakMap();

// Groups the route's customer stops by *door*, returning a Map from each
// stop's id to the ids of every stop that shares that door (itself
// included).
//
// Two things make two stops one door, and both are needed:
//   - the same normalized address text (see `addrKey`), which catches the
//     ordinary case of one address entered twice; and
//   - the same resolved coordinate, when both stops were located exactly.
//     Vienna's register reconciles wordings no text normalizer could —
//     "Gentzgasse 129/1" and "Gentzgasse 129 Stiege 1" resolve to one point
//     — and the point is the closest thing this app has to "the driver will
//     be standing in the same place". Approximately located stops are left
//     out of that half of the test on purpose: several unrelated addresses
//     can share one district-centre fallback, and calling those one door
//     would cry wolf.
// Either relation can bridge a group, so the two are unioned rather than
// applied in sequence.
function sameDoorGroups(stops) {
  const cached = dupCountsCache.get(stops);
  if (cached) return cached;

  const customers = stops.filter((s) => s.kind === 'customer');
  // Union-find. A route caps out around a hundred stops so the cost is
  // irrelevant, but the correctness isn't: "put each stop in the first
  // group it matches" gets the wrong answer when a third stop is the one
  // that reveals two earlier groups are the same door.
  const parent = new Map(customers.map((s) => [s.id, s.id]));
  const find = (id) => {
    let root = id;
    while (parent.get(root) !== root) root = parent.get(root);
    while (parent.get(id) !== root) { const next = parent.get(id); parent.set(id, root); id = next; }
    return root;
  };
  const union = (a, b) => {
    const ra = find(a), rb = find(b);
    if (ra !== rb) parent.set(ra, rb);
  };
  const firstBy = new Map();
  const link = (key, id) => {
    if (firstBy.has(key)) union(firstBy.get(key), id);
    else firstBy.set(key, id);
  };
  for (const s of customers) {
    link('a:' + addrKey(s.strasse, s.plz), s.id);
    if (!s.location_precision) link('p:' + pointKey(s), s.id);
  }

  const byRoot = new Map();
  for (const s of customers) {
    const root = find(s.id);
    if (!byRoot.has(root)) byRoot.set(root, []);
    byRoot.get(root).push(s.id);
  }
  const groups = new Map();
  for (const s of customers) groups.set(s.id, byRoot.get(find(s.id)));

  dupCountsCache.set(stops, groups);
  return groups;
}

// A Start/Lager/Ziel row. Carries the same press handlers a customer row
// does, so the gesture that opens "this stop" is one gesture everywhere —
// it just lands on `openFixedStopSheet` instead (see `openStopSheet`).
// A skipped stop is dimmed and labelled rather than hidden: the row is the
// only way back to the switch that skipped it.
function renderFixedRow(s, meta, animIndex = null) {
  const url = navUrl(s);
  const skipped = !!s.excluded;
  const animClass = animIndex === null ? '' : 'row-enter ';
  const animStyle = animIndex === null ? '' : ` style="animation-delay:${animIndex * 25}ms"`;

  return `
    <div class="${animClass}flex items-start gap-3 px-4 py-3.5"${animStyle}>
      <span class="w-9 h-9 shrink-0 rounded-full bg-black/5 flex items-center justify-center text-base ${skipped ? 'text-black/25' : 'text-black/60'}">${meta.icon}</span>
      <div class="flex-1 min-w-0 pt-0.5 select-none cursor-pointer rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"
        role="button" tabindex="0"
        aria-label="${escapeAttr(`${meta.title}, ${meta.subtitle} — ${skipped ? 'übersprungen, wieder einplanen' : 'überspringen'}`)}"
        ontouchstart="stopLongPressStart(event, ${s.id})"
        ontouchend="stopLongPressEnd(event)"
        ontouchcancel="stopLongPressEnd(event)"
        ontouchmove="stopLongPressMove(event)"
        onmousedown="stopLongPressStart(event, ${s.id})"
        onmouseup="stopLongPressEnd(event)"
        onmouseleave="stopLongPressEnd(event)"
        onmousemove="stopLongPressMove(event)"
        onkeydown="stopRowKeydown(event, ${s.id})"
        oncontextmenu="stopLongPressContext(event, ${s.id})">
        <div class="flex items-center gap-1.5 flex-wrap">
          <p class="font-medium ${skipped ? 'text-black/40 line-through' : ''}">${meta.title}</p>
          ${skipped ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-black/45 bg-black/[0.07] px-1.5 py-0.5 rounded">Übersprungen</span>` : ''}
        </div>
        <p class="text-[13px] ${skipped ? 'text-black/35' : 'text-black/50'}">${escapeHtml(meta.subtitle)}</p>
        ${skipped ? '' : legLabel(s)}
      </div>
      <a href="${url}" target="_blank" rel="noopener" aria-label="In Maps öffnen" title="In Maps öffnen" class="press-fade shrink-0 w-9 h-9 rounded-full bg-black/5 flex items-center justify-center ${skipped ? 'text-black/25' : 'text-black/50'}">${ICONS.mapPin}</a>
    </div>
  `;
}

// A single customer row's markup — factored out of renderRouteDetail so
// `applyDeliveredDomPatch` can rebuild exactly one row (or the two rows a
// "next stop" handoff touches) without going through a full list render.
// `animIndex` is only ever non-null from the full-list render path
// (`renderRouteDetail`'s own `stopRow`); a DOM-patched row never plays the
// staggered entrance animation — it's already on screen, mid-session, and
// replaying it would be the "list just reloaded" flicker this whole patch
// path exists to avoid.
function renderCustomerRow(s, isNext, animIndex = null, duplicateCount = 1) {
  const url = navUrl(s);
  const delivered = s.delivered;
  const precisionBadge = s.location_precision === 'street'
    ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-warnText bg-warn/10 px-1.5 py-0.5 rounded" title="Genaue Hausnummer nicht gefunden — nächstgelegene bekannte Adresse auf der Straße verwendet.">≈ Straße</span>`
    : s.location_precision === 'district'
    ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-warnText bg-warn/10 px-1.5 py-0.5 rounded" title="Straße nicht gefunden — nur Bezirksmitte verwendet. Position bitte prüfen.">≈ Bezirk</span>`
    : '';
  // Loud, solid-fill — not the quieter tinted style the precision badge
  // above uses — on purpose: missing this is the one thing it exists to
  // prevent, a second package at a door the driver has already left.
  const duplicateBadge = duplicateCount > 1
    ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-white bg-warn px-1.5 py-0.5 rounded flex items-center gap-1" title="Insgesamt ${duplicateCount} Stopps an dieser Adresse — alle Pakete mitnehmen."><span class="flex">${ICONS.warning}</span>${duplicateCount}× an dieser Adresse</span>`
    : '';
  const animClass = animIndex === null ? '' : 'row-enter ';
  const animStyle = animIndex === null ? '' : ` style="animation-delay:${animIndex * 25}ms"`;

  return `
    <div data-stop-row="${s.id}" ${isNext && !delivered ? 'data-next-stop' : ''} class="${animClass}flex items-start gap-2 px-4 py-3.5 ${isNext && !delivered ? 'bg-brand-50/60' : ''}"${animStyle}>
      <div class="flex-1 min-w-0 select-none cursor-pointer rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-600"
        role="button" tabindex="0"
        aria-label="${escapeAttr(`${s.kunde}, ${s.strasse}, ${s.plz} Wien — bearbeiten`)}"
        ontouchstart="stopLongPressStart(event, ${s.id})"
        ontouchend="stopLongPressEnd(event)"
        ontouchcancel="stopLongPressEnd(event)"
        ontouchmove="stopLongPressMove(event)"
        onmousedown="stopLongPressStart(event, ${s.id})"
        onmouseup="stopLongPressEnd(event)"
        onmouseleave="stopLongPressEnd(event)"
        onmousemove="stopLongPressMove(event)"
        onkeydown="stopRowKeydown(event, ${s.id})"
        oncontextmenu="stopLongPressContext(event, ${s.id})">
        <div class="flex items-center gap-1.5 flex-wrap">
          ${isNext && !delivered ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-brand-600 bg-brand-50 px-1.5 py-0.5 rounded">Nächster Stopp</span>` : ''}
          ${duplicateBadge}
          ${precisionBadge}
        </div>
        <p class="font-medium ${delivered ? 'text-black/50 line-through' : ''}">${escapeHtml(s.kunde)}</p>
        <p class="text-[13px] ${delivered ? 'text-black/50' : 'text-black/60'}">${escapeHtml(s.strasse)}, ${escapeHtml(s.plz)} Wien</p>
        ${s.paket ? (() => {
          const qty = paketQty(s.paket);
          const multi = qty > 1 && !delivered;
          return `<p class="inline-flex items-center gap-1 max-w-full text-[12px] ${multi ? 'font-bold' : 'font-medium'} mt-1.5 px-1.5 py-0.5 rounded ${
            delivered ? 'text-black/55 bg-black/5' : multi ? 'text-white bg-brand-600 shadow-sm' : 'text-brand-700 bg-brand-50'
          }">${
            multi
              ? `<span class="shrink-0 w-4 h-4 rounded-full bg-white/25 flex items-center justify-center text-[10px] font-bold">${qty}</span>`
              : `<span class="flex shrink-0">${ICONS.box}</span>`
          }<span class="truncate">${escapeHtml(s.paket)}</span></p>`;
        })() : ''}
        ${s.notiz ? `<p class="inline-flex items-center gap-1 max-w-full text-[12px] italic mt-1 px-1.5 py-0.5 rounded ${delivered ? 'text-black/55 bg-black/5' : 'text-warnText bg-warn/10'}"><span class="flex shrink-0 not-italic">${ICONS.note}</span><span class="truncate">${escapeHtml(s.notiz)}</span></p>` : ''}
        ${legLabel(s, 'mt-1.5')}
      </div>
      <div class="flex flex-col gap-2 shrink-0 mt-0.5">
        <button onclick="toggleDelivered(${s.id}, ${!delivered})" aria-pressed="${delivered}" aria-label="${delivered ? 'Zustellung zurücknehmen' : 'Als zugestellt markieren'}" title="${delivered ? 'Zustellung zurücknehmen' : 'Als zugestellt markieren'}" class="press-95 w-10 h-10 rounded-full flex items-center justify-center text-[20px] shadow-sm ${delivered ? 'bg-success text-white' : 'bg-white border-2 border-black/15 text-black/30'}">
          ${delivered ? ICONS.checkCircleFill : ICONS.circle}
        </button>
        <a href="${url}" target="_blank" rel="noopener" aria-label="In Maps öffnen" title="In Maps öffnen" class="press-fade w-10 h-10 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center text-[17px] shadow-sm">${ICONS.mapPin}</a>
      </div>
    </div>
  `;
}

// ---------------------------------------------------------------------
// Map engine — OpenFreeMap (tiles.openfreemap.org), a free/open vector-
// tile CDN built on OpenStreetMap data by the creator of OpenMapTiles: no
// API key, no usage cap, no billing account, self-hostable if that's ever
// needed. It ships a complete, professionally-designed style — real street
// labels, house numbers, POIs, building footprints — via MapLibre GL JS.
// Routing/geocoding stay fully server-side against Nominatim/OSRM (see
// src/main.rs); this is only the on-screen visualization. Used by both the
// Karte tab (full-screen) and the pin-drop sheet (small, embedded).
// ---------------------------------------------------------------------
const MAP_STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';
const VIENNA_CENTER = [16.3738, 48.2082]; // [lon, lat]

// ---------------------------------------------------------------------
// Aerial basemap — "which of these buildings is it, and how do I get in".
// A vector street map draws Favoritenstraße 45 as a number next to a grey
// block; the orthophoto shows the driver the actual entrance, the
// courtyard, the driveway and where a van can stop, which is the thing
// they're actually trying to work out on arrival.
//
// Sources, both free (CC-BY 4.0), no API key, no usage cap:
//   - `lb` ("Luftbild") from maps.wien.gv.at — Stadt Wien's own aerial
//     imagery, the same orthophoto the city's public map viewers show,
//     reflown yearly and served down to zoom 21 (~10cm/px). Vienna-only,
//     which is the entire operating area of this app.
//   - `bmaporthofoto30cm` (basemap.at, served from the same host) sits
//     underneath at a deliberately low `maxzoom`: it covers all of
//     Austria, so a driver who pans past the city limits sees imagery
//     instead of an empty grey void, and capping it at zoom 16 means
//     MapLibre stretches a handful of coarse tiles rather than fetching a
//     second full-resolution basemap nobody looks at.
//   - `beschriftung` — Vienna's transparent label overlay (street names,
//     house numbers) painted on top, because an orthophoto with no labels
//     is unnavigable. Tops out at zoom 19 and is overzoomed above that.
//
// Built as a style object here rather than fetched as a style URL: it's
// three raster layers with no glyphs, sprites or symbol layers to load, so
// switching basemaps costs no round-trip at all beyond the tiles.
// ---------------------------------------------------------------------
const AERIAL_ATTRIB_WIEN = '© <a href="https://data.wien.gv.at" target="_blank" rel="noopener">Stadt Wien</a>';
const AERIAL_ATTRIB_AT = '© <a href="https://basemap.at" target="_blank" rel="noopener">basemap.at</a>';

// The WMTS serves 256px tiles and has no `@2x` variant, so on a phone
// (devicePixelRatio 2–3) a tile drawn at its nominal size is upscaled and
// goes soft. Declaring a source's tiles as *half* their real size makes
// MapLibre fetch one zoom level deeper for the same ground area and draw it
// into the same box: same apparent scale, twice the detail — what a `@2x`
// endpoint would have given us.
//
// It also costs FOUR TIMES the tiles, and that bill is only worth paying
// where the tiles are small. Applied to the imagery it made the Luftbild
// crawl in over a mobile connection, one square at a time, because those
// are 8–20 KB JPEGs and a screenful of them is megabytes. Applied to the
// label overlay it costs almost nothing — those are mostly-transparent PNGs
// of a few hundred bytes to a few KB — and the labels were the part that
// actually looked pixelated, since text shows upscaling far more than an
// aerial photo does.
//
// So: labels get the retina treatment, imagery stays native. See the
// sources in `aerialStyle`.
const RETINA_LABEL_TILE_SIZE = (typeof devicePixelRatio === 'number' && devicePixelRatio > 1.5) ? 128 : 256;

// The aerial layers, added *on top of* the vector basemap rather than
// swapped in as a style of their own.
//
// This started out as two styles and a `setStyle` between them, and that is
// what produced the blank map: `setStyle` with a style *object* parses it
// inside an animation frame, so anything that stalls frames — a
// backgrounded tab, a phone throttling a busy page — leaves the map holding
// neither style, with no error to catch. Diffing made it worse, a lost
// WebGL context made it worse again, and every swap also threw away the
// route line and every tile already on screen.
//
// Adding layers to the live style instead has none of those failure modes.
// Switching basemap is three `setLayoutProperty` calls: instant, no
// reload, no re-fetch of tiles already in memory, and the route line and
// markers are never touched because the style they live in never changes.
//
// The vector map is deliberately left *visible underneath* the imagery
// rather than hidden. Aerial JPEGs are opaque, so it costs nothing to look
// at — and it means that if the imagery can't load at all (no signal, the
// city's tile server down, a Vienna gap), the driver sees the street map
// through the hole instead of an empty grey screen. There is no state this
// map can get into where nothing is drawn.
function mountAerialLayers(map) {
  if (map.getSource('wien-lb')) return true;
  const sources = {
    'at-ortho': {
      type: 'raster',
      tiles: ['https://maps.wien.gv.at/basemap/bmaporthofoto30cm/normal/google3857/{z}/{y}/{x}.jpeg'],
      tileSize: 256,
      // Deliberately shallow. This exists only so panning past the city
      // limits shows ground rather than a void; every zoom level it can
      // serve is one where it loads a full screenful of tiles underneath
      // the Vienna imagery that completely covers it — paying twice for one
      // view. Capped here, the whole city is a handful of stretched tiles.
      maxzoom: 12,
      attribution: AERIAL_ATTRIB_AT,
    },
    'wien-lb': {
      type: 'raster',
      tiles: ['https://maps.wien.gv.at/wmts/lb/farbe/google3857/{z}/{y}/{x}.jpeg'],
      // Native size — see `RETINA_LABEL_TILE_SIZE`. Runs to zoom 21
      // (~10 cm/px), so a driver who wants more detail pinches in and gets
      // it natively instead of every screen paying for four times the tiles.
      tileSize: 256,
      maxzoom: 21,
      attribution: AERIAL_ATTRIB_WIEN,
    },
    'wien-labels': {
      type: 'raster',
      tiles: ['https://maps.wien.gv.at/wmts/beschriftung/normal/google3857/{z}/{y}/{x}.png'],
      tileSize: RETINA_LABEL_TILE_SIZE,
      // The label overlay stops at 19 where the imagery goes to 21 — above
      // that MapLibre stretches the deepest tiles it has, which is the right
      // trade: by then the driver is looking at one roof and needs the
      // picture, not the lettering.
      maxzoom: 19,
      attribution: AERIAL_ATTRIB_WIEN,
    },
  };
  try {
    for (const [id, source] of Object.entries(sources)) {
      if (!map.getSource(id)) map.addSource(id, source);
    }
    // Under the route line if it's already drawn, so switching to the
    // Luftbild can never bury the route under the imagery.
    const before = map.getLayer('route-line-casing') ? 'route-line-casing' : undefined;
    const visibility = map._earBasemap === 'aerial' ? 'visible' : 'none';
    for (const id of AERIAL_LAYER_IDS) {
      if (map.getLayer(id)) continue;
      map.addLayer({
        id,
        type: 'raster',
        source: id,
        layout: { visibility },
        ...(id === 'wien-labels' ? { paint: { 'raster-opacity': 0.95 } } : {}),
      }, before);
    }
    return true;
  } catch (err) {
    // A failure here costs the Luftbild, not the map: the vector basemap,
    // the route and the markers are all still there.
    console.warn('aerial layers could not be added', err);
    return false;
  }
}

// Bottom-to-top: the nationwide fallback, Vienna's imagery over it, labels
// on top of both.
const AERIAL_LAYER_IDS = ['at-ortho', 'wien-lb', 'wien-labels'];

// Which basemap every map in the app opens with, persisted like the
// maps-app choice (see `MAPS_PROVIDER_KEY`) — a driver who works off the
// Luftbild wants it to still be the Luftbild after a reload, not a
// preference to re-set on every route.
const BASEMAP_KEY = 'ear_basemap';

function getBasemap() {
  let saved;
  try { saved = localStorage.getItem(BASEMAP_KEY); } catch (_) { /* private-browsing storage lockout */ }
  return saved === 'aerial' ? 'aerial' : 'map';
}

function setBasemap(mode) {
  try { localStorage.setItem(BASEMAP_KEY, mode); } catch (_) { /* private-browsing storage lockout */ }
}

// Switching basemap: three visibility flags. Nothing is fetched, no style is
// replaced, the route line and markers are not touched, and tiles already in
// memory stay there — so switching back is instant rather than a reload.
function applyBasemap(map, mode) {
  map._earBasemap = mode;
  // Late-mounted if the style wasn't ready when the map was built.
  if (!mountAerialLayers(map)) return;
  const visibility = mode === 'aerial' ? 'visible' : 'none';
  for (const id of AERIAL_LAYER_IDS) {
    if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', visibility);
  }
}

// Runs whenever the map's style changes state. There is only ever one style
// now (the vector basemap; the aerial layers live inside it), so this has
// two jobs: put the aerial layers in as soon as there is a style to put them
// in, and draw the route once.
//
// `styledata` rather than `style.load`: the latter fires only for a map's
// first style and MapLibre gives no other reliable "ready" signal. Readiness
// is "the style is parsed" (it has layers) rather than `isStyleLoaded()`,
// which additionally waits for every source's tiles — on a van's connection
// that can be a long time, and the route line has no reason to wait for
// imagery.
function mountBasemapRedraw(map) {
  map._earStyleReady = false;
  const onStyleData = () => {
    let layers;
    // getStyle() throws rather than returning undefined at some points
    // during a style's life.
    try { layers = map.getStyle()?.layers; } catch (_) { return; }
    if (!layers?.length) return;
    map._earStyleReady = true;
    mountAerialLayers(map);
    // Already drawn. `styledata` also fires as a *result* of adding the
    // route's own layers, and again for every tile that arrives, so without
    // this the handler would answer its own work and rebuild every marker
    // on the map dozens of times while a basemap loads.
    if (map.getLayer('route-line')) return;
    map._earLastSignature = null;
    if (mapTabMap === map) syncMapTabRoute();
  };
  map.on('styledata', onStyleData);
  onStyleData();
}

// Rebuilding the Karte tab's map from scratch — the recovery of last resort,
// for the one thing that leaves a live map permanently blank with no error
// anyone can catch: a lost WebGL context. Rate-limited, because a rebuild
// that fails the same way immediately would loop, and a phone stuck in a
// rebuild loop is worse than a phone showing a stale map.
let lastMapRebuildAt = 0;
function rebuildMapTabMap(reason) {
  const now = Date.now();
  if (now - lastMapRebuildAt < 15000) {
    console.warn('map rebuild suppressed (too soon):', reason);
    return false;
  }
  lastMapRebuildAt = now;
  console.warn('rebuilding map:', reason);
  try { mapTabMap?.remove(); } catch (_) { /* already torn down */ }
  mapTabMap = null;
  mapTabRouteId = null;
  // `remove()` empties the container, but the element itself is reused —
  // it's the node `render()` re-parents between screens (see `mapTabEl`).
  if (mapTabEl) mapTabEl.innerHTML = '';
  if (state.tab === 'map' && !isDetailShowing()) initMapTabMap();
  return true;
}

function basemapControl() {
  return {
    onAdd(map) {
      const container = elFromHtml('<div class="maplibregl-ctrl maplibregl-ctrl-group"><button type="button" class="basemap-toggle"></button></div>');
      const btn = container.querySelector('button');
      const paint = () => {
        const aerial = map._earBasemap === 'aerial';
        btn.textContent = aerial ? 'Karte' : 'Luftbild';
        const label = aerial ? 'Zur Kartenansicht wechseln' : 'Zum Luftbild wechseln — Häuser von oben';
        btn.title = label;
        btn.setAttribute('aria-label', label);
      };
      btn.addEventListener('click', () => {
        applyBasemap(map, map._earBasemap === 'aerial' ? 'map' : 'aerial');
        setBasemap(map._earBasemap);
        paint();
      });
      paint();
      this._container = container;
      return container;
    },
    onRemove() {
      this._container?.remove();
      this._container = null;
    },
  };
}

// Loads MapLibre GL JS/CSS on first actual need (see the comment in
// <head> where the old blocking <link>/<script> tags used to be) and
// caches the in-flight promise so concurrent callers (the Karte tab and
// the pin-drop sheet can both want it around the same time) share one
// fetch instead of racing to inject duplicate tags. Idempotent — safe to
// call from every site that touches `maplibregl`, including ones that
// already ran once and found it loaded.
let mapLibrePromise = null;
function ensureMapLibre() {
  if (typeof maplibregl !== 'undefined') return Promise.resolve();
  if (mapLibrePromise) return mapLibrePromise;
  mapLibrePromise = new Promise((resolve, reject) => {
    // Waits for BOTH the stylesheet and the script, not just the script —
    // the static <link>+<script> tags this replaced got that ordering for
    // free (a browser holds a following synchronous <script> from
    // *executing* until a preceding <link rel=stylesheet> has finished, so
    // MapLibre's own code never used to run before its CSS was applied).
    // Two independently `document.head.appendChild`-ed elements have no
    // such relationship, so it's tracked explicitly here instead — without
    // it, `new maplibregl.Map(...)` could run with the map's controls
    // still unstyled for a frame.
    let cssReady = false;
    let jsReady = false;
    const maybeResolve = () => { if (cssReady && jsReady) resolve(); };

    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css';
    // A CSS load failure degrades to unstyled map controls, not a broken
    // map — worth letting the script side still resolve rather than
    // blocking the whole map on a stylesheet that will never arrive.
    link.onload = () => { cssReady = true; maybeResolve(); };
    link.onerror = () => { cssReady = true; maybeResolve(); };
    document.head.appendChild(link);
    // Belt-and-suspenders against a real, documented cross-browser gotcha:
    // a dynamically-appended <link rel=stylesheet> pointing at a resource
    // the browser already has cached (the overwhelmingly common case after
    // the very first load) does not reliably fire `load` at all in every
    // browser/condition — no load, no error, nothing. Without this timeout,
    // that silently wedged `ensureMapLibre()`'s promise forever, which
    // wedged every caller awaiting it (`initMapTabMap`, the pin-drop sheet)
    // — the map tab would render its empty container and just sit there,
    // permanently, even though the MapLibre *script* loaded fine. A missed
    // `onload` is now a cosmetic risk (rare, brief unstyled controls)
    // instead of a functional one.
    setTimeout(() => { cssReady = true; maybeResolve(); }, 1500);

    const script = document.createElement('script');
    script.src = 'https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js';
    script.onload = () => { jsReady = true; maybeResolve(); };
    script.onerror = () => {
      // Let a fresh attempt happen next time (a dropped connection loading
      // this shouldn't permanently disable the map for the rest of the
      // session) rather than caching a rejected promise forever.
      mapLibrePromise = null;
      reject(new Error('MapLibre GL JS konnte nicht geladen werden.'));
    };
    document.head.appendChild(script);
  });
  return mapLibrePromise;
}

// Speculatively starts the fetch a moment after first load — not blocking
// anything (this fires well after `render()` has already painted the
// first screen), just likely finished by the time a driver actually taps
// the Karte tab instead of them watching it load right then.
// `requestIdleCallback` doesn't exist in Safari, the platform this app
// mostly runs on (see the zoom-lock comment in <head>), hence the
// `setTimeout` fallback rather than skipping the idle path outright. The
// `timeout` option is what actually matters, not just a nice-to-have: a
// tab that's never truly "idle" (rendering, animating, handling touch
// input the whole time a driver is using it) can otherwise leave this
// speculative preload waiting forever — a real possibility, not a
// hypothetical, for an app whose whole point is a driver actively poking
// at it. Bounding it means the driver's very first tap on the Karte tab
// is still at worst a few seconds' wait, not an indefinite one.
if (typeof requestIdleCallback === 'function') {
  requestIdleCallback(() => ensureMapLibre().catch(() => {}), { timeout: 3000 });
} else {
  setTimeout(() => ensureMapLibre().catch(() => {}), 1500);
}

function elFromHtml(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function newMap(container, opts) {
  const basemap = getBasemap();
  const map = new maplibregl.Map({
    container,
    // One style for the life of the map. The Luftbild is layers inside it,
    // not a style of its own — see `mountAerialLayers`.
    style: MAP_STYLE_URL,
    center: opts.center || VIENNA_CENTER,
    zoom: opts.zoom || 12,
    // The aerial imagery stops at zoom 21 but is worth overzooming a
    // little: a driver pinching all the way in on one building wants the
    // biggest possible picture of the entrance, not a hard stop.
    maxZoom: 22,
    dragRotate: false,
    touchPitch: false,
    pitchWithRotate: false,
    ...opts.extra,
  });
  map._earBasemap = basemap;
  mountBasemapRedraw(map);
  // A phone under memory pressure can have its WebGL context taken away by
  // the browser. MapLibre does not recover from that on its own: the canvas
  // simply stays blank for the rest of the session, with no error and
  // nothing to tap. Caught here and rebuilt, it costs a second of reloading
  // instead of a dead map tab.
  map.on('webglcontextlost', () => console.warn('map WebGL context lost'));
  map.on('webglcontextrestored', () => {
    if (mapTabMap === map) rebuildMapTabMap('WebGL context restored');
  });
  // Whether two badges collide depends on the zoom, so the fan is recomputed
  // whenever it changes. `zoomend` rather than `zoom`: this walks every
  // marker, and doing that on each frame of a pinch is work nobody sees.
  map.on('zoomend', () => relayoutStopMarkers(map));
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  map.addControl(basemapControl(), 'top-right');
  const geolocate = new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: true, showUserHeading: true });
  map.addControl(geolocate, 'top-right');

  // `_earPauseGeolocate`/`_earResumeGeolocate` exist so the Karte tab's
  // persistent map (see the section below — it's built once and kept
  // alive for the app's whole lifetime) can stop `watchPosition()` while
  // its own tab isn't the one on screen. Once a driver has tapped the
  // locate-me button, `trackUserLocation: true` keeps that GPS watch
  // running continuously — including while the map's canvas sits detached
  // during a visit to Routen/Verlauf/Mehr — for as long as the app stays
  // open, which for this PWA is realistically hours. `geolocate.trigger()`
  // is the same action a tap on the control performs: a toggle, not a
  // dedicated pause/resume API (MapLibre doesn't expose one), so whether
  // it was actually active is tracked separately rather than assumed —
  // pausing it while off, or resuming it when the driver had already
  // turned it off themselves, would incorrectly turn it *on*.
  let geolocateActive = false;
  let pausedFromActive = false;
  geolocate.on('trackuserlocationstart', () => { geolocateActive = true; });
  geolocate.on('trackuserlocationend', () => { geolocateActive = false; });
  map._earPauseGeolocate = () => {
    pausedFromActive = geolocateActive;
    if (geolocateActive) geolocate.trigger();
  };
  map._earResumeGeolocate = () => {
    if (pausedFromActive) geolocate.trigger();
    pausedFromActive = false;
  };
  return map;
}

// A cheap fingerprint of exactly what `drawRouteOnMap` actually draws —
// not the whole route object, which also carries fields (name,
// created_at, status, ...) that change independently of anything on the
// map and would otherwise force a pointless marker teardown/rebuild.
// `total_km`/`total_min` stand in for the route geometry itself (a full
// coordinate-array comparison on every sync would cost more than the
// redraw it's trying to avoid): a reoptimization that changes the line
// always changes the rounded totals too, even fractionally.
function routeMarkerSignature(r) {
  // Every field `drawRouteOnMap` actually reads into a marker or its popup
  // — id/lat/lon (position), delivered/location_precision (marker color and
  // ring), excluded (whether the stop gets a marker at all), kunde/strasse/plz
  // (the popup's text). `total_km`/`total_min`
  // stand in for the route geometry itself (see the comment where this
  // function is called) rather than the coordinate array, which would cost
  // more to compare on every sync than the redraw it's trying to avoid.
  const stopsSig = r.stops
    .map(s => `${s.id}:${s.lat}:${s.lon}:${s.delivered ? 1 : 0}:${s.excluded ? 1 : 0}:${s.location_precision || ''}:${s.kunde}:${s.strasse}:${s.plz}`)
    .join('|');
  return `${r.id}|${r.total_km}|${r.total_min}|${stopsSig}`;
}

// How far apart (in degrees) two stops' coordinates may be and still get one
// shared dot rather than two. 1e-5 ° is a bit over a metre: two entries
// geocoded to the same register point are bitwise identical, but two
// registered entrances of one building can land a metre apart, where a second
// dot would be indistinguishable from the first at any zoom — one dot is the
// honest drawing of "one door, as far as this map can show it". Keeping the
// badges apart is a separate job, done in screen space (see
// `relayoutStopMarkers`) because whether two badges collide depends on zoom.
const SAME_POINT_DECIMALS = 5;

function pointKey(s) {
  return `${s.lat.toFixed(SAME_POINT_DECIMALS)},${s.lon.toFixed(SAME_POINT_DECIMALS)}`;
}

// Where a badge sits relative to the point it belongs to, in screen pixels —
// a marker `offset`, so it holds its distance at every zoom instead of
// drifting as the map scales.
//
// A lone badge gets pushed straight up, clear of the dot marking the door.
// Badges that would land on top of each other fan out evenly around the
// group's shared centre.
function badgeOffset(i, n) {
  if (n <= 1) return [0, -22];
  // Grows with the group so five-plus badges don't crowd each other back
  // into the clump the fan exists to break up.
  const radius = n <= 4 ? 26 : 26 + (n - 4) * 4;
  // Starts at 12 o'clock and goes clockwise, so a pair reads as one above
  // and one below the door rather than an arbitrary diagonal.
  const angle = -Math.PI / 2 + (i * 2 * Math.PI) / n;
  return [Math.cos(angle) * radius, Math.sin(angle) * radius];
}

// How close two badges have to be, on screen, to be fanned apart instead of
// left to overlap.
const FAN_CLUSTER_PX = 34;
// Below street level, only *exactly* coincident stops are fanned. Two
// entries for one door overlap at every zoom there is and must always be
// separated; two neighbouring houses only overlap when the map is zoomed
// out, and pulling their badges apart there would just scatter numbers away
// from the streets they belong to for no gain — at that zoom the driver is
// reading the shape of the route, not picking out a door.
const FAN_MIN_ZOOM = 15;

// Fans out every group of badges that would otherwise sit on top of each
// other *at the current zoom*.
//
// Grouping by identical coordinates (which is what this used to do) only
// caught two orders at one address. It did nothing for the case that
// actually hides a stop just as thoroughly: two doors a few metres apart —
// neighbouring houses, or two Stiegen of one Gemeindebau, 30 m and therefore
// a couple of pixels apart on an overview. Clustering in projected screen
// space catches both, and re-running on zoom means a fan opens up as the
// driver zooms in rather than being decided once at whatever zoom the route
// happened to be drawn at.
//
// The dots never move: each stays on its own registered point, so the
// precise locations stay readable underneath whatever the badges do.
function relayoutStopMarkers(map) {
  const badges = map._earBadges || [];
  if (!badges.length) return;
  const radius = map.getZoom() >= FAN_MIN_ZOOM ? FAN_CLUSTER_PX : 0.5;
  const pts = badges.map((b) => {
    const p = map.project(b.lngLat);
    return { b, x: p.x, y: p.y, taken: false };
  });
  for (const seed of pts) {
    if (seed.taken) continue;
    // `seed` is still untaken here, so it heads its own cluster.
    const cluster = pts.filter((q) => !q.taken && Math.hypot(q.x - seed.x, q.y - seed.y) <= radius);
    for (const q of cluster) q.taken = true;
    const cx = cluster.reduce((sum, q) => sum + q.x, 0) / cluster.length;
    const cy = cluster.reduce((sum, q) => sum + q.y, 0) / cluster.length;
    cluster.forEach((q, idx) => {
      const [fx, fy] = badgeOffset(idx, cluster.length);
      // Offsets are relative to each marker's *own* coordinate, so the fan
      // is built around the cluster's centre by first cancelling out how far
      // this marker sits from it.
      // Rounded: these end up as CSS translate values, and a whole pixel
      // renders a 26px badge crisply where 25.9999 makes the browser
      // resample it.
      const off = [Math.round(cx - q.x + fx), Math.round(cy - q.y + fy)];
      q.b.marker.setOffset(off);
      // The popup follows its badge — anchored to the bare coordinate it
      // would point at the dot, which for a fanned group is not the badge
      // the driver just tapped.
      q.b.popup.setOffset([off[0], off[1] + (off[1] < 0 ? -14 : 14)]);
    });
  }
}

function drawRouteOnMap(map, r, { fit = true } = {}) {
  for (const id of ['route-line', 'route-line-casing']) {
    if (map.getLayer(id)) map.removeLayer(id);
  }
  if (map.getSource('route-line')) map.removeSource('route-line');
  // Scoped to this map's own container. A document-wide query would also
  // rip the markers out of any *other* map that happens to be open — the
  // pin-drop sheet's, most obviously — which is a bug waiting for the day
  // two maps are on screen at once rather than a hypothetical.
  (map._earMarkers || []).forEach((m) => m.remove());
  map._earMarkers = [];
  map._earBadges = [];

  map.addSource('route-line', {
    type: 'geojson',
    data: {
      type: 'Feature',
      properties: {},
      geometry: {
        type: 'LineString',
        coordinates: (Array.isArray(r.geometry) ? r.geometry : [])
          .filter((p) => Array.isArray(p) && Number.isFinite(p[0]) && Number.isFinite(p[1]))
          .map(([lat, lon]) => [lon, lat]),
      },
    },
  });
  // A white casing under the red line. On the vector basemap it's a subtle
  // outline; on the aerial one it's what keeps the route visible at all,
  // since red-on-dark-asphalt at 4px is nearly invisible from arm's length
  // in daylight.
  map.addLayer({
    id: 'route-line-casing',
    type: 'line',
    source: 'route-line',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#fff', 'line-width': 8, 'line-opacity': 0.75 },
  });
  map.addLayer({
    id: 'route-line',
    type: 'line',
    source: 'route-line',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ED1639', 'line-width': 4, 'line-opacity': 0.95 },
  });

  const bounds = new maplibregl.LngLatBounds();
  if (Array.isArray(r.geometry) && r.geometry.length > 1) {
    for (const point of r.geometry) {
      // Same reasoning as the per-stop check below, for the route line's
      // own polyline: it comes from OSRM rather than from this app, and one
      // malformed pair must not be able to break the camera.
      if (!Array.isArray(point)) continue;
      const [lat, lon] = point;
      if (Number.isFinite(lat) && Number.isFinite(lon)) bounds.extend([lon, lat]);
    }
  }

  const firstOpenIdx = r.stops.findIndex(s => s.kind === 'customer' && !s.delivered);
  let customerNum = 0;

  // One dot per distinct registered point, and every badge collected for
  // `relayoutStopMarkers` to fan out once they're all placed.
  const dotsPlaced = new Set();
  map._earBadges = [];

  r.stops.forEach((s, i) => {
    // A skipped fixed stop isn't on this tour at all: the line doesn't go
    // there and neither does the van, so a marker for it would only be a
    // pin the driver has to work out isn't a destination — and letting it
    // into `bounds` would zoom the map out to frame a place nobody visits.
    if (s.excluded) return;
    // A coordinate that isn't a real number would be drawn as a marker at
    // an undefined place and, worse, poison `bounds` — one NaN there and
    // `fitBounds` throws, taking the whole map render down with it rather
    // than losing one pin. The stop is still in the list, where the driver
    // can see and fix it; it just isn't on the map.
    if (!Number.isFinite(s.lat) || !Number.isFinite(s.lon)) return;
    const meta = stopKindMeta(s);
    let el;
    if (meta) {
      el = elFromHtml(`<div class="marker-fixed">${meta.icon}</div>`);
    } else {
      customerNum++;
      const isNext = i === firstOpenIdx;
      const bg = s.delivered ? '#34C759' : isNext ? '#ED1639' : '#8E8E93';
      const ring = s.location_precision ? 'box-shadow:0 0 0 3px #FF9500,0 1px 4px rgba(0,0,0,.4);' : '';
      el = elFromHtml(`<div class="marker-badge" style="background:${bg};${ring}">${s.delivered ? '✓' : customerNum}</div>`);
    }
    el.classList.add('ear-route-marker');
    const precisionNote = s.location_precision === 'street' ? '<br><i>≈ nächstgelegene bekannte Hausnummer</i>'
      : s.location_precision === 'district' ? '<br><i>≈ nur Bezirksmitte, Adresse unbekannt</i>' : '';
    // One dot per address, drawn once for the whole group and marking the
    // registered position of the door itself. The badge is 26px wide and
    // would otherwise sit *on* the building it's pointing at, hiding the
    // one thing the driver zoomed in to look at; offsetting the badge and
    // leaving a 9px dot behind is what makes "exactly this house, this
    // entrance" readable on the aerial imagery. `pointer-events: none` (see
    // the CSS) keeps the dot from swallowing taps meant for the badge.
    const key = pointKey(s);
    if (!dotsPlaced.has(key)) {
      dotsPlaced.add(key);
      const dot = new maplibregl.Marker({ element: elFromHtml('<div class="marker-dot"></div>'), anchor: 'center' })
        .setLngLat([s.lon, s.lat])
        .addTo(map);
      map._earMarkers.push(dot);
    }

    const popup = new maplibregl.Popup({ offset: [0, -36], closeButton: false }).setHTML(
      `<b>${escapeHtml(meta ? meta.title : s.kunde)}</b><br>${escapeHtml(s.strasse)}, ${escapeHtml(s.plz)} Wien${precisionNote}`
    );

    const marker = new maplibregl.Marker({ element: el, anchor: 'center', offset: [0, -22] })
      .setLngLat([s.lon, s.lat])
      .setPopup(popup)
      .addTo(map);
    map._earMarkers.push(marker);
    map._earBadges.push({ marker, popup, lngLat: [s.lon, s.lat] });
    bounds.extend([s.lon, s.lat]);
  });

  // Only frame the route when it's a route the map wasn't already showing.
  // Redrawing after a stop is ticked off (or after any other in-place
  // update) must leave the camera exactly where the driver put it —
  // re-fitting on every redraw would silently undo their zoom/pan each
  // time, which is maddening while actually using the map to navigate.
  if (fit) {
    if (!bounds.isEmpty()) {
      map.fitBounds(bounds, { padding: 48, maxZoom: 16, duration: 0 });
    } else {
      map.jumpTo({ center: VIENNA_CENTER, zoom: 12 });
    }
  }
  // Last, after any camera move: which badges collide is a function of the
  // zoom this ends on, not the one the map happened to be at when the
  // redraw started.
  relayoutStopMarkers(map);
}

// ---------------------------------------------------------------------
// The Karte tab's map is built exactly once and then kept alive for the
// life of the page.
//
// It can't simply live in the markup `renderMapTab()` returns: render()
// replaces all of #app's innerHTML, so any element written there is a
// brand new DOM node every single pass, and a map bound to the old one
// would have to be torn down and rebuilt — refetching the style JSON,
// glyphs and sprites, and throwing away the driver's zoom and pan — on
// every re-render, including something as routine as tapping a different
// route chip.
//
// So MapLibre gets its own element that render() never touches
// (`mapTabEl`, created detached), and each render just re-parents that
// element into the empty `#route-map` slot the freshly built screen
// provides. Moving a node between parents preserves its canvas and its
// WebGL context — the map keeps its tiles, its camera and its state, and
// switching routes becomes "swap the line and the markers".
// ---------------------------------------------------------------------
let mapTabMap = null;
let mapTabEl = null;
let mapTabRouteId = null;
// Tracks whether the Karte tab was the visible screen as of the last
// render — see `render()`'s own use of this, right after the comment
// about not destroying the map on tab-away.
let mapTabWasVisible = false;

function initMapTabMap() {
  const slot = document.getElementById('route-map');
  if (!slot || !state.currentRoute) return;
  if (typeof maplibregl === 'undefined') {
    // Not loaded yet (the idle-time speculative fetch may still be in
    // flight, or this is the very first thing the driver did after a cold
    // start) — kick it off/join the in-flight load, then re-run this
    // function from scratch once it lands. Re-running rather than
    // continuing the stale call is what makes sure whatever's actually on
    // screen by the time it resolves (maybe a different route, maybe a
    // different tab entirely) is what gets initialized, not whatever was
    // true when this call started.
    ensureMapLibre()
      .then(() => { if (state.tab === 'map' && !isDetailShowing()) initMapTabMap(); })
      .catch(() => { toast('Kartenbibliothek konnte nicht geladen werden.', 'error'); });
    return;
  }

  if (!mapTabEl) {
    mapTabEl = document.createElement('div');
    mapTabEl.className = 'absolute inset-0';
  }
  if (mapTabEl.parentElement !== slot) slot.appendChild(mapTabEl);

  if (!mapTabMap) {
    const map = newMap(mapTabEl, {});
    mapTabMap = map;
    // The element's real size is still settling the tick it's inserted
    // (Tailwind's CDN runtime applies utility classes asynchronously,
    // safe-area values resolve) — and it's detached and re-attached on
    // every tab switch from then on. A ResizeObserver keeps the canvas in
    // sync with whatever the box actually turns out to be, each time,
    // instead of guessing at one fixed delay.
    const resizeObserver = new ResizeObserver(() => map.resize());
    resizeObserver.observe(mapTabEl);
    map.once('remove', () => resizeObserver.disconnect());
    // No 'load' handler for the first draw: `mountBasemapRedraw` covers it,
    // earlier (layers only need a parsed style, not loaded tiles) and on
    // one code path rather than two that can disagree.
    return;
  }

  // Re-attached from a previous tab visit: the element had no layout box
  // while it was detached, so the canvas needs one explicit nudge before
  // the ResizeObserver takes over again.
  mapTabMap.resize();
  syncMapTabRoute();
}

function syncMapTabRoute() {
  const map = mapTabMap;
  const r = state.currentRoute;
  if (!map || !r) return;
  // Nothing to add sources or layers to until the style is parsed. Waiting
  // on `isStyleLoaded()` here (which is what this used to do) waits for far
  // more than that — it also wants every *source* to have its tiles, which
  // on a van's connection can be in flight for a long time, and re-arming
  // on `styledata` to find out was both racy and easy to dead-end. The
  // `styledata` handler in `mountBasemapRedraw` sets this flag at exactly
  // the moment layers can be added, and calls back here itself, so a plain
  // early return is now the whole of the waiting logic.
  if (!map._earStyleReady) return;
  // Skip the teardown/rebuild entirely when nothing that's actually drawn
  // has changed since the last time this map was synced — `render()` calls
  // this on every single re-render while the Karte tab is showing (see its
  // call to `initMapTabMap()`), including a driver just switching away to
  // the stop list and back with nothing having changed at all. Without
  // this, every one of those visits tore down and recreated every marker
  // and popup from scratch.
  const signature = routeMarkerSignature(r);
  if (map._earLastSignature === signature) return;
  map._earLastSignature = signature;
  drawRouteOnMap(map, r, { fit: mapTabRouteId !== r.id });
  mapTabRouteId = r.id;
}

// Keeps the selected route's chip visible in the horizontally scrolling
// picker — auto-selecting the first active route, or picking one far down
// a long list, otherwise leaves the highlighted chip off-screen with no
// hint that the map is showing anything at all.
let chipScrolledOnce = false;
function scrollActiveChipIntoView() {
  const chip = document.querySelector('[data-route-chip-active]');
  if (!chip) return;
  // The very first paint has nowhere to animate *from*, and a smooth scroll
  // there just looks like the row drifting on arrival.
  chip.scrollIntoView({ inline: 'center', block: 'nearest', behavior: chipScrolledOnce ? 'smooth' : 'auto' });
  chipScrolledOnce = true;
}

// ---------------------------------------------------------------------
// Route detail — pushed screen (stops only; the map lives in its own
// Karte tab now). Large-title collapse, back chevron, "..." overflow menu.
// ---------------------------------------------------------------------
function renderRouteDetail() {
  const r = state.currentRoute;
  const stops = r.stops;
  const firstOpenIdx = stops.findIndex(s => s.kind === 'customer' && !s.delivered);
  const progress = r.customer_count ? Math.round((r.delivered_count / r.customer_count) * 100) : 0;
  const doors = sameDoorGroups(stops);

  const stopRow = (s, i) => {
    const isNext = i === firstOpenIdx;
    const meta = stopKindMeta(s);

    if (meta) return renderFixedRow(s, meta, suppressRowAnim ? null : i);

    return renderCustomerRow(s, isNext, suppressRowAnim ? null : i, doors.get(s.id)?.length);
  };

  return `
    <div data-scroll class="flex-1 min-h-0 overflow-y-auto momentum" style="padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 3.75rem)">
      <div class="sticky top-0 z-20 bg-[#F2F2F7]/85 backdrop-blur-xl border-b border-black/10" style="padding-top: calc(env(safe-area-inset-top) + 0.5rem)">
        <div class="flex items-center gap-1 px-2 pb-2.5">
          <button onclick="closeDetail()" aria-label="Zurück zur Übersicht" title="Zurück" class="press-fade w-9 h-9 flex items-center justify-center text-brand-600 text-lg shrink-0">${ICONS.back}</button>
          <p data-compact-title class="compact-title flex-1 min-w-0 text-[15px] font-semibold text-center truncate px-1" style="opacity:0">${escapeHtml(r.name)}</p>
          <button onclick="openAddSheet()" aria-label="Stopp hinzufügen" title="Stopp hinzufügen" class="press-fade w-9 h-9 flex items-center justify-center text-brand-600 text-lg shrink-0">${ICONS.plus}</button>
          <div class="relative shrink-0">
            <button id="route-menu-btn" onclick="toggleRouteMenu()" aria-label="Weitere Aktionen" title="Weitere Aktionen" aria-haspopup="menu" aria-expanded="false" aria-controls="route-menu" class="press-fade w-9 h-9 flex items-center justify-center text-black/60 text-lg">${ICONS.kebab}</button>
            ${renderRouteMenu()}
          </div>
        </div>
      </div>

      <div class="px-4">
        <h1 data-large-title class="large-title text-[22px] font-bold tracking-tight pt-3 pb-1 truncate">${escapeHtml(r.name)}</h1>
        <p class="text-[13px] text-black/50 pb-3">${r.status === 'active' ? 'Aktiv' : 'Abgeschlossen'} · ${fmtDate(r.created_at)}</p>

        ${r.needs_optimize ? `
          <button onclick="manualOptimize()" class="press-98 w-full flex items-center justify-between gap-2 bg-warn/10 text-warnText text-[13px] font-semibold px-4 py-2.5 rounded-xl mb-3">
            <span class="flex items-center gap-1.5"><span class="flex">${ICONS.warning}</span>Route nicht aktuell</span>
            <span class="underline">Jetzt optimieren</span>
          </button>
        ` : ''}

        <button onclick="switchTab('map')" class="${CARD} w-full text-left px-4 py-3.5 flex items-center gap-3 mb-4">
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-baseline mb-1.5">
              <p data-delivered-count-text class="text-[15px] font-semibold">${r.delivered_count} / ${r.customer_count} zugestellt</p>
              <p class="text-[12px] text-black/50">≈ ${r.total_km} km · ${r.total_min} min</p>
            </div>
            <div class="h-1.5 bg-black/10 rounded-full overflow-hidden">
              <div data-progress-bar class="h-full bg-success transition-all duration-500" style="width: ${progress}%"></div>
            </div>
          </div>
          <span class="text-brand-600 shrink-0 flex items-center gap-1 text-[13px] font-medium">${ICONS.mapPin} Karte<span class="flex">${ICONS.chevron}</span></span>
        </button>

        <div data-next-stop-bar-slot>${nextStopBar(stops, firstOpenIdx)}</div>

        <div class="${GROUP}">
          ${stops.map(stopRow).join('')}
        </div>
      </div>
    </div>
  `;
}

// A route is 20–30 stops, and the one that matters is whichever is next.
// Partway through a shift that row is somewhere in the middle of a list
// the driver has to scroll and scan to find — every single time they come
// back to the app after a delivery. This puts it one tap away, and names
// the customer so it doubles as an answer to "who am I going to?" without
// scrolling at all. Hidden once everything is delivered, when there is no
// next stop to go to.
function nextStopBar(stops, firstOpenIdx) {
  if (firstOpenIdx < 0) return '';
  const next = stops[firstOpenIdx];
  return `
    <button onclick="scrollToNextStop()" class="press-98 w-full flex items-center gap-3 bg-brand-600 text-white rounded-2xl px-4 py-3 mb-4 shadow-sm text-left">
      <span class="w-8 h-8 shrink-0 rounded-full bg-white/20 flex items-center justify-center">${ICONS.mapPin}</span>
      <span class="flex-1 min-w-0">
        <span class="block text-[11px] font-semibold uppercase tracking-wide text-white/75">Nächster Stopp</span>
        <span class="block text-[15px] font-semibold truncate">${escapeHtml(next.kunde)}</span>
        <span class="block text-[12px] text-white/80 truncate">${escapeHtml(next.strasse)}, ${escapeHtml(next.plz)} Wien</span>
      </span>
      <span class="shrink-0 text-white/70 flex">${ICONS.chevron}</span>
    </button>
  `;
}

function scrollToNextStop() {
  const row = document.querySelector('[data-next-stop]');
  if (!row) return;
  row.scrollIntoView({ block: 'center', behavior: 'smooth' });
  // A brief highlight so the eye lands on the right row rather than on
  // wherever the scroll happened to stop.
  row.animate(
    [{ backgroundColor: 'rgba(237,22,57,0.22)' }, { backgroundColor: 'rgba(237,22,57,0)' }],
    { duration: 1200, easing: 'ease-out' }
  );
}

function closeRouteMenu() {
  document.getElementById('route-menu')?.classList.add('hidden');
  document.getElementById('route-menu-btn')?.setAttribute('aria-expanded', 'false');
}

function toggleRouteMenu() {
  const menu = document.getElementById('route-menu');
  if (!menu) return;
  const open = menu.classList.toggle('hidden') === false;
  document.getElementById('route-menu-btn')?.setAttribute('aria-expanded', String(open));
  // Move into the menu when it opens so a keyboard user lands on the first
  // action rather than having to tab through the rest of the header.
  if (open) menu.querySelector('button')?.focus();
}

function renderRouteMenu() {
  const r = state.currentRoute;
  // Every item closes the menu before running its action. Most end in a
  // render() that rebuilds the (hidden) menu anyway — but the ones that
  // open a confirm sheet first do not, so cancelling out of "Route
  // löschen?" used to leave the menu still hanging open over the route.
  const item = (onclick, iconSvg, label, danger) => `<button onclick="closeRouteMenu(); ${onclick}" role="menuitem" class="w-full flex items-center gap-3 text-left px-4 py-3 text-[15px] ${danger ? 'text-red-600' : ''} active:bg-black/5">
    <span class="w-5 flex shrink-0 ${danger ? 'text-red-600' : 'text-black/50'}">${iconSvg}</span>${label}
  </button>`;
  return `
    <div id="route-menu" role="menu" aria-label="Weitere Aktionen" class="hidden absolute right-0 top-10 w-56 bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl overflow-hidden z-30 divide-y divide-black/10">
      ${item("renderLadeliste()", ICONS.box, "Ladeliste")}
      ${item("renameRoute()", ICONS.pencil, "Umbenennen")}
      ${item("manualOptimize()", ICONS.compass, "Neu optimieren")}
      ${item("renderJsonForm();", ICONS.doc, "Als JSON bearbeiten")}
      ${item("resetDelivered()", ICONS.refresh, "Zustellungen zurücksetzen")}
      ${item("toggleRouteStatus()", ICONS.checkCircle, r.status === 'completed' ? 'Wieder aktivieren' : 'Route abschließen')}
      ${item("deleteRoute()", ICONS.trash, "Löschen", true)}
    </div>
  `;
}

// ---------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------
document.querySelectorAll('[data-logo-src]').forEach(img => img.src = APP_LOGO);

// ---------------------------------------------------------------------
// Zoom lock — the half of it that has to be JavaScript.
//
// `user-scalable=no` in the viewport meta is honored by Android/Chrome and
// has been ignored outright by iOS Safari since iOS 10, so on the platform
// this app mostly runs on these listeners *are* the mechanism. Safari
// reports a page pinch as its own `gesture*` events; cancelling those is
// what stops a stray two-finger touch leaving the app stuck at 1.4×.
//
// The map needs no exemption, and that is precisely why this is done with
// event handlers rather than a `touch-action: pan-x pan-y` blanket:
// MapLibre implements pinch and wheel zoom itself, from raw touch/wheel
// events, and never asks the browser to zoom. `preventDefault()` cancels
// the browser's default action without stopping propagation, so every one
// of these events still reaches MapLibre's own handlers intact. Pinching
// the map still zooms the map — it just no longer resizes the whole app
// around it at the same time.
//
// Not covered, because a page cannot: the desktop browser's own Ctrl/Cmd
// +/- keyboard zoom. That is browser chrome, it is not reachable from
// here, and it is not a gesture anyone hits by accident in a van.
// ---------------------------------------------------------------------
for (const gestureType of ['gesturestart', 'gesturechange', 'gestureend']) {
  document.addEventListener(gestureType, (e) => e.preventDefault(), { passive: false });
}
// A trackpad pinch (and Ctrl+scroll) arrives as a wheel event with ctrlKey
// set — the desktop equivalent of the above. MapLibre's own scroll zoom is
// plain-wheel and is unaffected either way.
document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

window.addEventListener('online', () => { toast('Wieder online', 'success'); refreshOnResume(); });
window.addEventListener('offline', () => toast('Keine Internetverbindung – Änderungen können nicht gespeichert werden.', 'error'));

document.addEventListener('visibilitychange', refreshOnResume);
// iOS restores a backgrounded standalone PWA from the back/forward cache,
// which in some versions skips visibilitychange entirely — pageshow is the
// event that always fires there.
window.addEventListener('pageshow', refreshOnResume);

document.addEventListener('click', (e) => {
  const menu = document.getElementById('route-menu');
  if (menu && !menu.classList.contains('hidden') && !e.target.closest('#route-menu') && !e.target.closest('#route-menu-btn')) {
    closeRouteMenu();
  }
});

// Top-level (not nested in the `if` block below) so `saveJsonEdits` can
// call `reloadForUpdateIfPending()` from wherever it's defined in the
// file — see the comments inside the `if` block for why this exists.
let reloadingForUpdate = false;
let reloadForUpdatePending = false;
function reloadForUpdateIfPending() {
  if (!reloadForUpdatePending || jsonSaveController || reloadingForUpdate) return;
  reloadForUpdatePending = false;
  reloadingForUpdate = true;
  window.location.reload();
}

// Not fully offline-capable — adding/editing a stop still calls Nominatim/
// Wien-OGD (geocoding) and OSRM (routing) live, and the map needs its
// vector tiles from OpenFreeMap. What this buys: the app shell and any
// already-visited page load instantly from cache and still work with no
// connection at all. See /sw.js (served straight off disk the same way as
// this file — src/main.rs).
// ---------------------------------------------------------------------
// Last-resort reporting.
//
// Everything this app does deliberately has its own error path — `api()`
// turns network failures into sentences, every action's `catch` toasts, and
// `render()` has a fallback screen. What's left is what nobody planned for:
// a listener that throws, a promise nobody awaited, a browser API behaving
// differently than expected. Those used to be entirely silent, which for a
// driver means "I tapped it and nothing happened" with nothing to report to
// anyone afterwards.
//
// Deliberately quiet about detail (a stack trace helps no one in a van) and
// rate-limited, because the failure mode that matters here is a loop: one
// broken thing firing every frame must not paper the screen in toasts.
let lastUnexpectedErrorAt = 0;
function reportUnexpectedError(what, detail) {
  console.error(what, detail);
  const now = Date.now();
  if (now - lastUnexpectedErrorAt < 10000) return;
  lastUnexpectedErrorAt = now;
  toast('Unerwarteter Fehler. Wenn etwas fehlt, bitte die App neu laden.', 'error');
}
window.addEventListener('error', (e) => reportUnexpectedError('uncaught error', e.error || e.message));
window.addEventListener('unhandledrejection', (e) => {
  // An aborted request is not a fault: `api()` aborts in-flight fetches on
  // timeout and on deliberate cancel, and both are already reported by
  // whoever started them.
  if (e.reason?.code === 'aborted' || e.reason?.name === 'AbortError') return;
  reportUnexpectedError('unhandled rejection', e.reason);
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });

  // A deployed update installs and takes over immediately (the worker calls
  // skipWaiting/clients.claim), but the *page* keeps running whatever
  // JavaScript it started with. That leaves an old app talking to a new
  // server for as long as the driver keeps the tab open — which for an
  // installed PWA is days. Reloading once when control changes hands puts
  // the two back in step.
  //
  // The flag is the whole safety of this: a reload that itself triggers
  // another controllerchange would loop forever, and a reload loop on a
  // delivery app in the field is far worse than a stale tab.
  //
  // Only when a worker *replaces* another one. On a first-ever visit the
  // page starts with no controller at all, and the freshly installed worker
  // claiming it also fires `controllerchange` — reloading there would mean
  // every new install, and every visit after the caches are cleared, paying
  // a pointless second page load. There is nothing stale to correct in that
  // case: the JavaScript running *is* the JavaScript that was just fetched.
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloadingForUpdate) return;
    // Not during a save: an import can legitimately run for minutes, and a
    // reload mid-request abandons it with no way to know what landed. The
    // reload isn't dropped, only deferred — `saveJsonEdits`'s `finally`
    // calls `reloadForUpdateIfPending()` the moment the save settles, so a
    // deploy landing mid-import still gets picked up instead of leaving
    // this tab running stale JavaScript against a new server indefinitely
    // (which, for an installed PWA a driver might not close for days, is a
    // real gap — not just a theoretical one).
    if (jsonSaveController) {
      reloadForUpdatePending = true;
      return;
    }
    reloadingForUpdate = true;
    window.location.reload();
  });
}

loadRoutes();
</script>
</body>
</html>
