<script>
  // The ASBÖ logo (Arbeiter-Samariter-Bund Österreichs) is served
  // from disk as /icon.png (see src/main.rs) — reused for the favicon,
  // apple-touch-icon, the inline manifest's icon and the in-app
  // header/empty-states, all via this one constant.
  const APP_LOGO = "/icon.png";
  const MANIFEST = {
    name: "EAR Routing – Essen auf Rädern",
    short_name: "EAR Routing",
    description: "Routenplanung für Essen auf Rädern – Arbeiter-Samariter-Bund Österreichs",
    start_url: "/",
    scope: "/",
    display: "standalone",
    orientation: "portrait",
    background_color: "#F2F2F7",
    theme_color: "#F2F2F7",
    icons: [
      { src: APP_LOGO, sizes: "512x512", type: "image/png", purpose: "any" },
      { src: APP_LOGO, sizes: "512x512", type: "image/png", purpose: "maskable" },
    ],
  };
  // Appended to <head> directly rather than via document.write(): same
  // result, but document.write is blocked outright in a few contexts a PWA
  // can legitimately end up in (a parser-inserted async script, some
  // in-app browsers) and would silently take the icons and the manifest —
  // i.e. "add to home screen" itself — down with it.
  const head = document.head;
  const addTag = (tag, attrs) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    head.appendChild(el);
  };
  addTag('link', { rel: 'icon', type: 'image/png', href: APP_LOGO });
  addTag('link', { rel: 'apple-touch-icon', href: APP_LOGO });
  addTag('link', {
    rel: 'manifest',
    href: 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(MANIFEST)),
  });
  addTag('meta', { name: 'apple-mobile-web-app-status-bar-style', content: 'default' });
</script>

<style>
  /* `dvh` is unreliable specifically inside an iOS home-screen standalone
     launch (it can resolve smaller than the true screen, exposing the
     WKWebView's default black canvas above/below the content). #app is
     therefore pinned with `position: fixed; inset: 0` (resolved against the
     UA's viewport directly, not the `dvh` custom unit) instead of a
     `height: 100dvh` — see the #app element below. html/body just need a
     matching background as a fallback so any edge-case gap reads as the
     app's own color instead of stray black. */
  /* No text selection anywhere by default — a delivery app isn't a
     document, and the native iOS/Android selection handles + callout
     menu popping up on every long-press read as "web page", not "app".
     Form fields are excluded (see below) so typing/editing still works. */
  html, body {
    height: 100%; overflow: hidden; overscroll-behavior-y: none; background: #F2F2F7;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* NOTE: safe-area padding is applied via inline style="padding-top: calc(env(...) + Nrem)"
     at each call site, not a shared class. The Tailwind CDN script injects its utility
     stylesheet *after* this one, so a `.safe-top { padding-top: env(...) }` class sharing
     the `padding-top` property with a Tailwind class like `.pt-6` on the same element loses
     the cascade and silently gets overridden — inline styles always win regardless of
     injection order, which is what actually keeps content out of the iOS notch/Dynamic Island. */
  ::-webkit-scrollbar { display: none; }
  * { -webkit-tap-highlight-color: transparent; }
  input, textarea, [contenteditable="true"] {
    -webkit-user-select: text; user-select: text; -webkit-touch-callout: default;

  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
  @keyframes popIn { from { opacity: 0; transform: scale(.92) } to { opacity: 1; transform: scale(1) } }

  .toast-enter { animation: toastIn .25s cubic-bezier(.32,.72,0,1); }

     load-bearing, not decorative: MapLibre's internal canvas/marker/popup
     layers carry their own z-index stack, and without a new stacking
     context on the map container those internal z-indices compare
     directly against the rest of the page — a marker/popup can end up
     painting *above* a sibling dropdown or nav bar that has a nominally
     higher Tailwind z-index but lives in a different, unisolated stacking

  #route-map, #pin-map { background: #e5e3df; }

async function api(path, options = {}) {
  const res = await fetch('/api' + path, {
    // Only declare a JSON body when there actually is one — a
    // Content-Type on a bodyless GET/DELETE is meaningless and is exactly
    // the kind of header that turns a same-origin request into a
    // preflighted one behind some proxies.
    headers: options.body ? { 'Content-Type': 'application/json' } : {},
    ...options,
  });
  if (!res.ok) {
    let msg = 'Ein Fehler ist aufgetreten.';
    let code = null;
    try {
      const data = await res.json();
      if (data.detail && typeof data.detail === 'object') {
        msg = data.detail.message || msg;
        code = data.detail.code || null;
      } else if (data.detail) {
        msg = data.detail;
      }
    } catch (_) {}
    const err = new Error(msg);
    err.code = code;
    throw err;
  }
  return res.json();
}

// ---------------------------------------------------------------------
// In-flight indicator — a thin top progress bar (nprogress/YouTube-style),
// never a full-screen blocking modal. The app stays visible and tappable
// while a request is in flight instead of a "page reload"-style dimmed
// takeover; a small pill under the bar carries a short status message only
// for the handful of actions where the driver genuinely needs to read one
// (e.g. the JSON bulk-import's "don't close" warning). `depth` makes this
// safe for overlapping calls — the bar only actually hides once every
// caller that asked for it has finished, so one action finishing early
// can't yank the indicator out from under a still-running one.
// ---------------------------------------------------------------------
let progressDepth = 0;

function showProgress(label) {
  progressDepth++;
  const bar = document.getElementById('progress-bar');
  bar.style.transition = 'none';
  bar.style.opacity = '1';
  bar.style.transform = 'scaleX(0.08)';
  void bar.offsetWidth; // force reflow so the slow transition below starts from scaleX(0.08), not skips straight to the target
  bar.style.transition = 'transform 6s cubic-bezier(.15,.8,.4,1), opacity .2s';
  bar.style.transform = 'scaleX(0.75)';

  if (label) {
    document.getElementById('progress-pill-text').textContent = label;
    document.getElementById('progress-pill-wrap').classList.remove('hidden');
  }
}

function hideProgress() {
  progressDepth = Math.max(0, progressDepth - 1);
  if (progressDepth > 0) return; // another caller is still in flight
  const bar = document.getElementById('progress-bar');
  bar.style.transition = 'transform .25s ease-out';
  bar.style.transform = 'scaleX(1)';
  setTimeout(() => {
    bar.style.transition = 'opacity .2s';
    bar.style.opacity = '0';
    setTimeout(() => { bar.style.transform = 'scaleX(0)'; }, 200);
  }, 150);
  document.getElementById('progress-pill-wrap').classList.add('hidden');
}

function toast(message, type = 'info', durationMs = 3800) {
  const colors = {
    info: 'bg-white/95 text-black',
    error: 'bg-red-50/95 text-red-700',
    success: 'bg-emerald-50/95 text-emerald-700',
  };
  const el = document.createElement('div');
  el.className = `toast-enter pointer-events-auto max-w-sm w-full backdrop-blur-xl border border-black/5 ${colors[type] || colors.info} rounded-2xl px-4 py-3 text-sm font-medium shadow-xl`;
  el.textContent = message;
  document.getElementById('toast-container').appendChild(el);
  if (navigator.vibrate && type === 'error') navigator.vibrate(30);
  setTimeout(() => { el.style.transition = 'opacity .3s, transform .3s'; el.style.opacity = '0'; el.style.transform = 'translateY(-8px)'; setTimeout(() => el.remove(), 300); }, durationMs);
}

// ---------------------------------------------------------------------
// Native-feeling alert/confirm/prompt sheets — replace window.alert/
// confirm/prompt (an ugly, non-brandable OS dialog) with in-app
// UIAlertController-styled equivalents: centered card, hairline-separated
// button row, brand-tinted default action, red destructive action. Still
// just resolve a Promise, so call sites read almost like the built-ins
// they replace.
// ---------------------------------------------------------------------
function closeAlert() {
  document.getElementById('modal-root').innerHTML = '';
}

function confirmSheet({ title, message, confirmLabel = 'Bestätigen', cancelLabel = 'Abbrechen', danger = false }) {
  return new Promise((resolve) => {
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="fixed inset-0 z-[60] flex items-center justify-center px-6">
        <div class="sheet-backdrop absolute inset-0 bg-black/30" data-cancel></div>
        <div class="alert-panel relative w-full max-w-[300px] bg-white/95 backdrop-blur-xl border border-black/5 rounded-2xl overflow-hidden shadow-2xl text-center">
          <div class="px-5 pt-5 pb-4">
            <h3 class="font-semibold text-[15px]">${escapeHtml(title)}</h3>
            ${message ? `<p class="text-[13px] text-black/60 mt-1.5 leading-snug">${escapeHtml(message)}</p>` : ''}
          </div>
          <div class="grid grid-cols-2 border-t border-black/10">
            <button data-cancel class="press-98 py-3 text-[15px] font-medium text-black/70 border-r border-black/10">${escapeHtml(cancelLabel)}</button>
            <button data-confirm class="press-98 py-3 text-[15px] font-semibold ${danger ? 'text-red-600' : 'text-brand-600'}">${escapeHtml(confirmLabel)}</button>
          </div>
        </div>
      </div>
    `;
    root.querySelectorAll('[data-cancel]').forEach(el => el.addEventListener('click', () => { closeAlert(); resolve(false); }));
    root.querySelector('[data-confirm]').addEventListener('click', () => { closeAlert(); resolve(true); });
  });
}

function promptSheet({ title, message, placeholder = '', initial = '', confirmLabel = 'Speichern', cancelLabel = 'Abbrechen' }) {
  return new Promise((resolve) => {
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="fixed inset-0 z-[60] flex items-center justify-center px-6">
        <div class="sheet-backdrop absolute inset-0 bg-black/30" data-cancel></div>
        <div class="alert-panel relative w-full max-w-[300px] bg-white/95 backdrop-blur-xl border border-black/5 rounded-2xl overflow-hidden shadow-2xl text-center">
          <div class="px-5 pt-5 pb-4">
            <h3 class="font-semibold text-[15px]">${escapeHtml(title)}</h3>
            ${message ? `<p class="text-[13px] text-black/60 mt-1 mb-3 leading-snug">${escapeHtml(message)}</p>` : '<div class="mt-3"></div>'}
            <input data-input value="${escapeAttr(initial)}" placeholder="${escapeAttr(placeholder)}" class="w-full bg-black/5 rounded-lg px-3 py-2 text-[15px] text-center focus:outline-none focus:ring-2 focus:ring-brand-600" />
          </div>
          <div class="grid grid-cols-2 border-t border-black/10">
            <button data-cancel class="press-98 py-3 text-[15px] font-medium text-black/70 border-r border-black/10">${escapeHtml(cancelLabel)}</button>
            <button data-confirm class="press-98 py-3 text-[15px] font-semibold text-brand-600">${escapeHtml(confirmLabel)}</button>
          </div>
        </div>
      </div>
    `;
    const input = root.querySelector('[data-input]');
    setTimeout(() => { input.focus(); input.select(); }, 80);
    // Resolves `null` only for a real cancel, and the (possibly empty)
    // string for a confirm — collapsing "" into null would make submitting
    // a blank field indistinguishable from backing out, which is why
    // accepting the suggested default route name by just tapping
    // "Speichern" used to silently do nothing.
    const submit = () => { const v = input.value; closeAlert(); resolve(v); };
    root.querySelectorAll('[data-cancel]').forEach(el => el.addEventListener('click', () => { closeAlert(); resolve(null); }));
    root.querySelector('[data-confirm]').addEventListener('click', submit);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  });
}

// ---------------------------------------------------------------------
// Maps link (platform-aware) — deep-links with the plain address, not
// coordinates, so the phone's own Maps app does its own (usually better)
// geocoding/routing to the door.
// ---------------------------------------------------------------------
function mapsUrl(address) {
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const encAddr = encodeURIComponent(address || '');
  if (isIOS) return `https://maps.apple.com/?daddr=${encAddr}&dirflg=d`;
  return `https://www.google.com/maps/dir/?api=1&destination=${encAddr}&travelmode=driving`;
}

// ---------------------------------------------------------------------
// Navigation — tab switching + the single shared "route in focus" that the
// Karte tab visualizes and Routen/Mehr can push a detail screen for. See
// the `state` doc comment above for the full model. `detailOrigin` must
// never be set to 'map' — that's a real tab id, and `render()`'s
// `detailOrigin === state.tab` check would then wrongly treat "picked in
// the map's own route picker" as "push the stops-list detail screen over
// the map". `null` is the correct value for "in focus, but no tab has a
// pushed detail for it".
// ---------------------------------------------------------------------
function switchTab(tab) {
  state.tab = tab;
  render();
}

// Every route-list screen (Routen/Verlauf) reads from `state.routes`, a
// separate array of lightweight summaries fetched once via loadRoutes() —
// it does NOT automatically pick up changes made to `state.currentRoute`
// (rename, status toggle, a stop delivered/added/removed all shift
// customer_count/delivered_count/needs_optimize). Call this right after
// every `state.currentRoute = await api(...)` assignment so the list a
// driver lands back on is never showing stale counts/name/status — cheaper
// than a full loadRoutes() network round-trip on every single mutation.
function syncRouteSummary() {
  const r = state.currentRoute;
  if (!r) return;
  const summary = {
    id: r.id, name: r.name, status: r.status, created_at: r.created_at,
    completed_at: r.completed_at, customer_count: r.customer_count,
    delivered_count: r.delivered_count, needs_optimize: r.needs_optimize,
  };
  const idx = state.routes.findIndex(x => x.id === r.id);
  if (idx === -1) state.routes.unshift(summary); else state.routes[idx] = summary;
}

// Both openRoute (tapping a route in a list) and selectMapRoute (the Karte
// tab's picker) fetch a route by id and land it in state.currentRoute — the
// single most routine action in the app, and the easiest to fire twice in
// a row (tap one route, then quickly tap a different one before the first
// finishes loading). Network responses aren't guaranteed to arrive in the
// order they were sent, so without this guard the *first* tap's slower
// response could land last and silently switch the driver back to a route
// they already navigated away from. Both share `latestRouteRequestId` so
// they also correctly supersede each other, not just themselves.
let latestRouteRequestId = null;

async function openRoute(id) {
  latestRouteRequestId = id;
  showProgress();
  try {
    const route = await api(`/routes/${id}`);
    if (latestRouteRequestId !== id) return;
    state.currentRoute = route;
    syncRouteSummary();
    state.detailOrigin = state.tab;
    render();
  } catch (err) {
    if (latestRouteRequestId === id) toast(err.message || 'Route konnte nicht geladen werden.', 'error');
  } finally {
    hideProgress();
  }
}

function closeDetail() {
  state.currentRoute = null;
  state.detailOrigin = null;
  render();
}

async function selectMapRoute(id) {
  latestRouteRequestId = id;
  showProgress();
  try {
    const route = await api(`/routes/${id}`);
    if (latestRouteRequestId !== id) return;
    state.currentRoute = route;
    syncRouteSummary();
    state.detailOrigin = null;
    render();
  } catch (err) {
    if (latestRouteRequestId === id) toast(err.message || 'Route konnte nicht geladen werden.', 'error');
  } finally {
    hideProgress();
  }
}

function openCurrentRouteDetail() {
  if (!state.currentRoute) return;
  state.tab = state.currentRoute.status === 'completed' ? 'verlauf' : 'routes';
  state.detailOrigin = state.tab;
  render();
}

// ---------------------------------------------------------------------
// Data loading
// ---------------------------------------------------------------------
async function loadRoutes() {
  try {
    state.routes = await api('/routes');
    render();
  } catch (err) {
    toast(err.message || 'Routen konnten nicht geladen werden.', 'error');
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="px-6 pt-28 text-center text-black/50">
        <p class="text-sm mb-4">Verbindung zum Server fehlgeschlagen.</p>
        <button onclick="loadRoutes()" class="press-98 px-5 py-3 rounded-xl bg-brand-600 font-semibold text-white text-sm">Erneut versuchen</button>
      </div>
    `;
  } finally {
    hideSplash();
  }
}

function hideSplash() {
  const el = document.getElementById('splash');
  if (!el) return;
  el.style.transition = 'opacity .3s ease-out';
  el.style.opacity = '0';
  setTimeout(() => el.remove(), 320);
}

async function refreshCurrentRoute(promise) {
  // Guards against the driver navigating to a *different* route while this
  // request is still in flight — without this, a slow delete/optimize call
  // for route A could resolve after the driver has already opened route B
  // and silently stomp the screen with A's stale data (same class of race
  // toggleDelivered already guards against).
  const routeId = state.currentRoute?.id;
  showProgress();
  try {
    const updated = await promise;
    if (state.currentRoute?.id !== routeId) return;
    state.currentRoute = updated;
    syncRouteSummary();
    render();
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

// ---------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------
async function createRoute() {
  const name = await promptSheet({ title: 'Neue Route', message: 'Name (z. B. Kundenname, Bezirk, Tour):', placeholder: `Route ${new Date().toLocaleDateString('de-AT')}` });
  if (name === null) return;
  showProgress();
  try {
    // Left blank on purpose = "use the default name" — the server fills in
    // "Route <heutiges Datum>" for an omitted name.
    const body = name.trim() ? { name: name.trim() } : {};
    const route = await api('/routes', { method: 'POST', body: JSON.stringify(body) });
    state.currentRoute = route;
    syncRouteSummary();
    state.detailOrigin = 'routes';
    state.tab = 'routes';
    render();
    if (navigator.vibrate) navigator.vibrate(15);
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

async function submitStop(form, stopId) {
  const kunde = form.kunde.value.trim();
  const strasse = form.strasse.value.trim();
  const plz = form.plz.value.trim();
  const paket = form.paket.value.trim();
  const notiz = form.notiz.value.trim();
  if (!kunde || !strasse || !plz) { toast('Bitte Kunde, Straße und Bezirk ausfüllen.', 'error'); return; }

  lastUsedPlz = plz;
  const data = { kunde, strasse, plz, paket, notiz, stopId };
  closeSheet();
  await sendStop(data);
}

async function sendStop(data, coords) {
  // Geocoding can take well over a second — captures the route this stop
  // was meant for so a driver who's since navigated to a different route
  // doesn't get that route's screen silently overwritten (or, on failure,
  // a pin-drop sheet popped open for a route they're no longer looking at)
  // once this finally resolves.
  // The pin-drop sheet can outlive the route it was opened for (the driver
  // is free to close it and navigate away, then come back and confirm the
  // pin), so this genuinely can run with no route in focus.
  if (!state.currentRoute) { toast('Keine Route ausgewählt.', 'error'); return; }
  const routeId = state.currentRoute.id;
  const payload = { kunde: data.kunde, strasse: data.strasse, plz: data.plz, paket: data.paket, notiz: data.notiz };
  if (coords) { payload.lat = coords.lat; payload.lon = coords.lon; }
  const body = JSON.stringify(payload);

  showProgress(data.stopId ? 'Adresse wird aktualisiert …' : 'Stopp wird hinzugefügt …');
  try {
    const updated = data.stopId
      ? await api(`/stops/${data.stopId}`, { method: 'PATCH', body })
      : await api(`/routes/${routeId}/stops`, { method: 'POST', body });
    if (state.currentRoute?.id !== routeId) return;
    state.currentRoute = updated;
    syncRouteSummary();
    render();
    if (navigator.vibrate) navigator.vibrate(15);
    if (coords) toast('Standort manuell gesetzt ✓', 'success');
    else toast(data.stopId ? 'Stopp aktualisiert ✓' : 'Stopp hinzugefügt ✓', 'success');
  } catch (err) {
    if (!coords && (err.code === 'address_not_found' || err.code === 'geocode_unavailable') && state.currentRoute?.id === routeId) {
      openPinDropSheet(data);
      return;
    }
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

// Optimistic — the delivered-toggle is the single most-tapped action in
// the app, so it flips instantly instead of waiting on a network
// round-trip, then reconciles with the server response in the background.
// Safe to predict: toggling delivered never reorders stops or changes
// route geometry (see update_stop in src/main.rs), only the flag itself
// and delivered_count move. Reverts precisely on failure; guards against
// the driver having navigated to a different route before the response
// lands, so a slow/failed request can never stomp whatever's on screen by
// then.
async function toggleDelivered(stopId, delivered) {
  const route = state.currentRoute;
  if (!route) return;
  const stop = route.stops.find((s) => s.id === stopId);
  if (!stop) return;

  const prevDelivered = stop.delivered;
  const prevDeliveredCount = route.delivered_count;
  stop.delivered = delivered;
  route.delivered_count += delivered ? 1 : -1;
  render(true);
  if (navigator.vibrate) navigator.vibrate(delivered ? [12, 40, 12] : 12);

  try {
    const updated = await api(`/stops/${stopId}`, { method: 'PATCH', body: JSON.stringify({ delivered }) });
    if (state.currentRoute?.id !== route.id) return;
    state.currentRoute = updated;
    syncRouteSummary();
    render(true);
  } catch (err) {
    if (state.currentRoute?.id === route.id) {
      stop.delivered = prevDelivered;
      route.delivered_count = prevDeliveredCount;
      render(true);
    }
    toast(err.message, 'error');
  }
}

// NOTE for call sites: the confirm dialog and the bottom sheets share one
// `#modal-root`, so anything that calls this from inside an open sheet has
// to `closeSheet()` *first*. Calling it after (`deleteStop(id);
// closeSheet();`) wipes the confirm dialog this function is still awaiting
// out of the DOM the moment it appears — the promise then never settles
// and the stop is never deleted.
async function deleteStop(stopId) {
  const ok = await confirmSheet({ title: 'Stopp löschen?', message: 'Dieser Kundenstopp wird endgültig entfernt.', confirmLabel: 'Löschen', danger: true });
  if (!ok) return;
  await refreshCurrentRoute(api(`/stops/${stopId}`, { method: 'DELETE' }));
}

// Each of these captures the route's id *before* its confirm/prompt sheet
// (and then the network request) resolves, and checks it again afterward —
// the driver is free to close the sheet/navigate to a different route
// while either is pending, and without the check a slow response could
// silently overwrite (or, for deleteRoute, close) whatever route they've
// since navigated to instead of the one this action was actually for.
async function renameRoute() {
  const routeId = state.currentRoute.id;
  const name = await promptSheet({ title: 'Route umbenennen', initial: state.currentRoute.name });
  if (name === null) return;
  if (!name.trim()) { toast('Name darf nicht leer sein.', 'error'); return; }
  try {
    const updated = await api(`/routes/${routeId}`, { method: 'PATCH', body: JSON.stringify({ name: name.trim() }) });
    if (state.currentRoute?.id !== routeId) return;
    state.currentRoute = updated;
    syncRouteSummary();
    render();
  } catch (err) { toast(err.message, 'error'); }
}

async function resetDelivered() {
  const routeId = state.currentRoute.id;
  const ok = await confirmSheet({ title: 'Zustellungen zurücksetzen?', message: 'Alle Häkchen dieser Route werden entfernt. Adressen und Reihenfolge bleiben erhalten.', confirmLabel: 'Zurücksetzen' });
  if (!ok) return;
  showProgress();
  try {
    const updated = await api(`/routes/${routeId}/reset-delivered`, { method: 'POST' });
    if (state.currentRoute?.id !== routeId) return;
    state.currentRoute = updated;
    syncRouteSummary();
    render();
    toast('Zustellungen zurückgesetzt ✓', 'success');
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    hideProgress();
  }
}

async function toggleRouteStatus() {
  const routeId = state.currentRoute.id;
  const newStatus = state.currentRoute.status === 'completed' ? 'active' : 'completed';
  const ok = await confirmSheet({
    title: newStatus === 'completed' ? 'Route abschließen?' : 'Route reaktivieren?',
    message: `„${state.currentRoute.name}" ${newStatus === 'completed' ? 'als abgeschlossen markieren.' : 'wieder als aktiv markieren.'}`,
    confirmLabel: newStatus === 'completed' ? 'Abschließen' : 'Reaktivieren',
  });
  if (!ok) return;
  try {
    const updated = await api(`/routes/${routeId}`, { method: 'PATCH', body: JSON.stringify({ status: newStatus }) });
    if (state.currentRoute?.id !== routeId) return;
    state.currentRoute = updated;
    syncRouteSummary();
    state.tab = newStatus === 'completed' ? 'verlauf' : 'routes';
    state.detailOrigin = state.tab;
    render();
    toast(newStatus === 'completed' ? 'Route abgeschlossen ✓' : 'Route wieder aktiv ✓', 'success');
  } catch (err) { toast(err.message, 'error'); }
}

async function deleteRoute() {
  const routeId = state.currentRoute.id;
  const ok = await confirmSheet({ title: 'Route löschen?', message: `„${state.currentRoute.name}" wird mit allen Stopps endgültig gelöscht. Das kann nicht rückgängig gemacht werden.`, confirmLabel: 'Löschen', danger: true });
  if (!ok) return;
  try {
    await api(`/routes/${routeId}`, { method: 'DELETE' });
    await loadRoutes();
    if (state.currentRoute?.id === routeId) closeDetail();
  } catch (err) { toast(err.message, 'error'); }
}

async function manualOptimize() {
  await refreshCurrentRoute(api(`/routes/${state.currentRoute.id}/optimize`, { method: 'POST' }));
}

async function clearOfflineCache() {
  const ok = await confirmSheet({ title: 'Offline-Daten leeren?', message: 'Zwischengespeicherte Kartenkacheln und App-Dateien werden gelöscht und beim nächsten Öffnen neu geladen.', confirmLabel: 'Leeren' });
  if (!ok) return;
  try {
    const names = await caches.keys();
    await Promise.all(names.map((n) => caches.delete(n)));
    toast('Offline-Daten geleert ✓', 'success');
  } catch (_) {
    toast('Offline-Daten konnten nicht geleert werden.', 'error');
  }
}

// bearbeiten") — see update_route_from_json in src/main.rs — not offered
// here too, so there's exactly one place to reach for each: "+" always
// means "one stop", "..." always means "the whole route".
// ---------------------------------------------------------------------
const EXAMPLE_CUSTOMER_STOP = {
  kunde: 'BEISPIEL – Fam. Mustermann',
  strasse: 'Beispielgasse 12',
  plz: '1190',
  paket: '1x Mittagsmenü',
  notiz: 'Bitte klingeln, 2. Stock',
};
function stopToCustomerJson(s) {

}

function openAddSheet(stop) {

// ---------------------------------------------------------------------
// Stop row press handling — tapping a stop row used to open the edit
// sheet immediately, which meant a stray tap while scrolling/scanning
// the list could yank the driver into an edit form. Editing now needs a
// deliberate hold (touch) or right-click (desktop, via oncontextmenu);
// a plain tap does nothing. Only a real drag (finger moves more than a
// few px — scrolling the list) cancels the hold; a finger is never
// perfectly still, so cancelling on any movement at all meant the hold
// almost never survived long enough to fire on a real touchscreen.
// ---------------------------------------------------------------------
let stopPressTimer = null;
let stopPressEl = null;
let stopPressStart = null;
let lastTouchTime = 0;

function getStop(stopOrId) {
  if (typeof stopOrId === 'object' && stopOrId !== null) return stopOrId;
  const numId = Number(stopOrId);
  return state.currentRoute?.stops?.find(s => s.id === numId);
}

function stopLongPressStart(e, stopOrId) {
  if (e.type === 'touchstart') {
    lastTouchTime = Date.now();
  } else if (e.type === 'mousedown') {
    if (e.button !== 0) return;
    if (Date.now() - lastTouchTime < 500) return;
  }
  clearTimeout(stopPressTimer);
  const stop = getStop(stopOrId);
  if (!stop) return;
  stopPressEl = e.currentTarget;
  const t = e.touches ? e.touches[0] : e;
  stopPressStart = { x: t.clientX, y: t.clientY };
  stopPressEl.classList.add('opacity-60');
  stopPressTimer = setTimeout(() => {
    stopPressEl?.classList.remove('opacity-60');
    stopPressTimer = null;
    if (navigator.vibrate) navigator.vibrate(10);
    openAddSheet(stop);
  }, 450);
}

function stopLongPressMove(e) {
  if (!stopPressTimer || !stopPressStart) return;
  const t = e.touches ? e.touches[0] : e;
  const dx = t.clientX - stopPressStart.x;
  const dy = t.clientY - stopPressStart.y;
  if (Math.hypot(dx, dy) > 12) stopLongPressEnd();
}

function stopLongPressEnd() {
  clearTimeout(stopPressTimer);
  stopPressEl?.classList.remove('opacity-60');
  stopPressTimer = null;
  stopPressEl = null;
  stopPressStart = null;
}

function stopLongPressContext(e, stopOrId) {
  e.preventDefault();
  const stop = getStop(stopOrId);
  if (!stop) return;
  stopLongPressEnd();
  openAddSheet(stop);
}

const FIELD = 'mt-1 w-full bg-white rounded-xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-brand-600';
const LABEL = 'text-[13px] font-medium text-black/50';

function renderManualForm(stop) {
  const isEdit = !!stop?.id;
  const defaultPlz = stop?.plz || (isEdit ? '' : lastUsedPlz) || '';

  renderSheetShell(`
    <h2 class="text-[22px] font-bold mb-4">${isEdit ? 'Stopp bearbeiten' : 'Neuer Stopp'}</h2>
    <form id="stop-form" class="space-y-3 pb-2">
      <div>
        <label class="${LABEL}">Kunde</label>
        <input name="kunde" required autocomplete="off" value="${escapeAttr(stop?.kunde || '')}" placeholder="z.B. Fam. Gruber" class="${FIELD}" />
      </div>
      <div>
        <label class="${LABEL}">Straße &amp; Hausnummer</label>
        <input name="strasse" required autocomplete="off" value="${escapeAttr(stop?.strasse || '')}" placeholder="z.B. Favoritenstraße 45 (Adresse einfügen geht auch)" class="${FIELD}" />
      </div>
      <div>
        <label class="${LABEL}">Bezirk</label>
        <select name="plz" required class="${FIELD}">
          <option value="" disabled ${!defaultPlz ? 'selected' : ''}>Bezirk wählen …</option>
          ${VIENNA_DISTRICTS.map(d => `<option value="${d.plz}" ${defaultPlz === d.plz ? 'selected' : ''}>${d.bezirk}. Bezirk – ${d.name} (${d.plz})</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="${LABEL}">Paket</label>
        <input name="paket" autocomplete="off" value="${escapeAttr(stop?.paket || '')}" placeholder="z.B. 2 Pakete, 1x Kühlware" class="${FIELD}" />
      </div>
      <div>
        <label class="${LABEL}">Notiz</label>
        <textarea name="notiz" rows="2" placeholder="z.B. persönlich übergeben, Lift im Hof, Code 1234" class="${FIELD} resize-none">${escapeHtml(stop?.notiz || '')}</textarea>
      </div>
      <div class="flex gap-3 pt-2">
        ${isEdit ? `<button type="button" onclick="closeSheet(); deleteStop(${stop.id});" class="press-98 px-4 py-3 rounded-xl bg-red-50 text-red-600 font-semibold">Löschen</button>` : ''}
        <button type="submit" class="press-98 flex-1 py-3 rounded-xl bg-brand-600 font-semibold text-white">${isEdit ? 'Speichern' : 'Hinzufügen & Optimieren'}</button>
      </div>
    </form>
  `);

  const form = document.getElementById('stop-form');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    submitStop(e.target, stop?.id);
  });

  // Paste a full address ("Clementinengasse 11, 1150 Wien") straight from a
  // chat/SMS into the Straße field: pull the district PLZ out of it and
  // select it automatically instead of making the driver do it by hand.
  const strasseInput = form.strasse;
  const plzSelect = form.plz;
  strasseInput.addEventListener('input', (e) => {
    if (e.inputType !== 'insertFromPaste') return;
    autoFillDistrictFromText(strasseInput, plzSelect);
  });
  strasseInput.addEventListener('blur', () => autoFillDistrictFromText(strasseInput, plzSelect));
}

function autoFillDistrictFromText(strasseInput, plzSelect) {
  const match = strasseInput.value.match(/\b1\d{3}\b/);
  if (!match || !DISTRICT_BY_PLZ[match[0]]) return;
  plzSelect.value = match[0];
  let cleaned = strasseInput.value.replace(match[0], '');
  cleaned = cleaned.replace(/,?\s*(wien|austria|österreich)\.?/gi, '');
  cleaned = cleaned.replace(/,\s*,/g, ',').replace(/,\s*$/, '').replace(/\s{2,}/g, ' ').trim();
  strasseInput.value = cleaned;
}

async function copyJsonToClipboard() {
  const editor = document.getElementById('json-editor');
  if (!editor) return;
  try {
    await navigator.clipboard.writeText(editor.value);
    toast('JSON kopiert ✓', 'success');
  } catch (_) {
    toast('Kopieren nicht möglich – bitte im Feld manuell markieren.', 'error');
  }
}

async function pasteIntoJsonEditor() {
  const editor = document.getElementById('json-editor');
  if (!editor) return;
  try {
    const text = await navigator.clipboard.readText();
    if (!text) { toast('Zwischenablage ist leer.', 'error'); return; }
    editor.value = text;
    editor.focus();
    toast('Eingefügt ✓', 'success');
  } catch (_) {
    toast('Einfügen aus Zwischenablage nicht möglich – bitte manuell ins Feld einfügen (lange drücken → Einfügen).', 'error');
  }
}

function clearJsonEditor() {
  const editor = document.getElementById('json-editor');
  if (!editor) return;
  editor.value = '[]';
  editor.focus();
}

// Disables every control in the JSON sheet (including the backdrop, so a
// stray tap can't dismiss it) while the bulk-import request is in flight —
// now that there's no full-screen blocking modal to physically stop a
// second tap, this is what actually prevents a double-submit or the sheet
// being closed mid-save (this endpoint can legitimately run for a minute
// or more against Nominatim's rate limit).
function setJsonSheetBusy(busy) {
  const root = document.getElementById('modal-root');
  root.querySelectorAll('button, textarea').forEach((el) => { el.disabled = busy; });
  const backdrop = document.getElementById('sheet-backdrop');
  if (backdrop) backdrop.style.pointerEvents = busy ? 'none' : '';
  const saveBtn = document.getElementById('json-save-btn');
  if (saveBtn) saveBtn.textContent = busy ? 'Wird gespeichert …' : 'Speichern & Optimieren';
}

async function saveJsonEdits() {
  const editor = document.getElementById('json-editor');
  if (!editor || !state.currentRoute) return;
  let parsed;
  try {
    parsed = JSON.parse(editor.value);
  } catch (err) {
    toast('Ungültiges JSON: ' + err.message, 'error');
    return;
  }
  if (!Array.isArray(parsed)) {
    toast('Erwarte eine Liste von Kundenstopps ([...]).', 'error');
    return;
  }
  const routeId = state.currentRoute.id;
  setJsonSheetBusy(true);
  showProgress('Adressen werden abgeglichen — bitte nicht schließen …');
  try {
    const data = await api(`/routes/${routeId}/json`, {
      method: 'PUT',
      body: JSON.stringify(parsed),
    });
    // This request can legitimately run for a minute against the
    // geocoders' rate limit — long enough for the driver to have moved to
    // another route, whose screen must not be replaced by this one's result.
    if (state.currentRoute?.id !== routeId) { closeSheet(); return; }
    state.currentRoute = data;
    syncRouteSummary();
    closeSheet();
    render();
    if (data.geocode_failures && data.geocode_failures.length) {
      const names = data.geocode_failures.map((f) => `${f.kunde} (${f.strasse}, ${f.plz})`).join('; ');
      const skipNote = data.deletions_skipped ? ' Entfernte Adressen wurden diesmal nicht gelöscht, bis alle Adressen aufgelöst sind.' : '';
      toast(`${data.geocode_failures.length} Adresse(n) nicht gefunden, übersprungen: ${names}.${skipNote} Restliche Route wurde gespeichert.`, 'error', 12000);
    } else if (data.approximate && data.approximate.length) {
      toast(`Route aktualisiert ✓ — ${data.approximate.length} Adresse(n) nur ungefähr lokalisiert, bitte im Kartenpin prüfen.`, 'success', 6000);
    } else {
      toast('Route aktualisiert & optimiert ✓', 'success');
    }
  } catch (err) {
    toast(err.message || 'Speichern fehlgeschlagen.', 'error');
    setJsonSheetBusy(false); // sheet stays open on failure — let the driver retry/edit
  } finally {
    hideProgress();
  }
}

// ---------------------------------------------------------------------
// Manual pin-drop — the guaranteed fallback when automatic geocoding
// can't resolve an address (typo, brand-new building, service outage).
// ---------------------------------------------------------------------
let pinDropMap = null;
let pinDropMarker = null;

function openPinDropSheet(data) {
  const district = DISTRICT_BY_PLZ[data.plz];
  const center = district ? district.center : [48.2082, 16.3738];

  renderSheetShell(`
    <h2 class="text-[19px] font-bold mb-1">Adresse nicht automatisch gefunden</h2>
    <p class="text-sm text-black/60 mb-3">„${escapeHtml(data.strasse)}, ${escapeHtml(data.plz)} Wien" – tippe auf die Karte, um den Standort selbst zu markieren. Der Stopp wird trotzdem hinzugefügt.</p>
    <div id="pin-map" class="w-full h-72 rounded-2xl mb-4 overflow-hidden"></div>
    <div class="flex gap-3 pb-2">
      <button type="button" id="pin-back" class="press-98 px-4 py-3 rounded-xl bg-white text-black/70 font-semibold">Zurück</button>
      <button type="button" id="pin-confirm" class="press-98 flex-1 py-3 rounded-xl bg-brand-600 font-semibold text-white">Standort bestätigen</button>
    </div>
  `, { scrollable: false });

  setTimeout(() => {
    const container = document.getElementById('pin-map');
    if (!container || typeof maplibregl === 'undefined') return;
    const centerLngLat = [center[1], center[0]];
    const map = newMap(container, { center: centerLngLat, zoom: 15 });
    pinDropMap = map;
    const marker = new maplibregl.Marker({ color: '#ED1639', draggable: true }).setLngLat(centerLngLat).addTo(map);
    pinDropMarker = marker;
    map.on('click', (e) => marker.setLngLat(e.lngLat));
    setTimeout(() => { if (pinDropMap === map) map.resize(); }, 60);
  }, 50);

  document.getElementById('pin-confirm').addEventListener('click', () => {
    if (!pinDropMarker) return;
    const { lat, lng } = pinDropMarker.getLngLat();
    closeSheet();
    sendStop(data, { lat, lon: lng });
  });
  document.getElementById('pin-back').addEventListener('click', () => {
    closeSheet();
    openAddSheet(data.stopId ? { ...data, id: data.stopId } : { ...data });
  });
}

// Customer names, addresses and notes are free text that ends up inside
// template strings assigned to innerHTML — these are what keep an
// apostrophe or an angle bracket in a real name from being parsed as
// markup. `escapeAttr` covers both quote styles (not just the double
// quotes these templates happen to use today) so it stays correct if an
// attribute is ever written with single quotes.
function escapeAttr(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;')
    .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeHtml(str) {
  return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---------------------------------------------------------------------
// Large-title collapse — UINavigationController's large-title behavior:
// a big bold title up top that shrinks into a small centered title in a
// translucent sticky bar once the content scrolls under it. Re-attached
// after every render() since #app's innerHTML (and therefore the scroll
// container) is fully replaced each time — no explicit teardown needed,
// the old listener goes away with the old DOM node.
// ---------------------------------------------------------------------
function mountLargeTitle() {
  const scroller = document.querySelector('[data-scroll]');
  const large = document.querySelector('[data-large-title]');
  const compact = document.querySelector('[data-compact-title]');
  if (!scroller || !large || !compact) return;
  const onScroll = () => {
    const collapsed = scroller.scrollTop > 24;
    compact.style.opacity = collapsed ? '1' : '0';
    large.style.opacity = collapsed ? '0' : '1';
    large.style.transform = collapsed ? 'translateY(-6px)' : 'translateY(0)';
  };
  scroller.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

function fmtDate(iso) {
  // `new Date(garbage)` doesn't throw, it yields an Invalid Date whose
  // toLocaleDateString is the literal string "Invalid Date" — checking the
  // timestamp is what actually keeps that out of a route row.
  const d = new Date(iso);
  if (!iso || Number.isNaN(d.getTime())) return '';
  return d.toLocaleDateString('de-AT', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

// ---------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------
// Set true right before a render() that only refreshes already-visible
// content in place (e.g. the delivered-toggle's optimistic + confirm
// re-renders) — stopRow reads this to skip re-triggering every row's
// entrance animation, which otherwise makes the whole list look like it
// "reloads" on every single tap.
let suppressRowAnim = false;

function render(skipRowAnim) {
  suppressRowAnim = !!skipRowAnim;
  const app = document.getElementById('app');
  const prevScroller = document.querySelector('[data-scroll]');
  const prevScrollTop = prevScroller ? prevScroller.scrollTop : 0;

  const showingDetail = state.currentRoute && state.detailOrigin === state.tab;
  let screen;
  if (showingDetail) screen = renderRouteDetail();
  else if (state.tab === 'routes') screen = renderRoutesTab();
  else if (state.tab === 'map') screen = renderMapTab();
  else if (state.tab === 'verlauf') screen = renderVerlaufTab();
  else screen = renderMoreTab();

  app.innerHTML = screen + renderTabBar();
  document.querySelectorAll('[data-logo-src]').forEach(img => img.src = APP_LOGO);

  // innerHTML replacement above tears down and rebuilds the scroll
  // container, which resets scrollTop to 0 by default — restore it so a
  // re-render (e.g. an optimistic update immediately followed by the
  // server-confirmed one) never visibly yanks the screen back to the top.
  const nextScroller = document.querySelector('[data-scroll]');
  if (nextScroller) nextScroller.scrollTop = prevScrollTop;

  mountLargeTitle();

  if (state.tab === 'map' && !showingDetail) {
    initMapTabMap();
  } else if (mapTabMap) {
    mapTabMap.remove();
    mapTabMap = null;
  }
}

// True while the Karte tab's "nothing in focus yet, open the first active
// route" fetch is in flight — see renderMapTab.
let mapAutoSelectPending = false;

// ---------------------------------------------------------------------
// Karte tab — the map as a first-class, edge-to-edge destination. A
// horizontal route picker up top switches which active route's geometry
// is shown; the map itself owns the rest of the screen down to the tab
// bar instead of being boxed into a small preview.
// ---------------------------------------------------------------------
function renderMapTab() {
  const pickable = state.routes.filter(r => r.status === 'active');
  if (!state.currentRoute && pickable.length && !mapAutoSelectPending) {
    // Defer selection to after this render pass — selectMapRoute() re-
    // renders itself once the full route detail (with geometry) loads.
    // The flag is what keeps that from compounding: this function runs on
    // every render, and each render before the fetch resolves would
    // otherwise queue another identical request for the same route.
    mapAutoSelectPending = true;
    setTimeout(() => {
      selectMapRoute(pickable[0].id).finally(() => { mapAutoSelectPending = false; });
    }, 0);
  }

  if (!pickable.length) {
    return `
      <div class="flex-1 min-h-0 flex flex-col items-center justify-center px-8 text-center text-black/40">
        <span class="text-4xl flex justify-center mb-3 opacity-40">${ICONS.tabMap}</span>
        <p class="text-[15px]">Noch keine aktive Route.<br/>Lege zuerst eine Route an.</p>
      </div>
    `;
  }

  const r = state.currentRoute;
  const progress = r && r.customer_count ? Math.round((r.delivered_count / r.customer_count) * 100) : 0;

  return `
    <div class="flex-1 min-h-0 relative">
      <div id="route-map" class="absolute inset-0"></div>

      <div class="absolute top-0 inset-x-0 z-10 momentum overflow-x-auto flex gap-2 px-4" style="padding-top: calc(env(safe-area-inset-top) + 0.75rem); padding-bottom: 0.75rem;">

          <button onclick="selectMapRoute(${p.id})" class="press-98 shrink-0 px-3.5 py-2 rounded-full text-[13px] font-semibold shadow-lg backdrop-blur-xl ${r && r.id === p.id ? 'bg-brand-600 text-white' : 'bg-white/90 text-black/70'}">${escapeHtml(p.name)}</button>
        `).join('')}
      </div>

      ${r ? `
        <div class="absolute bottom-0 inset-x-0 z-10 px-4" style="padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 3.75rem)">
          <button onclick="openCurrentRouteDetail()" class="press-98 w-full text-left bg-white/90 backdrop-blur-xl rounded-2xl p-4 shadow-lg flex items-center gap-3">
            <div class="flex-1 min-w-0">
              <p class="font-semibold truncate">${escapeHtml(r.name)}</p>
              <p class="text-[13px] text-black/50 mt-0.5">${r.delivered_count}/${r.customer_count} zugestellt · ≈ ${r.total_km} km · ${r.total_min} min</p>
              <div class="h-1 bg-black/10 rounded-full overflow-hidden mt-1.5"><div class="h-full bg-success" style="width:${progress}%"></div></div>
            </div>
            <span class="text-black/25 text-lg flex shrink-0">${ICONS.chevron}</span>
          </button>
        </div>
      ` : ''}
    </div>
  `;
}

// "3.4 km · 8 min bis zum nächsten Stopp" under a stop row. Both numbers
// are written together by the optimizer and are null together on the last
// stop — but they arrive from the network, so each is checked on its own
// rather than letting one missing value render "NaN min".
function legLabel(stop, extraClass = 'mt-1') {
  if (stop.next_leg_km == null || stop.next_leg_min == null) return '';
  return `<p class="text-[12px] text-black/40 ${extraClass}">${stop.next_leg_km.toFixed(1)} km · ${Math.round(stop.next_leg_min)} min bis zum nächsten Stopp</p>`;
}

function stopKindMeta(stop) {
  if (stop.kind === 'start') return { icon: ICONS.house, title: 'Start', subtitle: `${stop.strasse}, ${stop.plz} Wien` };
  if (stop.kind === 'via') return { icon: ICONS.box, title: 'Lager', subtitle: `${stop.strasse}, ${stop.plz} Wien` };
  if (stop.kind === 'end') return { icon: ICONS.flag, title: 'Ziel', subtitle: `${stop.strasse}, ${stop.plz} Wien` };
  return null;
}

// ---------------------------------------------------------------------
// Map engine — OpenFreeMap (tiles.openfreemap.org), a free/open vector-
// tile CDN built on OpenStreetMap data by the creator of OpenMapTiles: no
// API key, no usage cap, no billing account, self-hostable if that's ever
// needed. It ships a complete, professionally-designed style — real street
// labels, house numbers, POIs, building footprints — via MapLibre GL JS.
// Routing/geocoding stay fully server-side against Nominatim/OSRM (see
// src/main.rs); this is only the on-screen visualization. Used by both the
// Karte tab (full-screen) and the pin-drop sheet (small, embedded).
// ---------------------------------------------------------------------
const MAP_STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';
const VIENNA_CENTER = [16.3738, 48.2082]; // [lon, lat]

function elFromHtml(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function newMap(container, opts) {
  const map = new maplibregl.Map({
    container,
    style: MAP_STYLE_URL,
    center: opts.center || VIENNA_CENTER,
    zoom: opts.zoom || 12,
    dragRotate: false,
    touchPitch: false,
    pitchWithRotate: false,
    ...opts.extra,
  });
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  map.addControl(
    new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: true, showUserHeading: true }),
    'top-right'
  );
  return map;
}

function drawRouteOnMap(map, r) {
  if (map.getLayer('route-line')) map.removeLayer('route-line');
  if (map.getSource('route-line')) map.removeSource('route-line');
  document.querySelectorAll('.ear-route-marker').forEach(el => el._marker?.remove());

  map.addSource('route-line', {
    type: 'geojson',
    data: {
      type: 'Feature',
      properties: {},
      geometry: { type: 'LineString', coordinates: (r.geometry || []).map(([lat, lon]) => [lon, lat]) },
    },
  });
  map.addLayer({
    id: 'route-line',
    type: 'line',
    source: 'route-line',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ED1639', 'line-width': 4, 'line-opacity': 0.9 },
  });

  const bounds = new maplibregl.LngLatBounds();
  if (r.geometry && r.geometry.length > 1) {
    for (const [lat, lon] of r.geometry) bounds.extend([lon, lat]);
  }

  const firstOpenIdx = r.stops.findIndex(s => s.kind === 'customer' && !s.delivered);
  let customerNum = 0;

  r.stops.forEach((s, i) => {
    const meta = stopKindMeta(s);
    let el;
    if (meta) {
      el = elFromHtml(`<div class="marker-fixed">${meta.icon}</div>`);
    } else {
      customerNum++;
      const isNext = i === firstOpenIdx;
      const bg = s.delivered ? '#34C759' : isNext ? '#ED1639' : '#8E8E93';
      const ring = s.location_precision ? 'box-shadow:0 0 0 3px #FF9500,0 1px 4px rgba(0,0,0,.4);' : '';
      el = elFromHtml(`<div class="marker-badge" style="background:${bg};${ring}">${s.delivered ? '✓' : customerNum}</div>`);
    }
    el.classList.add('ear-route-marker');
    const precisionNote = s.location_precision === 'street' ? '<br><i>≈ nächstgelegene bekannte Hausnummer</i>'
      : s.location_precision === 'district' ? '<br><i>≈ nur Bezirksmitte, Adresse unbekannt</i>' : '';
    const popup = new maplibregl.Popup({ offset: 16, closeButton: false }).setHTML(
      `<b>${escapeHtml(meta ? meta.title : s.kunde)}</b><br>${escapeHtml(s.strasse)}, ${escapeHtml(s.plz)} Wien${precisionNote}`
    );
    const marker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([s.lon, s.lat]).setPopup(popup).addTo(map);
    el._marker = marker;
    bounds.extend([s.lon, s.lat]);
  });

  if (!bounds.isEmpty()) {
    map.fitBounds(bounds, { padding: 48, maxZoom: 16, duration: 0 });
  } else {
    map.jumpTo({ center: VIENNA_CENTER, zoom: 12 });
  }
}

let mapTabMap = null;

function initMapTabMap() {
  const container = document.getElementById('route-map');
  if (!container || typeof maplibregl === 'undefined' || !state.currentRoute) return;

  if (mapTabMap) { mapTabMap.remove(); mapTabMap = null; }
  const map = newMap(container, {});
  mapTabMap = map;
  // The container is freshly inserted into the DOM this same tick, so its
  // real size can still be settling when the map is constructed (Tailwind's
  // CDN runtime applies utility classes asynchronously, safe-area values
  // resolve, etc.) — a ResizeObserver keeps the canvas in sync with
  // whatever the container's actual box turns out to be, for as long as
  // this map instance lives, instead of guessing at one fixed delay.
  const resizeObserver = new ResizeObserver(() => map.resize());
  resizeObserver.observe(container);
  map.once('remove', () => resizeObserver.disconnect());
  map.on('load', () => {
    if (mapTabMap !== map) return;
    drawRouteOnMap(map, state.currentRoute);
  });
}

// ---------------------------------------------------------------------
// Route detail — pushed screen (stops only; the map lives in its own
// Karte tab now). Large-title collapse, back chevron, "..." overflow menu.

function renderRouteDetail() {
  const r = state.currentRoute;
  const stops = r.stops;
  const firstOpenIdx = stops.findIndex(s => s.kind === 'customer' && !s.delivered);
  const progress = r.customer_count ? Math.round((r.delivered_count / r.customer_count) * 100) : 0;

  let customerNum = 0;

  const stopRow = (s, i) => {
    const isNext = i === firstOpenIdx;
    const meta = stopKindMeta(s);
    const address = `${s.strasse}, ${s.plz} Wien`;
    const url = mapsUrl(address);

    if (meta) {
      return `
        <div class="${suppressRowAnim ? '' : 'row-enter '}flex items-start gap-3 px-4 py-3.5" ${suppressRowAnim ? '' : `style="animation-delay:${i * 25}ms"`}>
          <span class="w-9 h-9 shrink-0 rounded-full bg-black/5 text-black/60 flex items-center justify-center text-base">${meta.icon}</span>
          <div class="flex-1 min-w-0 pt-0.5">
            <p class="font-medium">${meta.title}</p>
            <p class="text-[13px] text-black/50">${escapeHtml(meta.subtitle)}</p>
            ${legLabel(s)}
          </div>
          <a href="${url}" target="_blank" rel="noopener" aria-label="In Maps öffnen" title="In Maps öffnen" class="press-fade shrink-0 w-9 h-9 rounded-full bg-black/5 text-black/50 flex items-center justify-center">${ICONS.mapPin}</a>
        </div>
      `;
    }

    customerNum++;
    const delivered = s.delivered;
    const precisionBadge = s.location_precision === 'street'
      ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-warn bg-warn/10 px-1.5 py-0.5 rounded" title="Genaue Hausnummer nicht gefunden — nächstgelegene bekannte Adresse auf der Straße verwendet.">≈ Straße</span>`
      : s.location_precision === 'district'
      ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-warn bg-warn/10 px-1.5 py-0.5 rounded" title="Straße nicht gefunden — nur Bezirksmitte verwendet. Position bitte prüfen.">≈ Bezirk</span>`
      : '';

    return `
      <div class="${suppressRowAnim ? '' : 'row-enter '}flex items-start gap-2 px-4 py-3.5 ${isNext && !delivered ? 'bg-brand-50/60' : ''}" ${suppressRowAnim ? '' : `style="animation-delay:${i * 25}ms"`}>
        <div class="flex-1 min-w-0 select-none cursor-pointer"
          ontouchstart="stopLongPressStart(event, ${s.id})"
          ontouchend="stopLongPressEnd(event)"
          ontouchcancel="stopLongPressEnd(event)"
          ontouchmove="stopLongPressMove(event)"
          onmousedown="stopLongPressStart(event, ${s.id})"
          onmouseup="stopLongPressEnd(event)"
          onmouseleave="stopLongPressEnd(event)"
          onmousemove="stopLongPressMove(event)"
          oncontextmenu="stopLongPressContext(event, ${s.id})">
          <div class="flex items-center gap-1.5 flex-wrap">
            ${isNext && !delivered ? `<span class="text-[10px] font-semibold uppercase tracking-wide text-brand-600 bg-brand-50 px-1.5 py-0.5 rounded">Nächster Stopp</span>` : ''}
            ${precisionBadge}
          </div>
          <p class="font-medium ${delivered ? 'text-black/40 line-through' : ''}">${escapeHtml(s.kunde)}</p>
          <p class="text-[13px] ${delivered ? 'text-black/35' : 'text-black/50'}">${escapeHtml(s.strasse)}, ${escapeHtml(s.plz)} Wien</p>
          ${s.paket ? `<p class="inline-flex items-center gap-1 max-w-full text-[12px] font-medium mt-1.5 px-1.5 py-0.5 rounded ${delivered ? 'text-black/35 bg-black/5' : 'text-brand-700 bg-brand-50'}"><span class="flex shrink-0">${ICONS.box}</span><span class="truncate">${escapeHtml(s.paket)}</span></p>` : ''}
          ${s.notiz ? `<p class="inline-flex items-center gap-1 max-w-full text-[12px] italic mt-1 px-1.5 py-0.5 rounded ${delivered ? 'text-black/35 bg-black/5' : 'text-warn bg-warn/10'}"><span class="flex shrink-0 not-italic">${ICONS.note}</span><span class="truncate">${escapeHtml(s.notiz)}</span></p>` : ''}
          ${legLabel(s, 'mt-1.5')}
        </div>
        <div class="flex flex-col gap-2 shrink-0 mt-0.5">
          <button onclick="toggleDelivered(${s.id}, ${!delivered})" aria-pressed="${delivered}" aria-label="${delivered ? 'Zustellung zurücknehmen' : 'Als zugestellt markieren'}" title="${delivered ? 'Zustellung zurücknehmen' : 'Als zugestellt markieren'}" class="press-95 w-10 h-10 rounded-full flex items-center justify-center text-[20px] shadow-sm ${delivered ? 'bg-success text-white' : 'bg-white border-2 border-black/15 text-black/30'}">
            ${delivered ? ICONS.checkCircleFill : ICONS.circle}
          </button>
          <a href="${url}" target="_blank" rel="noopener" aria-label="In Maps öffnen" title="In Maps öffnen" class="press-fade w-10 h-10 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center text-[17px] shadow-sm">${ICONS.mapPin}</a>
        </div>
      </div>
    `;
  };

  return `
    <div data-scroll class="flex-1 min-h-0 overflow-y-auto momentum" style="padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 3.75rem)">
      <div class="sticky top-0 z-20 bg-[#F2F2F7]/85 backdrop-blur-xl border-b border-black/10" style="padding-top: calc(env(safe-area-inset-top) + 0.5rem)">
        <div class="flex items-center gap-1 px-2 pb-2.5">
          <button onclick="closeDetail()" aria-label="Zurück zur Übersicht" title="Zurück" class="press-fade w-9 h-9 flex items-center justify-center text-brand-600 text-lg shrink-0">${ICONS.back}</button>
          <p data-compact-title class="compact-title flex-1 min-w-0 text-[15px] font-semibold text-center truncate px-1" style="opacity:0">${escapeHtml(r.name)}</p>
          <button onclick="openAddSheet()" aria-label="Stopp hinzufügen" title="Stopp hinzufügen" class="press-fade w-9 h-9 flex items-center justify-center text-brand-600 text-lg shrink-0">${ICONS.plus}</button>
          <div class="relative shrink-0">
            <button onclick="document.getElementById('route-menu').classList.toggle('hidden')" aria-label="Weitere Aktionen" title="Weitere Aktionen" class="press-fade w-9 h-9 flex items-center justify-center text-black/60 text-lg">${ICONS.kebab}</button>
            ${renderRouteMenu()}
          </div>
        </div>
      </div>

      <div class="px-4">
        <h1 data-large-title class="large-title text-[22px] font-bold tracking-tight pt-3 pb-1 truncate">${escapeHtml(r.name)}</h1>
        <p class="text-[13px] text-black/50 pb-3">${r.status === 'active' ? 'Aktiv' : 'Abgeschlossen'} · ${fmtDate(r.created_at)}</p>

        ${r.needs_optimize ? `
          <button onclick="manualOptimize()" class="press-98 w-full flex items-center justify-between gap-2 bg-warn/10 text-warn text-[13px] font-semibold px-4 py-2.5 rounded-xl mb-3">
            <span class="flex items-center gap-1.5"><span class="flex">${ICONS.warning}</span>Route nicht aktuell</span>
            <span class="underline">Jetzt optimieren</span>
          </button>
        ` : ''}

        <button onclick="switchTab('map')" class="${CARD} w-full text-left px-4 py-3.5 flex items-center gap-3 mb-4">
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-baseline mb-1.5">
              <p class="text-[15px] font-semibold">${r.delivered_count} / ${r.customer_count} zugestellt</p>
              <p class="text-[12px] text-black/50">≈ ${r.total_km} km · ${r.total_min} min</p>
            </div>
            <div class="h-1.5 bg-black/10 rounded-full overflow-hidden">
              <div class="h-full bg-success transition-all duration-500" style="width: ${progress}%"></div>
            </div>
          </div>
          <span class="text-brand-600 shrink-0 flex items-center gap-1 text-[13px] font-medium">${ICONS.mapPin} Karte<span class="flex">${ICONS.chevron}</span></span>
        </button>

        <div class="${GROUP}">
          ${stops.map(stopRow).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderRouteMenu() {
  const r = state.currentRoute;
  const item = (onclick, iconSvg, label, danger) => `<button onclick="${onclick}" class="w-full flex items-center gap-3 text-left px-4 py-3 text-[15px] ${danger ? 'text-red-600' : ''} active:bg-black/5">
    <span class="w-5 flex shrink-0 ${danger ? 'text-red-600' : 'text-black/50'}">${iconSvg}</span>${label}
  </button>`;
  return `
    <div id="route-menu" class="hidden absolute right-0 top-10 w-56 bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl overflow-hidden z-30 divide-y divide-black/10">
      ${item("renameRoute()", ICONS.pencil, "Umbenennen")}
      ${item("manualOptimize()", ICONS.compass, "Neu optimieren")}
      ${item("document.getElementById('route-menu').classList.add('hidden'); renderJsonForm();", ICONS.doc, "Als JSON bearbeiten")}
      ${item("resetDelivered()", ICONS.refresh, "Zustellungen zurücksetzen")}
      ${item("toggleRouteStatus()", ICONS.checkCircle, r.status === 'completed' ? 'Wieder aktivieren' : 'Route abschließen')}
      ${item("deleteRoute()", ICONS.trash, "Löschen", true)}
    </div>
  `;
}

// Not fully offline-capable — adding/editing a stop still calls Nominatim/
// Wien-OGD (geocoding) and OSRM (routing) live, and the map needs its
// vector tiles from OpenFreeMap. What this buys: the app shell and any
// already-visited page load instantly from cache and still work with no
// connection at all. See /sw.js (served straight off disk the same way as
// this file — src/main.rs).
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}

loadRoutes();
